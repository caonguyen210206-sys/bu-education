],"methods":[{"title":"Phân thức đại số","lead":"Phân thức \\frac{A}{B} có B khác đa thức 0; khi thay biến, mẫu phải khác 0. Nhân hoặc chia cả tử và mẫu cho cùng nhân tử khác 0 không đổi giá trị. Cộng trừ quy đồng; chia thêm điều kiện phân thức chia khác 0.","steps":["Ghi điều kiện từ biểu thức ban đầu","Phân tích mẫu và tử","Tính, rút gọn nhưng giữ nguyên điều kiện"],"example":"","tip":"","worked":[]},{"title":"Rút gọn có điều kiện","lead":"","steps":[],"example":"","tip":"","worked":[["Rút gọn có điều kiện","Rút gọn \\frac{x²−9}{x−3}.",["Ghi x ≠ 3 vì mẫu ban đầu khác 0.","Phân tích tử x² − 9 = (x − 3)(x + 3).","Chia cả tử và mẫu cho x − 3 ở những x đã cho phép."],"x + 3 với x ≠ 3.","Điều kiện ban đầu được giữ sau rút gọn."]]}],"visuals":[],"table":[]},{"title":"Cộng, trừ, nhân, chia","intro":"Cộng trừ sau quy đồng. Nhân tử với tử, mẫu với mẫu. Chia cho phân thức khác 0 bằng cách nhân với phân thức nghịch đảo.","formulas":"\\frac{A}{B} : \\frac{C}{D} = \\frac{AD}{BC}, B, C, D ≠ 0","short":"","notes":[],"methods":[{"title":"Cộng hai phân thức có mẫu liên hệ","lead":"Tìm mẫu chung bằng phân tích mẫu thành nhân tử.","steps":["Ghi các giá trị bị loại từ mẫu ban đầu.","Phân tích các mẫu, rồi nhân mỗi tử với nhân tử phụ tương ứng.","Cộng tử, rút gọn và giữ điều kiện."],"example":"\\frac{1}{x−2} + \\frac{1}{x+2} = \\frac{2x}{x²−4}, với x ≠ ±2.","worked":[],"tip":""}],"visuals":[],"table":[]}],"g8-c7":[{"title":"Phương trình bậc nhất","intro":"Thu gọn về ax + b = 0. Nếu a ≠ 0 có một nghiệm. Nếu a = 0, có vô số nghiệm khi b = 0, vô nghiệm khi b ≠ 0.","formulas":"x = −\\frac{b}{a} (a ≠ 0)","short":"","notes":[["","Phương trình bậc nhất một ẩn","Phương trình ax+b=0 với a ≠ 0 có nghiệm duy nhất. Khi thu gọn có thể mất hệ số x: 0x=0 nhận mọi x, 0x=c khác 0 vô nghiệm. Bài lời văn cần điều kiện của ẩn.","x=−\\frac{b}{a}, a ≠ 0"]],"methods":[{"title":"Phương trình bậc nhất một ẩn","lead":"Phương trình ax+b=0 với a ≠ 0 có nghiệm duy nhất. Khi thu gọn có thể mất hệ số x: 0x=0 nhận mọi x, 0x=c khác 0 vô nghiệm. Bài lời văn cần điều kiện của ẩn.","steps":["Đặt ẩn kèm điều kiện","Bỏ ngoặc, chuyển vế và thu gọn","Giải rồi thử nghiệm trong đề"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Giải bài toán bằng phương trình","intro":"Chọn ẩn và điều kiện, lập biểu thức, giải rồi đối chiếu điều kiện và đơn vị.","formulas":"","short":"","notes":[["cách làm","Lập mô hình phí cố định và phí theo lượt","Với hai phương án, lập hai biểu thức chi phí. Tìm giao điểm để xác định khi nào hai phương án bằng giá; hệ số góc là phần tăng trên một đơn vị x.","A=20+3x, B=32+x ⇒ A=B khi x=6"]],"methods":[{"title":"Lập mô hình phí cố định và phí theo lượt","lead":"Với hai phương án, lập hai biểu thức chi phí. Tìm giao điểm để xác định khi nào hai phương án bằng giá; hệ số góc là phần tăng trên một đơn vị x.","steps":["Đặt x và đơn vị","Lập hai biểu thức","Cho bằng nhau và kiểm tra x thực tế"],"example":"","tip":"","worked":[]},{"title":"Lập phương trình từ hai cách tính tiền","lead":"Phân biệt khoản cố định với khoản tăng theo số lượt.","steps":["Gọi x là số lượt và ghi điều kiện nguyên không âm.","Lập tổng tiền từng phương án.","Cho hai tổng bằng nhau, giải và đối chiếu điều kiện."],"example":"Phí A là 40 + 6x, phí B là 16 + 10x (nghìn đồng). Hai phí bằng nhau tại x = 6.","worked":[],"tip":""}],"visuals":[],"table":[]},{"title":"Hàm số và đồ thị bậc nhất","intro":"Hàm số gán mỗi x trong tập xác định đúng một y. Với y = ax + b, a ≠ 0, đồ thị là đường thẳng. a là hệ số góc, b là tung độ gốc.","formulas":"Giao Oy: (0;b); giao Ox: (−\\frac{b}{a};0)","short":"","notes":[["","Hàm số và hệ số góc","Mỗi x trong tập xác định ứng đúng một y. Với y=ax+b, a ≠ 0, đồ thị là đường thẳng có hệ số góc a, cắt Oy tại (0;b). a dương thì đi lên từ trái sang phải, a âm thì đi xuống.","a=\\frac{y₂−y₁}{x₂−x₁}; giao Ox: (−\\frac{b}{a};0)"]],"methods":[{"title":"Hàm số và hệ số góc","lead":"Mỗi x trong tập xác định ứng đúng một y. Với y=ax+b, a ≠ 0, đồ thị là đường thẳng có hệ số góc a, cắt Oy tại (0;b). a dương thì đi lên từ trái sang phải, a âm thì đi xuống.","steps":["Xác định tập xác định hoặc hai điểm","Tính hệ số góc","Kiểm tra điểm thuộc đồ thị bằng thay tọa độ"],"example":"","tip":"","worked":[]},{"title":"Đọc giao điểm từ phương trình","lead":"","steps":[],"example":"","tip":"","worked":[["Đọc giao điểm từ phương trình","Tìm giao điểm của y = 2x − 3 với trục hoành và trục tung.",["Trên trục hoành, y = 0. Giải 2x − 3 = 0 được x = \\frac{3}{2}.","Trên trục tung, x = 0. Khi đó y = −3.","Viết theo thứ tự (x; y)."],"(\\frac{3}{2}; 0) và (0; −3).",""]]},{"title":"Xác định hàm số bậc nhất từ hai điểm","lead":"","steps":["Lập hai đẳng thức khi thế tọa độ từng điểm vào y = ax + b.","Lấy hiệu để tìm a.","Thế ngược để tìm b và kiểm tra a khác 0."],"example":"","worked":[],"tip":"","practice":["Tìm hàm số bậc nhất có đồ thị đi qua A(1; 5) và B(3; 9).","Từ 5 = a + b và 9 = 3a + b, suy ra 2a = 4.","y = 2x + 3."]}],"visuals":[],"table":[],"diagrams":["sameSlope"]},{"title":"Hai đường thẳng","intro":"Hệ số góc khác nhau thì cắt nhau. Cùng hệ số góc khác tung độ gốc thì song song; cùng cả hai hệ số thì trùng nhau.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[],"core":[["So hai đường thẳng",["Với y = ax + b và y = a′x + b′, so hệ số góc trước.","Cùng a, khác b thì song song; cùng cả hai thì trùng; khác a thì cắt."],""]]}],"g8-c8":[{"title":"Mô hình xác suất","intro":"Không gian mẫu gồm mọi kết quả. Khi các kết quả đồng khả năng, xác suất là tỉ số số trường hợp thuận lợi trên tổng số trường hợp.","formulas":"P(A) = \\frac{n(A)}{n(Ω)}","short":"","notes":[["","Kết quả, biến cố và xác suất","Một kết quả có thể chắc chắn, không thể hoặc có thể xảy ra. Xác suất cổ điển dùng các kết quả đồng khả năng; xác suất thực nghiệm dùng số lần quan sát được.","P(A)=\\frac{số kết quả thuận lợi}{số kết quả đồng khả năng} // Tần suất A = \\frac{số lần A xảy ra}{số lần thử}"]],"methods":[{"title":"Kết quả, biến cố và xác suất","lead":"Một kết quả có thể chắc chắn, không thể hoặc có thể xảy ra. Xác suất cổ điển dùng các kết quả đồng khả năng; xác suất thực nghiệm dùng số lần quan sát được.","steps":["Liệt kê kết quả hoặc đọc bảng thử nghiệm","Xác định mẫu số đúng","Đếm kết quả thỏa yêu cầu"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"diagrams":["dice"]},{"title":"Thực nghiệm","intro":"Dùng số lần biến cố xảy ra chia tổng lượt. Tần suất có thể thay đổi khi thêm dữ liệu.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Liên hệ","intro":"Với nhiều lượt thử trong cùng điều kiện, xác suất thực nghiệm thường gần xác suất theo mô hình. Xác suất theo mô hình không suy ra chỉ từ một lượt thử.","formulas":"","short":"","notes":[["cách làm","Đếm thuận lợi và đối chiếu thực nghiệm","Mẫu số xác suất lí thuyết là tổng kết quả đồng khả năng; mẫu số thực nghiệm là số lần thử. Tổng của hai xúc xắc không đồng khả năng, nhưng từng cặp mặt có thứ tự thì đồng khả năng.","P(A)=\\frac{n(A)}{n(Ω)}; tần suất = \\frac{số lần A xuất hiện}{tổng lượt}"]],"methods":[{"title":"Đếm thuận lợi và đối chiếu thực nghiệm","lead":"Mẫu số xác suất lí thuyết là tổng kết quả đồng khả năng; mẫu số thực nghiệm là số lần thử. Tổng của hai xúc xắc không đồng khả năng, nhưng từng cặp mặt có thứ tự thì đồng khả năng.","steps":["Chọn mô hình","Liệt kê cặp kết quả hoặc đọc tần số","So đúng mẫu số"],"example":"","tip":"","worked":[]},{"title":"Ước lượng số lần từ xác suất thực nghiệm","lead":"Một tỉ lệ đo được chỉ giúp dự đoán gần đúng.","steps":["Tính tỉ lệ thành công từ dữ liệu đã có.","Nhân với số lần thử dự kiến.","Ghi rõ kết quả là ước lượng."],"example":"Có 36 lần thành công trong 120 lần thử. Với 200 lần cùng điều kiện, dự đoán khoảng 60 lần thành công.","worked":[],"tip":""},{"title":"Xác suất thực nghiệm và lý thuyết","lead":"","steps":[],"example":"","tip":"","worked":[["Xác suất thực nghiệm và lý thuyết","Đồng xu cân đối tung 20 lần ra 13 lần ngửa. So sánh xác suất thực nghiệm với xác suất lý thuyết của mặt ngửa.",["Thực nghiệm lấy số lần ngửa chia số lần tung, được \\frac{13}{20}.","Lý thuyết có hai kết quả đồng khả năng, được \\frac{1}{2}.","Quy đồng \\frac{1}{2} = \\frac{10}{20} rồi so sánh."],"\\frac{13}{20} > \\frac{1}{2} trong đợt thử này.",""]]},{"title":"So tần suất gộp với xác suất lí thuyết","lead":"","steps":["Cộng số lần biến cố xảy ra giữa các nhóm.","Chia cho tổng số lần thử của các nhóm.","So sánh với xác suất lí thuyết của cùng biến cố."],"example":"","worked":[],"tip":"","practice":["Tung đồng xu cân đối. Nhóm A có 16 mặt ngửa trong 30 lần, nhóm B có 26 mặt ngửa trong 50 lần. Tính xác suất thực nghiệm của mặt ngửa khi gộp số liệu.","Dùng tổng 42 mặt ngửa trên 80 lần, không lấy trung bình cộng hai tỉ lệ nhóm.","Xác suất thực nghiệm bằng \\frac{21}{40} = 0,525, lớn hơn xác suất lí thuyết \\frac{1}{2}."]}],"visuals":[],"table":[],"core":[["Lí thuyết và thực nghiệm",["Xác suất lí thuyết dựa trên mô hình. Tỉ lệ thực nghiệm tính từ số lần quan sát được."],""]]}],"g8-c9":[{"title":"Các trường hợp đồng dạng","intro":"Góc–góc; cạnh–góc–cạnh với góc xen giữa; cạnh–cạnh–cạnh với ba tỉ số tương ứng bằng nhau. Với tam giác vuông, có thể dùng một góc nhọn bằng nhau hoặc các trường hợp tỉ lệ cạnh tương ứng.","formulas":"","short":"","notes":[["","Tam giác đồng dạng","Góc tương ứng bằng nhau và cạnh tương ứng cùng tỉ lệ. Có thể dùng góc–góc, cạnh–góc–cạnh, cạnh–cạnh–cạnh. Với tam giác vuông, một cặp góc nhọn bằng nhau là đủ.","Nếu tỉ số đồng dạng là k thì tỉ số chu vi k và tỉ số diện tích k²"],["cách làm","Nhìn góc chung và ghép đúng đỉnh","Hai tam giác có chung góc hoặc hai cạnh song song dễ cho đồng dạng. Trong hình vuông góc, kiểm tra đúng cạnh huyền trước khi dùng Pythagore hoặc trường hợp đồng dạng tam giác vuông.","\\frac{S₁}{S₂}=k² nếu tỉ số cạnh tương ứng bằng k"]],"methods":[{"title":"Tam giác đồng dạng","lead":"Góc tương ứng bằng nhau và cạnh tương ứng cùng tỉ lệ. Có thể dùng góc–góc, cạnh–góc–cạnh, cạnh–cạnh–cạnh. Với tam giác vuông, một cặp góc nhọn bằng nhau là đủ.","steps":["Ghép đỉnh tương ứng","Chọn tiêu chí đồng dạng","Lập tỉ số cùng chiều rồi mới thay số"],"example":"","tip":"","worked":[]},{"title":"Nhìn góc chung và ghép đúng đỉnh","lead":"Hai tam giác có chung góc hoặc hai cạnh song song dễ cho đồng dạng. Trong hình vuông góc, kiểm tra đúng cạnh huyền trước khi dùng Pythagore hoặc trường hợp đồng dạng tam giác vuông.","steps":["Viết thứ tự đỉnh ứng nhau","Lập tỉ số theo cùng chiều","Chỉ bình phương khi chuyển sang diện tích"],"example":"","tip":"","worked":[]}],"visuals":[0],"table":[]},{"title":"Định lí Pythagore","intro":"Trong tam giác vuông, bình phương cạnh huyền bằng tổng bình phương hai cạnh góc vuông. Đảo: nếu cạnh lớn nhất thỏa hệ thức thì tam giác vuông.","formulas":"c² = a² + b²","short":"","notes":[["","Định lí Pythagore và đảo","Trong tam giác vuông, bình phương cạnh huyền bằng tổng bình phương hai cạnh góc vuông. Nếu cạnh lớn nhất của một tam giác thỏa đẳng thức ấy thì góc đối diện nó vuông.","c²=a²+b²"]],"methods":[{"title":"Định lí Pythagore và đảo","lead":"Trong tam giác vuông, bình phương cạnh huyền bằng tổng bình phương hai cạnh góc vuông. Nếu cạnh lớn nhất của một tam giác thỏa đẳng thức ấy thì góc đối diện nó vuông.","steps":["Đánh dấu cạnh huyền hoặc cạnh dài nhất","Lập hệ thức","Lấy căn dương hoặc kết luận góc vuông"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Pythagore thuận và đảo",["Trong tam giác vuông, bình phương cạnh huyền bằng tổng bình phương hai cạnh góc vuông.","Để dùng định lí đảo, bình phương cạnh dài nhất trước."],"a² + b² = c²"]],"diagrams":["rightSides"]},{"title":"Tam giác vuông đồng dạng và tỉ lệ diện tích","intro":"Hai tam giác vuông có một cặp góc nhọn tương ứng bằng nhau thì đồng dạng. Nếu tỉ số đồng dạng là k, các độ dài tương ứng có tỉ số k và diện tích có tỉ số k².","formulas":"\\frac{S₁}{S₂} = k² khi k là tỉ số cạnh của tam giác 1 so với tam giác 2","short":"","notes":[],"methods":[{"title":"Chứng minh hai tam giác vuông đồng dạng","lead":"Hai góc vuông sẵn có nên chỉ cần thêm một cặp góc nhọn bằng nhau để dùng góc–góc.","steps":["Đánh dấu hai góc vuông.","Tìm góc nhọn chung hoặc bằng nhau do song song.","Ghép đúng thứ tự đỉnh rồi lập tỉ số cạnh."],"example":"Tam giác ABC và DEF vuông lần lượt tại A, D. Nếu \\widehat{B} = \\widehat{E} thì ABC ∼ DEF.","worked":[],"tip":""},{"title":"Từ tỉ số đồng dạng sang diện tích","lead":"","steps":[],"example":"","tip":"","worked":[["Từ tỉ số đồng dạng sang diện tích","Hai tam giác đồng dạng, cạnh tương ứng dài 6 cm và 9 cm. Diện tích tam giác lớn là 81 cm². Tính diện tích tam giác nhỏ.",["Tỉ số đồng dạng nhỏ so với lớn là \\frac{6}{9} = \\frac{2}{3}.","Đáy và chiều cao tương ứng đều theo tỉ số \\frac{2}{3}.","Diện tích nhỏ bằng 81 × (\\frac{2}{3})²."],"36 cm².",""]]},{"title":"Dùng hai tam giác đồng dạng để tìm đường cao","lead":"","steps":["Hạ đường cao từ đỉnh góc vuông xuống cạnh huyền.","Chứng minh hai tam giác nhỏ đồng dạng theo góc–góc.","Lập tỉ số để suy bình phương đường cao bằng tích hai đoạn trên cạnh huyền."],"example":"","worked":[],"tip":"","practice":["Trong tam giác ABC vuông tại A, AH là đường cao. Biết BH = 4 cm và CH = 9 cm. Tính AH.","Hai tam giác ABH và CAH đồng dạng. Suy ra \\frac{BH}{AH} = \\frac{AH}{CH}.","AH = \\sqrt{4·9} = 6 cm."],"diagram":"practiceAltitude"}],"visuals":[],"table":[]}],"g8-c10":[{"title":"Hình chóp đều","intro":"Đáy là đa giác đều. Hình chiếu của đỉnh xuống đáy là tâm đáy. Các mặt bên là những tam giác cân bằng nhau.","formulas":"","short":"","notes":[["","Hình chóp","Hình chóp có một đáy đa giác và các mặt bên tam giác chung đỉnh. Hình chóp đều có đáy đều, chân đường cao là tâm đáy. Trung đoạn của chóp đều là đường cao của một mặt bên kẻ từ đỉnh.","V=\\frac{S_{đáy}·h}{3} // Chóp đều: S_{xq}=\\frac{C_{đáy}·d}{2}"]],"methods":[{"title":"Hình chóp","lead":"Hình chóp có một đáy đa giác và các mặt bên tam giác chung đỉnh. Hình chóp đều có đáy đều, chân đường cao là tâm đáy. Trung đoạn của chóp đều là đường cao của một mặt bên kẻ từ đỉnh.","steps":["Xác định đề hỏi h vuông góc đáy hay trung đoạn d","Tính đại lượng đáy","Chọn công thức thể tích hoặc diện tích"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Chiều cao và trung đoạn","intro":"Chiều cao h vuông góc mặt đáy. Trung đoạn d là đường cao của một mặt bên kẻ từ đỉnh. Hai độ dài có vai trò khác nhau.","formulas":"","short":"","notes":[["cách làm","Phân biệt đường cao khối và trung đoạn","Chiều cao khối từ đỉnh vuông góc mặt đáy. Trung đoạn là đường cao trên một mặt bên. Đáy hình chóp tam giác đều và tứ giác đều có diện tích khác nhau.","V=\\frac{S_{đáy}h}{3}; S_{xq}=\\frac{C_{đáy}d}{2}"]],"methods":[{"title":"Phân biệt đường cao khối và trung đoạn","lead":"Chiều cao khối từ đỉnh vuông góc mặt đáy. Trung đoạn là đường cao trên một mặt bên. Đáy hình chóp tam giác đều và tứ giác đều có diện tích khác nhau.","steps":["Đọc loại đáy","Đánh dấu h hay d trên hình","Chọn đúng đại lượng"],"example":"","tip":"","worked":[]},{"title":"Tìm trung đoạn để tính diện tích xung quanh","lead":"Đáy vuông, chân đường cao khối ở tâm đáy và trung đoạn đi tới trung điểm cạnh đáy.","steps":["Tính đoạn từ tâm đáy tới trung điểm cạnh bằng nửa cạnh đáy.","Dùng Pythagore với đường cao khối để tính trung đoạn.","Nhân trung đoạn với nửa chu vi đáy."],"example":"Cạnh đáy 10 cm, chiều cao 12 cm. Trung đoạn bằng 13 cm, diện tích xung quanh bằng 260 cm².","worked":[],"tip":""}],"visuals":[],"table":[],"core":[["Hai loại chiều cao",["Chiều cao khối vuông góc mặt đáy. Trung đoạn thuộc mặt bên và vuông góc với cạnh đáy của mặt bên."],"S_{xq} = \\frac{1}{2}C_{đáy}·d // V = \\frac{1}{3}S_{đáy}·h"]],"diagrams":["pyramid"]},{"title":"Diện tích và thể tích","intro":"Chu vi đáy là C, diện tích đáy là S. Toàn phần cộng một đáy.","formulas":"S_{xq} = \\frac{Cd}{2}; S_{tp} = S_{xq} + S; V = \\frac{Sh}{3}","short":"","notes":[],"methods":[{"title":"Thể tích chóp tứ giác đều","lead":"","steps":[],"example":"","tip":"","worked":[["Thể tích chóp tứ giác đều","Chóp đáy vuông cạnh 9 cm, chiều cao 12 cm. Tính thể tích.",["Diện tích đáy là 9² = 81 cm².","Dùng chiều cao vuông góc với mặt đáy là 12 cm.","Nhân 81 × 12 rồi chia 3."],"324 cm³.",""]]},{"title":"Tính diện tích toàn phần của chóp từ hình khai triển","lead":"","steps":["Đếm mặt bên và nhận dạng đa giác đáy.","Tính diện tích từng tam giác bằng cạnh đáy và trung đoạn.","Cộng diện tích mặt đáy."],"example":"","worked":[],"tip":"","practice":["Hình chóp tứ giác đều có cạnh đáy 8 cm và trung đoạn 5 cm. Tính diện tích toàn phần.","Có bốn mặt bên, mỗi mặt có diện tích 20 cm².","S = 4·20 + 8² = 144 cm²."]}],"visuals":[],"table":[]}],"g9-c1":[{"title":"Phương trình bậc nhất hai ẩn","intro":"Có dạng ax + by = c với a, b không đồng thời bằng 0. Nghiệm là cặp có thứ tự; tập nghiệm biểu diễn bởi một đường thẳng.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Hệ hai phương trình","intro":"Nghiệm phải thỏa cả hai phương trình. Dùng thế hoặc cộng đại số để khử một ẩn.","formulas":"","short":"","notes":[["","Hệ phương trình bậc nhất hai ẩn","Nghiệm là cặp số đồng thời thỏa hai phương trình. Hai đường cắt nhau cho một nghiệm, song song cho vô nghiệm, trùng nhau cho vô số nghiệm. Hai cách giải thường dùng là thế và cộng đại số.","ax+by=c; a′x+b′y=c′"],["cách làm","Chọn giữa thế và cộng đại số","Thế thuận tiện nếu một ẩn có hệ số 1 hoặc −1. Cộng đại số khi hai hệ số đã đối nhau hoặc dễ nhân để đối nhau. Với bài thực tế, điều kiện nguyên hoặc dương kiểm tra sau khi giải.","x+y=18; 30x+50y=700 ⇒ y=8"]],"methods":[{"title":"Hệ phương trình bậc nhất hai ẩn","lead":"Nghiệm là cặp số đồng thời thỏa hai phương trình. Hai đường cắt nhau cho một nghiệm, song song cho vô nghiệm, trùng nhau cho vô số nghiệm. Hai cách giải thường dùng là thế và cộng đại số.","steps":["Chọn ẩn, ghi điều kiện","Viết hai quan hệ","Khử một ẩn bằng thế hoặc cộng","Kiểm tra cả hai phương trình"],"example":"","tip":"","worked":[]},{"title":"Chọn giữa thế và cộng đại số","lead":"Thế thuận tiện nếu một ẩn có hệ số 1 hoặc −1. Cộng đại số khi hai hệ số đã đối nhau hoặc dễ nhân để đối nhau. Với bài thực tế, điều kiện nguyên hoặc dương kiểm tra sau khi giải.","steps":["Chọn hai ẩn có ý nghĩa rõ","Lập đủ hai phương trình","Khử một ẩn rồi thử cả hai"],"example":"","tip":"","worked":[]},{"title":"Giải hệ bằng thế","lead":"","steps":[],"example":"","tip":"","worked":[["Giải hệ bằng thế","Giải hệ x + y = 7 và 2x − y = 5.",["Từ phương trình đầu, y = 7 − x.","Thế vào phương trình hai, được 2x − (7 − x) = 5, suy ra 3x = 12.","Tìm x = 4, y = 3 rồi thử cả hai phương trình."],"(x; y) = (4; 3).",""]]}],"visuals":[],"table":[]},{"title":"Số nghiệm và mô hình","intro":"Hai đường cắt nhau có một nghiệm, song song có không nghiệm, trùng nhau có vô số nghiệm. Với bài toán thực tế, kiểm tra đơn vị và điều kiện của nghiệm.","formulas":"","short":"","notes":[],"methods":[{"title":"Lập hệ từ tổng số lượng và tổng giá trị","lead":"Hai loại có số lượng chưa biết và giá trị mỗi đơn vị khác nhau.","steps":["Đặt hai ẩn kèm điều kiện thực tế.","Viết phương trình tổng lượng và tổng giá trị.","Giải, thử lại và trả lời có đơn vị."],"example":"Có 18 vé loại 20 nghìn và 35 nghìn, thu 480 nghìn. Hệ x + y = 18, 20x + 35y = 480 cho x = 10, y = 8.","worked":[],"tip":""},{"title":"Lập hệ từ tổng và hiệu hai vận tốc","lead":"","steps":["Chọn hai ẩn cùng đơn vị.","Dùng vận tốc tương đối để lập tổng khi ngược chiều và hiệu khi cùng chiều.","Giải hệ rồi kiểm tra vận tốc dương."],"example":"","worked":[],"tip":"","practice":["Hai xe chạy cùng chiều cách nhau 24 km thì xe nhanh đuổi kịp sau 2 giờ. Khi chạy ngược chiều cách nhau 156 km, chúng gặp nhau sau 2 giờ. Tính vận tốc mỗi xe.","Hiệu hai vận tốc bằng 12 km mỗi giờ, tổng bằng 78 km mỗi giờ.","Xe nhanh đi 45 km mỗi giờ, xe chậm đi 33 km mỗi giờ."]}],"visuals":[],"table":[],"core":[["Số nghiệm của hệ",["Hai đường biểu diễn cắt nhau thì có một nghiệm. Song song phân biệt thì vô nghiệm. Trùng nhau thì vô số nghiệm."],""]],"diagrams":["systems"]}],"g9-c2":[{"title":"Phương trình tích","intro":"Tích bằng 0 khi ít nhất một thừa số bằng 0.","formulas":"(ax + b)(cx + d) = 0 ⇔ ax + b = 0 hoặc cx + d = 0","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Phương trình chứa ẩn ở mẫu","intro":"Đặt điều kiện mẫu khác 0, quy đồng và khử mẫu, giải rồi loại nghiệm không thỏa điều kiện.","formulas":"","short":"","notes":[["","Phương trình tích và phương trình chứa ẩn ở mẫu","Một tích bằng 0 khi ít nhất một thừa số bằng 0. Với phương trình có mẫu chứa ẩn, đặt điều kiện mẫu khác 0 trước khi khử mẫu.","A·B=0 ⇔ A=0 hoặc B=0"]],"methods":[{"title":"Phương trình tích và phương trình chứa ẩn ở mẫu","lead":"Một tích bằng 0 khi ít nhất một thừa số bằng 0. Với phương trình có mẫu chứa ẩn, đặt điều kiện mẫu khác 0 trước khi khử mẫu.","steps":["Đặt điều kiện xác định","Quy đồng hoặc phân tích tích","Giải và loại nghiệm làm mẫu bằng 0"],"example":"","tip":"","worked":[]},{"title":"Giải phương trình có ẩn trong mẫu","lead":"Các giá trị làm mẫu bằng 0 bị loại trước khi khử mẫu.","steps":["Tìm điều kiện xác định.","Nhân hai vế với mẫu chung trên tập được phép.","Giải phương trình thu được, đối chiếu điều kiện rồi thử."],"example":"\\frac{2}{x−3} = 1 + \\frac{1}{x−3}, x ≠ 3. Suy ra 2 = x−3 + 1, nên x = 4.","worked":[],"tip":""}],"visuals":[],"table":[]},{"title":"Bất phương trình bậc nhất","intro":"Cộng cùng số vào hai vế giữ chiều. Nhân hoặc chia số âm làm đổi chiều; số dương giữ chiều.","formulas":"ax + b > 0: nếu a > 0 thì x > −\\frac{b}{a}; nếu a < 0 thì x < −\\frac{b}{a}","short":"","notes":[["","Bất đẳng thức và bất phương trình","Cộng cùng số giữ chiều. Nhân hoặc chia cùng số dương giữ chiều; số âm đổi chiều. Dấu nghiêm ngặt không lấy đầu mút.","a<b ⇒ a+c<b+c; nếu c<0 thì ac>bc"]],"methods":[{"title":"Bất đẳng thức và bất phương trình","lead":"Cộng cùng số giữ chiều. Nhân hoặc chia cùng số dương giữ chiều; số âm đổi chiều. Dấu nghiêm ngặt không lấy đầu mút.","steps":["Thu gọn hai vế","Xác định dấu hệ số của x","Giải, kiểm tra điểm biên và ghi tập nghiệm"],"example":"","tip":"","worked":[]},{"title":"Đổi chiều khi chia cho số âm","lead":"","steps":[],"example":"","tip":"","worked":[["Đổi chiều khi chia cho số âm","Giải 5 − 2x ≤ 11.",["Trừ 5 hai vế, được −2x ≤ 6.","Chia hai vế cho −2 và đảo chiều.","Thử x = −3 cho dấu bằng, thử x = 0 đúng."],"x ≥ −3.",""]]}],"visuals":[],"table":[]},{"title":"Đầu mút tập nghiệm","intro":"Dấu ≥ hoặc ≤ lấy điểm bằng nếu thỏa. Dấu > hoặc < loại điểm bằng.","formulas":"","short":"","notes":[["cách làm","Chia hệ số âm và thử điểm biên","Nhân, chia số âm đổi chiều. Dấu lớn hơn hoặc nhỏ hơn nghiêm ngặt loại điểm bằng; dấu có bằng giữ điểm bằng nếu không bị loại bởi miền xác định.","−3x<12 ⇒ x>−4"]],"methods":[{"title":"Chia hệ số âm và thử điểm biên","lead":"Nhân, chia số âm đổi chiều. Dấu lớn hơn hoặc nhỏ hơn nghiêm ngặt loại điểm bằng; dấu có bằng giữ điểm bằng nếu không bị loại bởi miền xác định.","steps":["Ghi điều kiện nếu có mẫu","Thu gọn","Xét dấu hệ số","Thử một số trong tập nghiệm"],"example":"","tip":"","worked":[]},{"title":"Đếm số nguyên thỏa đồng thời hai bất phương trình","lead":"","steps":["Giải riêng từng bất phương trình.","Lấy giao các khoảng nghiệm, giữ đúng đầu mút mở hoặc đóng.","Liệt kê số nguyên thuộc giao."],"example":"","worked":[],"tip":"","practice":["Có bao nhiêu số nguyên x thỏa 2x − 1 < 7 và −3x ≤ 6?","Hai điều kiện tương đương x < 4 và x ≥ −2.","Có 6 số nguyên, từ −2 đến 3."]}],"visuals":[],"table":[],"core":[["Biên tập nghiệm",["Khi nhân hoặc chia bất đẳng thức cho số âm, đổi chiều.","Đầu mút có dấu bằng thì lấy nếu thuộc điều kiện."],"−2x ≤ 6 ⇔ x ≥ −3"]],"diagrams":["inequality"]}],"g9-c3":[{"title":"Căn bậc hai","intro":"√A có nghĩa khi A ≥ 0 và luôn không âm. Căn của bình phương bằng giá trị tuyệt đối.","formulas":"\\sqrt{A²} = trị tuyệt đối của A","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Nhân và chia căn","intro":"Tách căn của tích khi hai thừa số không âm. Tách căn của thương khi tử không âm và mẫu dương.","formulas":"\\sqrt{ab} = \\sqrt{a}·\\sqrt{b}; \\sqrt{\\frac{a}{b}} = \\frac{√a}{√b}","short":"","notes":[["","Căn thức và biến đổi căn","Căn bậc hai cần biểu thức dưới căn không âm và cho giá trị không âm. Căn tích chỉ tách khi mỗi thừa số không âm; mẫu của thương phải dương. Căn bậc ba tồn tại với mọi số thực và giữ dấu.","\\sqrt{A²}=∣A∣ // \\sqrt{ab}=\\sqrt{a}·\\sqrt{b} (a,b ≥ 0) // ∛(−27)=−3"]],"methods":[{"title":"Căn thức và biến đổi căn","lead":"Căn bậc hai cần biểu thức dưới căn không âm và cho giá trị không âm. Căn tích chỉ tách khi mỗi thừa số không âm; mẫu của thương phải dương. Căn bậc ba tồn tại với mọi số thực và giữ dấu.","steps":["Ghi điều kiện","Đưa thừa số chính phương ra ngoài hoặc nhân liên hợp","Chỉ cộng trừ căn đồng dạng"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Điều kiện của quy tắc căn",["Để nhân hai căn bậc hai, các số dưới căn đều không âm. Với thương hai căn, mẫu phải dương."],"\\sqrt{ab} = \\sqrt{a}·\\sqrt{b}, a,b ≥ 0 // \\sqrt{\\frac{a}{b}} = \\frac{\\sqrt{a}}{\\sqrt{b}}, a ≥ 0, b > 0"]]},{"title":"Rút gọn và trục căn","intro":"Đưa thừa số chính phương ra khỏi căn; chỉ cộng trừ các căn đồng dạng. Khi cần, nhân tử mẫu để mẫu hết căn.","formulas":"","short":"","notes":[["cách làm","Rút gọn căn không mất dấu","Khi đưa nhân tử bình phương ra khỏi căn, dùng giá trị tuyệt đối nếu chưa biết dấu. Nhân liên hợp khi mẫu là tổng hoặc hiệu của hai căn thích hợp.","\\sqrt{(x−3)²}=∣x−3∣ // (√a+√b)(√a−√b)=a−b"]],"methods":[{"title":"Rút gọn căn không mất dấu","lead":"Khi đưa nhân tử bình phương ra khỏi căn, dùng giá trị tuyệt đối nếu chưa biết dấu. Nhân liên hợp khi mẫu là tổng hoặc hiệu của hai căn thích hợp.","steps":["Ghi miền xác định","Tách bình phương","Quy đồng hoặc nhân liên hợp","Gộp căn cùng loại"],"example":"","tip":"","worked":[]},{"title":"Rút gọn căn rồi mới trục căn ở mẫu","lead":"Khi mẫu là tổng hoặc hiệu hai số chứa căn, dùng biểu thức liên hợp.","steps":["Nêu điều kiện để căn có nghĩa và mẫu khác 0.","Nhân cả tử và mẫu với liên hợp nếu liên hợp khác 0.","Dùng hiệu hai bình phương ở mẫu và rút gọn."],"example":"\\frac{1}{\\sqrt{7}+2} = \\frac{\\sqrt{7}−2}{3}.","worked":[],"tip":""},{"title":"Điều kiện và nghiệm ngoại lai","lead":"","steps":[],"example":"","tip":"","worked":[["Điều kiện và nghiệm ngoại lai","Giải \\sqrt{x+5} = x − 1.",["Vế phải phải không âm, nên x ≥ 1.","Bình phương với điều kiện đó, x + 5 = x² − 2x + 1.","Giải (x − 4)(x + 1) = 0. Loại −1, thay 4 được 3 = 3."],"x = 4.",""]]},{"title":"Rút gọn tổng căn bằng liên hợp và triệt tiêu","lead":"","steps":["Nhân tử và mẫu với biểu thức liên hợp.","Dùng hiệu hai bình phương.","Nhóm các căn xuất hiện hai lần trái dấu."],"example":"","worked":[],"tip":"","practice":["Tính \\frac{1}{\\sqrt{2}+1} + \\frac{1}{\\sqrt{3}+\\sqrt{2}} + \\frac{1}{2+\\sqrt{3}}.","Mỗi phân thức có hiệu bình phương ở mẫu bằng 1 sau khi nhân liên hợp.","Tổng bằng (\\sqrt{2}−1) + (\\sqrt{3}−\\sqrt{2}) + (2−\\sqrt{3}) = 1."]}],"visuals":[],"table":[]},{"title":"Căn bậc ba","intro":"Mỗi số thực có đúng một căn bậc ba. Căn bậc ba có cùng dấu với số dưới căn.","formulas":"∛(−27) = −3","short":"","notes":[],"methods":[],"visuals":[],"table":[]}],"g9-c4":[{"title":"Tỉ số lượng giác góc nhọn","intro":"Cạnh đối và cạnh kề được xác định theo góc đang xét. Cạnh huyền đối diện góc vuông.","formulas":"sin α = \\frac{đối}{huyền}; cos α = \\frac{kề}{huyền}; tan α = \\frac{đối}{kề}; cot α = \\frac{kề}{đối}","short":"","notes":[["","Tỉ số lượng giác trong tam giác vuông","Đối và kề được xác định theo góc nhọn đang xét; huyền đối diện góc vuông. Hai góc nhọn phụ nhau. Khi biết cạnh và góc, dùng hệ thức lượng để tính cạnh còn lại.","sin α=\\frac{đối}{huyền}; cos α=\\frac{kề}{huyền} // tan α=\\frac{đối}{kề}; cot α=\\frac{kề}{đối}"]],"methods":[{"title":"Tỉ số lượng giác trong tam giác vuông","lead":"Đối và kề được xác định theo góc nhọn đang xét; huyền đối diện góc vuông. Hai góc nhọn phụ nhau. Khi biết cạnh và góc, dùng hệ thức lượng để tính cạnh còn lại.","steps":["Vẽ tam giác và đánh dấu góc đang xét","Ghi đối, kề, huyền","Chọn tỉ số chứa dữ kiện và ẩn"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Xác định cạnh theo góc đang xét",["Cạnh huyền đối diện góc vuông. Hai cạnh đối và kề đổi vai khi đổi sang góc nhọn còn lại."],"sin α = \\frac{đối}{huyền} // cos α = \\frac{kề}{huyền} // tan α = \\frac{đối}{kề} // cot α = \\frac{kề}{đối}"]],"diagrams":["rightSides"]},{"title":"Hai góc phụ nhau","intro":"Nếu α + β = 90° thì sin α = cos β và tan α = cot β.","formulas":"sin² α + cos² α = 1; tan α = \\frac{sin α}{cos α}","short":"","notes":[],"methods":[],"visuals":[],"table":[],"diagrams":["rightComplement"]},{"title":"Tính cạnh và góc","intro":"Vẽ tam giác vuông từ đề, chọn tỉ số chứa cạnh đã biết và cạnh cần tìm. Nếu biết cạnh huyền c, cạnh đối góc α bằng c sin α, cạnh kề bằng c cos α.","formulas":"","short":"","notes":[["cách làm","Đổi góc nhìn trước khi chọn tỉ số","Đổi góc nhọn đang xét làm cạnh đối và kề hoán đổi, cạnh huyền giữ nguyên. Có thể suy hệ thức cạnh–góc từ định nghĩa tỉ số thay vì dùng hệ thức nâng cao.","sin B=cos C nếu B+C=90° // a_{đối}=c_{huyền} sin α"]],"methods":[{"title":"Đổi góc nhìn trước khi chọn tỉ số","lead":"Đổi góc nhọn đang xét làm cạnh đối và kề hoán đổi, cạnh huyền giữ nguyên. Có thể suy hệ thức cạnh–góc từ định nghĩa tỉ số thay vì dùng hệ thức nâng cao.","steps":["Vẽ tam giác vuông","Gắn nhãn đối, kề, huyền","Dùng định nghĩa để biến đổi"],"example":"","tip":"","worked":[["Chuyển sin sang cos","Tam giác ABC vuông tại A. Cho cos C = \\frac{5}{13}. Tính sin B.",["Góc B và góc C phụ nhau.","Với góc B, cạnh đối là AC. Với góc C, cạnh kề là AC. Mẫu của cả hai tỉ số là BC."],"sin B = cos C = \\frac{5}{13}.",""]],"diagram":"rightComplement"},{"title":"Tính chiều cao khi biết khoảng cách ngang và góc nâng","lead":"Hai cạnh góc vuông là khoảng ngang và độ cao chênh với mắt.","steps":["Vẽ đường ngang qua mắt và đường đứng tới đỉnh.","Dùng tan góc nâng bằng độ cao chênh chia khoảng ngang.","Cộng độ cao mắt nếu hỏi độ cao từ mặt đất."],"example":"Mắt cao 1,5 m, khoảng ngang 18 m, góc nâng 45°. Chiều cao là 18 + 1,5 = 19,5 m.","worked":[],"tip":""},{"title":"Chọn đúng tỉ số lượng giác","lead":"","steps":[],"example":"","tip":"","worked":[["Chọn đúng tỉ số lượng giác","Một thang dài 5 m tạo góc 60° với sàn. Chân thang cách tường bao xa nếu tường vuông góc sàn?",["Thang là cạnh huyền. Khoảng cách trên sàn là cạnh kề góc 60°.","Dùng cos 60° = \\frac{cạnh kề}{5}.","Nhân 5 × \\frac{1}{2}."],"2,5 m.",""]]},{"title":"Tìm chiều cao từ hai góc nâng","lead":"","steps":["Kẻ đoạn ngang qua hai điểm quan sát cùng độ cao.","Viết hai đẳng thức tang theo cùng độ cao chênh lệch.","Dùng khoảng cách giữa hai điểm để loại một ẩn."],"example":"","worked":[],"tip":"","practice":["Hai điểm A, B cách nhau 10 m trên cùng đường ngang với chân cột H, B nằm giữa A và H. Góc nâng lên đỉnh lần lượt bằng 30° và 45°. Tính chiều cao cột, bỏ qua độ cao mắt.","Gọi d là khoảng cách từ B tới chân cột. Khi đó h = d và h = \\frac{d+10}{\\sqrt{3}}.","h = \\frac{10}{\\sqrt{3}−1} = 5(\\sqrt{3}+1) m."],"diagram":"practiceElevation"}],"visuals":[],"table":[]}],"g9-c5":[{"title":"Đường tròn và dây","intro":"Các điểm trên đường tròn cách tâm một khoảng R. Đường kính là dây lớn nhất. Đường vuông góc từ tâm đến dây chia đôi dây; dây dài hơn thì gần tâm hơn.","formulas":"AB = 2\\sqrt{R² − d²} với d là khoảng cách từ tâm đến dây","short":"","notes":[["","Dây, tiếp tuyến và vị trí tương đối","Vuông góc từ tâm đến dây chia đôi dây. Đường thẳng tiếp xúc khi cách tâm đúng bán kính; tại tiếp điểm, bán kính vuông góc tiếp tuyến. Với hai đường tròn có tâm khác nhau, so khoảng cách tâm với hiệu và tổng bán kính.","Đường thẳng: d<R cắt, d=R tiếp xúc, d>R không cắt // Hai đường tròn cắt nhau khi ∣R−r∣<d<R+r"]],"methods":[{"title":"Dây, tiếp tuyến và vị trí tương đối","lead":"Vuông góc từ tâm đến dây chia đôi dây. Đường thẳng tiếp xúc khi cách tâm đúng bán kính; tại tiếp điểm, bán kính vuông góc tiếp tuyến. Với hai đường tròn có tâm khác nhau, so khoảng cách tâm với hiệu và tổng bán kính.","steps":["Xác định tâm và bán kính","Tính khoảng cách đúng đối tượng","So với các mốc, kể cả dấu bằng"],"example":"","tip":"","worked":[]},{"title":"Từ khoảng cách tâm đến độ dài dây","lead":"","steps":[],"example":"","tip":"","worked":[["Từ khoảng cách tâm đến độ dài dây","Đường tròn bán kính 10 cm, khoảng cách từ tâm đến dây AB là 6 cm. Tính AB.",["Hạ OH vuông góc AB. Khi đó H là trung điểm AB.","Trong tam giác vuông OHA, AH = \\sqrt{10²−6²} = 8 cm.","Gấp đôi AH."],"AB = 16 cm.",""]]}],"visuals":[0],"table":[]},{"title":"Cung và góc ở tâm","intro":"Số đo cung nhỏ bằng số đo góc ở tâm tương ứng. Cung lớn và cung nhỏ của cùng dây cộng 360°.","formulas":"","short":"","notes":[["","Độ dài cung và diện tích quạt","Cung n° chiếm \\frac{n}{360} đường tròn. Hình quạt dùng cùng tỉ lệ của hình tròn. Vành khuyên là phần giữa hai đường tròn đồng tâm.","l=\\frac{πRn}{180}; S quạt=\\frac{πR²n}{360}; S vành=π(R²−r²)"]],"methods":[{"title":"Độ dài cung và diện tích quạt","lead":"Cung n° chiếm \\frac{n}{360} đường tròn. Hình quạt dùng cùng tỉ lệ của hình tròn. Vành khuyên là phần giữa hai đường tròn đồng tâm.","steps":["Xác định n theo độ và bán kính","Chọn độ dài hay diện tích","Tính rồi ghi đơn vị"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Đường thẳng và tiếp tuyến","intro":"So d(tâm, đường) với R. Nếu d < R có hai giao điểm, d = R tiếp xúc, d > R không cắt. Tiếp tuyến vuông góc bán kính tại tiếp điểm. Hai tiếp tuyến từ một điểm ngoài có độ dài bằng nhau.","formulas":"","short":"","notes":[["định lí","Tiếp tuyến và khoảng cách","Bán kính vuông góc tiếp tuyến ở tiếp điểm. Nếu đường qua M trên đường tròn vuông góc OM thì đường đó là tiếp tuyến. Với hai tiếp tuyến xuất phát từ cùng điểm, hai đoạn tới tiếp điểm bằng nhau.","OM⊥d tại M∈(O) ⇒ d là tiếp tuyến"]],"methods":[{"title":"Tiếp tuyến và khoảng cách","lead":"Bán kính vuông góc tiếp tuyến ở tiếp điểm. Nếu đường qua M trên đường tròn vuông góc OM thì đường đó là tiếp tuyến. Với hai tiếp tuyến xuất phát từ cùng điểm, hai đoạn tới tiếp điểm bằng nhau.","steps":["Xác định M thuộc đường tròn","Chứng minh vuông góc hoặc tính khoảng cách bằng R","Kết luận"],"example":"","tip":"","worked":[]},{"title":"Chứng minh một đường thẳng là tiếp tuyến","lead":"Cần chỉ ra điểm tiếp xúc nằm trên đường tròn và bán kính vuông góc với đường thẳng tại đó.","steps":["Chọn điểm T ứng viên và kiểm tra OT = R.","Chứng minh đường thẳng qua T và vuông góc OT.","Kết luận tiếp xúc tại T."],"example":"Trong tam giác OTM vuông tại T, nếu OT = R thì MT tiếp xúc đường tròn tâm O bán kính R tại T.","worked":[],"tip":""},{"title":"Tính góc giữa hai tiếp tuyến từ một điểm","lead":"","steps":["Nối tâm với hai tiếp điểm.","Dùng góc vuông ở các tiếp điểm để tính tổng góc còn lại trong tứ giác.","Trừ góc ở tâm khỏi 180°."],"example":"","worked":[],"tip":"","practice":["Từ M kẻ hai tiếp tuyến MA, MB đến đường tròn tâm O. Biết \\widehat{AOB} = 114°. Tính \\widehat{AMB}.","Hai góc tại A và B của tứ giác OAMB đều bằng 90°.","\\widehat{AMB} = 180° − 114° = 66°."],"diagram":"practiceTangents"}],"visuals":[],"table":[],"diagrams":["tangentCircle"]},{"title":"Hai đường tròn","intro":"Với hai tâm phân biệt, xét d so với tổng và hiệu hai bán kính. Cắt tại hai điểm khi hiệu < d < tổng, tiếp xúc ngoài khi d bằng tổng, tiếp xúc trong khi d bằng hiệu.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[],"core":[["Vị trí hai đường tròn",["So khoảng cách hai tâm d với tổng và hiệu hai bán kính.","Hai giao điểm khi ∣R−r∣ < d < R+r. Hai đường tròn trùng nếu d = 0 và R = r."],""]],"diagrams":["circlesCross"]}],"g9-c6":[{"title":"Hàm số y = ax²","intro":"Parabol đi qua gốc tọa độ và đối xứng qua Oy. Mở lên khi a > 0 và mở xuống khi a < 0.","formulas":"","short":"","notes":[["tính chất","Đồ thị y = ax²","Với a≠0, đồ thị là parabol nhận Oy làm trục đối xứng và O làm đỉnh. a>0 mở lên, a<0 mở xuống. Cùng một độ lớn của x cho cùng y.","f(−x)=f(x); f(0)=0"]],"methods":[{"title":"Đồ thị y = ax²","lead":"Với a≠0, đồ thị là parabol nhận Oy làm trục đối xứng và O làm đỉnh. a>0 mở lên, a<0 mở xuống. Cùng một độ lớn của x cho cùng y.","steps":["Lập bảng một vài x đối nhau","Chấm điểm đối xứng","Vẽ theo dấu của a"],"example":"","tip":"","worked":[]}],"visuals":[0],"table":[]},{"title":"Phương trình bậc hai","intro":"Với a ≠ 0, xét biệt thức Δ. Δ < 0 vô nghiệm thực, Δ = 0 có nghiệm kép, Δ > 0 có hai nghiệm phân biệt.","formulas":"Δ = b² − 4ac; x_{1,2} = \\frac{−b ± √Δ}{2a}","short":"","notes":[["định lí","Số nghiệm theo biệt thức","Với ax²+bx+c=0, a≠0, nếu Δ<0 thì vô nghiệm thực, Δ=0 thì có nghiệm kép, Δ>0 thì có hai nghiệm thực phân biệt. Khi b chẵn có thể dùng Δ′ với b′=\\frac{b}{2}.","Δ=b²−4ac; x_{1,2}=\\frac{−b±√Δ}{2a} // Δ′=b′²−ac; x_{1,2}=\\frac{−b′±√Δ′}{a}"]],"methods":[{"title":"Số nghiệm theo biệt thức","lead":"Với ax²+bx+c=0, a≠0, nếu Δ<0 thì vô nghiệm thực, Δ=0 thì có nghiệm kép, Δ>0 thì có hai nghiệm thực phân biệt. Khi b chẵn có thể dùng Δ′ với b′=\\frac{b}{2}.","steps":["Xác định đúng hệ số và dấu","Tính biệt thức","Chọn công thức theo dấu"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Hệ thức Viète","intro":"Nếu có nghiệm x₁, x₂, tính tổng và tích mà không giải riêng.","formulas":"x₁ + x₂ = −\\frac{b}{a}; x₁x₂ = \\frac{c}{a}","short":"","notes":[["định lí","Định lí Viète","Nếu phương trình ax²+bx+c=0 có hai nghiệm x₁,x₂ tính cả bội, tổng nghiệm là −\\frac{b}{a}, tích nghiệm là \\frac{c}{a}. Ngược lại, hai số có tổng S và tích P là nghiệm của t²−St+P=0.","S=x₁+x₂=−\\frac{b}{a}; P=x₁x₂=\\frac{c}{a}"],["bổ sung","Dùng Viète tính biểu thức đối xứng","Khi hai nghiệm tồn tại, có thể tính tổng bình phương từ tổng và tích mà không giải riêng từng nghiệm. Nếu biểu thức chứa nghịch đảo, phải kiểm tra tích khác 0.","x₁²+x₂²=(x₁+x₂)²−2x₁x₂ // \\frac{1}{x₁}+\\frac{1}{x₂}=\\frac{x₁+x₂}{x₁x₂}"]],"methods":[{"title":"Định lí Viète","lead":"Nếu phương trình ax²+bx+c=0 có hai nghiệm x₁,x₂ tính cả bội, tổng nghiệm là −\\frac{b}{a}, tích nghiệm là \\frac{c}{a}. Ngược lại, hai số có tổng S và tích P là nghiệm của t²−St+P=0.","steps":["Kiểm tra điều kiện có nghiệm thực","Tìm S,P","Chuyển biểu thức đối xứng theo S,P"],"example":"","tip":"","worked":[]},{"title":"Dùng Viète tính biểu thức đối xứng","lead":"Khi hai nghiệm tồn tại, có thể tính tổng bình phương từ tổng và tích mà không giải riêng từng nghiệm. Nếu biểu thức chứa nghịch đảo, phải kiểm tra tích khác 0.","steps":["Kiểm tra Δ≥0","Đặt S và P","Biến đổi theo S,P rồi thay số"],"example":"","tip":"","worked":[]},{"title":"Tính tổng bình phương hai nghiệm không cần tìm nghiệm","lead":"Dùng Viète khi phương trình bậc hai có hai nghiệm thực, có thể trùng.","steps":["Kiểm tra biệt thức và ghi tổng, tích hai nghiệm.","Biến đổi x₁² + x₂² = (x₁ + x₂)² − 2x₁x₂.","Thay tổng và tích."],"example":"Với x² − 4x + 1 = 0, tổng bình phương nghiệm bằng 16 − 2 = 14.","worked":[],"tip":""},{"title":"Đọc nghiệm và kiểm tra bằng Viète","lead":"","steps":[],"example":"","tip":"","worked":[["Đọc nghiệm và kiểm tra bằng Viète","Giải x² − 5x + 6 = 0.",["Tìm hai số có tổng 5 và tích 6, được 2 và 3.","Viết x² − 5x + 6 = (x − 2)(x − 3).","Cho từng nhân tử bằng 0 và thử lại."],"x = 2 hoặc x = 3.",""]]},{"title":"Dùng Viète để kiểm tra hai nghiệm dương","lead":"","steps":["Kiểm tra phương trình có hai nghiệm thực theo yêu cầu.","Dùng tích dương để suy hai nghiệm cùng dấu.","Dùng tổng dương để suy cả hai nghiệm dương."],"example":"","worked":[],"tip":"","practice":["Phương trình x² − (m + 1)x + 2m = 0 có hai nghiệm dương phân biệt khi m = 5 hay m = 6?","Biệt thức Δ = (m + 1)² − 8m. Hai điều kiện tổng và tích dương đều đúng với hai giá trị đã cho.","m = 5 cho Δ = −4. m = 6 cho Δ = 1 và hai nghiệm dương 3, 4. Chọn m = 6."]}],"visuals":[],"table":[],"core":[["Viète dùng sau khi xét nghiệm",["Khi ax² + bx + c = 0 có nghiệm thực x_1, x_2, dùng tổng và tích để tính biểu thức đối xứng."],"x_1 + x_2 = −\\frac{b}{a} // x_1x_2 = \\frac{c}{a}"]]},{"title":"Bài toán thực tế","intro":"Lập phương trình theo số đo, diện tích, quãng đường hoặc năng suất. Loại nghiệm không thỏa điều kiện thực tế.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]}],"g9-c7":[{"title":"Tần số","intro":"Số lần một giá trị hoặc một nhóm xuất hiện. Tổng các tần số bằng cỡ mẫu N.","formulas":"","short":"","notes":[],"methods":[],"visuals":[0],"table":[]},{"title":"Tần số tương đối","intro":"Tần số n chia cho N. Dạng phần trăm nhân thêm 100%.","formulas":"f = \\frac{n}{N}; f% = \\frac{n}{N} × 100%","short":"","notes":[["cách làm","Từ bảng tần số sang tần số tương đối","Cộng tần số ra cỡ mẫu. Mỗi tần số tương đối lấy số của nhóm chia cỡ mẫu. Khi ghép nhóm, xác định giá trị biên thuộc nhóm nào trước khi đếm.","fᵢ=\\frac{nᵢ}{N}; tổng các tần số tương đối bằng 1 trước khi làm tròn"]],"methods":[{"title":"Từ bảng tần số sang tần số tương đối","lead":"Cộng tần số ra cỡ mẫu. Mỗi tần số tương đối lấy số của nhóm chia cỡ mẫu. Khi ghép nhóm, xác định giá trị biên thuộc nhóm nào trước khi đếm.","steps":["Đếm nhóm","Kiểm tra tổng","Chia và đổi thành phần trăm nếu cần"],"example":"","tip":"","worked":[]},{"title":"Tìm tần số từ tần số tương đối","lead":"","steps":[],"example":"","tip":"","worked":[["Tìm tần số từ tần số tương đối","Trong mẫu 80 quan sát, một giá trị có tần số tương đối 12,5%. Giá trị đó xuất hiện mấy lần?",["Đổi 12,5% thành 0,125.","Lấy tần số tương đối nhân cỡ mẫu.","Kiểm tra \\frac{10}{80} = 0,125."],"10 lần.",""]]}],"visuals":[],"table":[]},{"title":"Bảng ghép nhóm","intro":"Nhóm [a;b) lấy a, không lấy b. Đếm mỗi giá trị đúng một nhóm.","formulas":"Giá trị đại diện = \\frac{a + b}{2}","short":"","notes":[["","Tần số và mẫu ghép nhóm","Tần số đếm số lần; tần số tương đối chia cho cỡ mẫu. Nhóm [a;b) lấy đầu trái và loại đầu phải. Giá trị đại diện là trung điểm khoảng.","f=\\frac{n}{N}; xᵢ=\\frac{aᵢ+bᵢ}{2}"]],"methods":[{"title":"Tần số và mẫu ghép nhóm","lead":"Tần số đếm số lần; tần số tương đối chia cho cỡ mẫu. Nhóm [a;b) lấy đầu trái và loại đầu phải. Giá trị đại diện là trung điểm khoảng.","steps":["Đếm mỗi giá trị vào đúng một nhóm","Tính cỡ mẫu và tần số","Đổi ra phần trăm nếu cần"],"example":"","tip":"","worked":[]},{"title":"Đọc nhóm chứa dữ liệu theo khoảng nửa kín","lead":"Điểm nằm ở đầu chung thuộc nhóm lấy đầu trái và bỏ đầu phải.","steps":["Ghi rõ các khoảng [a; b).","Xếp mỗi số vào đúng một khoảng.","Đếm và kiểm tra tổng tần số bằng cỡ mẫu."],"example":"Với các nhóm [0; 10) và [10; 20), số 10 chỉ thuộc nhóm thứ hai.","worked":[],"tip":""},{"title":"Tìm tần số lớp từ tần số tích lũy","lead":"","steps":["Đọc tần số tích lũy đến lớp đang xét.","Trừ tần số tích lũy đến ngay trước lớp đó.","Chia cho cỡ mẫu nếu cần tần số tương đối."],"example":"","worked":[],"tip":"","practice":["Ba lớp có tần số tích lũy lần lượt là 5, 18 và 30. Tính tần số và tần số tương đối của lớp thứ hai.","Tần số lớp hai là phần tăng từ 5 lên 18.","Tần số bằng 13. Tần số tương đối bằng \\frac{13}{30}, khoảng 43,33%."]}],"visuals":[],"table":[],"core":[["Khoảng ghép nhóm",["Nhóm [a; b) lấy a và bỏ b. Tần số các nhóm cộng bằng cỡ mẫu."],"f_i = \\frac{n_i}{n}·100%"]],"diagrams":["histogram"]}],"g9-c8":[{"title":"Không gian mẫu","intro":"Liệt kê các kết quả đơn giản bằng bảng, sơ đồ cây hoặc cặp có thứ tự. Chỉ chia theo số trường hợp khi các kết quả đồng khả năng.","formulas":"","short":"","notes":[["cách làm","Chọn không gian mẫu có kết quả đồng khả năng","Ghi mỗi kết quả đủ chi tiết. Hai lần rút không hoàn lại phải điều chỉnh số lựa chọn ở lượt hai; nếu không xét thứ tự, cả tử và mẫu cùng dùng kiểu đó.","P(A)=\\frac{n(A)}{n(Ω)} khi Ω đồng khả năng"]],"methods":[{"title":"Chọn không gian mẫu có kết quả đồng khả năng","lead":"Ghi mỗi kết quả đủ chi tiết. Hai lần rút không hoàn lại phải điều chỉnh số lựa chọn ở lượt hai; nếu không xét thứ tự, cả tử và mẫu cùng dùng kiểu đó.","steps":["Liệt kê hoặc vẽ sơ đồ cây","Gạch các kết quả thuận lợi","Chia cho tổng hợp lệ"],"example":"","tip":"","worked":[]},{"title":"Đếm kết quả khi gieo hai xúc xắc","lead":"Cặp (a; b) phân biệt kết quả của hai viên.","steps":["Lập bảng 6 hàng và 6 cột.","Đánh dấu các ô thỏa yêu cầu.","Chia số ô đã đánh dấu cho 36 nếu xúc xắc cân đối và hai lần độc lập."],"example":"Tổng bằng 9 ở (3;6), (4;5), (5;4), (6;3). Xác suất bằng \\frac{4}{36} = \\frac{1}{9}.","worked":[],"tip":""}],"visuals":[],"table":[],"core":[["Liệt kê kết quả đồng khả năng",["Với hai lượt có phân biệt thứ tự, dùng cặp (a; b).","Với chọn đồng thời, dùng mỗi nhóm đúng một lần."],""]],"diagrams":["dice"]},{"title":"Biến cố thuận lợi và đối","intro":"P(A) = \\frac{n(A)}{n(Ω)} trong mô hình đồng khả năng. Dùng biến cố đối khi phần không xảy ra dễ đếm hơn.","formulas":"P(A đối) = 1 − P(A)","short":"","notes":[["","Kết quả, biến cố và xác suất","Một kết quả có thể chắc chắn, không thể hoặc có thể xảy ra. Xác suất cổ điển dùng các kết quả đồng khả năng; xác suất thực nghiệm dùng số lần quan sát được.","P(A)=\\frac{số kết quả thuận lợi}{số kết quả đồng khả năng} // Tần suất A = \\frac{số lần A xảy ra}{số lần thử}"]],"methods":[{"title":"Kết quả, biến cố và xác suất","lead":"Một kết quả có thể chắc chắn, không thể hoặc có thể xảy ra. Xác suất cổ điển dùng các kết quả đồng khả năng; xác suất thực nghiệm dùng số lần quan sát được.","steps":["Liệt kê kết quả hoặc đọc bảng thử nghiệm","Xác định mẫu số đúng","Đếm kết quả thỏa yêu cầu"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Rút có và không hoàn lại","intro":"Có hoàn lại giữ số vật cho lượt sau. Không hoàn lại làm thay đổi cả số vật và số trường hợp thuận lợi tùy lượt trước.","formulas":"","short":"","notes":[],"methods":[{"title":"Biến cố khi rút không hoàn lại","lead":"","steps":[],"example":"","tip":"","worked":[["Biến cố khi rút không hoàn lại","Hộp có 3 viên xanh, 2 viên đỏ. Rút hai viên không hoàn lại. Tính xác suất cả hai xanh.",["Lần đầu có 3 lựa chọn xanh trong 5 viên.","Sau khi lấy một viên xanh, còn 2 xanh trong 4 viên.","Nhân \\frac{3}{5} × \\frac{2}{4} theo hai bước cùng xảy ra."],"\\frac{3}{10}.",""]]},{"title":"Đếm số cách chọn đồng thời bằng biến cố đối","lead":"","steps":["Xác định các cặp không xét thứ tự và đồng khả năng.","Đếm những cặp không chứa đối tượng cần chọn.","Lấy một trừ xác suất của trường hợp đó."],"example":"","worked":[],"tip":"","practice":["Một hộp có 3 bi đỏ và 5 bi xanh cùng kích thước. Lấy ngẫu nhiên đồng thời 2 bi. Tính xác suất có ít nhất một bi đỏ.","Có 28 cặp bi và 10 cặp toàn xanh.","Xác suất bằng 1 − \\frac{10}{28} = \\frac{9}{14}."]}],"visuals":[],"table":[]}],"g9-c9":[{"title":"Góc nội tiếp","intro":"Đỉnh nằm trên đường tròn, hai cạnh cắt đường tròn. Số đo bằng nửa cung bị chắn. Góc chắn nửa đường tròn là góc vuông.","formulas":"\\widehat{AMB} = \\frac{số đo cung AB không chứa M}{2}","short":"","notes":[["định lí","","Đỉnh góc nằm trên đường tròn và hai cạnh chứa hai dây. Số đo góc nội tiếp bằng nửa cung bị chắn. Hai góc nội tiếp chắn cùng một cung bằng nhau. Góc chắn nửa đường tròn bằng 90°.","\\widehat{AMB}=\\frac{số đo cung AB không chứa M}{2}"]],"methods":[{"title":"Góc nội tiếp","lead":"Đỉnh góc nằm trên đường tròn và hai cạnh chứa hai dây. Số đo góc nội tiếp bằng nửa cung bị chắn. Hai góc nội tiếp chắn cùng một cung bằng nhau. Góc chắn nửa đường tròn bằng 90°.","steps":["Xác định đỉnh M","Chọn cung AB không qua M","Áp dụng tính chất đúng"],"example":"","tip":"","worked":[["Hai góc chắn cùng một cung","Góc ở tâm AOB bằng 120° như hình. Tính góc nội tiếp ACB.",["Nhận ra cả hai góc cùng chắn cung nhỏ AB.","Lấy một nửa số đo góc ở tâm."],"Góc ACB bằng 60°.","Kiểm tra điểm C nằm trên cung nào trước khi chọn cung bị chắn."]],"diagram":"inscribedAngle"}],"visuals":[],"table":[],"core":[["Góc nội tiếp",["Góc nội tiếp bằng một nửa góc ở tâm cùng chắn một cung. Góc nội tiếp chắn đường kính bằng 90°."],""]],"diagrams":["inscribedAngle"]},{"title":"Đường tròn ngoại tiếp và nội tiếp","intro":"Tâm ngoại tiếp là giao các đường trung trực, cách đều ba đỉnh. Tâm nội tiếp là giao các phân giác trong, cách đều ba cạnh.","formulas":"","short":"","notes":[["khái niệm","Tâm ngoại tiếp và tâm nội tiếp","Đường tròn ngoại tiếp đi qua ba đỉnh; tâm là giao ba đường trung trực. Đường tròn nội tiếp tiếp xúc ba cạnh; tâm là giao ba phân giác trong. Trong tam giác vuông, tâm ngoại tiếp là trung điểm cạnh huyền.","Với tam giác vuông: R=\\frac{c_{huyền}}{2}"]],"methods":[{"title":"Tâm ngoại tiếp và tâm nội tiếp","lead":"Đường tròn ngoại tiếp đi qua ba đỉnh; tâm là giao ba đường trung trực. Đường tròn nội tiếp tiếp xúc ba cạnh; tâm là giao ba phân giác trong. Trong tam giác vuông, tâm ngoại tiếp là trung điểm cạnh huyền.","steps":["Xác định đang xét cách đều cạnh hay đỉnh","Chọn loại đường đồng quy","Tìm tâm và bán kính"],"example":"","tip":"","worked":[]},{"title":"Phân biệt tâm ngoại tiếp và nội tiếp","lead":"","steps":[],"example":"","tip":"","worked":[["Phân biệt tâm ngoại tiếp và nội tiếp","Tìm bán kính ngoại tiếp tam giác vuông có cạnh huyền 13 cm.",["Đường kính chắn góc nội tiếp vuông.","Trung điểm cạnh huyền cách đều ba đỉnh nên là tâm ngoại tiếp.","Bán kính bằng nửa cạnh huyền."],"6,5 cm.",""]]}],"visuals":[],"table":[],"diagrams":["triangleCenters"]},{"title":"Tứ giác nội tiếp","intro":"Bốn đỉnh cùng nằm trên một đường tròn. Hai góc đối có tổng 180°. Với tứ giác lồi, một cặp góc đối bù nhau đủ để suy ra nội tiếp.","formulas":"","short":"","notes":[["định lí","","Tứ giác nội tiếp có bốn đỉnh cùng thuộc một đường tròn. Hai góc đối bù nhau. Với tứ giác lồi, có thể dùng điều kiện một cặp góc đối có tổng 180° để chứng minh nội tiếp.","\\widehat{A}+\\widehat{C}=180°"],["cách làm","Nhận diện cung và chứng minh nội tiếp","Chọn cung không chứa đỉnh góc nội tiếp. Khi chứng minh tứ giác lồi nội tiếp, có thể dùng hai góc đối bù nhau hoặc hai góc cùng nhìn một đoạn từ cùng phía bằng nhau.","\\widehat{A}+\\widehat{C}=180° ⇒ ABCD nội tiếp nếu tứ giác lồi"]],"methods":[{"title":"Tứ giác nội tiếp","lead":"Tứ giác nội tiếp có bốn đỉnh cùng thuộc một đường tròn. Hai góc đối bù nhau. Với tứ giác lồi, có thể dùng điều kiện một cặp góc đối có tổng 180° để chứng minh nội tiếp.","steps":["Kiểm tra thứ tự bốn đỉnh","Tìm hai góc đối","Chứng minh bù nhau hoặc tìm một tâm cách đều"],"example":"","tip":"","worked":[]},{"title":"Nhận diện cung và chứng minh nội tiếp","lead":"Chọn cung không chứa đỉnh góc nội tiếp. Khi chứng minh tứ giác lồi nội tiếp, có thể dùng hai góc đối bù nhau hoặc hai góc cùng nhìn một đoạn từ cùng phía bằng nhau.","steps":["Ghi tên góc và cung rõ","Tìm hai góc thích hợp","Chứng minh bằng nhau hoặc bù nhau"],"example":"","tip":"","worked":[]},{"title":"Chứng minh tứ giác nội tiếp bằng hai góc đối","lead":"Áp dụng cho tứ giác lồi có tổng một cặp góc đối bằng 180°.","steps":["Xác định hai góc đối của tứ giác theo đúng thứ tự các đỉnh.","Dùng góc vuông, góc bù hoặc góc trong tam giác để tính tổng.","Kết luận bốn đỉnh cùng thuộc một đường tròn."],"example":"\\widehat{ABC} = \\widehat{ADC} = 90° thì B và D cùng nằm trên đường tròn đường kính AC.","worked":[],"tip":""},{"title":"Nhận biết tứ giác nội tiếp từ góc ngoài","lead":"","steps":["Xác định góc ngoài và góc trong kề bù với nó.","Đổi góc ngoài thành số đo góc trong.","Nếu góc trong này và góc đối diện có tổng 180°, suy ra tứ giác nội tiếp."],"example":"","worked":[],"tip":"","practice":["Cho tứ giác lồi ABCD, kéo dài BA qua A đến E. Biết \\widehat{EAD} = \\widehat{BCD} = 72°. Chứng minh ABCD nội tiếp.","Góc DAB kề bù với góc EAD.","\\widehat{DAB} = 108°. Vì \\widehat{DAB} + \\widehat{BCD} = 180°, ABCD nội tiếp."]}],"visuals":[0],"table":[]},{"title":"Đa giác đều","intro":"Các cạnh và góc bằng nhau; có chung tâm nội tiếp và ngoại tiếp. Mỗi cạnh chắn góc ở tâm \\frac{360°}{n}.","formulas":"Góc trong của đa giác đều n cạnh = \\frac{(n − 2)·180°}{n}","short":"","notes":[["tính chất","","Các cạnh và các góc trong bằng nhau. Tâm của đường tròn nội tiếp và ngoại tiếp trùng nhau. Nối tâm với n đỉnh tạo n tam giác cân bằng nhau.","Góc ở tâm = \\frac{360°}{n}; góc trong = \\frac{(n−2)180°}{n}"]],"methods":[{"title":"Đa giác đều","lead":"Các cạnh và các góc trong bằng nhau. Tâm của đường tròn nội tiếp và ngoại tiếp trùng nhau. Nối tâm với n đỉnh tạo n tam giác cân bằng nhau.","steps":["Đếm n","Chia hình quanh tâm","Dùng tổng góc hoặc độ dài cung phù hợp"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Đa giác đều",["Góc ở tâm giữa hai đỉnh liên tiếp bằng \\frac{360°}{n}.","Góc trong mỗi đỉnh bằng \\frac{(n−2)·180°}{n}."],""]],"diagrams":["regularGrid"]}],"g9-c10":[{"title":"Hình trụ","intro":"Hai đáy là hình tròn bằng nhau. Mở mặt bên được hình chữ nhật có chiều dài chu vi đáy và chiều rộng bằng chiều cao.","formulas":"S_{xq} = 2πrh; S_{tp} = 2πrh + 2πr²; V = πr²h","short":"","notes":[],"methods":[],"visuals":[0],"table":[]},{"title":"Hình nón","intro":"Đường sinh l nối đỉnh với một điểm trên đường tròn đáy. Chiều cao h vuông góc đáy.","formulas":"l² = r² + h²; S_{xq} = πrl; S_{tp} = πrl + πr²; V = \\frac{πr²h}{3}","short":"","notes":[["cách làm","Đọc bán kính, đường sinh và thiết diện","Ở hình nón, đường sinh dài hơn chiều cao. Ở hình cầu, mặt cắt qua tâm có bán kính lớn nhất. Đề về sơn, bọc cần diện tích; đề về lượng chứa cần thể tích.","Nón: l²=r²+h²; cầu cắt ở khoảng d: bán kính = \\sqrt{R²−d²} nếu d<R"]],"methods":[{"title":"Đọc bán kính, đường sinh và thiết diện","lead":"Ở hình nón, đường sinh dài hơn chiều cao. Ở hình cầu, mặt cắt qua tâm có bán kính lớn nhất. Đề về sơn, bọc cần diện tích; đề về lượng chứa cần thể tích.","steps":["Vẽ mặt cắt qua trục hoặc tâm","Ghi các đoạn vuông góc","Chọn công thức rồi đổi đơn vị"],"example":"","tip":"","worked":[]},{"title":"Tìm đường sinh và diện tích xung quanh hình nón","lead":"Bán kính đáy, chiều cao và đường sinh tạo thành tam giác vuông trong thiết diện qua trục.","steps":["Tính l = \\sqrt{r²+h²}.","Tính diện tích xung quanh πrl.","Nếu hỏi diện tích toàn phần, cộng πr²."],"example":"r = 5, h = 12 thì l = 13, diện tích xung quanh bằng 65π.","worked":[],"tip":""},{"title":"Cùng đáy và chiều cao","lead":"","steps":[],"example":"","tip":"","worked":[["Cùng đáy và chiều cao","Một hình nón và hình trụ có cùng bán kính đáy 3 cm và chiều cao 8 cm. Tính hiệu thể tích.",["Thể tích trụ là π·3²·8 = 72π cm³.","Thể tích nón bằng một phần ba, tức 24π cm³.","Lấy hiệu 72π − 24π."],"48π cm³.",""]]},{"title":"Tính thể tích vật ghép từ trụ và nón","lead":"","steps":["Tách vật thành hai khối không chồng lấn.","Dùng đúng chiều cao vuông góc của từng khối.","Tính và cộng hai thể tích."],"example":"","worked":[],"tip":"","practice":["Một vật gồm hình trụ bán kính 3 cm, cao 10 cm và hình nón cùng đáy, cao 4 cm. Tính thể tích vật.","Thể tích nón bằng một phần ba tích diện tích đáy và chiều cao.","V = 90π + 12π = 102π cm³."]}],"visuals":[],"table":[],"core":[["Đường sinh hình nón",["Trong thiết diện qua trục, r và h là hai cạnh góc vuông; l là cạnh huyền."],"l = \\sqrt{r²+h²} // S_{xq} = πrl // V = \\frac{1}{3}πr²h"]],"diagrams":["cone"]},{"title":"Hình cầu và mặt cầu","intro":"Mặt cầu là bề mặt; hình cầu gồm cả phần bên trong. Nếu mặt phẳng cách tâm d < r, bán kính thiết diện là √(r² − d²).","formulas":"S mặt cầu = 4πr²; V hình cầu = \\frac{4πr³}{3}","short":"","notes":[],"methods":[],"visuals":[],"table":[],"diagrams":["sphere"]}],"g10-c1":[{"title":"Mệnh đề, phủ định và lượng từ","intro":"Mệnh đề là câu khẳng định có thể xác định đúng hoặc sai. Phủ định của “mọi” là “tồn tại” và ngược lại, đồng thời phủ định tính chất.","formulas":"Phủ định của ∀x, P(x) là ∃x, không P(x).","short":"","notes":[["","Mệnh đề, phủ định, điều kiện cần và đủ","Mệnh đề là câu khẳng định có giá trị đúng hoặc sai. P ⇒ Q nghĩa là P đủ cho Q, còn Q cần cho P. Hai chiều đúng mới có tương đương. Phủ định đổi lượng từ và đổi điều kiện.","¬(∀x, P(x)) ⇔ ∃x, ¬P(x) // ¬(∃x, P(x)) ⇔ ∀x, ¬P(x)"],["cách làm","Viết phủ định chính xác","Đổi “mọi” thành “tồn tại” và đảo điều kiện bên trong. Phủ định của ≥ là <; phủ định của “và” là “hoặc” giữa các phủ định. Một phản ví dụ đủ bác bỏ mệnh đề tổng quát.","¬(x≥a) ⇔ x<a"]],"methods":[{"title":"Mệnh đề, phủ định, điều kiện cần và đủ","lead":"Mệnh đề là câu khẳng định có giá trị đúng hoặc sai. P ⇒ Q nghĩa là P đủ cho Q, còn Q cần cho P. Hai chiều đúng mới có tương đương. Phủ định đổi lượng từ và đổi điều kiện.","steps":["Tách giả thiết và kết luận","Kiểm tra chiều đang xét","Tìm một phản ví dụ nếu muốn bác bỏ mệnh đề chứa “mọi”"],"example":"","tip":"","worked":[]},{"title":"Viết phủ định chính xác","lead":"Đổi “mọi” thành “tồn tại” và đảo điều kiện bên trong. Phủ định của ≥ là <; phủ định của “và” là “hoặc” giữa các phủ định. Một phản ví dụ đủ bác bỏ mệnh đề tổng quát.","steps":["Xác định tập đang xét","Đổi lượng từ","Viết lại điều kiện phủ định bằng kí hiệu"],"example":"","tip":"","worked":[]},{"title":"Viết phủ định của mệnh đề có lượng từ","lead":"Phủ định đổi lượng từ và phủ định điều kiện theo sau.","steps":["Xác định tập mà biến chạy qua.","Đổi “mọi” thành “tồn tại” hoặc ngược lại.","Phủ định điều kiện, chú ý đổi cả dấu bằng nếu cần."],"example":"Phủ định “Mọi x ∈ ℝ đều thỏa x² > 0” là “Tồn tại x ∈ ℝ sao cho x² ≤ 0”.","worked":[],"tip":""}],"visuals":[],"table":[],"core":[["Phủ định mệnh đề có lượng từ",["Đổi “với mọi” thành “tồn tại” hoặc ngược lại, rồi phủ định điều kiện đi kèm."],"Phủ định của ∀x ∈ A, P(x) là ∃x ∈ A sao cho P(x) sai"]]},{"title":"Kéo theo và tương đương","intro":"P ⇒ Q nghĩa là P đủ để có Q và Q cần để có P. Đảo là Q ⇒ P, cần chứng minh riêng. Tương đương khi cả hai chiều đúng.","formulas":"P ⇔ Q khi P ⇒ Q và Q ⇒ P","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Tập hợp và tập con","intro":"Viết ∈ cho phần tử, ⊂ cho quan hệ tập con. ∅ là tập con của mọi tập. Một tập n phần tử có 2ⁿ tập con vì mỗi phần tử có hai lựa chọn.","formulas":"Số tập con thực sự = 2ⁿ − 1","short":"","notes":[["bổ sung","Đếm tập con bằng quy tắc chọn–bỏ","Mỗi phần tử có hai trạng thái độc lập: có trong tập con hoặc không. Nếu yêu cầu chứa một phần tử và không chứa một phần tử khác, hai trạng thái đó bị cố định.","n phần tử ⇒ 2ⁿ tập con; số tập con thực sự = 2ⁿ−1"]],"methods":[{"title":"Đếm tập con bằng quy tắc chọn–bỏ","lead":"Mỗi phần tử có hai trạng thái độc lập: có trong tập con hoặc không. Nếu yêu cầu chứa một phần tử và không chứa một phần tử khác, hai trạng thái đó bị cố định.","steps":["Đánh dấu phần tử bắt buộc hoặc bị cấm","Đếm phần tử còn tự do","Dùng lũy thừa của 2"],"example":"Tập 5 phần tử có 32 tập con; chứa a và không chứa b với a≠b còn 2³=8 cách.","tip":"","worked":[]},{"title":"Đếm tập con và tập con thực sự","lead":"","steps":[],"example":"","tip":"","worked":[["Đếm tập con và tập con thực sự","A có 5 phần tử. A có bao nhiêu tập con thực sự khác rỗng?",["Với mỗi phần tử có hai lựa chọn, lấy hoặc bỏ. Năm lựa chọn độc lập cho 2⁵ = 32 tập con.","Một lựa chọn bỏ hết sinh ra tập rỗng.","Một lựa chọn lấy hết sinh ra chính A. Loại cả hai."],"30 tập con.","Tập con thực sự loại A, còn điều kiện khác rỗng loại thêm ∅."]]}],"visuals":[],"table":[],"core":[["Đếm tập con · mở rộng",["Mỗi phần tử có hai lựa chọn, lấy hoặc bỏ. Trừ thêm 1 nếu chỉ đếm tập con thực sự."],"Số tập con của A có n phần tử = 2^n"]]},{"title":"Phép toán tập hợp","intro":"Giao lấy phần chung. Hợp lấy mọi phần tử thuộc ít nhất một tập. A ∖ B lấy phần thuộc A nhưng không thuộc B. Phần bù của A trong E là E ∖ A nếu A ⊂ E.","formulas":"","short":"","notes":[["","Tập hợp và phép toán tập hợp","a ∈ A xét phần tử, A ⊂ B xét mọi phần tử của A đều thuộc B. Giao lấy phần chung; hợp lấy phần thuộc ít nhất một tập; hiệu lấy phần chỉ thuộc tập đứng trước.","A∩B={x:x∈A và x∈B}; A∪B={x:x∈A hoặc x∈B}"]],"methods":[{"title":"Tập hợp và phép toán tập hợp","lead":"a ∈ A xét phần tử, A ⊂ B xét mọi phần tử của A đều thuộc B. Giao lấy phần chung; hợp lấy phần thuộc ít nhất một tập; hiệu lấy phần chỉ thuộc tập đứng trước.","steps":["Vẽ trục số hoặc sơ đồ Venn","Tô các miền theo phép toán","Thử riêng từng đầu mút"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Hiệu và phần bù",["Hiệu A ∖ B giữ những phần tử thuộc A mà không thuộc B. Phần bù của B trong A là A ∖ B khi B ⊂ A."],""]],"diagrams":["venn"]},{"title":"Khoảng, đoạn và nửa khoảng","intro":"Dấu [ hoặc ] lấy đầu mút tương ứng. Dấu ( hoặc ) bỏ đầu mút tương ứng. Với vô cực luôn dùng ngoặc tròn.","formulas":"[a;b) = {x ∈ ℝ ∣ a ≤ x < b}","short":"","notes":[],"methods":[{"title":"Tìm giao và hiệu của hai khoảng có chung miền","lead":"","steps":["Vẽ từng tập trên trục số, giữ đúng đầu mút.","Lấy phần trùng để tìm giao.","Để tìm hiệu, xóa khỏi tập thứ nhất các điểm cũng thuộc tập thứ hai."],"example":"","worked":[],"tip":"","practice":["Cho A = [−2; 4) và B = (1; 6]. Tìm A ∩ B và A ∖ B.","Điểm 1 thuộc A nhưng không thuộc B. Điểm 4 thuộc B nhưng không thuộc A.","A ∩ B = (1; 4) và A ∖ B = [−2; 1]."]}],"visuals":[],"table":[],"diagrams":["halfOpen"]}],"g10-c2":[{"title":"Bất phương trình hai ẩn","intro":"Có dạng ax + by + c > 0 hoặc các dấu <, ≥, ≤, với a và b không đồng thời bằng 0. Nghiệm là cặp (x;y) thỏa khi thay vào.","formulas":"","short":"","notes":[["","Bất phương trình bậc nhất hai ẩn","Biên ax+by+c=0 chia mặt phẳng thành hai nửa. Dùng điểm thử ngoài biên để chọn nửa mặt phẳng. Hệ bất phương trình lấy phần giao; biên thuộc miền khi dấu cho phép bằng.","ax+by+c≥0; (a,b) ≠ (0,0)"]],"methods":[{"title":"Bất phương trình bậc nhất hai ẩn","lead":"Biên ax+by+c=0 chia mặt phẳng thành hai nửa. Dùng điểm thử ngoài biên để chọn nửa mặt phẳng. Hệ bất phương trình lấy phần giao; biên thuộc miền khi dấu cho phép bằng.","steps":["Vẽ từng đường biên","Thử điểm và giữ đúng nửa mặt phẳng","Lấy phần giao, xét dấu bằng ở biên"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Biểu diễn miền nghiệm","intro":"Vẽ đường biên ax + by + c = 0. Thử một điểm ngoài biên để chọn nửa mặt phẳng. Dấu nghiêm ngặt loại biên; dấu có bằng giữ biên.","formulas":"","short":"","notes":[],"methods":[{"title":"Miền nghiệm của hệ bất phương trình","lead":"","steps":[],"example":"","tip":"","worked":[["Miền nghiệm của hệ bất phương trình","Vẽ miền thỏa x ≥ 0, y ≥ 0 và 2x + y ≤ 6.",["Hai điều kiện đầu giữ góc phần tư thứ nhất cùng hai trục.","Đường 2x + y = 6 đi qua (3; 0) và (0; 6).","Thử (0; 0) thấy thỏa 0 ≤ 6, giữ phía chứa gốc và giữ biên."],"Tam giác kín có ba đỉnh (0; 0), (3; 0), (0; 6).",""]]}],"visuals":[],"table":[],"core":[["Chọn đúng nửa mặt phẳng",["Vẽ đường biên ax + by = c. Dùng một điểm ngoài đường biên để thử dấu.","Lấy đường biên nếu có dấu bằng."],""]]},{"title":"Hệ và bài toán tối ưu","intro":"Miền nghiệm của hệ là phần giao các miền. Khi miền nghiệm là đa giác kín và bị chặn, giá trị lớn nhất, nhỏ nhất của biểu thức bậc nhất đạt tại ít nhất một đỉnh.","formulas":"F(x;y) = px + qy","short":"","notes":[["cách làm","Miền nghiệm và bài toán chọn phương án","Đường biên nghiêm ngặt dùng nét đứt khi biểu diễn. Với miền đa giác kín và bị chặn, biểu thức bậc nhất đạt cực trị tại ít nhất một đỉnh. Nếu đề yêu cầu nghiệm nguyên, kiểm tra các điểm nguyên khả thi.","F=px+qy"]],"methods":[{"title":"Miền nghiệm và bài toán chọn phương án","lead":"Đường biên nghiêm ngặt dùng nét đứt khi biểu diễn. Với miền đa giác kín và bị chặn, biểu thức bậc nhất đạt cực trị tại ít nhất một đỉnh. Nếu đề yêu cầu nghiệm nguyên, kiểm tra các điểm nguyên khả thi.","steps":["Vẽ đúng nửa mặt phẳng","Tìm giao các biên","So giá trị tại các đỉnh nếu đủ điều kiện"],"example":"","tip":"","worked":[]},{"title":"Tối ưu biểu thức bậc nhất trên miền đa giác kín","lead":"Điều kiện tạo thành đa giác bị chặn và có đường biên thuộc miền nghiệm.","steps":["Vẽ giao của các nửa mặt phẳng.","Tìm tọa độ từng đỉnh bằng giải các cặp phương trình đường biên.","Tính giá trị hàm mục tiêu tại các đỉnh và so sánh."],"example":"Trên tam giác x ≥ 0, y ≥ 0, x + y ≤ 4, biểu thức 3x + 2y lớn nhất bằng 12 tại (4; 0).","worked":[["Thử giá trị tại các đỉnh","Trên miền trong hình, x ≥ 0, y ≥ 0, x + y ≤ 4. Tìm giá trị lớn nhất của F = 3x + y.",["Liệt kê các đỉnh O(0; 0), A(4; 0), B(0; 4).","Tính lần lượt F bằng 0, 12, 4."],"Giá trị lớn nhất là 12 tại A(4; 0).","Với hệ số khác nhau, cạnh AB có thể chỉ có một đầu đạt tối ưu."]],"tip":"","diagram":"practiceOptimum"},{"title":"Xét khi hai đỉnh cùng cho giá trị tối ưu","lead":"","steps":["Vẽ miền nghiệm và đọc tọa độ các đỉnh.","Tính biểu thức bậc nhất ở mỗi đỉnh.","Nếu hai đỉnh kề cùng đạt giá trị tối ưu thì xét cả cạnh nối hai đỉnh đó."],"example":"","worked":[],"tip":"","practice":["Tìm giá trị lớn nhất của 2x + 2y trên miền x ≥ 0, y ≥ 0, x + y ≤ 4 và nêu mọi điểm đạt giá trị đó.","Hai đỉnh (4; 0) và (0; 4) đều cho giá trị 8.","Giá trị lớn nhất là 8, đạt tại mọi điểm trên đoạn nối (4; 0) và (0; 4)."],"diagram":"practiceOptimum"}],"visuals":[0],"table":[]}],"g10-c3":[{"title":"Giá trị lượng giác","intro":"Trên nửa đường tròn đơn vị, cos α là hoành độ, sin α là tung độ. Tan cần cos α ≠ 0, cot cần sin α ≠ 0.","formulas":"sin² α + cos² α = 1; sin(180° − α) = sin α; cos(180° − α) = −cos α","short":"","notes":[["","Giá trị lượng giác từ 0° đến 180°","Trên nửa đường tròn đơn vị, cos là hoành độ và sin là tung độ. Với góc tù, sin dương và cos âm. Tan và cot chỉ xác định khi mẫu tương ứng khác 0.","sin²α+cos²α=1 // sin(180°−α)=sin α; cos(180°−α)=−cos α"],["định lí","Dấu, góc bù và điều kiện","Với 0°≤α≤180°, sin không âm; cos đổi dấu qua 90°. Tan và cot xác định khi mẫu tương ứng khác 0. Tan của hai góc bù trái dấu nếu xác định.","tan α=\\frac{sin α}{cos α}; cot α=\\frac{cos α}{sin α}"]],"methods":[{"title":"Giá trị lượng giác từ 0° đến 180°","lead":"Trên nửa đường tròn đơn vị, cos là hoành độ và sin là tung độ. Với góc tù, sin dương và cos âm. Tan và cot chỉ xác định khi mẫu tương ứng khác 0.","steps":["Xác định góc nhọn, vuông hay tù","Đưa về góc đặc biệt hoặc góc bù","Gắn đúng dấu"],"example":"","tip":"","worked":[]},{"title":"Dấu, góc bù và điều kiện","lead":"Với 0°≤α≤180°, sin không âm; cos đổi dấu qua 90°. Tan và cot xác định khi mẫu tương ứng khác 0. Tan của hai góc bù trái dấu nếu xác định.","steps":["Xác định vị trí góc","Dùng góc bù để lấy trị số","Giữ đúng dấu"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Định lí cosin","intro":"Với a, b, c lần lượt đối diện A, B, C. Dùng hai cạnh và góc xen giữa, hoặc tìm góc khi biết ba cạnh.","formulas":"a² = b² + c² − 2bc cos A; cos A = \\frac{b² + c² − a²}{2bc}","short":"","notes":[["cách làm","Chọn định lí theo dữ kiện","Hai cạnh và góc xen giữa cho cạnh thứ ba bằng cosin và diện tích bằng sin. Biết ba cạnh có thể dùng Heron. Biết cạnh đối một góc cho bán kính ngoại tiếp bằng định lí sin.","R=\\frac{a}{2sin A}; r=\\frac{S}{p}"]],"methods":[{"title":"Chọn định lí theo dữ kiện","lead":"Hai cạnh và góc xen giữa cho cạnh thứ ba bằng cosin và diện tích bằng sin. Biết ba cạnh có thể dùng Heron. Biết cạnh đối một góc cho bán kính ngoại tiếp bằng định lí sin.","steps":["Vẽ tam giác và ghi a đối A","Xác định cặp dữ kiện đã đủ","Giải rồi kiểm tra cạnh và góc"],"example":"Hai cạnh 5, 8 kẹp góc 60°: cạnh còn lại bằng 7 và diện tích bằng 10√3.","tip":"","worked":[]},{"title":"Giải tam giác bằng định lí côsin","lead":"","steps":[],"example":"","tip":"","worked":[["Giải tam giác bằng định lí côsin","Tam giác có AB = 5 cm, AC = 7 cm, \\widehat{BAC} = 60°. Tính BC.",["Dùng định lí côsin với góc xen giữa hai cạnh đã biết.","BC² = 5² + 7² − 2·5·7·cos 60° = 25 + 49 − 35 = 39.","Chọn căn dương vì BC là độ dài."],"BC = \\sqrt{39} cm.",""]]},{"title":"Tính góc khi biết ba cạnh bằng định lí côsin","lead":"","steps":["Xác định cạnh đối diện góc cần tính.","Chuyển công thức côsin để đưa cos của góc về một thương.","Dùng giá trị cos để xác định góc trong khoảng từ 0° đến 180°."],"example":"","worked":[],"tip":"","practice":["Tam giác ABC có BC = \\sqrt{19}, CA = 3 và AB = 5. Tính góc A.","cos A = \\frac{3²+5²−19}{2·3·5}.","cos A = \\frac{1}{2}, suy ra A = 60°."]}],"visuals":[],"table":[],"core":[["Cạnh đối và góc xen giữa",["Theo quy ước, a = BC, b = CA, c = AB. Dùng định lí côsin khi biết hai cạnh và góc xen giữa, hoặc ba cạnh."],"a² = b² + c² − 2bc·cos A"]],"diagrams":["sinCosTriangle"]},{"title":"Định lí sin","intro":"Dùng cạnh đối diện với góc tương ứng. Hai góc bù nhau có cùng sin, nên khi suy góc cần kiểm tra khả năng còn lại.","formulas":"\\frac{a}{sin A} = \\frac{b}{sin B} = \\frac{c}{sin C} = 2R","short":"","notes":[],"methods":[{"title":"Dùng định lí sin khi biết góc và cạnh đối diện","lead":"Cặp góc–cạnh đối diện cho ngay tỉ số chung.","steps":["Ghi cặp tương ứng a ↔ A, b ↔ B, c ↔ C.","Thay cặp đã biết vào định lí sin.","Khi tìm góc từ sin, kiểm tra cả góc bù nếu dữ kiện chưa loại được."],"example":"A = 30°, a = 6 và B = 45° thì b = 6 \\frac{sin 45°}{sin 30°} = 6\\sqrt{2}.","worked":[],"tip":""}],"visuals":[],"table":[],"diagrams":["sinCosTriangle"]},{"title":"Diện tích tam giác","intro":"R, r lần lượt là bán kính ngoại tiếp, nội tiếp; p là nửa chu vi. Chọn công thức theo dữ kiện.","formulas":"S = \\frac{ahₐ}{2} = \\frac{bc sin A}{2} = pr = \\frac{abc}{4R}; S = \\sqrt{p(p−a)(p−b)(p−c)}","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Tính nhanh tam giác đều","intro":"Hạ đường cao chia đáy thành hai nửa và tạo tam giác vuông. Trọng tâm, tâm ngoại tiếp và tâm nội tiếp trùng nhau.","formulas":"h = \\frac{a√3}{2}; S = \\frac{a²√3}{4}; R = \\frac{2h}{3}; r = \\frac{h}{3}","short":"","notes":[["bổ sung","","Kẻ đường cao từ một đỉnh, đáy chia đôi. Áp dụng Pythagore rồi dùng S=\\frac{ah}{2}. Tâm chung chia trung tuyến theo tỉ số 2:1 từ đỉnh.","h=\\frac{a√3}{2}; S=\\frac{a²√3}{4} // R=\\frac{a√3}{3}; r=\\frac{a√3}{6}; R=2r"]],"methods":[{"title":"Tính nhanh tam giác đều","lead":"Kẻ đường cao từ một đỉnh, đáy chia đôi. Áp dụng Pythagore rồi dùng S=\\frac{ah}{2}. Tâm chung chia trung tuyến theo tỉ số 2:1 từ đỉnh.","steps":["Xác định cạnh a","Chọn đúng đại lượng cần tính","Nếu nhớ không chắc, dựng lại đường cao"],"example":"","tip":"","worked":[]},{"title":"Công thức nhanh của tam giác đều","lead":"","steps":[],"example":"","tip":"","worked":[["Công thức nhanh của tam giác đều","Tam giác đều có cạnh 8 cm. Tìm chiều cao, diện tích, bán kính nội tiếp và ngoại tiếp.",["Đường cao chia cạnh đáy thành hai đoạn 4 cm. Theo Pythagore, h = \\sqrt{8²−4²} = 4\\sqrt{3} cm.","Diện tích bằng \\frac{8h}{2} = 16\\sqrt{3} cm².","Trong tam giác đều, đường cao cũng là trung tuyến. Tâm nằm ở \\frac{2}{3} đường cao tính từ đỉnh, nên R = \\frac{2h}{3} và r = \\frac{h}{3}."],"h = 4\\sqrt{3} cm; S = 16\\sqrt{3} cm²; r = \\frac{4\\sqrt{3}}{3} cm; R = \\frac{8\\sqrt{3}}{3} cm.",""]]}],"visuals":[0],"table":[],"core":[["Tính nhanh tam giác đều · mở rộng",["Đường cao h đồng thời là trung tuyến. Tâm O chia đường cao theo tỉ số 2 : 1 tính từ đỉnh."],"h = \\frac{a\\sqrt{3}}{2} // S = \\frac{a²\\sqrt{3}}{4} // r = \\frac{h}{3} // R = \\frac{2h}{3}"]]}],"g10-c4":[{"title":"Khái niệm vectơ","intro":"Vectơ có hướng và độ dài. Hai vectơ bằng nhau khi cùng hướng và bằng độ dài. Vectơ đối ngược hướng và bằng độ dài.","formulas":"","short":"","notes":[["","Vectơ và các phép toán","Vectơ có độ dài và hướng. Hai vectơ bằng nhau khi cùng hướng và bằng độ dài. Nhân số âm đổi hướng; vectơ đối của \\vec{AB} là \\vec{BA}. Tổng theo quy tắc ba điểm hoặc hình bình hành.","\\vec{AB}+\\vec{BC}=\\vec{AC}; \\vec{AB}−\\vec{AC}=\\vec{CB} // Độ dài k\\vec{u} bằng ∣k∣ nhân độ dài \\vec{u}"]],"methods":[{"title":"Vectơ và các phép toán","lead":"Vectơ có độ dài và hướng. Hai vectơ bằng nhau khi cùng hướng và bằng độ dài. Nhân số âm đổi hướng; vectơ đối của \\vec{AB} là \\vec{BA}. Tổng theo quy tắc ba điểm hoặc hình bình hành.","steps":["Sắp xếp điểm đầu và cuối để ghép vectơ","Đổi phép trừ thành cộng vectơ đối","Kiểm tra hướng kết quả"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Cộng, trừ và nhân số","intro":"Dùng quy tắc ba điểm hoặc hình bình hành. Trừ một vectơ là cộng vectơ đối. Hệ số âm đổi hướng; độ dài nhân trị tuyệt đối của hệ số.","formulas":"\\vec{AB} + \\vec{BC} = \\vec{AC}; độ dài k\\vec{u} bằng trị tuyệt đối của k nhân độ dài \\vec{u}","short":"","notes":[["cách làm","Rút gọn qua điểm trung gian","Dùng quy tắc ba điểm để đưa các vectơ về cùng gốc hoặc cùng mốc. Với trung điểm M của BC, hai vectơ MB và MC đối nhau.","\\vec{AB}+\\vec{AC}=2\\vec{AM}"]],"methods":[{"title":"Rút gọn qua điểm trung gian","lead":"Dùng quy tắc ba điểm để đưa các vectơ về cùng gốc hoặc cùng mốc. Với trung điểm M của BC, hai vectơ MB và MC đối nhau.","steps":["Chọn điểm trung gian hữu ích","Tách từng vectơ theo quy tắc ba điểm","Triệt tiêu cặp đối nhau"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Cộng, trừ và nhân vectơ",["Dùng quy tắc ba điểm, hình bình hành.","Vectơ hiệu đưa hai vectơ về chung gốc; vectơ tích k\\vec{u} cùng hướng khi k > 0 và ngược hướng khi k < 0, với \\vec{u} khác vectơ không."],"\\vec{AB} + \\vec{BC} = \\vec{AC} // \\vec{AB} − \\vec{AC} = \\vec{CB}"]],"diagrams":["vector"]},{"title":"Tọa độ","intro":"Lấy tọa độ điểm cuối trừ điểm đầu. Cộng, trừ, nhân vectơ theo từng tọa độ. Trung điểm lấy trung bình hai đầu; trọng tâm tam giác lấy trung bình ba đỉnh.","formulas":"\\vec{AB} = (x_{B} − x_{A}; y_{B} − y_{A})","short":"","notes":[["","Vectơ và tọa độ","Tọa độ vectơ AB bằng tọa độ B trừ A. Phép cộng, trừ, nhân số được làm theo từng tọa độ. Trung điểm lấy trung bình hai đầu, trọng tâm tam giác lấy trung bình ba đỉnh.","\\vec{AB}=(x_B−x_A;y_B−y_A) hoặc (x_B−x_A;y_B−y_A;z_B−z_A)"]],"methods":[{"title":"Vectơ và tọa độ","lead":"Tọa độ vectơ AB bằng tọa độ B trừ A. Phép cộng, trừ, nhân số được làm theo từng tọa độ. Trung điểm lấy trung bình hai đầu, trọng tâm tam giác lấy trung bình ba đỉnh.","steps":["Xác định chiều vectơ","Lấy cuối trừ đầu theo từng trục","Phân biệt tọa độ điểm với tọa độ vectơ"],"example":"","tip":"","worked":[]},{"title":"Tìm đỉnh hình bình hành bằng vectơ","lead":"","steps":[],"example":"","tip":"","worked":[["Tìm đỉnh hình bình hành bằng vectơ","A(1; 2), B(4; 3), D(2; 5) là ba đỉnh của hình bình hành ABCD. Tìm C.",["Tính \\vec{AD} = (2 − 1; 5 − 2) = (1; 3).","Với ABCD đi theo thứ tự, \\vec{BC} = \\vec{AD}.","Từ B cộng độ dời (1; 3), được (5; 6)."],"C(5; 6).","Đọc hướng mũi tên trước khi trừ tọa độ."]]},{"title":"Dùng vectơ để chia đoạn theo tỉ số","lead":"","steps":["Đặt M trên AB và viết \\vec{AM} dưới dạng một số nhân \\vec{AB}.","Từ tỉ số AM : MB, tính tỉ số AM : AB.","Nhân độ dời theo từng tọa độ rồi cộng vào A."],"example":"","worked":[],"tip":"","practice":["Cho A(1; −2), B(7; 4). Điểm M nằm giữa A, B và AM : MB = 1 : 2. Tìm M.","\\vec{AM} = \\frac{1}{3}\\vec{AB}.","M(3; 0)."]}],"visuals":[],"table":[],"diagrams":["vectorCoordinates"]},{"title":"Tích vô hướng","intro":"Với hai vectơ khác 0, tích vô hướng bằng tích độ dài nhân cos góc giữa chúng. Hai vectơ vuông góc khi tích bằng 0.","formulas":"\\vec{u}·\\vec{v} = u₁v₁ + u₂v₂; độ dài \\vec{u} = \\sqrt{u₁² + u₂²}","short":"","notes":[["","","Tích vô hướng cho một số. Với vectơ khác 0, dấu tích cho biết góc nhọn, vuông hay tù; tích bằng 0 thì hai vectơ vuông góc.","\\vec{u}·\\vec{v}=u₁v₁+u₂v₂ (cộng u₃v₃ trong Oxyz) // \\vec{u}·\\vec{v}=∣u∣∣v∣cos α"]],"methods":[{"title":"Tích vô hướng","lead":"Tích vô hướng cho một số. Với vectơ khác 0, dấu tích cho biết góc nhọn, vuông hay tù; tích bằng 0 thì hai vectơ vuông góc.","steps":["Tính tích theo tọa độ hoặc độ dài và góc","Kiểm tra vectơ khác 0 khi tính góc","Lấy cos rồi suy α"],"example":"","tip":"","worked":[]},{"title":"Tính tích vô hướng qua độ dài của tổng","lead":"Có thể khai triển bình phương độ dài để suy tích vô hướng.","steps":["Viết ∣u + v∣² = ∣u∣² + 2u·v + ∣v∣².","Thay ba độ dài.","Suy dấu tích vô hướng để nhận biết góc nhọn, vuông hay tù nếu cần."],"example":"∣u∣ = 3, ∣v∣ = 4, ∣u + v∣ = 5 thì u·v = \\frac{25 − 9 − 16}{2} = 0.","worked":[],"tip":""}],"visuals":[],"table":[]}],"g10-c5":[{"title":"Số gần đúng và sai số","intro":"Sai số tuyệt đối là độ lớn của hiệu giữa giá trị gần đúng và đúng. Độ chính xác d là cận trên của sai số. Sai số tương đối so sai số tuyệt đối với độ lớn số gần đúng khác 0.","formulas":"","short":"","notes":[["","","Sai số tuyệt đối là độ lớn chênh lệch giữa giá trị đúng và gần đúng. Độ chính xác d là một cận trên của sai số. Khi chỉ biết d, quy tròn ở hàng phù hợp với độ chính xác và yêu cầu.","Δ=∣a−ā∣; Δ≤d; sai số tương đối = \\frac{Δ}{∣ā∣} khi ā≠0"]],"methods":[{"title":"Số gần đúng và sai số","lead":"Sai số tuyệt đối là độ lớn chênh lệch giữa giá trị đúng và gần đúng. Độ chính xác d là một cận trên của sai số. Khi chỉ biết d, quy tròn ở hàng phù hợp với độ chính xác và yêu cầu.","steps":["Đọc đâu là giá trị gần đúng và độ chính xác","Xác định hàng cần quy tròn","Giữ đúng số chữ số có nghĩa theo đề"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Trung bình, trung vị và mốt","intro":"Trung bình lấy tổng chia cỡ mẫu. Trung vị là số giữa sau sắp xếp, hoặc trung bình hai số giữa khi N chẵn. Mốt là giá trị xuất hiện nhiều nhất.","formulas":"x̄ = \\frac{x₁ + … + xₙ}{n}","short":"","notes":[["","Số trung bình, trung vị, tứ phân vị và mốt","Số trung bình dùng mọi giá trị. Trung vị là giá trị giữa của mẫu đã sắp xếp hoặc trung bình hai giá trị giữa khi số lượng chẵn. Q₁ và Q₃ là trung vị của hai nửa; bỏ Q₂ nếu mẫu có số lượng lẻ. Mốt có tần số lớn nhất.","x̄=\\frac{∑xᵢ}{n}; Q₂ là trung vị"]],"methods":[{"title":"Số trung bình, trung vị, tứ phân vị và mốt","lead":"Số trung bình dùng mọi giá trị. Trung vị là giá trị giữa của mẫu đã sắp xếp hoặc trung bình hai giá trị giữa khi số lượng chẵn. Q₁ và Q₃ là trung vị của hai nửa; bỏ Q₂ nếu mẫu có số lượng lẻ. Mốt có tần số lớn nhất.","steps":["Sắp xếp mẫu nếu tìm trung vị hoặc tứ phân vị","Đếm đúng số giá trị","Tính đại lượng được hỏi"],"example":"Mẫu 1, 3, 7, 9 có trung vị 5 dù không có giá trị nào bằng 5.","tip":"","worked":[]},{"title":"Trung vị trước giá trị ngoại lệ","lead":"","steps":[],"example":"","tip":"","worked":[["Trung vị trước giá trị ngoại lệ","Tìm số trung bình và trung vị của 2, 3, 4, 5, 36.",["Dữ liệu đã sắp tăng và có 5 giá trị.","Trung vị là giá trị thứ 3, bằng 4.","Cộng được 50 rồi chia 5, số trung bình bằng 10."],"Trung vị 4. Số trung bình 10.","Giá trị 36 kéo trung bình lên, còn vị trí giữa vẫn là 4."]]},{"title":"Tìm số liệu còn thiếu từ số trung bình","lead":"","steps":["Nhân số trung bình với cỡ mẫu để tìm tổng.","Cộng các giá trị đã biết.","Lấy tổng trừ phần đã biết rồi kiểm tra bằng phép thế."],"example":"","worked":[],"tip":"","practice":["Mẫu gồm 6, 7, 9, 11 và x. Số trung bình là 9. Tìm x.","Tổng năm số bằng 45.","x = 45 − 33 = 12."]}],"visuals":[],"table":[]},{"title":"Tứ phân vị và độ phân tán","intro":"Q₂ là trung vị. Q₁, Q₃ là trung vị của nửa dưới và nửa trên, bỏ Q₂ khi cỡ mẫu lẻ. Khoảng biến thiên là max trừ min; khoảng tứ phân vị là Q₃ − Q₁.","formulas":"ΔQ = Q₃ − Q₁","short":"","notes":[["","Trung vị, tứ phân vị và độ phân tán","Sắp xếp mẫu. Trung vị là giá trị giữa hoặc trung bình hai giá trị giữa. Q₁ và Q₃ là trung vị của nửa dưới và trên sau khi bỏ trung vị nếu n lẻ. Phương sai đo bình phương độ lệch quanh trung bình.","ΔQ=Q₃−Q₁; s²=\\frac{∑(xᵢ−x̄)²}{n}; s=\\sqrt{s²}"]],"methods":[{"title":"Trung vị, tứ phân vị và độ phân tán","lead":"Sắp xếp mẫu. Trung vị là giá trị giữa hoặc trung bình hai giá trị giữa. Q₁ và Q₃ là trung vị của nửa dưới và trên sau khi bỏ trung vị nếu n lẻ. Phương sai đo bình phương độ lệch quanh trung bình.","steps":["Sắp xếp nếu tìm trung vị hoặc tứ phân vị","Tính x̄ nếu cần phương sai","Kiểm tra đơn vị của s và s²"],"example":"","tip":"","worked":[]},{"title":"Tìm tứ phân vị và ngưỡng ngoại lệ","lead":"Tứ phân vị dựa trên thứ tự của mẫu số liệu.","steps":["Sắp số liệu tăng dần và tìm trung vị.","Tìm trung vị mỗi nửa, bỏ trung vị chung nếu cỡ mẫu lẻ.","Tính Δ_Q = Q_3 − Q_1 rồi đối chiếu các ngưỡng Q_1 − 1,5Δ_Q và Q_3 + 1,5Δ_Q."],"example":"Mẫu 1, 2, 3, 4, 5, 6, 20 có Q_1 = 2, Q_3 = 6. Ngưỡng trên là 12, nên 20 là ngoại lệ theo quy tắc này.","worked":[],"tip":""}],"visuals":[],"table":[],"core":[["Khoảng tứ phân vị",["S
