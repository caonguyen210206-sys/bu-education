 x; (eˣ)′ = eˣ","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Hàm hợp và hàm khác","intro":"Lấy đạo hàm hàm ngoài tại hàm trong rồi nhân đạo hàm hàm trong. Điều kiện mẫu hoặc đối số vẫn giữ.","formulas":"(f(u))′ = f′(u)u′; (ln x)′ = \\frac{1}{x}; (aˣ)′ = aˣ ln a; (tan x)′ = \\frac{1}{cos²x}","short":"","notes":[["cách làm","Đạo hàm của hàm hợp và tiếp tuyến","Nếu hàm có dạng g(u(x)), lấy đạo hàm hàm ngoài tại u rồi nhân u′. Tiếp tuyến cần cả tọa độ điểm và hệ số góc.","(g(u))′=g′(u)u′ // y=f(x₀)+f′(x₀)(x−x₀)"]],"methods":[{"title":"Đạo hàm của hàm hợp và tiếp tuyến","lead":"Nếu hàm có dạng g(u(x)), lấy đạo hàm hàm ngoài tại u rồi nhân u′. Tiếp tuyến cần cả tọa độ điểm và hệ số góc.","steps":["Tách lớp trong và ngoài","Tính đạo hàm đúng thứ tự","Thay tại x₀ nếu viết tiếp tuyến"],"example":"","tip":"","worked":[]},{"title":"Đạo hàm hàm hợp và hệ số góc tiếp tuyến","lead":"","steps":[],"example":"","tip":"","worked":[["Đạo hàm hàm hợp và hệ số góc tiếp tuyến","Tìm hệ số góc tiếp tuyến của y = (2x − 1)³ tại x = 2.",["Đặt u = 2x − 1 thì y = u³ và u′ = 2.","Dùng quy tắc hàm hợp, y′ = 3u²·2 = 6(2x − 1)².","Tại x = 2, u = 3, nên hệ số góc bằng 6·9."],"54.","Nhớ nhân đạo hàm của biểu thức trong ngoặc."]]}],"visuals":[],"table":[]},{"title":"Đạo hàm cấp hai","intro":"f″ là đạo hàm của f′. Với tọa độ s(t), s′ là vận tốc tức thời, s″ là gia tốc tức thời.","formulas":"v(t) = s′(t); a(t) = s″(t)","short":"","notes":[],"methods":[],"visuals":[],"table":[]}],"g12-c1":[{"title":"Đơn điệu","intro":"Xét dấu f′ trên từng khoảng của tập xác định. f′ > 0 cho đồng biến; f′ < 0 cho nghịch biến. Một vài điểm f′ = 0 riêng lẻ không tự làm đổi chiều.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Cực trị","intro":"f′ đổi từ dương sang âm tại điểm trong miền xác định thì có cực đại; đổi từ âm sang dương thì có cực tiểu. Cần xét cả điểm không có đạo hàm nếu hàm vẫn xác định.","formulas":"","short":"","notes":[["phương pháp","Lập bảng biến thiên và nhận dạng cực trị","Mốc xét dấu gồm nghiệm của f′ và điểm f′ không xác định. Cực trị chỉ được xét tại điểm thuộc tập xác định của f. Nếu f′ bằng 0 nhưng dấu giữ nguyên hai bên, điểm đó không phải cực trị theo tiêu chuẩn đổi dấu.","f′ đổi dấu + sang − ⇒ cực đại // f′ đổi dấu − sang + ⇒ cực tiểu"],["cách làm","Đọc bảng biến thiên và tránh nhầm cực trị","Điểm f′ bằng 0 chưa chắc là cực trị. Khi tìm lớn nhất, nhỏ nhất trên đoạn, phải thử hai đầu mút. Khi tìm tiệm cận đứng, kiểm tra giới hạn một phía thay vì chỉ nhìn mẫu bằng 0.","f′: +→− cho cực đại; −→+ cho cực tiểu"]],"methods":[{"title":"Lập bảng biến thiên và nhận dạng cực trị","lead":"Mốc xét dấu gồm nghiệm của f′ và điểm f′ không xác định. Cực trị chỉ được xét tại điểm thuộc tập xác định của f. Nếu f′ bằng 0 nhưng dấu giữ nguyên hai bên, điểm đó không phải cực trị theo tiêu chuẩn đổi dấu.","steps":["Tìm tập xác định và tính đạo hàm.","Đánh dấu các mốc xét dấu. Xét trên từng khoảng tách bởi các mốc.","Điền mũi tên tăng giảm, rồi tính giá trị tại cực trị.","Nếu hỏi lớn nhất hoặc nhỏ nhất trên đoạn, tính cả giá trị tại hai đầu mút."],"example":"","tip":"","worked":[]},{"title":"Đọc bảng biến thiên và tránh nhầm cực trị","lead":"Điểm f′ bằng 0 chưa chắc là cực trị. Khi tìm lớn nhất, nhỏ nhất trên đoạn, phải thử hai đầu mút. Khi tìm tiệm cận đứng, kiểm tra giới hạn một phía thay vì chỉ nhìn mẫu bằng 0.","steps":["Ghi tập xác định","Tính f′ và tìm điểm tới hạn","Lập bảng dấu và các giới hạn","So giá trị theo câu hỏi"],"example":"y=x³ có f′(0)=0 nhưng không có cực trị tại 0.","tip":"","worked":[]},{"title":"Cực trị qua sự đổi dấu đạo hàm","lead":"","steps":[],"example":"","tip":"","worked":[["Cực trị qua sự đổi dấu đạo hàm","Tìm cực trị của f(x) = x³ − 3x.",["f′(x) = 3(x − 1)(x + 1), bằng 0 tại −1 và 1.","Xét dấu theo thứ tự ba khoảng: dương trên (−∞; −1), âm trên (−1; 1), dương trên (1; +∞).","Đổi từ dương sang âm tại −1 là cực đại; đổi từ âm sang dương tại 1 là cực tiểu. Tính f(−1) và f(1)."],"Cực đại f(−1) = 2; cực tiểu f(1) = −2.",""]]}],"visuals":[0],"table":[],"diagrams":["cubic"]},{"title":"Giá trị lớn nhất và nhỏ nhất","intro":"Trên đoạn kín của hàm liên tục, so giá trị tại hai đầu mút với các điểm trong đoạn có f′ = 0 hoặc đạo hàm không tồn tại. Cực trị địa phương khác giá trị lớn nhất, nhỏ nhất trên miền.","formulas":"","short":"","notes":[["tính chất","Giá trị lớn nhất và nhỏ nhất trên đoạn","Hàm liên tục trên đoạn kín đạt lớn nhất và nhỏ nhất. So giá trị ở hai đầu với các điểm trong đoạn mà đạo hàm bằng 0 hoặc không tồn tại.","max và min trên [a;b] lấy trong các giá trị ứng viên"]],"methods":[{"title":"Giá trị lớn nhất và nhỏ nhất trên đoạn","lead":"Hàm liên tục trên đoạn kín đạt lớn nhất và nhỏ nhất. So giá trị ở hai đầu với các điểm trong đoạn mà đạo hàm bằng 0 hoặc không tồn tại.","steps":["Tính đạo hàm","Chọn điểm tới hạn thuộc đoạn","Tính cả f(a),f(b) và so"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Tiệm cận","intro":"Đứng x = a khi ít nhất một giới hạn một phía ở a là vô cực. Ngang y = b khi giới hạn ở một phía vô cực bằng b. Xiên y = ax + b với a ≠ 0 khi hiệu f(x) − (ax + b) tiến tới 0 ở vô cực.","formulas":"a = lim \\frac{f(x)}{x}; b = lim [f(x) − ax] theo cùng hướng vô cực","short":"","notes":[["khái niệm","Ba loại tiệm cận","Tiệm cận đứng x=a cần một giới hạn một phía vô cực. Ngang y=b cần giới hạn tại một hướng vô cực bằng b. Xiên y=ax+b, a≠0, cần hiệu giữa hàm và đường thẳng tiến tới 0.","a=lim \\frac{f(x)}{x}; b=lim (f(x)−ax) theo cùng hướng vô cực"]],"methods":[{"title":"Ba loại tiệm cận","lead":"Tiệm cận đứng x=a cần một giới hạn một phía vô cực. Ngang y=b cần giới hạn tại một hướng vô cực bằng b. Xiên y=ax+b, a≠0, cần hiệu giữa hàm và đường thẳng tiến tới 0.","steps":["Xét điểm loại khỏi tập xác định","Tính giới hạn hữu hạn và ở vô cực","Ghi phương trình đúng loại"],"example":"","tip":"","worked":[]},{"title":"Phân biệt điểm khuyết và tiệm cận đứng","lead":"","steps":["Ghi tập xác định từ mẫu ban đầu.","Rút gọn với điều kiện mẫu khác 0.","Tính giới hạn một phía ở các điểm bị loại để phân biệt giới hạn hữu hạn và vô cực."],"example":"","worked":[["Đọc giới hạn hữu hạn và vô cực","Cho y = \\frac{x²−1}{(x−1)(x−2)}. Tìm tiệm cận đứng.",["Tập xác định loại 1 và 2. Khi x thuộc tập xác định, rút gọn được y = \\frac{x+1}{x−2}.","Tại x = 1, giới hạn bằng −2. Tại x = 2, giới hạn một phía là vô cực."],"Tiệm cận đứng là x = 2. Điểm (1; −2) là điểm khuyết.",""]],"tip":"","practice":["Tìm các tiệm cận đứng của y = \\frac{x²−1}{(x−1)(x−2)}.","Với x ≠ 1, 2, biểu thức bằng \\frac{x+1}{x−2}.","Chỉ có tiệm cận đứng x = 2. Tại x = 1, giới hạn bằng −2."],"diagram":"holeGraph"}],"visuals":[],"table":[],"core":[["Đọc tiệm cận theo một phía",["Ở tiệm cận đứng, ít nhất một giới hạn một phía là vô cực. Ngang và xiên kiểm tra khi x tiến tới +∞ hoặc −∞."],""]],"diagrams":["holeGraph"]},{"title":"Khảo sát và tối ưu","intro":"Tìm tập xác định, đạo hàm, bảng biến thiên, giới hạn và tiệm cận. Đặt biến kèm điều kiện trong bài thực tế, sau đó so điểm tới hạn và biên của miền khả thi.","formulas":"","short":"","notes":[["cách làm","Trình tự khảo sát đồ thị","Xác định miền, giới hạn và tiệm cận, sau đó tính đạo hàm và bảng biến thiên. Lấy thêm giao trục hoặc điểm đặc biệt khi vẽ; đồ thị phải khớp chiều biến thiên và giới hạn.","Trên Oy: x=0; trên Ox: f(x)=0"],["cách làm","Tối ưu trong tình huống thực tế","Đặt biến và miền thực tế. Dùng điều kiện ràng buộc để đưa đại lượng cần tối ưu về hàm một biến. Khi miền gồm đầu mút, so cả đầu mút; nếu yêu cầu số nguyên, kiểm tra các giá trị nguyên thích hợp.","Với chu vi P, S=x(\\frac{P}{2}−x)"]],"methods":[{"title":"Lập bảng biến thiên và vẽ đồ thị","lead":"Xác định miền, giới hạn và tiệm cận, sau đó tính đạo hàm và bảng biến thiên. Lấy thêm giao trục hoặc điểm đặc biệt khi vẽ; đồ thị phải khớp chiều biến thiên và giới hạn.","steps":["Ghi tập xác định","Tính đạo hàm và giới hạn","Lập bảng","Vẽ các nhánh qua điểm mốc"],"example":"","tip":"","worked":[]},{"title":"Tối ưu trong tình huống thực tế","lead":"Đặt biến và miền thực tế. Dùng điều kiện ràng buộc để đưa đại lượng cần tối ưu về hàm một biến. Khi miền gồm đầu mút, so cả đầu mút; nếu yêu cầu số nguyên, kiểm tra các giá trị nguyên thích hợp.","steps":["Đặt biến và miền","Lập hàm mục tiêu","Tìm và so ứng viên","Trả lời bằng đơn vị thực tế"],"example":"","tip":"","worked":[]},{"title":"Đặt biến để giải bài toán tối ưu có ràng buộc","lead":"Ràng buộc cho phép biểu diễn mục tiêu theo một biến.","steps":["Đặt biến và ghi miền thực tế.","Dùng ràng buộc để lập hàm mục tiêu.","Tính đạo hàm, xét điểm tới hạn và biên rồi trả lời đúng đơn vị."],"example":"Hình chữ nhật chu vi 28 m có S = x(14 − x), 0 < x < 14. S lớn nhất bằng 49 m² khi x = 7 m.","worked":[],"tip":""}],"visuals":[],"table":[]}],"g12-c2":[{"title":"Tọa độ trong không gian","intro":"Một điểm M(x;y;z) có hoành độ, tung độ và cao độ. Trên (Oxy) thì z = 0, trên (Oxz) thì y = 0, trên (Oyz) thì x = 0.","formulas":"","short":"","notes":[],"methods":[{"title":"Xác định hình chiếu của một điểm lên mặt phẳng tọa độ","lead":"","steps":["Đọc hai trục nằm trong mặt phẳng cần chiếu.","Giữ hai tọa độ theo các trục đó.","Đặt tọa độ theo phương vuông góc bằng 0."],"example":"","worked":[],"tip":"","practice":["Cho M(2; −3; 4). Tìm hình chiếu vuông góc của M trên mặt phẳng (Oxz) và khoảng cách từ M đến mặt phẳng đó.","Tọa độ y của mọi điểm trên (Oxz) bằng 0.","Hình chiếu H(2; 0; 4). Khoảng cách MH = 3."]}],"visuals":[],"table":[],"diagrams":["xyz"]},{"title":"Tọa độ vectơ và điểm","intro":"Vectơ AB lấy B trừ A theo từng tọa độ. Trung điểm lấy trung bình hai đầu. Trọng tâm tam giác lấy trung bình ba đỉnh.","formulas":"\\vec{AB} = (x_{B} − x_{A}; y_{B} − y_{A}; z_{B} − z_{A})","short":"","notes":[["","Vectơ và tọa độ","Tọa độ vectơ AB bằng tọa độ B trừ A. Phép cộng, trừ, nhân số được làm theo từng tọa độ. Trung điểm lấy trung bình hai đầu, trọng tâm tam giác lấy trung bình ba đỉnh.","\\vec{AB}=(x_B−x_A;y_B−y_A) hoặc (x_B−x_A;y_B−y_A;z_B−z_A)"],["cách làm","Tọa độ và trung điểm theo từng trục","Vectơ đi từ A đến B lấy B trừ A. Trung điểm lấy trung bình hai đầu; hình chiếu xuống Oxy giữ x, y và cho z=0.","\\vec{AB}=(x_B−x_A;y_B−y_A;z_B−z_A)"]],"methods":[{"title":"Vectơ và tọa độ","lead":"Tọa độ vectơ AB bằng tọa độ B trừ A. Phép cộng, trừ, nhân số được làm theo từng tọa độ. Trung điểm lấy trung bình hai đầu, trọng tâm tam giác lấy trung bình ba đỉnh.","steps":["Xác định chiều vectơ","Lấy cuối trừ đầu theo từng trục","Phân biệt tọa độ điểm với tọa độ vectơ"],"example":"","tip":"","worked":[]},{"title":"Tọa độ và trung điểm theo từng trục","lead":"Vectơ đi từ A đến B lấy B trừ A. Trung điểm lấy trung bình hai đầu; hình chiếu xuống Oxy giữ x, y và cho z=0.","steps":["Ghi rõ đang tính điểm hay vectơ","Xử lí từng tọa độ","Kiểm tra hướng hoặc trục bị bỏ"],"example":"","tip":"","worked":[]},{"title":"Tìm tọa độ trọng tâm tam giác hoặc trung điểm đoạn thẳng","lead":"Tính riêng theo từng trục, giữ dấu tọa độ.","steps":["Ghi tọa độ các điểm theo thứ tự x, y, z.","Tính trung bình hai đầu mút để tìm trung điểm, hoặc trung bình ba đỉnh để tìm trọng tâm.","Kiểm tra cùng một trục được cộng với nhau."],"example":"A(1;0;2), B(3;2;0), C(2;1;4) có trọng tâm G(2;1;2).","worked":[],"tip":""}],"visuals":[],"table":[]},{"title":"Độ dài, tích vô hướng và góc","intro":"Tích vô hướng bằng tổng các tích tọa độ. Với hai vectơ khác 0, cos góc bằng tích vô hướng chia tích độ dài.","formulas":"\\vec{u}·\\vec{v} = u₁v₁ + u₂v₂ + u₃v₃; độ dài \\vec{u} = \\sqrt{u₁² + u₂² + u₃²}","short":"","notes":[["","Tích vô hướng","Tích vô hướng cho một số. Với vectơ khác 0, dấu tích cho biết góc nhọn, vuông hay tù; tích bằng 0 thì hai vectơ vuông góc.","\\vec{u}·\\vec{v}=u₁v₁+u₂v₂ (cộng u₃v₃ trong Oxyz) // \\vec{u}·\\vec{v}=∣u∣∣v∣cos α"]],"methods":[{"title":"Tích vô hướng","lead":"Tích vô hướng cho một số. Với vectơ khác 0, dấu tích cho biết góc nhọn, vuông hay tù; tích bằng 0 thì hai vectơ vuông góc.","steps":["Tính tích theo tọa độ hoặc độ dài và góc","Kiểm tra vectơ khác 0 khi tính góc","Lấy cos rồi suy α"],"example":"","tip":"","worked":[]},{"title":"Góc giữa hai vectơ trong không gian","lead":"","steps":[],"example":"","tip":"","worked":[["Góc giữa hai vectơ trong không gian","Cho u = (1; 2; 2) và v = (2; −1; 0). Tính góc giữa hai vectơ.",["Tính tích vô hướng u·v = 1·2 + 2·(−1) + 2·0 = 0.","Độ dài của u và v đều dương.","Cosin của góc bằng tích vô hướng chia tích độ dài, nên bằng 0."],"Góc bằng 90°.",""]]}],"visuals":[],"table":[],"core":[["Tích vô hướng trong Oxyz",["Nhân các thành phần cùng trục rồi cộng. Hai vectơ khác vectơ không vuông góc khi tích vô hướng bằng 0."],"\\vec{u}·\\vec{v} = u_1v_1 + u_2v_2 + u_3v_3"]]}],"g12-c3":[{"title":"Khoảng biến thiên","intro":"Lấy đầu phải của nhóm cuối có dữ liệu trừ đầu trái của nhóm đầu có dữ liệu. Đây là số đặc trưng tính từ bảng ghép nhóm, có thể khác khoảng biến thiên của mẫu gốc.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Khoảng tứ phân vị","intro":"ΔQ = Q₃ − Q₁. Tìm nhóm chứa vị trí \\frac{N}{4} và \\frac{3N}{4} bằng tần số tích lũy rồi nội suy trong nhóm.","formulas":"Q_{p} = L + \\frac{pN − F}{f}·h","short":"","notes":[],"methods":[{"title":"Nội suy hai tứ phân vị để tính khoảng tứ phân vị","lead":"","steps":["Tính cỡ mẫu và tần số tích lũy.","Xác định lớp chứa vị trí \\frac{n}{4} và \\frac{3n}{4}, nội suy trong mỗi lớp.","Lấy Q_3 − Q_1."],"example":"","worked":[],"tip":"","practice":["Mẫu ghép nhóm có ba lớp [0; 10), [10; 20), [20; 30), tần số lần lượt 8, 16, 8. Tính khoảng tứ phân vị.","Hai vị trí là 8 và 24, đúng tại các ranh giới tích lũy.","Q_1 = 10, Q_3 = 20, nên khoảng tứ phân vị bằng 10."]}],"visuals":[],"table":[],"diagrams":["quartile"]},{"title":"Phương sai và độ lệch chuẩn","intro":"Dùng trung điểm xᵢ và tần số nᵢ của từng nhóm. Phương sai dùng độ lệch bình phương; độ lệch chuẩn lấy căn.","formulas":"s² = \\frac{tổng nᵢ(xᵢ−x̄)²}{N}; s = \\sqrt{s²}","short":"","notes":[["","Độ phân tán của mẫu ghép nhóm","Khoảng biến thiên dùng đầu ngoài của hai nhóm có dữ liệu. Khoảng tứ phân vị là Q₃−Q₁. Phương sai lấy trung bình có trọng số của bình phương độ lệch, độ lệch chuẩn là căn bậc hai.","R=b_{cuối}−a_{đầu}; ΔQ=Q₃−Q₁ // s²=\\frac{∑nᵢ(xᵢ−x̄)²}{N}; s=\\sqrt{s²}"]],"methods":[{"title":"Độ phân tán của mẫu ghép nhóm","lead":"Khoảng biến thiên dùng đầu ngoài của hai nhóm có dữ liệu. Khoảng tứ phân vị là Q₃−Q₁. Phương sai lấy trung bình có trọng số của bình phương độ lệch, độ lệch chuẩn là căn bậc hai.","steps":["Đọc cỡ mẫu và trung điểm nhóm","Tìm đại lượng được yêu cầu","Đổi đơn vị đúng, phương sai có đơn vị bình phương"],"example":"","tip":"","worked":[]},{"title":"Độ phân tán từ điểm đại diện","lead":"","steps":[],"example":"","tip":"","worked":[["Độ phân tán từ điểm đại diện","Mẫu ghép nhóm [0; 10), [10; 20), [20; 30) có tần số 1, 2, 1. Tính phương sai theo mẫu ghép nhóm.",["Chọn trung điểm lớp là 5, 15, 25. Trung bình có trọng số bằng \\frac{5 + 2·15 + 25}{4} = 15.","Bình phương độ lệch tương ứng là 100, 0, 100.","Nhân với tần số rồi chia cho 4, được \\frac{100 + 2·0 + 100}{4}."],"Phương sai bằng 50, độ lệch chuẩn bằng 5\\sqrt{2}.",""]]}],"visuals":[],"table":[],"core":[["Độ phân tán của mẫu ghép nhóm",["Dùng giá trị đại diện c_i, tần số n_i và số trung bình ghép nhóm. Độ lệch chuẩn cùng đơn vị với dữ liệu."],"s² = \\frac{1}{n}∑_{i=1}^k n_i(c_i−x̄)² // s = \\sqrt{s²}"]],"diagrams":["histogram"]},{"title":"Đổi đơn vị","intro":"Cộng cùng hằng số cho mọi giá trị không đổi độ phân tán. Nhân với k làm phương sai gấp k², độ lệch chuẩn và các khoảng gấp trị tuyệt đối của k.","formulas":"","short":"","notes":[["bổ sung","Hiệu quả của phép đổi đơn vị","Với phép đổi y=ax+b, phương sai nhân a² và độ lệch chuẩn nhân ∣a∣. Các khoảng biến thiên và tứ phân vị cũng nhân ∣a∣; cộng một hằng số không làm đổi độ phân tán.","s_y²=a²s_x²; s_y=∣a∣s_x"]],"methods":[{"title":"Hiệu quả của phép đổi đơn vị","lead":"Với phép đổi y=ax+b, phương sai nhân a² và độ lệch chuẩn nhân ∣a∣. Các khoảng biến thiên và tứ phân vị cũng nhân ∣a∣; cộng một hằng số không làm đổi độ phân tán.","steps":["Viết phép đổi đơn vị","Chọn đại lượng","Nhớ bình phương chỉ dành cho phương sai"],"example":"","tip":"","worked":[]},{"title":"So độ phân tán khi đổi gốc và đơn vị đo","lead":"Cộng cùng hằng số chỉ dời dữ liệu. Nhân hệ số a làm khoảng cách nhân ∣a∣.","steps":["Xác định phép biến đổi X′ = aX + b.","Nhân độ lệch chuẩn với ∣a∣, nhân phương sai với a².","Đổi lại đơn vị khi giải thích kết quả."],"example":"Nếu phương sai là 0,04 m² thì khi đổi số đo sang cm, phương sai thành 400 cm².","worked":[],"tip":""}],"visuals":[],"table":[]}],"g12-c4":[{"title":"Nguyên hàm","intro":"F là nguyên hàm của f trên khoảng I nếu F′ = f. Mọi nguyên hàm trên cùng khoảng khác nhau một hằng số.","formulas":"∫ f(x) dx = F(x) + C","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Công thức cơ bản","intro":"Công thức lũy thừa loại n = −1. Với \\frac{1}{x} dùng ln trị tuyệt đối của x trên khoảng không chứa 0.","formulas":"∫ xⁿ dx = \\frac{xⁿ⁺¹}{n + 1} + C; ∫ eˣ dx = eˣ + C; ∫ cos x dx = sin x + C; ∫ sin x dx = −cos x + C","short":"","notes":[["","Nguyên hàm","F là nguyên hàm của f trên một khoảng khi F′=f tại mọi điểm của khoảng đó. Các nguyên hàm trên cùng khoảng sai khác một hằng số.","∫xⁿdx=\\frac{x^{n+1}}{n+1}+C, n≠−1 // ∫\\frac{1}{x}dx=ln∣x∣+C // ∫eˣdx=eˣ+C"],["cách làm","Đọc nhanh nguyên hàm có hàm trong tuyến tính","Nếu F′=f và a≠0, nguyên hàm của f(ax+b) có hệ số \\frac{1}{a} để triệt đạo hàm hàm trong. Nhớ +C trên từng khoảng xác định.","∫f(ax+b)dx=\\frac{1}{a}F(ax+b)+C"]],"methods":[{"title":"Nguyên hàm","lead":"F là nguyên hàm của f trên một khoảng khi F′=f tại mọi điểm của khoảng đó. Các nguyên hàm trên cùng khoảng sai khác một hằng số.","steps":["Nhận dạng hàm cơ bản","Tách tổng và hệ số","Lấy đạo hàm để kiểm tra và nhớ +C"],"example":"","tip":"","worked":[]},{"title":"Đọc nhanh nguyên hàm có hàm trong tuyến tính","lead":"Nếu F′=f và a≠0, nguyên hàm của f(ax+b) có hệ số \\frac{1}{a} để triệt đạo hàm hàm trong. Nhớ +C trên từng khoảng xác định.","steps":["Nhận dạng ax+b","Tìm nguyên hàm theo đối số","Chia hệ số a và lấy đạo hàm thử"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Tích phân xác định","intro":"Tính hiệu nguyên hàm tại cận trên và cận dưới. Đổi cận thì đổi dấu. Tách được tại điểm trung gian và có tính tuyến tính.","formulas":"∫_{a}^{b} f(x) dx = F(b) − F(a)","short":"","notes":[["tính chất","Đổi cận, chia cận và tính tuyến tính","Hai cận đổi chỗ làm tích phân đổi dấu. Có thể tách tại c nằm giữa hai cận. Tích phân của một hằng số bằng hằng số nhân độ dài có hướng của khoảng.","∫_{a}^{b}f = ∫_{a}^{c}f+∫_{c}^{b}f // ∫_{a}^{b}k dx=k(b−a)"]],"methods":[{"title":"Đổi cận, chia cận và tính tuyến tính","lead":"Hai cận đổi chỗ làm tích phân đổi dấu. Có thể tách tại c nằm giữa hai cận. Tích phân của một hằng số bằng hằng số nhân độ dài có hướng của khoảng.","steps":["Chọn cách tính trực tiếp, tách hoặc dùng dữ kiện tích phân","Đọc cận dưới và cận trên","Kiểm tra dấu"],"example":"","tip":"","worked":[]},{"title":"Phân biệt quãng đường và độ dịch chuyển từ vận tốc","lead":"","steps":["Tìm thời điểm vận tốc bằng 0 trong khoảng xét.","Tích phân vận tốc có dấu để tính độ dịch chuyển.","Tách khoảng đổi dấu và tích phân trị tuyệt đối vận tốc để tính quãng đường."],"example":"","worked":[],"tip":"","practice":["Một vật có vận tốc v(t) = t − 2 m mỗi giây trên [0; 5]. Tính độ dịch chuyển và quãng đường.","Vận tốc âm đến t = 2, sau đó dương. Hai tam giác dưới và trên trục thời gian có diện tích 2 và 4,5.","Độ dịch chuyển bằng 2,5 m. Quãng đường bằng 6,5 m."],"diagram":"practiceVelocity"}],"visuals":[],"table":[]},{"title":"Diện tích hình phẳng","intro":"Diện tích dưới một đồ thị dùng trị tuyệt đối của hàm. Giữa hai đồ thị dùng trị tuyệt đối của hiệu; tách khoảng ở các điểm đổi dấu hoặc giao nhau.","formulas":"S = ∫_{a}^{b} ∣f(x) − g(x)∣ dx","short":"","notes":[["phương pháp","Diện tích giữa hai đồ thị","Tại mỗi x, độ dài đoạn đứng giữa hai đường là trị tuyệt đối của hiệu hai tung độ. Hai đồ thị có thể đổi vị trí ở giao điểm, nên cần tách khoảng trước khi lấy tích phân.","S = ∫_a^b ∣f(x) − g(x)∣ dx // Trên khoảng có f ≥ g, lấy f(x) − g(x) // Trên khoảng có f ≤ g, lấy g(x) − f(x)"]],"methods":[{"title":"Tính diện tích giữa hai đồ thị khi chúng đổi vị trí","lead":"Tại mỗi x, độ dài đoạn đứng giữa hai đường là trị tuyệt đối của hiệu hai tung độ. Hai đồ thị có thể đổi vị trí ở giao điểm, nên cần tách khoảng trước khi lấy tích phân.","steps":["Giải f(x) = g(x), chỉ giữ nghiệm trong đoạn tích phân.","Chia đoạn tại những nghiệm và thử dấu hiệu f − g trong mỗi khoảng.","Tích phân hàm trên trừ hàm dưới trên từng phần.","Cộng các diện tích không âm."],"example":"Nếu g(x) = 0, các giao điểm cần tìm là nghiệm của f(x) = 0.","tip":"","worked":[["Tách miền khi hàm đổi dấu","Tính diện tích giữa y = x − 1, trục hoành, x = 0 và x = 3.",["Nghiệm x − 1 = 0 là x = 1. Hàm âm bên trái 1 và dương bên phải.","Từ 0 đến 1, diện tích là tích phân của 1 − x, bằng \\frac{1}{2}.","Từ 1 đến 3, diện tích là tích phân của x − 1, bằng 2. Cộng hai phần."],"Diện tích bằng \\frac{5}{2}.","Tích phân có dấu bằng \\frac{3}{2}, còn diện tích phải cộng cả hai miền với dấu dương."]]}],"visuals":[0],"table":[],"core":[["Diện tích và tích phân có dấu",["Tìm các giao điểm trong đoạn rồi chia miền ở nơi hai đồ thị đổi vị trí. Trên mỗi miền lấy hàm trên trừ hàm dưới."],"S = ∫_a^b ∣f(x)−g(x)∣ dx"]]},{"title":"Thể tích","intro":"Nếu tiết diện vuông góc trục x có diện tích S(x), lấy tích phân của S(x). Khối tròn xoay quanh Ox do y = f(x) và trục Ox tạo nên có tiết diện đĩa bán kính là độ lớn của f(x).","formulas":"V = ∫_{a}^{b} S(x) dx; V quanh Ox = π∫_{a}^{b} f²(x) dx","short":"","notes":[],"methods":[{"title":"Tính thể tích khối tròn xoay qua tiết diện đĩa","lead":"Với miền giữa y = f(x) và Ox quay quanh Ox, bán kính là ∣f(x)∣.","steps":["Xác định đoạn [a;b] theo trục x.","Viết diện tích tiết diện πf²(x).","Tích phân từ a đến b và ghi đơn vị thể tích."],"example":"Miền dưới y = x trên [0;2] quay quanh Ox có V = π∫_0^2 x² dx = \\frac{8π}{3}.","worked":[["Quay đường y = x quanh Ox","Quay miền giới hạn bởi y = x, Ox và x = 3 quanh Ox. Tính thể tích.",["Tại x thuộc [0; 3], tiết diện vuông góc Ox là đĩa bán kính x.","Lấy tích phân diện tích đĩa πx² trên [0; 3]. Nguyên hàm của x² là \\frac{x³}{3}."],"V = 9π đơn vị thể tích.","Bình phương bán kính trước khi tích phân."]],"tip":""}],"visuals":[],"table":[],"core":[["Thể tích theo thiết diện",["A(x) là diện tích thiết diện vuông góc Ox. Khi quay miền giữa hai đồ thị cùng phía Ox, có thể dùng hiệu diện tích hai đĩa."],"V = ∫_a^b A(x) dx // A(x) = π(R²(x)−r²(x))"]],"diagrams":["diskIntegral"]}],"g12-c5":[{"title":"Mặt phẳng","intro":"Mặt qua M₀(x₀;y₀;z₀) với pháp tuyến (a;b;c). Hai mặt song song hoặc trùng khi pháp tuyến cùng phương.","formulas":"a(x−x₀) + b(y−y₀) + c(z−z₀) = 0","short":"","notes":[["khái niệm","Phương trình mặt phẳng","Một điểm và một vectơ pháp tuyến khác 0 xác định mặt. Hai mặt song song hoặc trùng nếu pháp tuyến cùng phương. Khoảng cách từ điểm đến mặt dùng trị tuyệt đối của biểu thức tuyến tính.","a(x−x₀)+b(y−y₀)+c(z−z₀)=0 // d(M,(P))=\\frac{∣ax_M+by_M+cz_M+d∣}{√(a²+b²+c²)}"]],"methods":[{"title":"Phương trình mặt phẳng","lead":"Một điểm và một vectơ pháp tuyến khác 0 xác định mặt. Hai mặt song song hoặc trùng nếu pháp tuyến cùng phương. Khoảng cách từ điểm đến mặt dùng trị tuyệt đối của biểu thức tuyến tính.","steps":["Tìm điểm và pháp tuyến","Thế vào phương trình","Chuẩn hóa trước khi tính khoảng cách"],"example":"","tip":"","worked":[]},{"title":"Mặt phẳng qua điểm có pháp tuyến","lead":"","steps":[],"example":"","tip":"","worked":[["Mặt phẳng qua điểm có pháp tuyến","Viết mặt phẳng qua M(1; −2; 3) và có pháp tuyến n = (2; −1; 4).",["Một điểm (x; y; z) nằm trên mặt phẳng khi vectơ nối từ M vuông góc với n.","Viết 2(x − 1) − (y + 2) + 4(z − 3) = 0.","Thu gọn và thay M vào để kiểm tra."],"2x − y + 4z − 16 = 0.",""]]}],"visuals":[],"table":[],"core":[["Pháp tuyến và phương trình mặt",["Pháp tuyến \\vec{n} = (A; B; C) khác vectơ không. Thay tọa độ điểm thuộc mặt để kiểm tra."],"(P): Ax + By + Cz + D = 0"]],"diagrams":["planePoints"]},{"title":"Đường thẳng","intro":"Đường qua M₀ và có vectơ chỉ phương u viết bằng tham số. Chỉ dùng dạng chính tắc chia từng tọa độ khi các mẫu khác 0. Hai đường có thể cắt, song song, trùng hoặc chéo nhau.","formulas":"(x;y;z) = (x₀;y₀;z₀) + t(u₁;u₂;u₃)","short":"","notes":[["khái niệm","Phương trình đường thẳng trong Oxyz","Một điểm và một vectơ chỉ phương khác 0 xác định đường. Dạng chính tắc chỉ chia từng tọa độ khi thành phần chỉ phương tương ứng khác 0. Để xét giao, cho hai biểu thức tọa độ bằng nhau.","(x;y;z)=(x₀;y₀;z₀)+t(u₁;u₂;u₃)"],["cách làm","Phân biệt chỉ phương và pháp tuyến","Góc đường–đường dùng hai chỉ phương. Góc mặt–mặt dùng hai pháp tuyến. Góc đường–mặt dùng sin bằng trị tuyệt đối tích vô hướng chia tích độ dài. Mặt cầu tiếp xúc mặt phẳng khi khoảng cách từ tâm bằng bán kính.","sin ∠(d,(P))=\\frac{∣u·n∣}{∣u∣∣n∣} // d(I,(P))=R khi tiếp xúc"]],"methods":[{"title":"Phương trình đường thẳng trong Oxyz","lead":"Một điểm và một vectơ chỉ phương khác 0 xác định đường. Dạng chính tắc chỉ chia từng tọa độ khi thành phần chỉ phương tương ứng khác 0. Để xét giao, cho hai biểu thức tọa độ bằng nhau.","steps":["Đọc điểm và chỉ phương","Viết tham số","Nếu xét giao, giải ba đẳng thức theo tham số"],"example":"","tip":"","worked":[]},{"title":"Phân biệt chỉ phương và pháp tuyến","lead":"Góc đường–đường dùng hai chỉ phương. Góc mặt–mặt dùng hai pháp tuyến. Góc đường–mặt dùng sin bằng trị tuyệt đối tích vô hướng chia tích độ dài. Mặt cầu tiếp xúc mặt phẳng khi khoảng cách từ tâm bằng bán kính.","steps":["Chọn đúng loại vectơ","Dùng cos hoặc sin theo cặp đối tượng","Kiểm tra góc trong [0°;90°]"],"example":"","tip":"","worked":[]},{"title":"Tìm giao điểm của đường thẳng với mặt phẳng","lead":"Thế cả ba tọa độ theo cùng tham số vào phương trình mặt phẳng.","steps":["Viết x, y, z theo tham số t của đường thẳng.","Thế vào phương trình mặt phẳng để tìm t.","Tính tọa độ giao điểm và thử lại. Nếu phương trình theo t vô nghiệm hoặc đúng với mọi t, xét song song hoặc nằm trong."],"example":"Đường (x;y;z) = (1+t;2−t;3+t) cắt mặt x+y+z = 8 tại t = 2, tức (3;0;5).","worked":[],"tip":""}],"visuals":[],"table":[],"diagrams":["planeIntersection"]},{"title":"Khoảng cách đến mặt phẳng","intro":"Thay tọa độ điểm vào vế trái ax + by + cz + d = 0, lấy độ lớn rồi chia độ dài pháp tuyến.","formulas":"d(M,(P)) = \\frac{∣ax₀ + by₀ + cz₀ + d∣}{√(a² + b² + c²)}","short":"","notes":[],"methods":[{"title":"Tính khoảng cách từ điểm tới mặt phẳng","lead":"","steps":["Đọc hệ số A, B, C, D trong phương trình (P).","Thay tọa độ M vào Ax + By + Cz + D và lấy trị tuyệt đối.","Chia cho \\sqrt{A²+B²+C²}, là độ dài vectơ pháp tuyến."],"tip":"Nếu M nằm trên (P), khoảng cách bằng 0.","example":"Với M(1; 0; 2) và (P): x + 2z − 1 = 0, khoảng cách là \\frac{4}{\\sqrt{5}}.","worked":[],"diagram":"planeDistance"}],"visuals":[],"table":[],"core":[["Khoảng cách từ điểm tới mặt",["Thế tọa độ M vào vế trái, lấy trị tuyệt đối rồi chia độ dài pháp tuyến."],"d(M,(P)) = \\frac{∣Ax_0+By_0+Cz_0+D∣}{\\sqrt{A²+B²+C²}}"]],"diagrams":["planeDistance"]},{"title":"Góc","intro":"Góc hai đường dùng cos giữa hai chỉ phương. Góc hai mặt dùng cos giữa hai pháp tuyến. Góc đường–mặt dùng sin từ chỉ phương và pháp tuyến. Trong công thức lấy độ lớn của tích vô hướng.","formulas":"","short":"","notes":[["định lí","Ba công thức góc trong không gian","Hai đường dùng hai chỉ phương; hai mặt dùng hai pháp tuyến; đường và mặt dùng chỉ phương và pháp tuyến. Hai trường hợp đầu dùng cos, trường hợp sau dùng sin.","cos góc(d₁,d₂)=\\frac{∣u₁·u₂∣}{∣u₁∣∣u₂∣} // sin góc(d,(P))=\\frac{∣u·n∣}{∣u∣∣n∣}"]],"methods":[{"title":"Ba công thức góc trong không gian","lead":"Hai đường dùng hai chỉ phương; hai mặt dùng hai pháp tuyến; đường và mặt dùng chỉ phương và pháp tuyến. Hai trường hợp đầu dùng cos, trường hợp sau dùng sin.","steps":["Chọn vectơ phù hợp","Tính tích vô hướng và độ dài","Lấy góc trong [0°;90°]"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"diagrams":["planeAngle"]},{"title":"Mặt cầu","intro":"Tâm I(a;b;c), bán kính R. Mặt phẳng cách tâm bằng R thì tiếp xúc; nhỏ hơn R thì cắt thành đường tròn.","formulas":"(x−a)² + (y−b)² + (z−c)² = R²","short":"","notes":[["khái niệm","Phương trình mặt cầu","Mặt cầu tâm I(a;b;c) gồm các điểm cách I đúng R>0. Mặt phẳng cách tâm bằng R thì tiếp xúc; cách nhỏ hơn R thì cắt theo đường tròn, bán kính thiết diện từ định lí Pythagore.","(x−a)²+(y−b)²+(z−c)²=R² // r_{cắt}=\\sqrt{R²−d²}, d<R"]],"methods":[{"title":"Phương trình mặt cầu","lead":"Mặt cầu tâm I(a;b;c) gồm các điểm cách I đúng R>0. Mặt phẳng cách tâm bằng R thì tiếp xúc; cách nhỏ hơn R thì cắt theo đường tròn, bán kính thiết diện từ định lí Pythagore.","steps":["Hoàn thành bình phương nếu cần","Đọc tâm, bán kính","So d với R"],"example":"","tip":"","worked":[]},{"title":"Viết phương trình mặt phẳng tiếp xúc với mặt cầu","lead":"","steps":["Đọc tâm và kiểm tra điểm tiếp xúc nằm trên mặt cầu.","Dùng vectơ bán kính qua tiếp điểm làm pháp tuyến.","Viết mặt phẳng qua tiếp điểm với pháp tuyến vừa tìm."],"example":"","worked":[],"tip":"","practice":["Viết mặt phẳng tiếp xúc với mặt cầu (x − 1)² + y² + (z + 2)² = 9 tại M(3; 1; 0).","Tâm I(1; 0; −2), \\vec{IM} = (2; 1; 2) và IM = 3.","Mặt phẳng là 2(x − 3) + (y − 1) + 2z = 0, hay 2x + y + 2z − 7 = 0."]}],"visuals":[],"table":[],"diagrams":["sphere"]}],"g12-c6":[{"title":"Xác suất có điều kiện","intro":"Đọc P(A ∣ B) là xác suất A khi biết B, nên mẫu là P(B), với P(B) > 0.","formulas":"P(A ∣ B) = \\frac{P(A ∩ B)}{P(B)}","short":"","notes":[["khái niệm","","Điều kiện B thu hẹp không gian mẫu. Xác suất có điều kiện A khi biết B bằng xác suất giao chia cho xác suất B, với P(B)>0. Nếu A và B độc lập, biết B không đổi xác suất A.","P(A∣B)=\\frac{P(A∩B)}{P(B)} // P(A∩B)=P(B)P(A∣B)"]],"methods":[{"title":"Xác suất có điều kiện","lead":"Điều kiện B thu hẹp không gian mẫu. Xác suất có điều kiện A khi biết B bằng xác suất giao chia cho xác suất B, với P(B)>0. Nếu A và B độc lập, biết B không đổi xác suất A.","steps":["Khoanh dữ kiện đã biết","Đặt vào mẫu số","Tìm phần giao rồi chia"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Xác suất có điều kiện",["Thu hẹp không gian đang xét về biến cố đã biết B. Mẫu số là P(B), với P(B) > 0."],"P(A ∣ B) = \\frac{P(A ∩ B)}{P(B)}"]],"diagrams":["venn"]},{"title":"Quy tắc nhân","intro":"Có thể điều kiện hóa theo biến cố nào biết trước. Khi A và B độc lập và P(B) > 0 thì P(A ∣ B) = P(A).","formulas":"P(A ∩ B) = P(B)P(A ∣ B)","short":"","notes":[],"methods":[],"visuals":[],"table":[],"diagrams":["conditionalTree"]},{"title":"Xác suất toàn phần","intro":"Chia không gian mẫu thành các nguồn B₁, …, Bₙ rời nhau và phủ hết, có xác suất dương. Cộng xác suất đến từ từng nguồn.","formulas":"P(A) = tổng P(Bᵢ)P(A ∣ Bᵢ)","short":"","notes":[],"methods":[{"title":"Tính xác suất toàn phần trước khi dùng Bayes","lead":"Các nhóm đầu vào phải rời nhau và phủ toàn bộ mẫu.","steps":["Tính xác suất đi từ từng nhóm đến biến cố cần xét bằng quy tắc nhân.","Cộng các đường đi để được xác suất toàn phần.","Khi hỏi nguồn, lấy đường đi từ nguồn đó chia xác suất toàn phần."],"example":"Nguồn A chiếm 0,75 và có tỉ lệ lỗi 0,02. Nguồn B chiếm 0,25 và có tỉ lệ lỗi 0,06. Xác suất lỗi chung là 0,03.","worked":[],"tip":""}],"visuals":[],"table":[],"diagrams":["conditionalTree"]},{"title":"Công thức Bayes","intro":"Đảo chiều điều kiện. Tử là xác suất đồng thời từ nguồn Bᵢ và có A. Mẫu là xác suất có A từ mọi nguồn.","formulas":"P(Bᵢ ∣ A) = \\frac{P(Bᵢ)P(A ∣ Bᵢ)}{P(A)}","short":"","notes":[["phương pháp","Đọc sơ đồ cây và đảo điều kiện Bayes","P(B khi biết A) tính tỉ lệ B trong nhóm A. Muốn đảo thành P(A khi biết B), phải đổi mẫu số sang xác suất của toàn bộ B. Hai số này thường khác nhau.","P(A∩B) = P(A)·P(B khi biết A) // P(A khi biết B) = \\frac{P(A∩B)}{P(B)}, với P(B) > 0"],["cách làm","Lập cây và chọn đúng mẫu số của Bayes","Đặt các nhánh nguồn trước, dữ kiện quan sát sau. Tử số là nhánh cần hỏi; mẫu số cộng mọi nhánh tạo cùng dữ kiện. Phân biệt P(A∣B) với P(B∣A).","P(Bᵢ∣A)=\\frac{P(Bᵢ)P(A∣Bᵢ)}{∑P(Bⱼ)P(A∣Bⱼ)}"]],"methods":[{"title":"Dùng sơ đồ cây để tính xác suất có điều kiện ngược","lead":"P(B khi biết A) tính tỉ lệ B trong nhóm A. Muốn đảo thành P(A khi biết B), phải đổi mẫu số sang xác suất của toàn bộ B. Hai số này thường khác nhau.","steps":["Tách các nguồn A₁, A₂, … thành các nhánh loại trừ nhau và bao phủ toàn bộ kết quả.","Ở mỗi nguồn vẽ nhánh B và nhánh đối của B. Nhân xác suất dọc đường đi.","Cộng mọi đường đi tới B để được mẫu số P(B).","Chia nhánh B của nguồn cần hỏi cho mẫu số đó."],"example":"","tip":"","worked":[["Bayes theo sơ đồ cây","Hai dây chuyền A và B làm lần lượt 60% và 40% sản phẩm. Tỉ lệ lỗi lần lượt là 2% và 5%. Một sản phẩm lỗi đến từ B với xác suất bao nhiêu?",["Xác suất đến từ A và lỗi là 0,6·0,02 = 0,012.","Xác suất đến từ B và lỗi là 0,4·0,05 = 0,02. Cộng hai nhánh lỗi được 0,032.","Giới hạn mẫu vào những sản phẩm lỗi rồi lấy phần từ B, 0, \\frac{02}{0,032}."],"0,625 hay 62,5%.","P(B khi biết lỗi) dùng tất cả sản phẩm lỗi ở mẫu số."]]},{"title":"Lập cây và chọn đúng mẫu số của Bayes","lead":"Đặt các nhánh nguồn trước, dữ kiện quan sát sau. Tử số là nhánh cần hỏi; mẫu số cộng mọi nhánh tạo cùng dữ kiện. Phân biệt P(A∣B) với P(B∣A).","steps":["Chia nguồn thành các biến cố rời nhau","Nhân xác suất dọc từng nhánh","Chia nhánh đích cho tổng các nhánh thỏa"],"example":"","tip":"","worked":[["Nhìn đúng nhánh đã quan sát","Hai máy A, B làm lần lượt 70% và 30% sản phẩm. Tỉ lệ lỗi lần lượt là 1% và 4%. Chọn một sản phẩm lỗi. Tính xác suất nó do B làm.",["Nhánh A rồi lỗi có xác suất 0,7·0,01 = 0,007. Nhánh B rồi lỗi có xác suất 0,3·0,04 = 0,012.","Chia xác suất nhánh B rồi lỗi cho tổng hai nhánh lỗi."],"Kết quả \\frac{12}{19}, khoảng 63,16%.","Mẫu số là xác suất sản phẩm bị lỗi từ tất cả nguồn."]]},{"title":"Suy tỉ lệ ban đầu từ xác suất toàn phần","lead":"","steps":["Đặt tỉ lệ ban đầu chưa biết là p.","Viết xác suất quan sát bằng tổng hai nhánh theo p và 1 − p.","Giải phương trình rồi kiểm tra 0 ≤ p ≤ 1."],"example":"","worked":[],"tip":"","practice":["Máy A tạo 2% sản phẩm lỗi, máy B tạo 6% sản phẩm lỗi. Tỉ lệ lỗi chung là 3%. Tìm tỉ lệ sản phẩm do máy A sản xuất.","Đặt p là tỉ lệ máy A. Khi đó 0,02p + 0,06(1 − p) = 0,03.","p = 0,75. Máy A sản xuất 75% số sản phẩm."]}],"visuals":[0],"table":[],"core":[["Đảo điều kiện bằng Bayes",["Tính mẫu bằng tổng xác suất mọi nhánh dẫn đến B. Tử chỉ giữ nhánh từ nguồn A đến B."],"P(A ∣ B) = \\frac{P(A)P(B ∣ A)}{P(B)}"]]}]};

function theoryFormula(raw) { return buMath.render(raw); }
function theoryLines(text) {
  const lines = [];
  let depth = 0;
  let start = 0;
  for (let i=0;i<text.length;i++) {
    if ('([{'.includes(text[i])) depth++;
    if (')]}'.includes(text[i])) depth = Math.max(0,depth-1);
    const explicit = text.slice(i,i+4)===' // ';
    if (explicit || (!depth && text[i]===';')) {
      lines.push(text.slice(start,i).trim());
      if (explicit) i += 3;
      start = i+1;
    }
  }
  return [...lines,text.slice(start).trim()].filter(Boolean);
}
function factsFrom(text) {
  return text.split(/ \/\/ |(?<=[.!?])\s+(?=[\p{Lu}])/u).map(part=>part.trim()).filter(Boolean);
}
function theoryParagraphs(text) {
  return factsFrom(text).map(line=>'<p>'+theoryFormula(line)+'</p>').join('');
}
function factsHTML(lines) {
  return lines.length?'<ul class="paper-facts">'+lines.map(line=>'<li>'+theoryFormula(line)+'</li>').join('')+'</ul>':'';
}
function outlineFormula(text,seen) {
  const lines = theoryLines(text).filter(line=>{
    const key = line.normalize('NFC').replace(/\s+/gu,'');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  return lines.length?'<div class="outline-formula">'+lines.map(line=>'<div>'+theoryFormula(line)+'</div>').join('')+'</div>':'';
}
function formulaGroupHTML(title,contents) {
  return contents?'<div class="paper-rule">'+(title?'<h5>'+theoryFormula(title)+'</h5>':'')+contents+'</div>':'';
}
function outlineExample([title,prompt,steps,answer,note],embedded=false) {
  return '<div class="outline-example"><h5>'+theoryFormula(embedded?'Ví dụ · '+title:'Ví dụ')+'</h5>'+
    theoryParagraphs(prompt)+'<ol class="paper-steps">'+steps.map(step=>'<li>'+theoryFormula(step)+'</li>').join('')+'</ol>'+
    '<div class="outline-result"><strong>Kết quả</strong>'+theoryParagraphs(answer)+'</div>'+
    (note?'<div class="outline-caution"><strong>Lưu ý</strong>'+theoryParagraphs(note)+'</div>':'')+'</div>';
}
function outlineTable([headers,...rows]) {
  if (!headers) return '';
  return '<div class="outline-table"><table><thead><tr>'+
    headers.map(cell=>'<th scope="col">'+theoryFormula(cell)+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(([name,...values])=>'<tr><th scope="row">'+theoryFormula(name)+'</th>'+
      values.map(cell=>'<td>'+theoryFormula(cell)+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>';
}
function paperBody(contents,figures) {
  return '<div class="paper-body'+(figures?' has-figures':'')+'"><div class="paper-copy">'+contents+'</div>'+
    (figures?'<div class="paper-figures">'+figures+'</div>':'')+'</div>';
}
function practiceHTML([prompt,hint,answer]) {
  return '<section class="outline-practice"><h5>Bài tự luyện</h5>'+theoryParagraphs(prompt)+
    '<details><summary>Xem gợi ý</summary>'+theoryParagraphs(hint)+'</details>'+
    '<details><summary>Đối chiếu đáp án</summary>'+theoryParagraphs(answer)+'</details></section>';
}
function theoryHTML(chapter,inQuiz) {
  const sections = chapterReading[chapter.id];
  const figures = chapterVisuals(chapter.id);
  const ideas = sections.map(({title,intro,formulas,short,notes,visuals,table,diagrams=[],core=[]},index)=>{
    const seenRules = new Set();
    const seenFacts = new Set();
    const takeFacts = items=>items.filter(item=>{
      const key = item.toLocaleLowerCase('vi').replace(/\s+/gu,' ').replace(/[.]$/u,'');
      if (seenFacts.has(key)) return false;
      seenFacts.add(key);
      return true;
    });
    const first = factsHTML(takeFacts(factsFrom(intro)))+outlineFormula(formulas,seenRules);
    const coreRules = core.map(([name,bullets,rule])=>formulaGroupHTML(name,
      factsHTML(takeFacts(bullets))+outlineFormula(rule,seenRules)
    )).join('');
    const notesHTML = [];
    const noteRules = notes.map(([,name,definition,formula])=>{
      const detail = takeFacts(factsFrom(definition));
      if (detail.length) notesHTML.push(formulaGroupHTML(name,factsHTML(detail)));
      return formulaGroupHTML(name,outlineFormula(formula,seenRules));
    }).join('');
    const contents = first+outlineTable(table)+coreRules+noteRules+
      (short?'<div class="outline-inline-example"><strong>Ví dụ</strong>'+theoryParagraphs(short)+'</div>':'')+
      (notesHTML.length?'<details class="paper-more"><summary>Xem giải thích</summary>'+notesHTML.join('')+'</details>':'');
    const illustrations = diagrams.map(studyFigure).join('')+visuals.map(i=>figures[i]).join('');
    return '<section class="outline-topic paper-card"><h4 class="paper-heading"><span class="paper-index">'+
      String(index+1).padStart(2,'0')+'</span><span>'+theoryFormula(title)+'</span></h4>'+
      paperBody(contents,illustrations)+'</section>';
  }).join('');
  const exercises = sections.flatMap(section=>section.methods.map(method=>({method,section})));
  const methods = exercises.map(({method,section},index)=>{
    const {title,lead,steps,example,worked,tip,diagram,practice}=method;
    const leadText = factsFrom(lead)[0] || '';
    const illustration = diagram ? studyFigure(diagram) : practice ? '' : section.diagrams?.length===1 ?
      studyFigure(section.diagrams[0]) : section.visuals?.length===1 ? figures[section.visuals[0]] : '';
    const explanation = (leadText?'<p class="paper-recognition">'+theoryFormula(leadText)+'</p>':'')+
      (steps.length?'<h5 class="paper-method-label">Phương pháp</h5><ol class="paper-steps">'+
        steps.map(step=>'<li>'+theoryFormula(step)+'</li>').join('')+'</ol>':'')+
      (tip?'<div class="outline-caution"><strong>Lưu ý</strong>'+theoryParagraphs(tip)+'</div>':'')+
      (example?'<div class="outline-example"><h5>Ví dụ</h5>'+theoryParagraphs(example)+'</div>':'')+
      (practice?practiceHTML(practice):'');
    const examples = worked.map(item=>outlineExample(item,!!explanation || worked.length>1)).join('');
    return '<details class="outline-method paper-card"><summary class="paper-heading">'+
      '<span class="paper-index"><abbr title="Dạng toán">DT</abbr><b>'+String(index+1).padStart(2,'0')+'</b></span>'+
      '<span>'+theoryFormula(title)+'</span><span class="method-chevron" aria-hidden="true"></span></summary>'+
      (explanation?paperBody(explanation,illustration)+(examples?'<div class="paper-worked">'+examples+'</div>':''):
        paperBody(examples,illustration))+'</details>';
  }).join('');
  const sources = chapterSources[chapter.id] || [];
  return '<article class="outline" aria-label="Đề cương chương">'+
    '<section aria-labelledby="outline-theory"><h3 class="outline-heading" id="outline-theory"><span>A</span>Tóm tắt lý thuyết</h3>'+ideas+'</section>'+
    '<section aria-labelledby="outline-methods"><h3 class="outline-heading" id="outline-methods"><span>B</span>Dạng bài tập</h3>'+methods+'</section>'+
    (sources.length?'<details class="outline-sources"><summary>Sách bài tập và tài liệu phân dạng</summary><ul>'+
      sources.map(([name,url,date])=>'<li><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(name)+'</a>'+
        (date?' · '+esc(date):'')+'</li>').join('')+
      '</ul></details>':'')+
    (inQuiz?'':'<div class="outline-actions"><button type="button" class="btn" id="studyPractice">Luyện tập '+icon('arrow')+'</button></div>')+
    '</article>';
}

  if (!counts.length) return '<p class="sub">Hãy thử một mức luyện hoặc dạng câu khác.</p>';

    '<button type="button" class="segment-btn '+(count===state.count?'active':'')+
    '" aria-pressed="'+(count===state.count)+'" data-count="'+count+'">'+count+'</button>'
  ).join('');
}

    (inQuiz?'<h3 class="picker-theory-title">Đề cương</h3>':
      '<div class="picker-tabs" role="tablist" aria-label="Nội dung chương">'+
      '<button id="practiceTab" role="tab" aria-controls="pickerBody">Luyện tập</button>'+
      '<button id="theoryTab" role="tab" aria-controls="pickerBody">Đề cương</button>'+
      '<button id="replayTab" role="tab" aria-controls="pickerBody">Xem lại buổi học</button></div>')+'</header>'+
    '<div id="pickerBody"'+(inQuiz?'':' role="tabpanel"')+'></div>';
  $('#closeChapter').onclick = ()=>dialog.close();
  const scope = $('#lessonScope');
  scope.value = state.lesson;
  const switchTab = (next,focus=false)=>{
    view = next;
    const showTheory = view==='theory';
    const showReplay = view==='replay';
    const lesson = lessons.find(item=>item.id===state.lesson);
    dialog.classList.toggle('theory-open',showTheory);
    scope.closest('.scope-field').hidden = showTheory || showReplay;
    const panel = $('#pickerBody');
    if (!inQuiz) {
      const active = showReplay ? $('#replayTab') : showTheory ? $('#theoryTab') : $('#practiceTab');
      for (const tab of $$('.picker-tabs [role="tab"]')) {
        tab.setAttribute('aria-selected',String(tab===active));
        tab.tabIndex = tab===active ? 0 : -1;
      }
      panel.setAttribute('aria-labelledby',active.id);
      if (focus) active.focus({preventScroll:true});
    }
    panel.innerHTML = '<div class="picker-content">'+(!showTheory&&!showReplay&&lesson?'<h3 class="scope-title">'+esc(lesson.title)+'</h3>':'')+
      (showReplay?'':showTheory?theoryHTML(chapter,inQuiz):configHTML(chapter,lesson))+'</div>';
    panel.scrollTop = 0;
    if (showReplay) { buClassroom.mount(panel.querySelector('.picker-content'),chapter);return; }
    if (showTheory) {

      if ($('#studyPractice')) $('#studyPractice').onclick=()=>{
        state.lesson = scope.value = '';
        switchTab('practice',true);
      };
      return;
    }
    $$('[data-level]').forEach(button=>button.onclick=()=>{
      const id=button.dataset.level;
      state.levels=state.levels.includes(id)?state.levels.filter(t=>t!==id):[...state.levels,id];
      switchTab('practice');
      $('[data-level="'+id+'"]').focus({preventScroll:true});
    });
    const countChoices = $('.count-choices');
    countChoices.onclick = event=>{
      const button = event.target.closest('[data-count]');
      if (!button) return;
      state.count = Number(button.dataset.count);
      $$('[data-count]').forEach(choice=>markChoice(choice,choice===button));
    };
    $$('[data-format]').forEach(button=>button.onclick=()=>{
      if (state.format===button.dataset.format) return;
      state.format = button.dataset.format;
      $$('[data-format]').forEach(choice=>markChoice(choice,choice===button));
      countChoices.innerHTML = countOptionsHTML(chapter,lesson);
      $('#startButton').disabled=!state.count;
    });
    $$('[data-picker-resume]').forEach(button=>button.onclick=()=>{
      dialog.close();
      resume(button.dataset.pickerResume);
    });
    $('#startButton').onclick = ()=>begin('practice');
    if ($('#reviewButton')) $('#reviewButton').onclick = ()=>begin('review');
  };
  scope.onchange = ()=>{state.lesson = scope.value;switchTab(view);};
  if (!inQuiz) {
    $('#practiceTab').onclick = ()=>switchTab('practice',true);
    $('#theoryTab').onclick = ()=>switchTab('theory',true);
    $('#replayTab').onclick = ()=>switchTab('replay',true);
    $('.picker-tabs').onkeydown = e=>{
      if (!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
      e.preventDefault();
      const keys=['practice','theory','replay'];
      const index=keys.indexOf(view);
      switchTab(e.key==='Home'?keys[0]:e.key==='End'?keys.at(-1):keys[(index+(e.key==='ArrowRight'?1:2))%3],true);
    };
  }
  switchTab(view);
  if (!dialog.open) dialog.showModal();
}
async function refreshDashboard() {
  state.dashboard = await rpc('getDashboard',state.token);
}
async function begin(mode) {
  if (state.opening) return;
  state.opening = true;
  const button = mode==='review' ? $('#reviewButton') : $('#startButton');
  await busy(button,'Đang mở đề…',async()=>{
    const q = await rpc('startQuiz',state.token,{
      chapterId:state.chapter,lessonId:state.lesson,count:state.count,mode,type:state.format,levels:state.levels
    });
    if ($('#chapterPicker')?.open) $('#chapterPicker').close();
    openQuiz(q);
  });
  state.opening = false;
}
async function resume(id) {
  if (state.opening) return;
  state.opening = true;
  try {
    const q = await rpc('resumeQuiz',state.token,id);
    if (q.finished) renderResult(q.result);
    else openQuiz(q);
  } catch (e) { fail(e); }
  finally { state.opening = false; }
}
function draftKey(runId) {
  return 'tmn_draft_'+runId;
}
function readDraft(runId) {
  try { return JSON.parse(storage.get(draftKey(runId))||'{}'); }
  catch (e) { return {}; }
}
function persistDraft() {
  if (!state.quiz) return;
  storage.set(draftKey(state.quiz.id),JSON.stringify({pending:state.dirty,index:state.index}));
}
function openQuiz(q) {
  clearTimeout(state.saveTimer);
  state.quiz = q;
  const saved = readDraft(q.id);
  state.feedback = Object.fromEntries(q.feedback.map(f=>[f.id,f]));
  state.dirty = {};
  q.questions.forEach(question=>{
    if (!state.feedback[question.id] && Object.hasOwn(saved.pending || {},question.id)) {
      state.dirty[question.id] = saved.pending[question.id];
    }
  });
  state.drafts = {...q.drafts,...state.dirty};
  state.hints = {};
  const unanswered = q.questions.findIndex(question=>!state.feedback[question.id]);
  state.index = Number.isInteger(saved.index) && saved.index>=0 && saved.index<q.questions.length
    ? saved.index : Math.max(0,unanswered);
  state.checking = false;
  state.submitting = false;
  state.streak = 0;
  state.page = 'quiz';
  const active = state.dashboard.active;
  if (!active.some(run=>run.id===q.id)) {
    active.unshift({id:q.id,chapterId:q.chapterId,lessonId:q.lessonId,title:q.title,mode:q.mode,type:q.type,count:q.questions.length,grade:state.user.grade});
  }
  setNav('study');
  mountQuiz();
  renderQuiz(true);
  $('#questionPanel').focus({preventScroll:true});
  window.scrollTo({top:0,behavior:'instant'});
}
function quizMath(value) { return buMath.render(value); }
function questionPrompt(s) {
  return quizMath(s).replace(/Khẳng định nào (SAI|ĐÚNG)\?/g,'<span class="command">Khẳng định nào <em>$1</em>?</span>')
    .replace(/\n/g,'<br>');
}
function answerReady(q) {
  const draft = state.drafts[q.id];
  if (q.type==='mcq') return Number.isInteger(draft) && draft>=0 && draft<4;
  if (q.type==='tf') return Array.isArray(draft) && draft.length===4 && draft.every(v=>typeof v==='boolean');
  return String(draft??'').trim().length>0;
}
function quizLocked() {
  return state.checking || state.submitting || state.pausing;
}

    (quiz.mode==='review'?'Ôn câu sai':typeNames[quiz.type]||typeNames.mixed)+'</p></div>'+
    '<button class="btn secondary" id="quizTheory">'+icon('book')+' Lý thuyết</button>'+
    '<div class="timer" id="quizCount"></div></div>'+
    '<dialog class="chapter-picker" id="chapterPicker" aria-labelledby="chapterPickerTitle"><div id="config"></div></dialog>'+

    quiz.questions.length+'"><div></div></div><div class="palette">'+palette+'</div>'+

  $('#leaveQuiz').onclick = leaveQuiz;

  $('#previous').onclick = ()=>moveQuestion(-1);
  $('#checkAnswer').onclick = ()=>checkQuestion(quiz.questions[state.index]);
  $('#skipQuestion').onclick = $('#nextQuestion').onclick = ()=>state.index===quiz.questions.length-1 ? finish() : moveQuestion(1);
  $('#finishButton').onclick = finish;
  $$('[data-jump]').forEach(button=>button.onclick=()=>goToQuestion(Number(button.dataset.jump)));
}
function renderQuiz(animate=false) {
  const q = state.quiz.questions[state.index];
  $('#questionPanel').innerHTML = '<div'+(animate?' class="question-enter"':'')+'>'+questionHTML(q)+'</div>';
  $('#questionPanel').setAttribute('aria-label','Câu '+(state.index+1));
  bindQuestion(q);
  updateQuizControls();
}
function updateQuizControls() {
  const {questions} = state.quiz;
  const q = questions[state.index];
  const graded = !!state.feedback[q.id];
  const answered = Object.keys(state.feedback).length;
  const locked = quizLocked();
  const last = state.index===questions.length-1;
  $('#quizCount').textContent = answered+'/'+questions.length+' đã chấm';
  $('#quizTrack').setAttribute('aria-valuenow',String(answered));
  $('#quizTrack > div').style.width = answered/questions.length*100+'%';
  $('#questionPanel').setAttribute('aria-busy',String(state.checking));
  $('#leaveQuiz').textContent = state.pausing?'Đang lưu…':'← Tạm dừng';
  $('#finishLabel').textContent = state.submitting?'Đang nộp…':'Nộp bài';
  $('#checkAnswer').textContent = state.checking?'Đang chấm…':'Chấm câu';
  $('#nextQuestion').textContent = last?'Hoàn tất':'Câu tiếp →';
  $('#skipQuestion').textContent = last?'Nộp bài':'Bỏ qua';
  $('#skipQuestion').hidden = $('#checkAnswer').hidden = graded;
  $('#nextQuestion').hidden = !graded;
  $('#previous').disabled = !state.index || locked;
  $('#checkAnswer').disabled = locked || !answerReady(q);
  $('#leaveQuiz').disabled = $('#quizTheory').disabled = $('#finishButton').disabled =
    $('#skipQuestion').disabled = $('#nextQuestion').disabled = locked;
  $$('#questionPanel [data-choice],#questionPanel [data-tf],#shortAnswer').forEach(control=>control.disabled=locked||graded);
  const hint = $('#hintButton');
  if (hint) hint.disabled = locked || hint.getAttribute('aria-busy')==='true';
  $$('[data-jump]').forEach((button,i)=>{
    const id = questions[i].id;
    const f = state.feedback[id];
    button.classList.toggle('answered',!!f?.allCorrect);
    button.classList.toggle('wrong-answer',!!f && !f.allCorrect);
    button.classList.toggle('draft',!f && state.drafts[id]!=null);
    button.classList.toggle('current',i===state.index);
    if (i===state.index) button.setAttribute('aria-current','step');
    else button.removeAttribute('aria-current');
    button.disabled = locked;
  });
}
function questionHTML(q) {
  const f = state.feedback[q.id];
  const draft = state.drafts[q.id];
  const disabled = f || state.checking || state.submitting ? 'disabled' : '';
  let body;
  if (q.type==='mcq') {
    body = '<div class="options">'+q.options.map((x,i)=>{
      const style = f ? (i===f.answer?'correct':i===f.selected?'wrong':'') : (draft===i?'selected':'');
      return '<button class="option '+style+'" aria-pressed="'+((f?f.selected:draft)===i)+
        '" data-choice="'+i+'" '+disabled+'><span class="letter">'+'ABCD'[i]+'</span><span>'+quizMath(x)+'</span></button>';
    }).join('')+'</div>';
  } else if (q.type==='tf') {
    const values = f ? f.selected : (Array.isArray(draft)?draft:[null,null,null,null]);
    body = '<div class="tf-list">'+q.statements.map((x,i)=>{
      const style = f ? (f.parts[i].correct?'right':'wrong') : '';
      const choices = [true,false].map(v=>
        '<button class="'+(values[i]===v?'selected':'')+'" aria-pressed="'+(values[i]===v)+
        '" data-tf="'+i+'" data-value="'+v+'" '+disabled+'>'+(v?'Đúng':'Sai')+'</button>'
      ).join('');
      return '<div class="tf-row '+style+'"><div class="tf-statement"><b>'+'abcd'[i]+')</b> '+quizMath(x.text)+
        '</div><div class="tf-choices">'+choices+'</div>'+figureHTML(x.figure)+
        (f?'<div class="tf-why">Đáp án '+(f.parts[i].answer?'Đúng':'Sai')+'. '+quizMath(f.parts[i].explanation)+'</div>':'')+
        '</div>';
    }).join('')+'</div>';
  } else {
    body = '<div class="short-wrap"><input class="short-input" id="shortAnswer" type="text" inputmode="decimal" maxlength="48" autocomplete="off" '+
      'placeholder="Nhập đáp án" aria-label="Câu trả lời ngắn" value="'+esc(f?f.selected??'':draft??'')+'" '+disabled+'></div>'+
      (f?'<p class="sub" style="margin-top:12px">Đáp án <b>'+quizMath(f.answer)+'</b></p>':'');
  }
  const label = q.tags?.includes('trap')?'extension':'';
  const level = q.tags?.map(t=>practiceLevels[t]).filter(Boolean).join(' · ')||q.level;
  return '<div class="question-top"><span class="tag">Câu '+(state.index+1)+' · '+typeNames[q.type]+'</span>'+
    '<span class="level '+label+'">'+esc(level)+'</span></div>'+
    '<div class="qprompt">'+questionPrompt(q.prompt)+'</div>'+figureHTML(q.figure)+body+
    (f?feedbackHTML(f):'<div class="hint-row"><button class="hint-button" id="hintButton" '+
      (state.checking || state.submitting?'disabled':'')+'>Gợi ý ↗</button></div>'+
      (state.hints[q.id]?'<div class="hint-box">'+quizMath(state.hints[q.id])+'</div>':''));
}
function feedbackHTML(feedback) {
  const {explanation,rule,question,allCorrect,units,correct,trap} = feedback;
  const summary = allCorrect ? '✓ Đúng rồi!' : units===4 ? 'Đúng '+correct+'/4 ý' : 'Chưa đúng';
  const detail = rule && explanation?.endsWith(rule) ? explanation.slice(0,-rule.length).trim() : explanation;
  return '<div class="feedback '+(allCorrect ? '' : 'bad')+'" aria-live="polite"><strong>'+summary+'</strong>'+
    (state.streak>=3 && allCorrect ? '<span class="badge" style="float:right">★ '+state.streak+' câu liên tiếp</span>' : '')+
    (detail ? '<p>'+quizMath(detail)+'</p>' : '')+
    '<p class="rule"><b>'+esc(question.focus || 'Kiến thức cần nhớ')+'.</b> '+quizMath(rule)+'</p>'+
    (allCorrect || trap===rule ? '' : '<p><b>Dễ nhầm.</b> '+quizMath(trap)+'</p>')+'</div>';
}
function setDraft(q,value) {
  state.drafts[q.id] = value;
  state.dirty[q.id] = value;
  persistDraft();
  scheduleSave();
  $('#saveStatus').textContent = '';
  $('[data-jump="'+state.index+'"]').classList.add('draft');
  $('#checkAnswer').disabled = !answerReady(q);
}
function bindQuestion(q) {
  $$('[data-choice]').forEach(button=>button.onclick=()=>{
    setDraft(q,Number(button.dataset.choice));
    $$('[data-choice]').forEach(choice=>paintAnswerChoice(choice,choice===button));
  });
  $$('[data-tf]').forEach(button=>button.onclick=()=>{
    const before = state.drafts[q.id];
    const values = Array.isArray(before) ? before.slice() : [null,null,null,null];
    values[Number(button.dataset.tf)] = button.dataset.value==='true';
    setDraft(q,values);
    button.parentElement.querySelectorAll('[data-tf]').forEach(choice=>paintAnswerChoice(choice,choice===button));
  });
  if ($('#shortAnswer')) $('#shortAnswer').oninput=e=>setDraft(q,e.target.value);
  const hint = $('#hintButton');
  if (hint) hint.onclick = async()=>{
    const id = state.quiz.id;
    hint.setAttribute('aria-busy','true');
    await busy(hint,'Đang mở…',async()=>{
      const h = await rpc('getHint',state.token,id,q.id);
      if (state.quiz?.id!==id) return;
      state.hints[q.id] = h.hint;
      if (!hint.isConnected) return;
      let box = $('.hint-box');
      if (!box) {
        box = document.createElement('div');
        box.className = 'hint-box';
        box.setAttribute('role','status');
        hint.parentElement.after(box);
      }
      box.innerHTML = quizMath(h.hint);
    });
    hint.removeAttribute('aria-busy');
    if (hint.isConnected) hint.disabled = quizLocked();
  };
}
function paintAnswerChoice(button,selected) {
  button.classList.toggle('selected',selected);
  button.setAttribute('aria-pressed',String(selected));
}
async function checkQuestion(q) {
  if (!state.quiz || quizLocked() || state.feedback[q.id] || !answerReady(q)) return;
  clearTimeout(state.saveTimer);
  state.checking = true;
  const id = state.quiz.id;
  updateQuizControls();
  let graded = false;
  try {
    const result = await rpc('answerQuestion',state.token,id,q.id,state.drafts[q.id]);
    if (state.quiz?.id!==id) return;
    state.feedback[q.id] = result.feedback;
    delete state.dirty[q.id];
    persistDraft();
    state.streak = result.feedback.allCorrect ? state.streak+1 : 0;
    if (result.lessonProgress) {
      (state.dashboard.lessons ||= {})[result.lessonProgress.id] = result.lessonProgress;
    } else if (result.chapterProgress) {
      const i = state.dashboard.chapters.findIndex(c=>c.id===result.chapterProgress.id);
      if (i>=0) state.dashboard.chapters[i] = result.chapterProgress;
    }
    graded = true;
  } catch (e) {
    fail(e);
  } finally {
    state.checking = false;
    if (state.quiz?.id===id) {
      if (graded) {
        renderQuiz();
        $('#nextQuestion').focus({preventScroll:true});
        $('.feedback')?.scrollIntoView({block:'nearest',behavior:reducedMotion.matches?'instant':'smooth'});
      } else {
        updateQuizControls();
        $('#checkAnswer').focus({preventScroll:true});
      }
      if (Object.keys(state.dirty).length) scheduleSave();
    }
  }
}
function goToQuestion(index) {
  if (!state.quiz || quizLocked()) return;
  const next = Math.max(0,Math.min(state.quiz.questions.length-1,index));
  if (next===state.index) return;
  state.index = next;
  persistDraft();
  renderQuiz(true);
  $('#questionPanel').focus({preventScroll:true});
  window.scrollTo({top:0,behavior:'instant'});
}
function moveQuestion(delta) {
  goToQuestion(state.index+delta);
}
function scheduleSave() {
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(()=>{
    if (!state.checking && !state.submitting) flushSave().catch(()=>{});
  },6500);
}
function flushSave() {
  clearTimeout(state.saveTimer);
  if (!state.quiz || !Object.keys(state.dirty).length) return state.saveChain.catch(()=>{});
  const id = state.quiz.id;
  const token = state.token;
  const patch = {...state.dirty};
  state.saveChain = state.saveChain.catch(()=>{}).then(async()=>{
    if (state.quiz?.id!==id) return;
    Object.keys(patch).forEach(key=>{
      if (state.dirty[key]!==patch[key]) delete patch[key];
    });
    if (!Object.keys(patch).length) return;
    await rpc('saveProgress',token,id,patch);
    if (state.quiz?.id!==id) return;
    Object.keys(patch).forEach(key=>{
      if (state.dirty[key]===patch[key]) delete state.dirty[key];
    });
    persistDraft();
    if ($('#saveStatus')) $('#saveStatus').textContent = 'Đã lưu nháp';
  }).catch(e=>{
    if (state.quiz?.id===id && $('#saveStatus')) $('#saveStatus').textContent = 'Nháp trên máy';
    throw e;
  });
  return state.saveChain;
}
async function pauseCurrent() {
  if (state.checking || state.submitting || state.pausing || !state.quiz) return false;
  const id = state.quiz.id;
  state.pausing = true;
  clearTimeout(state.saveTimer);
  updateQuizControls();
  try {
    await state.saveChain.catch(()=>{});
    const result = await rpc('pauseQuiz',state.token,id,state.dirty);
    if (state.quiz?.id!==id) return false;
    state.dashboard.active = state.dashboard.active.filter(run=>run.id!==id);
    if (result.saved) state.dashboard.active.unshift(result.saved);
    state.dirty = {};
    persistDraft();
    state.quiz = null;
    return true;
  } catch (e) {
    fail(e);
    return false;
  } finally {
    state.pausing = false;
    if (state.quiz?.id===id) updateQuizControls();
  }
}
async function leaveQuiz() {
  if (!await pauseCurrent()) return;
  renderStudy();
  window.scrollTo(0,0);
}
async function finish() {
  if (!state.quiz || quizLocked()) return;
  state.submitting = true;
  const left = state.quiz.questions.length-Object.keys(state.feedback).length;
  if (!await confirmAction('Nộp bài?',left?'Các câu đã chọn sẽ được chấm. Câu để trống được tính 0 điểm.':'Bạn đã chấm tất cả các câu.','Nộp bài')) {
    state.submitting = false;
    return;
  }
  const id = state.quiz.id;
  clearTimeout(state.saveTimer);
  updateQuizControls();
  try {
    const r = await rpc('submitQuiz',state.token,id,state.drafts);
    storage.remove(draftKey(id));
    state.dashboard.active = state.dashboard.active.filter(run=>run.id!==id);
    state.quiz = null;
    renderResult(r);
  } catch (e) { fail(e); }
  finally {
    state.submitting = false;
    if (state.quiz?.id===id) updateQuizControls();
  }
}

  else if(d.type==='halfplane'){s='<path d="M55 165L295 165L55 25Z" fill="#dbeacc"/>'+line(38,165,325,165)+line(55,185,55,15)+line(55,25,295,165)+label(45,185,'O')+label(305,187,d.n)+label(34,30,d.n)+label(330,163,'x')+label(57,13,'y');}
  else if(d.type==='parallelAngles'){const cot=1/Math.tan(d.a*Math.PI/180),x1=180-35*cot,x2=180+125*cot;s=line(25,55,335,55)+line(25,145,335,145)+line(x1,20,x2,180)+label(180+38*Math.cos(d.a*Math.PI/360),55+38*Math.sin(d.a*Math.PI/360),d.a+'°')+label(30,43,'a')+label(30,134,'b');}
  else if(d.type==='rect'||d.type==='square'){s='<rect x="60" y="32" width="240" height="110" rx="3" fill="#e6f1de" stroke="#7f9d70" stroke-width="3"/>'+label(180,170,d.a+' cm')+label(330,90,(d.b||d.a)+' cm');if(d.type==='square')s='<rect x="110" y="15" width="150" height="150" fill="#e6f1de" stroke="#7f9d70" stroke-width="3"/>'+label(185,190,d.a+' cm');}

  else if(d.type==='triangle'){s='<path d="M65 150L285 150L130 20Z" fill="#e6f1de" stroke="#7f9d70" stroke-width="3"/><path d="M130 20V150" stroke="#a9c29b" stroke-dasharray="5 4"/>'+label(185,178,d.a+' cm')+label(107,91,d.b+' cm');}
  else if(d.type==='segment'){s=line(40,85,320,85)+[40,180,320].map((x,i)=>'<circle cx="'+x+'" cy="85" r="4" fill="#638d63"/>'+label(x,65,['A','M','B'][i])).join('')+label(110,115,d.a+' cm')+label(250,115,d.b+' cm');}
  else if(d.type==='circle'){s='<circle cx="180" cy="90" r="65" fill="#e6f1de" stroke="#7f9d70" stroke-width="3"/>'+line(180,90,245,90)+label(210,80,d.r+' cm')+'<circle cx="180" cy="90" r="3" fill="#7f9d70"/>';}

  const height=d.type==='dots'?((d.total??d.n)>5?165:105):d.type==='segment'?145:210;return s?'<div class="figure"><svg viewBox="0 0 360 '+height+'" role="img" aria-label="Hình minh họa bài toán">'+s+'</svg></div>':'';

function reasoningFigureHTML(figure) {
  const outline = '#23595a';
  const accent = '#a36a18';
  const tint = '#f4f8f5';
  let content;
  let height = 216;
  const point = (x,y,name) =>
    '<text x="'+x+'" y="'+y+'" text-anchor="middle" class="diagram-label">'+esc(name)+'</text>';
  const path = (d,stroke=outline,fill='none',dashed=false) =>
    '<path d="'+d+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"'+
    (dashed ? ' stroke-dasharray="5 5"' : '')+'/>';
  const polygon = (points,fill=tint) =>
    path('M'+points.map(p=>p.join(' ')).join('L')+'Z',outline,fill);
  const line = (x1,y1,x2,y2,stroke=outline,dashed=false) =>
    path('M'+x1+' '+y1+'L'+x2+' '+y2,stroke,'none',dashed);
  const right = (x,y) => path('M'+x+' '+(y-10)+'h10v10',accent);

  switch (figure.type) {
    case 'joinedSquares':
      content = path('M80 56H280V156H80Z',outline,tint)+
        line(180,56,180,156,accent,true);
      break;
    case 'perimeterPair':
      content = path('M49 55h96v96H49Z',outline,tint)+
        path('M197 63h118v80H197Z',outline,'#fcf0d9')+
        point(97,44,'A')+point(256,49,'B')+
        point(97,176,figure.side+' cm')+point(256,169,(figure.side+1)+' cm')+
        point(33,108,figure.side)+point(329,108,figure.side-1);
      break;
    case 'parallelRight':
      content = line(45,110,315,110)+line(112,30,112,185)+
        line(247,30,247,185)+right(112,110)+right(247,110)+
        point(125,42,'a')+point(260,42,'b')+point(310,99,'d');
      break;
    case 'trianglePartition': {
      const d = 54+252*figure.left/(figure.left+figure.right);
      content = polygon([[151,25],[54,163],[d,163]])+
        polygon([[151,25],[d,163],[306,163]],'#fcf0d9')+
        line(151,25,151,163,accent,true)+right(151,163)+
        point(151,17,'A')+point(50,181,'B')+point(308,181,'C')+
        point(d,181,'D')+point((54+d)/2,202,figure.left+' cm')+
        point((d+306)/2,202,figure.right+' cm');
      break;
    }
    case 'equalDiagonals':
      content = polygon([[120,45],[240,45],[303,155],[57,155]])+
        line(120,45,303,155,accent)+line(240,45,57,155,accent)+
        point(109,40,'A')+point(252,40,'B')+
        point(310,170,'C')+point(48,170,'D')+
        point(180,35,'4 cm')+point(180,179,'8 cm');
      break;
    case 'altitudeTriangle': {
      const x = figure.equilateral ? 90 : 64;
      content = polygon([[180,24],[x,180],[360-x,180]])+
        line(180,24,180,180,accent,true)+right(180,180)+
        line((x+180)/2,175,(x+180)/2,185)+line((540-x)/2,175,(540-x)/2,185)+
        point(180,16,'A')+point(x-8,197,'B')+
        point(368-x,197,'C')+point(180,201,figure.foot||'H');
      break;
    }
    case 'medianTriangle': {
      const centroid = figure.mode==='centroid';
      const x = centroid ? 182 : 158;
      content = polygon([[120,30],[60,174],[304,174]])+
        line(120,30,x,174,accent)+point(117,22,'A')+
        point(52,190,'B')+point(313,190,'C')+
        point(x,195,centroid ? 'M' : 'D');
      if (centroid) {
        content += '<circle cx="161.33" cy="126" r="4" fill="'+accent+'"/>'+
          point(177,126,'G');
      } else {
        content += path('M112 49A22 22 0 0 0 139 45',accent);
      }
      break;
    }
    case 'parallelProjection': {
      const top = [[100,52],[170,41],[240,30]];
      const bottom = [[137,145],[207,134],[277,123]];
      content = polygon([[55,161],[277,161],[323,110],[101,110]],'#edf6f2')+
        line(...top[0],...top[2])+line(...bottom[0],...bottom[2],accent);
      top.forEach(([x,y],i)=>{
        const [u,v] = bottom[i];
        content += '<path class="solid-guide" d="M'+x+' '+y+'L'+u+' '+v+'"/>'+
          point(x-5,y-10,['A','M','B'][i])+point(u+4,v+13,['A′','M′','B′'][i])+
          '<circle cx="'+x+'" cy="'+y+'" r="2.6" fill="'+outline+'"/>'+
          '<circle cx="'+u+'" cy="'+v+'" r="2.6" fill="'+accent+'"/>';
      });
      break;
    }
    case 'parallelogramCross':
      content = polygon([[100,49],[299,49],[261,158],[62,158]])+
        line(100,49,261,158,accent)+line(299,49,62,158,accent)+
        point(96,42,'A')+point(306,44,'B')+
        point(271,176,'C')+point(55,176,'D')+point(181,92,'O');
      break;
    case 'thalesTriangle': {
      const y = 22+148*figure.fraction;
      const dx = 144-91*figure.fraction;
      const ex = 144+161*figure.fraction;
      content = polygon([[144,22],[53,170],[305,170]])+
        line(dx,y,ex,y,accent)+
        point(144,15,'A')+point(45,189,'B')+point(311,189,'C')+
        point(dx-12,y,'D')+point(ex+13,y,'E');
      break;
    }
    case 'equilateralCenter':
      height = 242;
      content = '<circle cx="180" cy="126" r="104" fill="none" stroke="#a6c2bc" stroke-width="1.5"/>'+
        polygon([[180,22],[90,178],[270,178]],'#ebf6f0')+
        '<circle cx="180" cy="126" r="52" fill="none" stroke="'+accent+'" stroke-dasharray="5 4"/>'+
        line(180,22,180,178,accent)+right(180,178)+
        '<circle cx="180" cy="126" r="4" fill="'+accent+'"/>'+
        point(180,16,'A')+point(81,192,'B')+point(279,192,'C')+
        point(180,197,'H')+point(194,127,'O');
      break;
    case 'chord':
      content = '<circle cx="180" cy="103" r="80" fill="'+tint+'" stroke="'+outline+'" stroke-width="2"/>'+
        line(116,151,244,151)+line(180,103,180,151,accent)+line(180,103,116,151)+
        right(180,151)+point(180,94,'O')+point(105,166,'A')+
        point(255,166,'B')+point(180,169,'H');
      break;
    case 'cyclic': {
      const angles = [-130,-18,figure.angle-18,2*figure.angle-18];
      const points = angles.map(a=>[
        Math.round(180+75*Math.cos(a*Math.PI/180)),
        Math.round(105+75*Math.sin(a*Math.PI/180))
      ]);
      content = polygon(points)+points.map(([x,y],i)=>
        point(x+(x-180)*.19,y+(y-105)*.19+4,'ABCD'[i])).join('');
      break;
    }
    default:
      return '';
  }

  return '<div class="figure reasoning-diagram"><svg viewBox="0 0 360 '+height+
    '" role="img" aria-label="Hình minh họa bài toán">'+content+'</svg></div>';
}

function solidFigureHTML(figure) {
  if (!['cube','pyramid','cylinder','sphere'].includes(figure.type)) return '';
  const label = (x,y,text)=>
    '<text class="solid-label" x="'+x+'" y="'+y+'" text-anchor="middle">'+esc(text)+'</text>';
  const path = (commands,style='edge')=>
    '<path d="'+commands+'" class="solid-'+style+'"/>';
  const line = (a,b,style)=>path('M'+a.join(' ')+'L'+b.join(' '),style);
  let content;
  let name;

  if (figure.type==='cube') {
    const vertices = {
      A:[78,184],B:[244,184],C:[304,138],D:[138,138],
      'A′':[78,78],'B′':[244,78],'C′':[304,32],'D′':[138,32]
    };
    const hidden = [['A','D'],['D','C'],['D','D′']];
    const visible = [
      ['A','B'],['B','C'],['A','A′'],['B','B′'],['C','C′'],
      ['A′','B′'],['B′','C′'],['C′','D′'],['D′','A′']
    ];
    content = hidden.map(([a,b])=>line(vertices[a],vertices[b],'hidden')).join('')+
      visible.map(([a,b])=>line(vertices[a],vertices[b])).join('');
    const marked = {'A′C':['A′','C'],'B′D':['B′','D'],'AC':['A','C']};
    const segment = marked[figure.mark];
    if (segment) content += line(vertices[segment[0]],vertices[segment[1]],'guide');
    if (figure.labels) {
      const positions = {
        A:[67,201],B:[251,202],C:[318,147],D:[130,154],
        'A′':[64,77],'B′':[250,70],'C′':[319,30],'D′':[132,21]
      };
      content += Object.keys(positions).map(key=>label(...positions[key],key)).join('');
    }
    name = 'Hình lập phương với cạnh thấy nét liền, cạnh khuất nét đứt';
  } else if (figure.type==='pyramid') {
    const a=[64,180],b=[244,180],c=[306,124],d=[126,124],s=[185,25],o=[185,152],m=[154,180];
    content = line(a,d,'hidden')+line(d,c,'hidden')+line(s,d,'hidden')+
      line(a,b)+line(b,c)+line(s,a)+line(s,b)+line(s,c)+line(s,o,'guide')+
      path('M185 143h9v9','guide');
    if (figure.labels) {
      content += line(s,m,'emphasis')+line(o,m,'guide')+
        label(185,17,'S')+label(53,198,'A')+label(250,198,'B')+
        label(320,126,'C')+label(120,140,'D')+label(200,155,'O')+label(151,199,'M');
    } else {
      if (figure.height!=null) content += label(203,99,'h = '+figure.height);
      if (figure.base!=null) content += label(180,205,'S đáy = '+figure.base);
    }
    name = 'Hình chóp tứ giác với cạnh khuất và đường cao nét đứt';
  } else if (figure.type==='cylinder') {
    content = '<ellipse cx="180" cy="53" rx="70" ry="22" class="solid-edge"/>'+
      path('M110 53V158M250 53V158')+
      path('M110 158A70 22 0 0 1 250 158','hidden')+
      path('M110 158A70 22 0 0 0 250 158')+
      path('M180 53H250','emphasis');
    if (figure.r!=null) content += label(216,44,'r = '+figure.r);
    if (figure.h!=null) content += label(279,111,'h = '+figure.h);
    name = 'Hình trụ với nửa đáy khuất nét đứt';

function studyFigure(id) {
  const [title,caption,render] = studyDiagrams[id];
  return '<figure class="study-visual">'+render()+
    '<figcaption><strong>'+esc(title)+'</strong><span>'+theoryFormula(caption)+'</span></figcaption></figure>';
}

function visualFractionLabel(x,y,numerator,denominator) {
  return visualLabel(x,y-5,numerator)+plot([x-8,y],[x+8,y],'mark')+visualLabel(x,y+13,denominator);
}
