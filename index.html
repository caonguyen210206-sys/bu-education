ắp mẫu tăng dần. Tìm trung vị của nửa dưới và nửa trên, bỏ trung vị chung khi số phần tử lẻ."],"Δ_Q = Q_3 − Q_1"]],"diagrams":["quartile"]},{"title":"Phương sai và độ lệch chuẩn","intro":"Phương sai là trung bình bình phương độ lệch quanh x̄. Độ lệch chuẩn cùng đơn vị với dữ liệu.","formulas":"s² = \\frac{tổng (xᵢ − x̄)²}{n}; s = \\sqrt{s²}","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Ngoại lệ","intro":"Quy tắc thường dùng đánh dấu giá trị ngoài khoảng từ Q₁ − 1,5ΔQ đến Q₃ + 1,5ΔQ. Trung vị thường ít nhạy với số cực đoan hơn trung bình.","formulas":"","short":"","notes":[["bổ sung","Nhìn nhanh ảnh hưởng của giá trị ngoại lệ","Thay một giá trị cực lớn thường làm trung bình và phương sai đổi mạnh. Trung vị có thể giữ nguyên nếu vị trí giữa không thay đổi. Tịnh tiến toàn mẫu không đổi độ lệch chuẩn.","Nếu y=ax+b thì s_y=∣a∣s_x và s_y²=a²s_x²"]],"methods":[{"title":"Nhìn nhanh ảnh hưởng của giá trị ngoại lệ","lead":"Thay một giá trị cực lớn thường làm trung bình và phương sai đổi mạnh. Trung vị có thể giữ nguyên nếu vị trí giữa không thay đổi. Tịnh tiến toàn mẫu không đổi độ lệch chuẩn.","steps":["Xác định đại lượng dựa trên thứ tự hay độ lớn","Tính lại nếu thứ tự hoặc độ lệch đổi","Giữ đơn vị"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Ngưỡng ngoại lệ",["Giá trị nằm ngoài hai hàng rào thường được xem là ngoại lệ theo quy tắc tứ phân vị."],"Q_1 − 1,5Δ_Q và Q_3 + 1,5Δ_Q"]]}],"g10-c6":[{"title":"Hàm số và tập xác định","intro":"Mỗi x hợp lệ ứng đúng một giá trị y. Mẫu khác 0 và biểu thức dưới căn bậc hai không âm. Đọc khoảng đồng biến, nghịch biến theo chiều x tăng.","formulas":"","short":"","notes":[["","Hàm số và hệ số góc","Mỗi x trong tập xác định ứng đúng một y. Với y=ax+b, a ≠ 0, đồ thị là đường thẳng có hệ số góc a, cắt Oy tại (0;b). a dương thì đi lên từ trái sang phải, a âm thì đi xuống.","a=\\frac{y₂−y₁}{x₂−x₁}; giao Ox: (−\\frac{b}{a};0)"]],"methods":[{"title":"Hàm số và hệ số góc","lead":"Mỗi x trong tập xác định ứng đúng một y. Với y=ax+b, a ≠ 0, đồ thị là đường thẳng có hệ số góc a, cắt Oy tại (0;b). a dương thì đi lên từ trái sang phải, a âm thì đi xuống.","steps":["Xác định tập xác định hoặc hai điểm","Tính hệ số góc","Kiểm tra điểm thuộc đồ thị bằng thay tọa độ"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Parabol bậc hai","intro":"Với a ≠ 0, đồ thị y = ax² + bx + c có trục đi qua đỉnh. Mở lên khi a > 0; mở xuống khi a < 0.","formulas":"x_{đỉnh} = −\\frac{b}{2a}; y_{đỉnh} = −\\frac{Δ}{4a}; Δ = b² − 4ac","short":"","notes":[["cách làm","Chọn đỉnh, nghiệm hay bảng dấu","Dùng đỉnh khi hỏi cực trị hoặc trục đối xứng. Dùng nghiệm rồi bảng dấu khi giải bất phương trình. Bình phương để giải phương trình căn chỉ sau khi ghi điều kiện.","y=a(x−x₀)²+y₀; x₀=−\\frac{b}{2a}"]],"methods":[{"title":"Chọn đỉnh, nghiệm hay bảng dấu","lead":"Dùng đỉnh khi hỏi cực trị hoặc trục đối xứng. Dùng nghiệm rồi bảng dấu khi giải bất phương trình. Bình phương để giải phương trình căn chỉ sau khi ghi điều kiện.","steps":["Xác định đích của câu","Viết dạng phù hợp","So dấu và đầu mút, hoặc thử nghiệm"],"example":"","tip":"","worked":[]},{"title":"Hoàn thành bình phương để đọc đỉnh","lead":"","steps":[],"example":"","tip":"","worked":[["Hoàn thành bình phương để đọc đỉnh","Tìm giá trị lớn nhất của y = −2x² + 8x − 1.",["Nhóm −2(x² − 4x) − 1.","Viết x² − 4x = (x − 2)² − 4. Suy ra y = −2(x − 2)² + 7.","Vì (x − 2)² ≥ 0 nên y ≤ 7. Dấu bằng tại x = 2."],"Giá trị lớn nhất là 7 tại x = 2.",""]]}],"visuals":[0],"table":[]},{"title":"Dấu của tam thức","intro":"Nếu có hai nghiệm phân biệt, ngoài hai nghiệm cùng dấu a và giữa hai nghiệm trái dấu a. Có nghiệm kép thì cùng dấu a ở ngoài nghiệm. Không có nghiệm thì luôn cùng dấu a.","formulas":"","short":"","notes":[["","Hàm số bậc hai và dấu tam thức","Parabol y=ax²+bx+c có trục đối xứng qua đỉnh; a dương mở lên, a âm mở xuống. Tam thức có hai nghiệm phân biệt thì ngoài cùng dấu a, trong trái dấu a. Nghiệm kép không làm đổi dấu.","x_{đỉnh}=−\\frac{b}{2a}; y_{đỉnh}=−\\frac{Δ}{4a} // Δ=b²−4ac"]],"methods":[{"title":"Hàm số bậc hai và dấu tam thức","lead":"Parabol y=ax²+bx+c có trục đối xứng qua đỉnh; a dương mở lên, a âm mở xuống. Tam thức có hai nghiệm phân biệt thì ngoài cùng dấu a, trong trái dấu a. Nghiệm kép không làm đổi dấu.","steps":["Tính đỉnh hoặc nghiệm theo mục tiêu","Chia khoảng tại nghiệm","Xét dấu và lấy đầu mút đúng theo đề"],"example":"","tip":"","worked":[]},{"title":"Tìm tham số để tam thức không âm với mọi x","lead":"","steps":["Kiểm tra hệ số bậc hai dương.","Tìm giá trị nhỏ nhất bằng cách hoàn thành bình phương hoặc dùng biệt thức.","Đặt giá trị nhỏ nhất không âm và giải điều kiện."],"example":"","worked":[],"tip":"","practice":["Tìm m để x² − 4x + m ≥ 0 với mọi x ∈ ℝ.","Viết (x − 2)² + m − 4.","Cần và đủ m ≥ 4. Dấu bằng xảy ra tại x = 2 khi m = 4."]}],"visuals":[],"table":[],"core":[["Dấu tam thức bậc hai",["Có hai nghiệm phân biệt thì ngoài khoảng hai nghiệm cùng dấu a, trong khoảng trái dấu a.","Nghiệm kép chỉ làm biểu thức bằng 0 tại một điểm."],""]]},{"title":"Phương trình quy về bậc hai","intro":"Với hai căn bằng nhau, bình phương sau khi đặt điều kiện. Với √A = B, yêu cầu B ≥ 0 rồi giải A = B² và kiểm tra.","formulas":"\\sqrt{A} = B ⇔ A = B² và B ≥ 0","short":"","notes":[["","","Bình phương có thể tạo nghiệm ngoại lai. Với √A=B, cần B≥0; phương trình hai căn cần miền cả hai căn xác định. Sau biến đổi, thử lại nếu chưa dùng toàn phép tương đương.","\\sqrt{A}=B ⇔ A=B² và B≥0"]],"methods":[{"title":"Phương trình quy về bậc hai","lead":"Bình phương có thể tạo nghiệm ngoại lai. Với √A=B, cần B≥0; phương trình hai căn cần miền cả hai căn xác định. Sau biến đổi, thử lại nếu chưa dùng toàn phép tương đương.","steps":["Đặt điều kiện","Bình phương hoặc đặt ẩn phụ","Giải phương trình bậc hai","Thử và loại nghiệm"],"example":"","tip":"","worked":[]},{"title":"Giải phương trình chứa căn bằng bình phương có điều kiện","lead":"Với dạng \\sqrt{A(x)} = B(x), cần B(x) ≥ 0.","steps":["Tìm điều kiện xác định của các biểu thức gốc.","Giữ B(x) ≥ 0 rồi giải A(x) = B²(x).","Thử lại trong phương trình gốc để loại nghiệm ngoại lai."],"example":"\\sqrt{x+2} = x cho x ≥ 0. Từ x² − x − 2 = 0, chỉ x = 2 thỏa.","worked":[],"tip":""}],"visuals":[],"table":[]}],"g10-c7":[{"title":"Đường thẳng","intro":"ax + by + c = 0 có pháp tuyến (a;b), chỉ phương có thể là (−b;a). Phương trình tham số là điểm M₀ cộng t lần vectơ chỉ phương.","formulas":"(x;y) = (x₀;y₀) + t(u₁;u₂)","short":"","notes":[["","Đường thẳng trong Oxy","Đường thẳng ax+by+c=0 có pháp tuyến (a;b), chỉ phương (−b;a). Hai đường có pháp tuyến cùng phương thì song song hoặc trùng. Khoảng cách dùng trị tuyệt đối ở tử.","(x;y)=(x₀;y₀)+t(u₁;u₂) // d(M,Δ)=\\frac{∣ax₀+by₀+c∣}{√(a²+b²)}"]],"methods":[{"title":"Đường thẳng trong Oxy","lead":"Đường thẳng ax+by+c=0 có pháp tuyến (a;b), chỉ phương (−b;a). Hai đường có pháp tuyến cùng phương thì song song hoặc trùng. Khoảng cách dùng trị tuyệt đối ở tử.","steps":["Đọc điểm và vectơ đúng loại","Viết phương trình","Kiểm tra bằng thay một điểm đã biết"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Vị trí, góc và khoảng cách","intro":"Hai pháp tuyến cùng phương cho hai đường song song hoặc trùng. Góc giữa hai đường lấy góc không vượt 90°. Khoảng cách dùng trị tuyệt đối ở tử.","formulas":"d(M,d) = \\frac{∣ax₀ + by₀ + c∣}{√(a² + b²)}","short":"","notes":[],"methods":[{"title":"Lập đường thẳng qua điểm và vuông góc đường đã biết","lead":"Đường thẳng mới nhận vectơ chỉ phương của đường cũ làm pháp tuyến.","steps":["Đọc pháp tuyến của đường cũ từ hai hệ số.","Chọn vectơ chỉ phương vuông góc pháp tuyến đó.","Dùng vectơ vừa chọn làm pháp tuyến của đường mới và thế điểm để tìm hằng số."],"example":"Đường qua M(1; 2) vuông góc 2x − y + 3 = 0 là x + 2y − 5 = 0.","worked":[],"tip":""}],"visuals":[],"table":[],"diagrams":["normal"]},{"title":"Đường tròn","intro":"Tâm I(a;b), bán kính R. Tiếp tuyến tại M có pháp tuyến là vectơ IM. Đường thẳng tiếp xúc khi khoảng cách từ tâm tới đường bằng R.","formulas":"(x − a)² + (y − b)² = R²","short":"","notes":[["","Đường tròn trong Oxy","Phương trình chuẩn dùng tâm I(a;b), bán kính R>0. Hoàn thành bình phương để đọc tâm, bán kính từ phương trình khai triển. Tiếp tuyến tại M có pháp tuyến IM.","(x−a)²+(y−b)²=R² // x²+y²−2ax−2by+c=0, R²=a²+b²−c"],["cách làm","Lập phương trình từ điều kiện hình học","Với đường thẳng, cần điểm và một vectơ phù hợp. Với tiếp tuyến đường tròn, dùng bán kính làm pháp tuyến. Với conic, nhận dạng phương trình chuẩn trước khi đọc tiêu điểm.","d(I,Δ)=R ⇔ Δ tiếp xúc (I;R)"]],"methods":[{"title":"Đường tròn trong Oxy","lead":"Phương trình chuẩn dùng tâm I(a;b), bán kính R>0. Hoàn thành bình phương để đọc tâm, bán kính từ phương trình khai triển. Tiếp tuyến tại M có pháp tuyến IM.","steps":["Gom hạng tử x, y","Hoàn thành bình phương","Kiểm tra R² dương hoặc điều kiện tiếp xúc"],"example":"","tip":"","worked":[]},{"title":"Lập phương trình từ điều kiện hình học","lead":"Với đường thẳng, cần điểm và một vectơ phù hợp. Với tiếp tuyến đường tròn, dùng bán kính làm pháp tuyến. Với conic, nhận dạng phương trình chuẩn trước khi đọc tiêu điểm.","steps":["Ghi loại đối tượng","Xác định dữ kiện tối thiểu","Lập phương trình và thay lại một điểm"],"example":"","tip":"","worked":[]},{"title":"Từ tâm và tiếp tuyến đến phương trình đường tròn","lead":"","steps":[],"example":"","tip":"","worked":[["Từ tâm và tiếp tuyến đến phương trình đường tròn","Viết phương trình đường tròn tâm I(2; −1) tiếp xúc đường thẳng 3x + 4y − 12 = 0.",["Bán kính bằng khoảng cách vuông góc từ I tới đường thẳng.","Tính r = \\frac{∣3·2 + 4·(−1) − 12∣}{\\sqrt{3²+4²}} = \\frac{10}{5} = 2.","Thay tâm và bình phương bán kính vào dạng chuẩn."],"(x − 2)² + (y + 1)² = 4.",""]]},{"title":"Viết tiếp tuyến qua một điểm trên đường tròn","lead":"","steps":["Đọc tâm và kiểm tra điểm đã cho thuộc đường tròn.","Lấy vectơ từ tâm đến tiếp điểm làm vectơ pháp tuyến.","Viết phương trình đường thẳng qua tiếp điểm."],"example":"","worked":[["Dùng bán kính làm pháp tuyến","Đường tròn tâm I(2; 1) đi qua M(5; 1). Viết tiếp tuyến tại M.",["Vectơ IM có tọa độ (3; 0).","Tiếp tuyến qua M có pháp tuyến (3; 0), nên 3(x − 5) = 0."],"Tiếp tuyến là x = 5.",""]],"tip":"","practice":["Viết tiếp tuyến tại M(4; 3) của đường tròn (x − 1)² + (y + 1)² = 25.","Tâm I(1; −1), \\vec{IM} = (3; 4).","3(x − 4) + 4(y − 3) = 0, hay 3x + 4y − 24 = 0."],"diagram":"lineCircle"}],"visuals":[],"table":[],"diagrams":["lineCircle"]},{"title":"Elip, hypebol và parabol","intro":"Dạng chuẩn: elip có tổng khoảng cách đến hai tiêu điểm không đổi; hypebol có trị tuyệt đối hiệu không đổi; parabol cách đều tiêu điểm và đường chuẩn.","formulas":"Elip \\frac{x²}{a²} + \\frac{y²}{b²} = 1; hypebol \\frac{x²}{a²} − \\frac{y²}{b²} = 1; parabol y² = 2px","short":"","notes":[["","","Elip có tổng khoảng cách đến hai tiêu điểm không đổi. Hypebol có độ lớn của hiệu khoảng cách không đổi. Parabol gồm các điểm cách đều tiêu điểm và đường chuẩn.","Elip: \\frac{x²}{a²}+\\frac{y²}{b²}=1, c²=a²−b² // Hypebol: \\frac{x²}{a²}−\\frac{y²}{b²}=1, c²=a²+b² // Parabol: y²=2px, p>0"]],"methods":[{"title":"Elip, hypebol và parabol","lead":"Elip có tổng khoảng cách đến hai tiêu điểm không đổi. Hypebol có độ lớn của hiệu khoảng cách không đổi. Parabol gồm các điểm cách đều tiêu điểm và đường chuẩn.","steps":["Nhận dạng theo dấu và số hạng bình phương","Đọc hệ số","Tìm tiêu điểm hoặc đường chuẩn theo loại đường"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Ba đường conic",["Elip giữ tổng khoảng cách đến hai tiêu điểm. Hypebol giữ độ lớn hiệu hai khoảng cách.","Parabol có khoảng cách đến tiêu điểm bằng khoảng cách đến đường chuẩn."],""]],"diagrams":["conics"]}],"g10-c8":[{"title":"Quy tắc đếm","intro":"Cộng số cách của các trường hợp rời nhau. Nhân số cách qua các bước liên tiếp khi mỗi lựa chọn ở bước trước có cùng số cách đi tiếp.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[],"diagrams":["binomialRoute"]},{"title":"Hoán vị, chỉnh hợp và tổ hợp","intro":"Hoán vị xếp tất cả n phần tử; chỉnh hợp chọn k có thứ tự; tổ hợp chọn k không xét thứ tự.","formulas":"P_{n} = n!; A_{n}^{k} = \\frac{n!}{(n−k)!}; C_{n}^{k} = \\frac{n!}{k!(n−k)!}","short":"","notes":[["","Quy tắc đếm, hoán vị, chỉnh hợp, tổ hợp","Cộng các trường hợp rời nhau. Nhân số cách của các bước liên tiếp. Hoán vị xếp tất cả; chỉnh hợp chọn có thứ tự; tổ hợp chọn không thứ tự.","P_n=n! // A_{n}^{k}=\\frac{n!}{(n−k)!} // C_{n}^{k}=\\frac{n!}{k!(n−k)!}"],["cách làm","Đếm có thứ tự và dùng biến cố đối","Xếp vị trí hoặc phân vai làm thứ tự quan trọng; chỉ chọn nhóm thì không. Với “ít nhất một”, thường đếm tất cả trừ trường hợp không có.","A_{n}^{k}=k!C_{n}^{k}"]],"methods":[{"title":"Quy tắc đếm, hoán vị, chỉnh hợp, tổ hợp","lead":"Cộng các trường hợp rời nhau. Nhân số cách của các bước liên tiếp. Hoán vị xếp tất cả; chỉnh hợp chọn có thứ tự; tổ hợp chọn không thứ tự.","steps":["Xác định đang chọn hay xếp","Hỏi đổi chỗ hai phần tử có tạo kết quả mới không","Loại đếm trùng"],"example":"","tip":"","worked":[]},{"title":"Đếm có thứ tự và dùng biến cố đối","lead":"Xếp vị trí hoặc phân vai làm thứ tự quan trọng; chỉ chọn nhóm thì không. Với “ít nhất một”, thường đếm tất cả trừ trường hợp không có.","steps":["Chọn đơn vị đếm","Kiểm tra trùng khi đổi chỗ","Nếu đếm trực tiếp rối, đếm phần bù"],"example":"","tip":"","worked":[]},{"title":"Khi thứ tự tạo ra kết quả khác","lead":"","steps":[],"example":"","tip":"","worked":[["Khi thứ tự tạo ra kết quả khác","Từ 8 học sinh, chọn một trưởng nhóm và một thư ký, mỗi bạn chỉ giữ một vai. Có bao nhiêu cách?",["Chọn trưởng nhóm trước, có 8 cách.","Còn 7 người cho vai thư ký.","Hai vai phân biệt nên nhân 8 × 7, không chia đôi."],"56 cách.",""]]},{"title":"Đếm số có chữ số đầu khác 0 và các chữ số phân biệt","lead":"","steps":["Chọn chữ số đầu từ các chữ số khác 0.","Mỗi vị trí sau dùng một chữ số còn lại.","Nhân số cách ở các bước."],"example":"","worked":[],"tip":"","practice":["Từ các chữ số 0, 1, 2, 3, 4, lập được bao nhiêu số tự nhiên có ba chữ số phân biệt?","Chữ số hàng trăm có 4 cách. Sau đó vẫn có thể dùng 0.","4·4·3 = 48 số."]}],"visuals":[],"table":[],"core":[["Thứ tự và số phần tử",["Hoán vị xếp đủ n phần tử. Chỉnh hợp chọn k phần tử có thứ tự. Tổ hợp chọn k phần tử không xét thứ tự."],"P_n = n! // A_n^k = \\frac{n!}{(n−k)!} // C_n^k = \\frac{n!}{k!(n−k)!}"]]},{"title":"Nhị thức Newton","intro":"Số hạng chứa a mũ n − k và b mũ k có hệ số tổ hợp. Tính dấu của b mũ k khi b âm.","formulas":"Số hạng thứ k + 1 = C_{n}^{k}a^{n−k}b^{k}; k = 0, …, n","short":"","notes":[["","","Trong (a+b)ⁿ, hạng thứ k+1 có lũy thừa a giảm và b tăng, tổng số mũ là n. Nếu b chứa dấu âm, dấu phụ thuộc k.","T_{k+1}=C_{n}^{k}a^{n−k}b^{k}; 0≤k≤n"]],"methods":[{"title":"Nhị thức Newton","lead":"Trong (a+b)ⁿ, hạng thứ k+1 có lũy thừa a giảm và b tăng, tổng số mũ là n. Nếu b chứa dấu âm, dấu phụ thuộc k.","steps":["Viết số hạng tổng quát","Đồng nhất số mũ cần tìm","Thay k rồi tính hệ số"],"example":"","tip":"","worked":[]},{"title":"Tìm hệ số của một lũy thừa trong khai triển Newton","lead":"Bậc của x trong số hạng tổng quát phụ thuộc chỉ số chọn.","steps":["Viết số hạng tổng quát theo k.","Giải phương trình số mũ của x bằng bậc cần tìm, kiểm tra 0 ≤ k ≤ n.","Thay k để lấy hệ số, giữ dấu của hằng số."],"example":"Hệ số x³ trong (2x − 1)^5 là C_5^3·2³·(−1)² = 80.","worked":[],"tip":""}],"visuals":[],"table":[]}],"g10-c9":[{"title":"Không gian mẫu và biến cố","intro":"Ω là tập mọi kết quả; A là tập các kết quả thuận lợi cho biến cố. Kiểm tra đồng khả năng trước khi chia.","formulas":"P(A) = \\frac{n(A)}{n(Ω)}; 0 ≤ P(A) ≤ 1","short":"","notes":[["","Kết quả, biến cố và xác suất","Một kết quả có thể chắc chắn, không thể hoặc có thể xảy ra. Xác suất cổ điển dùng các kết quả đồng khả năng; xác suất thực nghiệm dùng số lần quan sát được.","P(A)=\\frac{số kết quả thuận lợi}{số kết quả đồng khả năng} // Tần suất A = \\frac{số lần A xảy ra}{số lần thử}"]],"methods":[{"title":"Kết quả, biến cố và xác suất","lead":"Một kết quả có thể chắc chắn, không thể hoặc có thể xảy ra. Xác suất cổ điển dùng các kết quả đồng khả năng; xác suất thực nghiệm dùng số lần quan sát được.","steps":["Liệt kê kết quả hoặc đọc bảng thử nghiệm","Xác định mẫu số đúng","Đếm kết quả thỏa yêu cầu"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Không gian mẫu",["Đếm số kết quả sơ cấp đồng khả năng trong Ω. A là một tập con của Ω."],"P(A) = \\frac{n(A)}{n(Ω)}"]],"diagrams":["dice"]},{"title":"Biến cố đối","intro":"Dùng khi đếm phần không thỏa dễ hơn, nhất là “ít nhất một”.","formulas":"P(A đối) = 1 − P(A)","short":"","notes":[],"methods":[{"title":"Dùng biến cố đối","lead":"","steps":[],"example":"","tip":"","worked":[["Dùng biến cố đối","Một hộp có 4 bi đỏ, 6 bi trắng. Lấy đồng thời 2 bi. Tính xác suất có ít nhất một bi đỏ.",["Có C_{10}^2 = 45 cặp đồng khả năng.","Biến cố đối là cả hai trắng, có C_{6}^2 = 15 cặp.","Lấy 1 − \\frac{15}{45}."],"\\frac{2}{3}.",""]]}],"visuals":[],"table":[]},{"title":"Đếm trong mô hình","intro":"Phân biệt kết quả có thứ tự với tổ hợp. Tử số và mẫu số phải cùng cách đếm. Hợp đếm phần giao một lần.","formulas":"n(A ∪ B) = n(A) + n(B) − n(A ∩ B)","short":"","notes":[["cách làm","Tử và mẫu phải dùng cùng cách đếm","Nếu mẫu là cặp có thứ tự, tử cũng đếm cặp có thứ tự. Hai loại kết quả tổng hợp có thể không đồng khả năng dù các kết quả cơ bản đồng khả năng.","P(A đối)=1−P(A)"]],"methods":[{"title":"Tử và mẫu phải dùng cùng cách đếm","lead":"Nếu mẫu là cặp có thứ tự, tử cũng đếm cặp có thứ tự. Hai loại kết quả tổng hợp có thể không đồng khả năng dù các kết quả cơ bản đồng khả năng.","steps":["Liệt kê Ω hoặc tính bằng quy tắc đếm","Đếm phần thuận lợi cùng kiểu","So kết quả với 0 và 1"],"example":"","tip":"","worked":[]},{"title":"Đếm xác suất lấy đúng một vật thuộc nhóm","lead":"Đếm cả tử và mẫu theo cùng quy ước, chẳng hạn chọn đồng thời không xét thứ tự.","steps":["Tính tổng số cách chọn.","Chọn đúng một vật nhóm cần xét và số còn lại từ nhóm khác.","Nhân hai số cách thuận lợi rồi chia cho tổng."],"example":"Túi có 5 bi xanh, 3 bi vàng. Lấy đồng thời 2 bi, xác suất đúng một vàng là 3·\\frac{5}{C_8^2} = \\frac{15}{28}.","worked":[],"tip":""},{"title":"Đếm xác suất hai vật cùng loại","lead":"","steps":["Đếm mọi cặp không xét thứ tự.","Đếm riêng cặp cùng mỗi loại rồi cộng vì các trường hợp rời nhau.","Chia cho tổng số cặp."],"example":"","worked":[],"tip":"","practice":["Có 4 thẻ xanh và 3 thẻ đỏ. Chọn đồng thời 2 thẻ. Tính xác suất hai thẻ cùng màu.","Có 6 cặp xanh và 3 cặp đỏ trong 21 cặp đồng khả năng.","Xác suất bằng \\frac{9}{21} = \\frac{3}{7}."]}],"visuals":[],"table":[]}],"g11-c1":[{"title":"Góc lượng giác và số đo","intro":"Chọn một tia đầu và một tia cuối. Quay ngược chiều kim đồng hồ là chiều dương, quay theo chiều kim đồng hồ là chiều âm. Hai góc cùng tia đầu và tia cuối có số đo sai khác một bội của 2π. Với cung dài s trên đường tròn bán kính R, góc ở tâm có độ lớn \\frac{s}{R} rađian.","formulas":"180° = π rad // 360° = 2π rad","short":"","notes":[["","","","180°=π rad; α=\\frac{s}{R} theo rađian"]],"methods":[{"title":"Đổi độ, rađian và tìm điểm cuối của góc","lead":"Góc lượng giác có chiều dương hoặc âm. Hai góc cùng điểm cuối sai khác bội nguyên 2π. Tọa độ điểm cuối trên đường tròn đơn vị là (cos α; sin α).","steps":["Đổi đơn vị nếu cần","Rút về một vòng","Xác định góc phần tư và dấu"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Đường tròn lượng giác và các giá trị","intro":"Trên đường tròn đơn vị, điểm cuối của góc x có hoành độ cos x và tung độ sin x. Vì bán kính bằng 1, tổng bình phương hai tọa độ luôn bằng 1. Dấu của hai giá trị lấy theo góc phần tư của điểm cuối.","formulas":"sin²x + cos²x = 1 // tan x = \\frac{sin x}{cos x} khi cos x ≠ 0 // cot x = \\frac{cos x}{sin x} khi sin x ≠ 0","short":"","notes":[],"methods":[],"visuals":[1],"table":[],"core":[["Hệ thức liên kết",["Xét đối xứng trên đường tròn lượng giác để kiểm tra dấu. Các tỉ số có mẫu khác 0."],"sin(−x) = −sin x // cos(−x) = cos x // sin(π−x) = sin x // cos(π−x) = −cos x"]]},{"title":"Công thức cộng","intro":"Dùng công thức cộng khi gặp tổng hoặc hiệu của hai góc. Ở công thức sin, dấu giữa hai tích giữ như dấu của góc. Ở công thức cos, dấu đổi chiều.","formulas":"sin(a ± b) = sin a cos b ± cos a sin b // cos(a ± b) = cos a cos b ∓ sin a sin b","short":"","notes":[],"methods":[{"title":"Biến đổi biểu thức bằng công thức lượng giác","lead":"Công thức cộng suy ra công thức nhân đôi và biến đổi tích–tổng. Sin của tổng giữ dấu giữa hai tích; cos của tổng đổi dấu giữa hai tích.","steps":["Xem đề cần hạ bậc, gộp góc hay tách góc","Chọn công thức phù hợp","Kiểm tra mẫu khác 0 trước khi chia"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Nhân đôi, hạ bậc và đổi tích thành tổng","intro":"Đặt hai góc bằng nhau trong công thức cộng để có công thức nhân đôi. Đọc ngược công thức cos 2x để đổi sin²x hoặc cos²x sang biểu thức bậc nhất theo cos 2x.","formulas":"sin 2x = 2 sin x cos x // cos 2x = cos²x − sin²x = 1 − 2 sin²x = 2 cos²x − 1 // sin²x = \\frac{1 − cos 2x}{2} // cos²x = \\frac{1 + cos 2x}{2} // 2 cos a cos b = cos(a + b) + cos(a − b) // 2 sin a sin b = cos(a − b) − cos(a + b) // 2 sin a cos b = sin(a + b) + sin(a − b)","short":"","notes":[],"methods":[],"visuals":[],"table":[],"core":[["Tổng thành tích",["Dùng trung bình và nửa hiệu hai góc làm đối số."],"sin a + sin b = 2 sin(\\frac{a+b}{2}) cos(\\frac{a−b}{2}) // cos a − cos b = −2 sin(\\frac{a+b}{2}) sin(\\frac{a−b}{2})"]]},{"title":"Hàm số lượng giác","intro":"Hàm tuần hoàn lặp lại đồ thị sau một khoảng dịch chuyển cố định. Đọc bảng dưới đây để chọn đúng miền xác định, tập giá trị và chu kì của từng hàm.","formulas":"","short":"","notes":[],"methods":[{"title":"Xét tính chẵn, lẻ và chu kì của hàm lượng giác","lead":"Sin và cos xác định trên ℝ, tập giá trị [−1;1]. Sin lẻ, cos chẵn. Tan và cot lẻ và có chu kì π. Tan loại \\frac{π}{2}+kπ; cot loại kπ.","steps":["Ghi miền trước","Xét f(−x)","Kiểm tra phép tịnh tiến nhỏ nhất dương"],"example":"","tip":"","worked":[]},{"title":"Tìm tập xác định của hàm lượng giác","lead":"Các biểu thức tan, cot và phân thức có điều kiện riêng.","steps":["Đổi tan, cot về điều kiện mẫu khác 0.","Gộp thêm điều kiện từ các mẫu hoặc căn khác nếu có.","Giải phương trình làm mẫu bằng 0 rồi loại mọi nghiệm."],"example":"y = tan(2x) xác định khi cos 2x ≠ 0, tức x ≠ \\frac{π}{4} + \\frac{kπ}{2}, k ∈ ℤ.","worked":[],"tip":""},{"title":"Tìm biên độ và khoảng giá trị của hàm dạng sin","lead":"Tách hệ số nhân trước sin khỏi hằng số dịch chuyển theo trục tung.","steps":["Viết −1 ≤ sin u ≤ 1.","Sau nhân với A, biên độ là ∣A∣. Cộng B để có khoảng [B − ∣A∣; B + ∣A∣].","Kiểm tra đối số u có đạt giá trị để sin bằng ±1 trên miền đề cho không."],"example":"Trên ℝ, y = 3 − 2 sin(2x) nhận mọi giá trị từ 1 đến 5.","worked":[],"tip":""}],"visuals":[],"table":[["Hàm","Tập xác định","Tập giá trị","Tính chẵn lẻ","Chu kì"],["sin x","ℝ","[−1; 1]","Lẻ","2π"],["cos x","ℝ","[−1; 1]","Chẵn","2π"],["tan x","x ≠ \\frac{π}{2} + kπ","ℝ","Lẻ","π"],["cot x","x ≠ kπ","ℝ","Lẻ","π"]],"diagrams":["sinGraphBu"]},{"title":"Phương trình lượng giác","intro":"Với sin và cos, trước hết kiểm tra vế phải có thuộc [−1; 1] không. Với tan và cot, cần giữ điều kiện xác định. Viết họ nghiệm với k ∈ ℤ, sau đó lọc nghiệm theo khoảng đề cho nếu có.","formulas":"sin x = sin α ⇒ x = α + 2kπ hoặc x = π − α + 2kπ // cos x = cos α ⇒ x = ±α + 2kπ // tan x = tan α hoặc cot x = cot α ⇒ x = α + kπ","short":"","notes":[["phương pháp","Phương trình a sin x + b cos x = c","Hai hệ số a và b cùng quyết định biên độ. Khi gom hai số hạng thành một hàm sin có góc lệch φ, chỉ còn một phương trình lượng giác cơ bản. Dùng rađian trong các công thức dưới đây.","R = \\sqrt{a²+b²} // Nếu R > 0, chọn cos φ = \\frac{a}{R} và sin φ = \\frac{b}{R} // a sin x + b cos x = R sin(x + φ) // Nếu ∣c∣ ≤ R, đặt α = arcsin(\\frac{c}{R}) ∈ [−\\frac{π}{2}; \\frac{π}{2}] // x = α − φ + 2kπ, k ∈ ℤ // x = π − α − φ + 2kπ, k ∈ ℤ"],["tính chất","Đọc nghiệm từ đồ thị lượng giác","Nghiệm của f(x) = c là hoành độ giao điểm của đồ thị y = f(x) và đường ngang y = c. Với hàm sin đã đổi pha và R > 0, trên một chu kì nửa kín có hai giao điểm khi ∣c∣ < R, một giao điểm khi ∣c∣ = R, và không có giao điểm khi ∣c∣ > R.","Giá trị lớn nhất = R // Giá trị nhỏ nhất = −R // Chu kì = 2π"]],"methods":[{"title":"Giải phương trình sin, cos, tan và cot cơ bản","lead":"Sin và cos bằng a chỉ có nghiệm khi ∣a∣≤1. Tan và cot cho một họ nghiệm modulo π. Khi đề hỏi trên đoạn, lọc k theo cả hai đầu mút.","steps":["Đưa về dạng cơ bản và đặt điều kiện","Viết mọi họ nghiệm","Lọc k nguyên"],"example":"","tip":"","worked":[]},{"title":"Giải phương trình a sin x + b cos x = c","lead":"Hai hệ số a và b cùng quyết định biên độ. Khi gom hai số hạng thành một hàm sin có góc lệch φ, chỉ còn một phương trình lượng giác cơ bản. Dùng rađian trong các công thức dưới đây.","steps":["Tính R = \\sqrt{a²+b²}. Nếu R = 0, phương trình trở thành 0 = c. Mọi x trong phạm vi đề cho đều là nghiệm khi c = 0; nếu c ≠ 0 thì vô nghiệm.","Khi R > 0, so sánh ∣c∣ với R. Nếu ∣c∣ > R thì dừng vì vế trái nằm trong [−R; R].","Chọn góc φ sao cho cos φ = \\frac{a}{R} và sin φ = \\frac{b}{R}. Dùng dấu của cả hai tỉ số để chọn đúng góc phần tư.","Dùng công thức cộng để viết a sin x + b cos x = R sin(x + φ), rồi chia hai vế cho R.","Chọn α ∈ [−\\frac{π}{2}; \\frac{π}{2}] sao cho sin α = \\frac{c}{R}. Hai họ nghiệm là x = α − φ + 2kπ và x = π − α − φ + 2kπ với k ∈ ℤ. Nếu ∣c∣ = R, hai họ trùng nhau theo chu kì nên ghi một họ.","Nếu đề giới hạn x trong một khoảng, thế từng họ nghiệm vào điều kiện hai đầu mút để tìm k nguyên. Đầu mút đóng thì lấy, đầu mút mở thì loại."],"example":"","tip":"Ở mức c = 0 và R > 0, giải sin(x + φ) = 0 gọn thành x = −φ + kπ.","worked":[["Giải a sin x + b cos x = c bằng đổi pha","Giải 3 sin x + 3 cos x = 3 trên [0; 2π).",["Tính R = \\sqrt{3²+3²} = 3\\sqrt{2}. Vì R > 0 và ∣3∣ < R, ta chia được hai vế cho R.","Chọn φ sao cho cos φ = \\frac{3}{R} = \\frac{\\sqrt{2}}{2} và sin φ = \\frac{3}{R} = \\frac{\\sqrt{2}}{2}. Cả hai đều dương, lấy φ = \\frac{π}{4}.","Dùng sin(x + φ) = sin x cos φ + cos x sin φ. Khi đó vế trái bằng 3\\sqrt{2} sin(x + \\frac{π}{4}).","Giải sin(x + \\frac{π}{4}) = \\frac{\\sqrt{2}}{2}. Đặt t = x + \\frac{π}{4}, ta có t = \\frac{π}{4} + 2kπ hoặc t = \\frac{3π}{4} + 2kπ với k ∈ ℤ.","Trừ \\frac{π}{4} ở cả hai họ. Ta được x = 2kπ hoặc x = \\frac{π}{2} + 2kπ.","Lọc [0; 2π). Mỗi họ chỉ giữ k = 0. Thử lại x = 0 và x = \\frac{π}{2} đều cho vế trái bằng 3."],"x ∈ {0; \\frac{π}{2}}.","Khoảng [0; 2π) lấy 0 và loại 2π. Khi chọn φ phải thỏa đồng thời sin và cos."],["Chọn góc pha khi hệ số cos âm","Giải 2 sin x − 2\\sqrt{3} cos x = 2 trên ℝ.",["R = \\sqrt{2²+(−2\\sqrt{3})²} = 4.","Cos φ = \\frac{1}{2} và sin φ = −\\frac{\\sqrt{3}}{2}, nên chọn φ = −\\frac{π}{3}.","Chia hai vế cho 4, được sin(x − \\frac{π}{3}) = \\frac{1}{2}.","Đặt t = x − \\frac{π}{3}. Khi đó t = \\frac{π}{6} + 2kπ hoặc t = \\frac{5π}{6} + 2kπ.","Cộng \\frac{π}{3} vào cả hai họ để trở về x."],"x = \\frac{π}{2} + 2kπ hoặc x = \\frac{7π}{6} + 2kπ, k ∈ ℤ.",""],["Nhìn biên độ để biết số nghiệm","So sánh nghiệm của 3 sin x − 4 cos x = 6 và 3 sin x − 4 cos x = 5 trên một chu kì [0; 2π).",["R = \\sqrt{3²+(−4)²} = 5. Sau đổi pha, vế trái có giá trị trong [−5; 5].","Mức 6 ở ngoài khoảng giá trị, nên phương trình đầu vô nghiệm.","Mức 5 đạt khi sin(x + φ) = 1, tương đương x + φ = \\frac{π}{2} + 2kπ. Mỗi chu kì nửa kín lấy đúng một nghiệm."],"Phương trình đầu có 0 nghiệm. Phương trình sau có 1 nghiệm.",""]]},{"title":"Đọc nghiệm từ đồ thị lượng giác","lead":"Nghiệm của f(x) = c là hoành độ giao điểm của đồ thị y = f(x) và đường ngang y = c. Với hàm sin đã đổi pha và R > 0, trên một chu kì nửa kín có hai giao điểm khi ∣c∣ < R, một giao điểm khi ∣c∣ = R, và không có giao điểm khi ∣c∣ > R.","steps":["Vẽ hoặc hình dung dải giá trị [−R; R]","Đặt đường ngang y = c","Đếm giao điểm trong đúng khoảng đề cho"],"example":"Trên khoảng dài ngắn khác một chu kì, cần lọc từng họ nghiệm để đếm.","tip":"","worked":[["Đếm hai giao điểm","Trên một chu kì [0; 2π), phương trình sin x = 0,5 có bao nhiêu nghiệm?",["Đường ngang y = 0,5 nằm giữa trục hoành và đỉnh đầu tiên của đồ thị.","Nó cắt nhánh tăng một lần và nhánh giảm một lần trong (0; π). Nửa chu kì còn lại có sin x ≤ 0."],"Có hai nghiệm, x = \\frac{π}{6} và x = \\frac{5π}{6}.",""]],"diagram":"sinGraphBu"},{"title":"Giải phương trình về một hàm bằng hạ bậc hoặc đặt ẩn phụ","lead":"Nếu chỉ còn một hàm lượng giác và lũy thừa của nó, có thể đặt ẩn phụ.","steps":["Dùng hệ thức cơ bản hoặc hạ bậc để đưa về một hàm.","Đặt t bằng hàm đó, kèm điều kiện như −1 ≤ t ≤ 1 đối với sin và cos.","Giải theo t rồi giải lượng giác theo x cho từng giá trị được giữ."],"example":"2sin²x − sin x − 1 = 0 cho t = 1 hoặc t = −\\frac{1}{2}. Trên [0; 2π), x ∈ {\\frac{π}{2}; \\frac{7π}{6}; \\frac{11π}{6}}.","worked":[],"tip":""},{"title":"Giải bài toán thời điểm bằng hàm tuần hoàn","lead":"Thời điểm đạt một mức cho trước tương ứng giao điểm với một đường ngang.","steps":["Ghi đơn vị của thời gian, chu kì và khoảng cần xét.","Thay mức vào hàm và giải phương trình lượng giác.","Lọc các thời điểm trong một chu kì hoặc trong khoảng thực tế, rồi đổi đơn vị nếu đề yêu cầu."],"example":"h(t) = 5 + 2 sin(\\frac{πt}{6}), với t tính bằng giờ. Trên [0;12), h(t) = 6 tại t = 1 và t = 5 giờ.","worked":[],"tip":""},{"title":"Lọc họ nghiệm lượng giác trong đoạn nửa kín","lead":"","steps":["Giải phương trình cơ bản và ghi đầy đủ chu kì.","Thế từng họ vào hai điều kiện đầu mút để kẹp k.","Giữ các k nguyên rồi loại trùng nếu có."],"example":"","worked":[],"tip":"","practice":["Giải sin 2x = \\frac{1}{2} trên [0; π).","Đặt t = 2x, khi đó t ∈ [0; 2π).","t = \\frac{π}{6} hoặc \\frac{5π}{6}; do đó x = \\frac{π}{12} hoặc \\frac{5π}{12}."]}],"visuals":[0],"table":[]}],"g11-c2":[{"title":"Dãy số","intro":"Có thể cho bằng công thức số hạng tổng quát hoặc truy hồi. Để xét tăng, giảm, so hai số hạng liên tiếp.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Cấp số cộng","intro":"Hiệu hai số hạng liên tiếp bằng công sai d. Số hạng ở giữa là trung bình của hai số hạng cách đều chỉ số.","formulas":"u_{n} = u₁ + (n−1)d; S_{n} = \\frac{n(u₁ + uₙ)}{2}","short":"","notes":[["cách làm","Tìm công sai hoặc công bội từ hai số hạng","Cấp số cộng có hiệu giữa hai số hạng bằng số bước nhân d. Với cấp số nhân, tỉ số bằng q mũ số bước nếu số hạng làm mẫu khác 0. Với khoảng cách chẵn, có thể có hai dấu của q.","u_j−u_i=(j−i)d; \\frac{u_j}{u_i}=q^{j−i}"]],"methods":[{"title":"Tìm công sai hoặc công bội từ hai số hạng","lead":"Cấp số cộng có hiệu giữa hai số hạng bằng số bước nhân d. Với cấp số nhân, tỉ số bằng q mũ số bước nếu số hạng làm mẫu khác 0. Với khoảng cách chẵn, có thể có hai dấu của q.","steps":["Đếm số bước giữa hai chỉ số","Lập hiệu hoặc tỉ số","Giải và kiểm tra dấu"],"example":"","tip":"","worked":[]},{"title":"Tìm cấp số cộng từ hai số hạng","lead":"","steps":[],"example":"","tip":"","worked":[["Tìm cấp số cộng từ hai số hạng","Một cấp số cộng có u_3 = 11 và u_7 = 27. Tính u_1 và S_{10}.",["Từ số hạng 3 tới 7 có 4 bước nên 4d = 27 − 11, được d = 4.","u_1 = u_3 − 2d = 3 và u_{10} = 3 + 9·4 = 39.","Ghép số đầu và số cuối trong công thức tổng, S_{10} = 10\\frac{3 + 39}{2}."],"u_1 = 3 và S_{10} = 210.",""]]},{"title":"Dùng tổng cách đều để tìm số hạng giữa","lead":"","steps":["Xác định chỉ số trung điểm của hai số hạng cách đều.","Dùng công sai để thấy phần tăng và giảm triệt tiêu.","Áp dụng trung bình cộng cho số hạng giữa."],"example":"","worked":[],"tip":"","practice":["Trong cấp số cộng, u_3 = 7 và u_9 = 25. Tìm u_6.","Chỉ số 6 cách đều 3 và 9.","u_6 = \\frac{7+25}{2} = 16."]}],"visuals":[],"table":[],"core":[["Công sai và tổng",["Cấp số cộng giữ hiệu của hai số hạng liên tiếp. Ghép số hạng đầu và cuối để tính tổng."],"u_n = u_1 + (n−1)d // S_n = \\frac{n(u_1+u_n)}{2}"]]},{"title":"Cấp số nhân","intro":"Mỗi số hạng sau bằng số trước nhân công bội q. Khi q = 1, tổng bằng nu₁.","formulas":"u_{n} = u₁q^{n−1}; S_{n} = \\frac{u₁(1 − qⁿ)}{1 − q} khi q ≠ 1","short":"","notes":[["","Dãy số, cấp số cộng và cấp số nhân","Dãy số có thể cho bằng công thức tường minh hoặc truy hồi. Cấp số cộng giữ hiệu d; cấp số nhân giữ hệ số nhân q. Số hạng đầu là u₁.","CSC: u_n=u₁+(n−1)d; S_n=\\frac{n(u₁+uₙ)}{2} // CSN: u_n=u₁q^{n−1}; S_n=\\frac{u₁(1−qⁿ)}{1−q}, q≠1"]],"methods":[{"title":"Dãy số, cấp số cộng và cấp số nhân","lead":"Dãy số có thể cho bằng công thức tường minh hoặc truy hồi. Cấp số cộng giữ hiệu d; cấp số nhân giữ hệ số nhân q. Số hạng đầu là u₁.","steps":["Tìm u₁ và công sai hoặc công bội","Đọc đúng chỉ số n","Chọn công thức số hạng hay tổng"],"example":"","tip":"","worked":[]},{"title":"Tính tổng cấp số nhân khi biết số hạng đầu","lead":"Mỗi số hạng gấp số trước cùng một hệ số q.","steps":["Viết số hạng tổng quát u_n = u_1 q^{n−1}.","Nếu q ≠ 1, dùng S_n = u_1\\frac{1 − q^n}{1 − q}. Nếu q = 1, dùng S_n = nu_1.","Kiểm tra đã đếm đúng số hạng."],"example":"Với u_1 = 3, q = 2, tổng 5 số hạng đầu là 3(2⁵ − 1) = 93.","worked":[],"tip":""}],"visuals":[],"table":[]}],"g11-c3":[{"title":"Mẫu ghép nhóm và trung bình","intro":"Giá trị đại diện xᵢ là trung điểm nhóm. Dùng tần số nᵢ làm trọng số, N là tổng tần số.","formulas":"x̄ = \\frac{n₁x₁ + … + nₖxₖ}{N}","short":"","notes":[["","Tần số và mẫu ghép nhóm","Tần số đếm số lần; tần số tương đối chia cho cỡ mẫu. Nhóm [a;b) lấy đầu trái và loại đầu phải. Giá trị đại diện là trung điểm khoảng.","f=\\frac{n}{N}; xᵢ=\\frac{aᵢ+bᵢ}{2}"]],"methods":[{"title":"Tần số và mẫu ghép nhóm","lead":"Tần số đếm số lần; tần số tương đối chia cho cỡ mẫu. Nhóm [a;b) lấy đầu trái và loại đầu phải. Giá trị đại diện là trung điểm khoảng.","steps":["Đếm mỗi giá trị vào đúng một nhóm","Tính cỡ mẫu và tần số","Đổi ra phần trăm nếu cần"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Giá trị đại diện",["Dùng trung điểm của mỗi nhóm. Trung bình ghép nhóm là trung bình có trọng số theo tần số."],"x̄ = \\frac{n_1c_1+⋯+n_kc_k}{n}"]],"diagrams":["histogram"]},{"title":"Trung vị và tứ phân vị","intro":"Tìm nhóm chứa vị trí \\frac{N}{4}, \\frac{N}{2} hoặc \\frac{3N}{4} theo tần số tích lũy. L là đầu trái, h là độ rộng, F là tần số tích lũy trước nhóm, f là tần số của nhóm.","formulas":"Q_{p} = L + \\frac{pN − F}{f}·h với p = \\frac{1}{4}, \\frac{1}{2}, \\frac{3}{4}","short":"","notes":[["cách làm","Tìm đúng lớp chứa trung vị hoặc tứ phân vị","Dùng tần số tích lũy, không chọn nhóm có tần số lớn nhất trừ khi đang tìm mốt. Đọc F ở ngay trước nhóm chứa vị trí cần tìm.","Q_p=L+\\frac{pN−F}{f}·h"]],"methods":[{"title":"Tìm đúng lớp chứa trung vị hoặc tứ phân vị","lead":"Dùng tần số tích lũy, không chọn nhóm có tần số lớn nhất trừ khi đang tìm mốt. Đọc F ở ngay trước nhóm chứa vị trí cần tìm.","steps":["Tính N và tích lũy","Xác định nhóm bằng pN","Đọc đúng L, F, f, h và thế số"],"example":"","tip":"","worked":[]},{"title":"Ước lượng tứ phân vị từ tần số tích lũy","lead":"Vị trí Q_1, Q_2, Q_3 lần lượt theo \\frac{n}{4}, \\frac{n}{2}, \\frac{3n}{4} trong mẫu ghép nhóm.","steps":["Cộng tần số tích lũy để tìm nhóm chứa vị trí cần lấy.","Lấy hiệu giữa vị trí và tần số tích lũy trước nhóm, chia cho tần số của nhóm.","Nhân độ rộng nhóm rồi cộng đầu trái."],"example":"Nhóm [0;10), [10;20), [20;30) có tần số 4, 12, 4. Q_1 = 10 + (5 − 4)·\\frac{10}{12} ≈ 10,83.","worked":[],"tip":""},{"title":"Xác định lớp chứa trung vị","lead":"","steps":[],"example":"","tip":"","worked":[["Xác định lớp chứa trung vị","Ba lớp [0; 10), [10; 20), [20; 30) có tần số lần lượt 5, 12, 7. Ước lượng trung vị.",["Tổng n = 24, dùng vị trí \\frac{n}{2} = 12. Tần số tích lũy qua lớp đầu là 5, qua lớp thứ hai là 17.","Lớp trung vị là [10; 20). Lấy đầu lớp 10, độ rộng 10, tần số lớp 12 và tần số trước lớp 5.","Nội suy theo công thức M_e = 10 + (12 − 5)·\\frac{10}{12}."],"M_e ≈ 15,83.",""]]}],"visuals":[],"table":[],"core":[["Nội suy trong nhóm",["Tìm nhóm chứa vị trí \\frac{n}{4}, \\frac{n}{2} hoặc \\frac{3n}{4} bằng tần số tích lũy.","Gọi L là đầu trái, h là độ rộng, F là tần số tích lũy trước nhóm và f là tần số nhóm."],"Q_j = L + \\frac{\\frac{jn}{4}−F}{f}·h, j ∈ {1; 2; 3}"]]},{"title":"Mốt ghép nhóm","intro":"Với các nhóm cùng độ rộng, chọn nhóm có tần số lớn nhất. d₁, d₂ là chênh lệch của tần số nhóm mốt với nhóm trước và sau; lấy tần số ngoài biên bằng 0 nếu cần.","formulas":"M_{o} = L + \\frac{d₁}{d₁ + d₂}·h","short":"","notes":[["","Số đặc trưng đo xu thế trung tâm của mẫu ghép nhóm","Trung bình lấy trung điểm nhóm làm đại diện và dùng tần số làm trọng số. Tứ phân vị xác định nhóm qua tần số tích lũy. Nhóm mốt là nhóm tần số cao nhất trong bảng có cùng độ rộng nhóm.","x̄=\\frac{∑nᵢxᵢ}{N} // Q_p=L+\\frac{pN−F}{f}h (p=\\frac{1}{4}, \\frac{1}{2}, \\frac{3}{4}) // M_o=L+\\frac{d₁}{d₁+d₂}h"]],"methods":[{"title":"Số đặc trưng đo xu thế trung tâm của mẫu ghép nhóm","lead":"Trung bình lấy trung điểm nhóm làm đại diện và dùng tần số làm trọng số. Tứ phân vị xác định nhóm qua tần số tích lũy. Nhóm mốt là nhóm tần số cao nhất trong bảng có cùng độ rộng nhóm.","steps":["Lập cột trung điểm hoặc tần số tích lũy","Chọn đúng nhóm chứa vị trí","Đọc L, F, f, h từ nhóm đó"],"example":"","tip":"","worked":[]},{"title":"Ước lượng mốt từ ba lớp kề nhau","lead":"","steps":["Với các lớp cùng độ rộng, chọn lớp có tần số lớn nhất.","Lấy hai độ chênh so với tần số lớp trước và lớp sau.","Nội suy từ đầu trái lớp mốt theo công thức."],"example":"","worked":[],"tip":"","practice":["Ba lớp [0; 10), [10; 20), [20; 30) có tần số lần lượt 6, 12, 8. Tính mốt mẫu ghép nhóm.","Đầu trái lớp mốt là 10. Hai độ chênh là 6 và 4, độ rộng lớp là 10.","M_o = 10 + \\frac{6}{6+4}·10 = 16."]}],"visuals":[],"table":[]}],"g11-c4":[{"title":"Điểm, đường thẳng và mặt phẳng","intro":"Xác định mặt phẳng qua ba điểm không thẳng hàng, qua một đường và một điểm ngoài đường, hoặc qua hai đường cắt nhau hay song song. Hai mặt phẳng phân biệt có điểm chung thì cắt theo một đường thẳng.","formulas":"","short":"","notes":[["","","Hai điểm phân biệt xác định một đường. Ba điểm không thẳng hàng xác định một mặt. Nếu đường chứa hai điểm thuộc mặt thì đường nằm trong mặt. Hai mặt phân biệt có điểm chung thì cắt nhau theo một đường.","A,B ∈ (P), A≠B ⇒ AB ⊂ (P) // A,B ∈ (P)∩(Q), (P)≠(Q) ⇒ (P)∩(Q)=AB"],["cách làm","Giao tuyến, giao điểm và thiết diện","Giao tuyến cần hai điểm chung phân biệt. Muốn tìm d∩(P), chọn mặt phụ chứa d để biến thành giao hai đường đồng phẳng. Khi tìm thiết diện, nối các điểm chung trên cùng mặt của khối rồi đi lần lượt qua cạnh kề.","Nếu d⊂(Q) và (P)∩(Q)=a thì d∩(P)=d∩a khi cắt"],["khái niệm","Hình chóp và hình tứ diện","Hình chóp có một đáy đa giác và các mặt bên tam giác cùng chung đỉnh ngoài mặt đáy. Tứ diện được xác định bởi bốn điểm không đồng phẳng, có bốn mặt tam giác; chọn mặt nào làm đáy cũng được.","Tứ diện ABCD có 4 đỉnh, 6 cạnh và 4 mặt"]],"methods":[{"title":"Điểm, đường thẳng và mặt phẳng","lead":"Hai điểm phân biệt xác định một đường. Ba điểm không thẳng hàng xác định một mặt. Nếu đường chứa hai điểm thuộc mặt thì đường nằm trong mặt. Hai mặt phân biệt có điểm chung thì cắt nhau theo một đường.","steps":["Tìm hai điểm chung để dựng giao tuyến","Khi tìm giao điểm đường với mặt, đặt đường vào mặt phụ","Tìm giao tuyến rồi giao hai đường đồng phẳng"],"example":"","tip":"","worked":[]},{"title":"Giao tuyến, giao điểm và thiết diện","lead":"Giao tuyến cần hai điểm chung phân biệt. Muốn tìm d∩(P), chọn mặt phụ chứa d để biến thành giao hai đường đồng phẳng. Khi tìm thiết diện, nối các điểm chung trên cùng mặt của khối rồi đi lần lượt qua cạnh kề.","steps":["Tìm một điểm chung dễ thấy","Dựng điểm chung thứ hai hoặc đường giao phụ","Nối các đoạn đúng mặt"],"example":"Tứ diện ABCD: (ABC) và (ABD) cùng chứa A, B nên giao tuyến là AB.","tip":"","worked":[]},{"title":"Hình chóp và hình tứ diện","lead":"Hình chóp có một đáy đa giác và các mặt bên tam giác cùng chung đỉnh ngoài mặt đáy. Tứ diện được xác định bởi bốn điểm không đồng phẳng, có bốn mặt tam giác; chọn mặt nào làm đáy cũng được.","steps":["Nhận diện đỉnh và đáy","Viết mặt bên qua một cạnh đáy","Khi tìm giao tuyến, xét cạnh chung của hai mặt"],"example":"","tip":"","worked":[]},{"title":"Tìm giao tuyến của hai mặt phẳng","lead":"","steps":["Tìm một điểm chung A từ hình hoặc dữ kiện.","Tìm điểm chung thứ hai B khác A bằng cách xét hai đường đồng phẳng.","Nối A, B và kết luận (P) ∩ (Q) = AB."],"tip":"Hai mặt phẳng phải phân biệt.","example":"Trong tứ diện ABCD, (ABC) ∩ (ACD) = AC.","worked":[["Tìm hai điểm chung","Hai mặt phẳng (P), (Q) trong hình cùng chứa A và B, với A ≠ B. Xác định giao tuyến.",["Vì A, B cùng thuộc (P), cả đường AB nằm trong (P).","Tương tự, AB nằm trong (Q). Hai mặt phẳng phân biệt có giao tuyến là một đường thẳng."],"Giao tuyến là đường thẳng AB.",""]],"diagram":"crossPlane"}],"visuals":[],"table":[],"core":[["Điểm thuộc mặt và giao tuyến",["Nếu A và B phân biệt cùng thuộc hai mặt phẳng phân biệt thì AB là giao tuyến.","Để tìm d ∩ (P), chọn mặt phụ (Q) chứa d và xét giao của d với giao tuyến của (P), (Q)."],""]],"diagrams":["planePoints","planeIntersection","tetrahedron","practiceSection"]},{"title":"Hai đường trong không gian","intro":"Cắt nhau nếu có đúng một điểm chung. Song song nếu đồng phẳng và không có điểm chung. Chéo nhau nếu không đồng phẳng.","formulas":"","short":"","notes":[["định lí","Định lí ba giao tuyến","Nếu ba mặt phẳng phân biệt đôi một cắt nhau theo ba giao tuyến phân biệt thì ba giao tuyến hoặc đồng quy hoặc đôi một song song. Nếu hai mặt chứa hai đường song song, giao tuyến của hai mặt, khi có, song song với chúng hoặc trùng một trong hai.","a∥b, a⊂(P), b⊂(Q), (P)∩(Q)=d ⇒ d cùng phương với a,b"]],"methods":[{"title":"Chứng minh hai đường thẳng song song","lead":"","steps":["Dùng hình bình hành: hai cạnh đối song song.","Dùng đường trung bình: đoạn nối trung điểm hai cạnh tam giác song song và bằng một nửa cạnh thứ ba.","Dùng Thalès đảo: nếu E ∈ AB, F ∈ AC và \\frac{AE}{AB} = \\frac{AF}{AC} thì EF ∥ BC.","Trong không gian, nếu chứng minh hai đường không có điểm chung, cần chỉ ra chúng đồng phẳng."],"tip":"Tỉ lệ trọng tâm: AG = \\frac{2}{3}AM với trung tuyến AM.","example":"Nếu E, F là trung điểm của AB, AC thì cả hai tỉ số đều bằng \\frac{1}{2}. Suy ra EF ∥ BC.","worked":[["Hai tỉ số tương ứng bằng nhau","Trong tam giác ABC, E thuộc AB, F thuộc AC. Biết AE = 6 cm, AB = 10 cm, AF = 9 cm và AC = 15 cm. Chứng minh EF ∥ BC.",["Tính \\frac{AE}{AB} = \\frac{6}{10} = \\frac{3}{5}.","Tính \\frac{AF}{AC} = \\frac{9}{15} = \\frac{3}{5}. Hai tỉ số bằng nhau, xét định lí Thalès đảo trong tam giác ABC."],"EF ∥ BC.","So hai tỉ số trên hai cạnh tính từ cùng đỉnh A."]],"diagram":"thales"},{"title":"Định lí ba giao tuyến","lead":"Nếu ba mặt phẳng phân biệt đôi một cắt nhau theo ba giao tuyến phân biệt thì ba giao tuyến hoặc đồng quy hoặc đôi một song song. Nếu hai mặt chứa hai đường song song, giao tuyến của hai mặt, khi có, song song với chúng hoặc trùng một trong hai.","steps":["Tìm điểm chung của hai mặt","Tìm cặp đường cùng phương","Qua điểm chung dựng đường có phương ấy"],"example":"Với chóp S.ABCD đáy hình bình hành, (SAB)∩(SCD) là đường qua S song song AB.","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Ba vị trí của hai đường phân biệt",["Cắt nhau: một điểm chung. Song song: cùng mặt phẳng và không có điểm chung. Chéo nhau: không cùng mặt phẳng."],""]],"diagrams":["cubeLines"]},{"title":"Đường song song với mặt","intro":"Nếu d nằm ngoài (P) và song song với một đường thuộc (P) thì d ∥ (P). Đường nằm trong mặt có vô số điểm chung với mặt.","formulas":"","short":"","notes":[["định lí","Tách giả thiết và kết luận trong chứng minh song song","Dấu ∥ nói hai đối tượng song song. Dấu ⊂ cho biết đường nằm trong mặt phẳng. Để chứng minh đường d song song với (P), cần chỉ ra đường a nằm trong (P), d song song với a và d không nằm trong (P).","Giả thiết 1 · a ⊂ (P) // Giả thiết 2 · d ∥ a // Giả thiết 3 · d ⊄ (P) // Kết luận · d ∥ (P)"],["","Đường thẳng song song với mặt phẳng","Một đường có ba vị trí với mặt: nằm trong, cắt tại một điểm hoặc song song. Để chứng minh song song, tìm một đường trong mặt song song với đường đã cho và kiểm tra đường đã cho nằm ngoài mặt.","Nếu (Q) chứa d và cắt (P) theo giao tuyến a // d ∥ (P) ⇒ d ∥ a"]],"methods":[{"title":"Chứng minh đường thẳng song song với mặt phẳng","lead":"Dấu ∥ nói hai đối tượng song song. Dấu ⊂ cho biết đường nằm trong mặt phẳng. Để chứng minh đường d song song với (P), cần chỉ ra đường a nằm trong (P), d song song với a và d không nằm trong (P).","steps":["Chọn đường a nằm trong mặt phẳng đích. Trong bài tam giác, thử tìm đường trung bình để tạo hai đường song song.","Chỉ ra một điểm trên d ở ngoài (P). Có thể dựa vào giao điểm đã biết của một đường khác với (P).","Nêu đủ ba dữ kiện rồi mới áp dụng định lí."],"example":"","tip":"","worked":[["Đường trung bình và mặt phẳng","Trong tứ diện ABCD, M là trung điểm DA và N là trung điểm DB. Chứng minh MN song song (ABC).",["Xét riêng tam giác DAB. M và N là trung điểm của hai cạnh, nên MN ∥ AB.","AB nằm trong (ABC). M nằm trên DA nhưng khác A, trong khi DA chỉ gặp (ABC) tại A. Do đó M ở ngoài (ABC).","Vì MN chứa M, MN không nằm trong (ABC). Áp dụng dấu hiệu đường thẳng song song mặt phẳng."],"MN ∥ (ABC).","Kiểm tra MN có nằm trong mặt phẳng hay không trước khi kết luận."]]},{"title":"Đường thẳng song song với mặt phẳng","lead":"Một đường có ba vị trí với mặt: nằm trong, cắt tại một điểm hoặc song song. Để chứng minh song song, tìm một đường trong mặt song song với đường đã cho và kiểm tra đường đã cho nằm ngoài mặt.","steps":["Nhìn trong mặt cần chứng minh để chọn đường cùng phương","Chứng minh hai đường song song","Nêu rõ điều kiện ngoài mặt"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Điều kiện đường song song mặt",["Chọn đường a thuộc (P) và song song d. Kiểm tra d không nằm trong (P)."],"a ⊂ (P), d ∥ a, d ⊄ (P) ⇒ d ∥ (P)"]],"diagrams":["lineParallel"]},{"title":"Hai mặt phẳng song song","intro":"Nếu một mặt chứa hai đường cắt nhau cùng song song với mặt kia thì hai mặt song song. Mặt thứ ba cắt hai mặt song song theo hai giao tuyến song song.","formulas":"","short":"","notes":[["","","Hai mặt phân biệt song song khi không có điểm chung. Dấu hiệu: một mặt chứa hai đường cắt nhau cùng song song với mặt kia. Mặt thứ ba cắt hai mặt song song theo hai giao tuyến song song.","a,b⊂(P), a∩b={M}, a∥(Q), b∥(Q) ⇒ (P)∥(Q)"],["định lí","Giao tuyến của mặt cắt với hai mặt song song","Nếu mặt (R) cắt hai mặt song song (P), (Q), hai giao tuyến cùng nằm trong (R) và không thể gặp nhau, nên song song. Một đường song song với mặt chưa đủ để suy hai mặt song song.","(P)∥(Q), (R)∩(P)=a, (R)∩(Q)=b ⇒ a∥b"],["định lí","Thalès trong không gian","Ba mặt phẳng đôi một song song cắt hai đường thẳng tại A,B,C và A′,B′,C′ theo cùng thứ tự. Các đoạn tương ứng trên hai cát tuyến tỉ lệ.","\\frac{AB}{A′B′}=\\frac{BC}{B′C′}=\\frac{AC}{A′C′}"],["khái niệm","Lăng trụ và hình hộp","Hai đáy của lăng trụ là các đa giác bằng nhau ở hai mặt phẳng song song, các mặt bên là hình bình hành. Hình hộp là lăng trụ có đáy hình bình hành; các mặt đối song song.","Với lăng trụ: AA′∥BB′∥CC′ và AA′=BB′=CC′"]],"methods":[{"title":"Hai mặt phẳng song song","lead":"Hai mặt phân biệt song song khi không có điểm chung. Dấu hiệu: một mặt chứa hai đường cắt nhau cùng song song với mặt kia. Mặt thứ ba cắt hai mặt song song theo hai giao tuyến song song.","steps":["Chọn hai phương khác nhau trong cùng mặt","Chứng minh từng đường song song mặt kia","Dùng giao tuyến song song khi có mặt cắt"],"example":"","tip":"","worked":[]},{"title":"Giao tuyến của mặt cắt với hai mặt song song","lead":"Nếu mặt (R) cắt hai mặt song song (P), (Q), hai giao tuyến cùng nằm trong (R) và không thể gặp nhau, nên song song. Một đường song song với mặt chưa đủ để suy hai mặt song song.","steps":["Chỉ ra hai phương cắt nhau trong một mặt","Chứng minh cả hai song song với mặt kia","Dùng định lí giao tuyến nếu cần dựng thiết diện"],"example":"","tip":"","worked":[]},{"title":"Thalès trong không gian","lead":"Ba mặt phẳng đôi một song song cắt hai đường thẳng tại A,B,C và A′,B′,C′ theo cùng thứ tự. Các đoạn tương ứng trên hai cát tuyến tỉ lệ.","steps":["Đánh dấu từng cặp giao điểm cùng mặt","Lập tỉ số theo đúng thứ tự","Dùng AB+BC=AC khi B nằm giữa A,C"],"example":"","tip":"","worked":[]},{"title":"Lăng trụ và hình hộp","lead":"Hai đáy của lăng trụ là các đa giác bằng nhau ở hai mặt phẳng song song, các mặt bên là hình bình hành. Hình hộp là lăng trụ có đáy hình bình hành; các mặt đối song song.","steps":["Tìm hai đáy tương ứng","Nối các đỉnh tương ứng","Suy các cặp cạnh hoặc mặt song song"],"example":"","tip":"","worked":[]},{"title":"Chứng minh song song giữa hai mặt bằng hai phương","lead":"Chọn hai đường cắt nhau trong mặt thứ nhất để cung cấp hai phương.","steps":["Chỉ ra hai đường cắt nhau thuộc mặt thứ nhất.","Chứng minh từng đường song song với mặt thứ hai.","Áp dụng dấu hiệu và nêu rõ hai mặt đang xét."],"example":"Trong hình lập phương, AB và AD cắt nhau, cùng song song mặt trên vì lần lượt song song A′B′ và A′D′. Suy ra hai mặt đáy song song.","worked":[],"tip":""},{"title":"Dựng thiết diện qua ba trung điểm của tứ diện","lead":"","steps":["Xác định ba điểm nằm trên ba cạnh cùng đi qua một đỉnh.","Nối từng cặp trung điểm trong mặt tam giác chứa chúng.","Dùng đường trung bình để đọc tính song song với các cạnh đáy và tỉ số độ dài."],"example":"","worked":[["Tỉ số giữa hai thiết diện","M, N, P là trung điểm SA, SB, SC như hình. Tam giác ABC có diện tích 40 cm². Tính diện tích MNP.",["MN, NP và PM lần lượt là đường trung bình của các tam giác chứa chúng.","Các cạnh MNP tương ứng bằng một nửa các cạnh ABC, nên tỉ số diện tích là \\frac{1}{4}."],"Diện tích thiết diện MNP là 10 cm².","Tỉ số diện tích là bình phương tỉ số độ dài."]],"tip":"","practice":["Trong tứ diện SABC, M, N, P lần lượt là trung điểm SA, SB, SC. Biết AB = 6 cm, BC = 8 cm, CA = 10 cm. Tìm chu vi thiết diện (MNP).","Ba cạnh MN, NP, PM bằng nửa ba cạnh tương ứng của ABC.","Thiết diện là tam giác MNP, chu vi \\frac{6+8+10}{2} = 12 cm."],"diagram":"practiceSection"}],"visuals":[0],"table":[],"core":[["Định lí Thalès trong không gian",["Ba mặt song song cắt hai đường tại A, B, C và A′, B′, C′ theo thứ tự. Các đoạn tương ứng tỉ lệ."],"\\frac{AB}{A′B′} = \\frac{BC}{B′C′} = \\frac{AC}{A′C′}"]],"diagrams":["planeTraces"]},{"title":"Phép chiếu song song","intro":"Chiếu theo một phương cố định không song song với mặt chiếu. Bảo toàn tính thẳng hàng, thứ tự và tỉ số của đoạn thẳng trên cùng đường thẳng nếu ảnh không suy biến.","formulas":"","short":"","notes":[["tính chất","Đại lượng nào được giữ khi chiếu?","Nếu đường không cùng phương chiếu, ảnh của đường là đường. Các điểm thẳng hàng giữ thứ tự, trung điểm và tỉ số. Hai đường song song có thể có ảnh song song hoặc trùng; đường cùng phương chiếu co về điểm.","Với M nằm giữa A, B và A′ ≠ B′ // AM : MB = A′M′ : M′B′"],["tính chất","Tỉ số và trung điểm qua phép chiếu song song","Gọi A′, M′, B′ là ảnh của A, M, B. Nếu M nằm giữa A và B, và đoạn AB không cùng phương chiếu, thì M′ nằm giữa A′ và B′. Hình chiếu có thể thay đổi độ dài và góc, nhưng vẫn giữ tỉ số của hai đoạn trên đường thẳng này.","Thứ tự · M nằm giữa A và B // Điều kiện · A′ ≠ B′ // \\frac{AM}{MB} = \\frac{A′M′}{M′B′} khi M nằm giữa A và B // AM = MB ⇒ A′M′ = M′B′"],["tính chất","Hình biểu diễn của hình không gian","Một hình biểu diễn có thể dùng ảnh qua phép chiếu song song. Vẽ các đường thấy bằng nét liền và phần khuất bằng nét đứt. Để đọc tỉ lệ, chỉ dùng quan hệ được phép chiếu bảo toàn hoặc đề đã cho.","Nếu M là trung điểm AB và A′ ≠ B′ // M′ là trung điểm A′B′"]],"methods":[{"title":"Đại lượng nào được giữ khi chiếu?","lead":"Nếu đường không cùng phương chiếu, ảnh của đường là đường. Các điểm thẳng hàng giữ thứ tự, trung điểm và tỉ số. Hai đường song song có thể có ảnh song song hoặc trùng; đường cùng phương chiếu co về điểm.","steps":["Xét ảnh có suy biến hay không","Chiếu điểm mốc trước","Dùng tỉ số thay vì lấy góc hay độ dài cũ"],"example":"AM:MB=2:1, A′B′=9 cm thì A′M′=6 cm.","tip":"","worked":[]},{"title":"Tỉ số và trung điểm qua phép chiếu song song","lead":"Gọi A′, M′, B′ là ảnh của A, M, B. Nếu M nằm giữa A và B, và đoạn AB không cùng phương chiếu, thì M′ nằm giữa A′ và B′. Hình chiếu có thể thay đổi độ dài và góc, nhưng vẫn giữ tỉ số của hai đoạn trên đường thẳng này.","steps":["Kẻ các đường chiếu theo cùng một phương qua từng điểm.","Lấy giao với mặt phẳng chiếu và đặt tên ảnh.","Kiểm tra A′ và B′ có trùng nhau không. Nếu trùng, không dùng công thức tỉ số."],"example":"\\frac{AM}{MB} = \\frac{2}{1} và A′B′ = 9 cm thì A′M′ = 6 cm, M′B′ = 3 cm.","tip":"","worked":[]},{"title":"Hình biểu diễn của hình không gian","lead":"Một hình biểu diễn có thể dùng ảnh qua phép chiếu song song. Vẽ các đường thấy bằng nét liền và phần khuất bằng nét đứt. Để đọc tỉ lệ, chỉ dùng quan hệ được phép chiếu bảo toàn hoặc đề đã cho.","steps":["Vẽ mặt đáy và các phương song song","Dựng ảnh các điểm","Đánh dấu nét khuất và tránh suy góc từ hình"],"example":"","tip":"","worked":[]},{"title":"Dựng hình chiếu song song của một đoạn thẳng","lead":"","steps":["Chọn mặt chiếu và phương chiếu, phương chiếu không song song mặt chiếu.","Kẻ qua A, M, B ba đường cùng phương chiếu.","Lấy các giao điểm A′, M′, B′. Nếu A′ và B′ phân biệt, nối A′B′; nếu trùng nhau, ảnh là một điểm."],"tip":"","example":"Nếu M là trung điểm AB và ảnh không co lại, M′ là trung điểm A′B′.","worked":[],"diagram":"projection"}],"visuals":[1],"table":[],"core":[["Đọc hình chiếu song song",["Nếu AB không song song phương chiếu, ảnh của M nằm giữa ảnh của A, B và giữ tỉ số.","Đường cùng phương chiếu co thành điểm."],"\\frac{AM}{MB} = \\frac{A′M′}{M′B′}"]]}],"g11-c5":[{"title":"Giới hạn dãy số","intro":"Với |q| < 1 thì qⁿ → 0. Với k > 0 thì \\frac{1}{nᵏ} → 0. Khi xét thương đa thức, có thể chia tử và mẫu cho lũy thừa bậc cao.","formulas":"lim qⁿ = 0 khi ∣q∣ < 1","short":"","notes":[["tính chất","Giới hạn dãy và cấp số nhân lùi vô hạn","Dãy có giới hạn hữu hạn khi các số hạng tiến sát một số. qⁿ tiến về 0 khi ∣q∣<1. Với phân thức theo n, có thể chia tử và mẫu cho lũy thừa bậc lớn nhất ở mẫu.","lim \\frac{1}{nᵏ}=0 khi k>0 // S=\\frac{u₁}{1−q} khi ∣q∣<1"]],"methods":[{"title":"Giới hạn dãy và cấp số nhân lùi vô hạn","lead":"Dãy có giới hạn hữu hạn khi các số hạng tiến sát một số. qⁿ tiến về 0 khi ∣q∣<1. Với phân thức theo n, có thể chia tử và mẫu cho lũy thừa bậc lớn nhất ở mẫu.","steps":["Nhận dạng dãy","Chia bậc lớn hoặc dùng giới hạn cơ bản","Kiểm tra điều kiện công bội"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Tổng cấp số nhân lùi vô hạn","intro":"Với trị tuyệt đối của q nhỏ hơn 1, lấy giới hạn tổng n số hạng đầu.","formulas":"S = \\frac{u₁}{1−q}","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Giới hạn hàm số","intro":"Giới hạn hai phía hữu hạn tồn tại khi hai giới hạn một phía bằng nhau. Dạng \\frac{0}{0} cần biến đổi như phân tích nhân tử hoặc nhân liên hợp.","formulas":"","short":"","notes":[["cách làm","Xử lí \\frac{0}{0} và kiểm tra hai phía","Dạng \\frac{0}{0} chưa cho kết quả giới hạn. Phân thức đa thức thường dùng nhân tử chung, biểu thức căn thường dùng liên hợp. Hàm ghép tại điểm nối phải kiểm tra hai giới hạn một phía và giá trị tại điểm.","\\frac{x²−4}{x−2}=x+2 khi x≠2 ⇒ giới hạn tại 2 là 4"],["tính chất","Giới hạn hàm số và giới hạn một phía","Giới hạn hai phía hữu hạn tồn tại khi giới hạn trái và phải tồn tại và bằng nhau. Khi mẫu tiến về 0 nhưng tử không, xét dấu từng phía.","lim_{x→0⁺}\\frac{1}{x}=+∞; lim_{x→0⁻}\\frac{1}{x}=−∞"]],"methods":[{"title":"Xử lí \\frac{0}{0} và kiểm tra hai phía","lead":"Dạng \\frac{0}{0} chưa cho kết quả giới hạn. Phân thức đa thức thường dùng nhân tử chung, biểu thức căn thường dùng liên hợp. Hàm ghép tại điểm nối phải kiểm tra hai giới hạn một phía và giá trị tại điểm.","steps":["Thử thay","Chọn biến đổi để bỏ nhân tử gây \\frac{0}{0}","Kiểm tra một phía nếu có dấu, căn hoặc điểm ghép"],"example":"","tip":"","worked":[]},{"title":"Giới hạn hàm số và giới hạn một phía","lead":"Giới hạn hai phía hữu hạn tồn tại khi giới hạn trái và phải tồn tại và bằng nhau. Khi mẫu tiến về 0 nhưng tử không, xét dấu từng phía.","steps":["Thử thay để nhận dạng","Biến đổi \\frac{0}{0}","Xét trái và phải ở điểm đặc biệt"],"example":"","tip":"","worked":[]},{"title":"Khử dạng \\frac{0}{0} của biểu thức có căn","lead":"Khi hiệu hai căn hoặc căn trừ một số cùng tiến tới 0, dùng liên hợp.","steps":["Viết liên hợp phù hợp.","Nhân cả tử và mẫu rồi dùng hiệu hai bình phương.","Rút gọn trên miền gần điểm xét và tính giới hạn."],"example":"Khi x → 4, \\frac{\\sqrt{x} − 2}{x − 4} = \\frac{1}{\\sqrt{x} + 2} với x ≠ 4, nên giới hạn bằng \\frac{1}{4}.","worked":[],"tip":""},{"title":"Khử dạng \\frac{0}{0}","lead":"","steps":[],"example":"","tip":"","worked":[["Khử dạng \\frac{0}{0}","Tính giới hạn của \\frac{x²−9}{x−3} khi x tiến tới 3.",["Thay x = 3 vào biểu thức ban đầu xuất hiện dạng \\frac{0}{0}.","Khi x ≠ 3, tách x² − 9 = (x − 3)(x + 3) rồi rút gọn được x + 3.","Cho x tiến tới 3 trong x + 3."],"Giới hạn bằng 6.","Giới hạn chỉ xét giá trị gần 3, biểu thức gốc vẫn chưa xác định ở 3."]]}],"visuals":[],"table":[],"diagrams":["hole"]},{"title":"Giới hạn vô cực","intro":"Xét dấu ở từng phía khi mẫu tiến đến 0. Khi x tiến vô cực, so bậc cao nhất và xét dấu của x theo hướng tiến.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Liên tục","intro":"Tại x₀, hàm phải xác định và giới hạn bằng giá trị f(x₀). Nếu f liên tục trên [a;b] và f(a)f(b) < 0 thì tồn tại c trong (a;b) sao cho f(c) = 0.","formulas":"lim_{x→x₀} f(x) = f(x₀)","short":"","notes":[["định lí","Liên tục và sự tồn tại nghiệm","Hàm liên tục tại x₀ nếu xác định tại đó và lim f(x) = f(x₀). Hàm liên tục trên [a;b] có f(a), f(b) trái dấu thì có ít nhất một nghiệm trong (a;b). Không kết luận duy nhất nếu chưa có thêm điều kiện.","lim_{x→x₀} f(x)=f(x₀) // f(a)f(b)<0 ⇒ tồn tại c∈(a;b) sao cho f(c)=0 nếu f liên tục"]],"methods":[{"title":"Liên tục và sự tồn tại nghiệm","lead":"Hàm liên tục tại x₀ nếu xác định tại đó và lim f(x) = f(x₀). Hàm liên tục trên [a;b] có f(a), f(b) trái dấu thì có ít nhất một nghiệm trong (a;b). Không kết luận duy nhất nếu chưa có thêm điều kiện.","steps":["Kiểm tra miền và hai phía","So với giá trị tại điểm","Khi tìm khoảng có nghiệm, thử dấu hai đầu"],"example":"","tip":"","worked":[]},{"title":"Tìm tham số để hàm liên tục tại điểm ghép","lead":"","steps":["Xác định giá trị hàm tại điểm ghép.","Tính giới hạn từ trái và phải.","Đặt hai giới hạn bằng giá trị hàm rồi giải tham số."],"example":"","worked":[],"tip":"","practice":["Hàm f(x) = 2x + m khi x < 1, và f(x) = x² + 3 khi x ≥ 1. Tìm m để f liên tục tại 1.","Giới hạn trái bằng 2 + m, giá trị hàm và giới hạn phải đều bằng 4.","m = 2."]}],"visuals":[],"table":[],"core":[["Liên tục tại một điểm",["Cần giá trị f(x_0), giới hạn khi x tiến đến x_0, và hai giá trị bằng nhau. Hàm liên tục trên đoạn và đổi dấu ở hai đầu có ít nhất một nghiệm trong đoạn."],"lim_{x→x_0} f(x) = f(x_0)"]]}],"g11-c6":[{"title":"Lũy thừa với số mũ thực","intro":"Với cơ số dương, dùng quy tắc cộng, trừ, nhân số mũ. Số mũ âm là nghịch đảo; số mũ phân số liên hệ với căn.","formulas":"a^{−r} = \\frac{1}{aʳ}; a^{r}a^{s} = a^{r+s}","short":"","notes":[["tính chất","","Cơ số dương cho phép các quy tắc lũy thừa với số mũ thực. Số mũ hữu tỉ liên hệ với căn và số mũ âm cho nghịch đảo.","a^{\\frac{m}{n}}=căn bậc n của aᵐ; a^{−r}=\\frac{1}{a}ʳ; (aʳ)ˢ=a^{rs}"]],"methods":[{"title":"Lũy thừa với số mũ thực","lead":"Cơ số dương cho phép các quy tắc lũy thừa với số mũ thực. Số mũ hữu tỉ liên hệ với căn và số mũ âm cho nghịch đảo.","steps":["Đưa số về cùng cơ số","Tính số mũ bằng quy tắc","Kiểm tra cơ số dương khi áp dụng"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Lôgarit","intro":"a > 0, a ≠ 1 và b > 0. logₐb là số mũ cần đặt cho a để được b.","formulas":"logₐb = c ⇔ aᶜ = b; logₐ1 = 0","short":"","notes":[["cách làm","Kiểm tra cơ số và điều kiện đối số","Đổi sang lũy thừa, log hoặc cùng cơ số tùy dạng. Với log cơ số nhỏ hơn 1, đổi chiều khi so đối số. Log của tổng không bằng tổng các log.","log_{\\frac{1}{2}}x>log_{\\frac{1}{2}}4 ⇔ 0<x<4"]],"methods":[{"title":"Kiểm tra cơ số và điều kiện đối số","lead":"Đổi sang lũy thừa, log hoặc cùng cơ số tùy dạng. Với log cơ số nhỏ hơn 1, đổi chiều khi so đối số. Log của tổng không bằng tổng các log.","steps":["Viết điều kiện đối số dương","Xác định cơ số lớn hay nhỏ hơn 1","Biến đổi và đối chiếu điều kiện"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Quy tắc tính","intro":"Log của tích là tổng, log của thương là hiệu. Không áp dụng quy tắc đó cho phép cộng.","formulas":"logₐ(xy) = logₐx + logₐy; logₐ(xʳ) = r logₐx; logₐb = \\frac{log_cb}{log_ca}","short":"","notes":[["khái niệm","Lôgarit và công thức","logₐb là số mũ c sao cho aᶜ=b, với a>0, a≠1, b>0. Log biến tích thành tổng, thương thành hiệu.","logₐb=c ⇔ aᶜ=b // logₐ(\\frac{u}{v})=logₐu−logₐv // logₐb=\\frac{log_cb}{log_ca}"]],"methods":[{"title":"Lôgarit và công thức","lead":"logₐb là số mũ c sao cho aᶜ=b, với a>0, a≠1, b>0. Log biến tích thành tổng, thương thành hiệu.","steps":["Kiểm tra đối số","Chọn quy tắc phù hợp","Khi cần tính, đổi cơ số hoặc đưa về lũy thừa"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Hàm mũ và lôgarit","intro":"y = aˣ xác định trên ℝ, nhận giá trị dương. y = logₐx xác định trên (0;+∞). Cả hai đồng biến khi a > 1, nghịch biến khi 0 < a < 1.","formulas":"","short":"","notes":[["tính chất","Đồ thị hàm mũ và hàm lôgarit","Hàm mũ xác định trên ℝ và nhận giá trị dương. Hàm lôgarit xác định khi x>0. Hai đồ thị với cùng cơ số đối xứng qua y=x. Cùng đồng biến khi a>1, cùng nghịch biến khi 0<a<1.","y=aˣ đi qua (0;1); y=logₐx đi qua (1;0)"]],"methods":[{"title":"Đồ thị hàm mũ và hàm lôgarit","lead":"Hàm mũ xác định trên ℝ và nhận giá trị dương. Hàm lôgarit xác định khi x>0. Hai đồ thị với cùng cơ số đối xứng qua y=x. Cùng đồng biến khi a>1, cùng nghịch biến khi 0<a<1.","steps":["Đọc cơ số","Xác định miền và chiều biến thiên","Nhận dạng điểm hoặc tiệm cận"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Chiều biến thiên",["Với a > 1, cả hàm mũ và hàm lôgarit cơ số a đồng biến. Với 0 < a < 1, cả hai nghịch biến.","Hàm mũ xác định trên ℝ; hàm lôgarit chỉ nhận đối số dương."],""]],"diagrams":["logs"]},{"title":"Phương trình và bất phương trình","intro":"Đặt điều kiện dương cho biểu thức trong log. Đưa về cùng cơ số, đặt ẩn phụ hoặc lấy lôgarit khi hợp lệ. Với cơ số nhỏ hơn 1, so sánh qua hàm mũ hoặc log thì đổi chiều.","formulas":"","short":"","notes":[["phương pháp","Giải phương trình mũ và lôgarit","Dùng cùng cơ số khi có thể. Lôgarit thực cần đối số dương và cơ số dương khác 1. Khi giải bất phương trình, lôgarit cơ số từ 0 đến 1 là hàm nghịch biến, nên phải đảo chiều nếu bỏ log cùng cơ số.","a^u = a^v ⇔ u = v, khi a > 0 và a ≠ 1 // log_a(u) = log_a(v) ⇔ u = v với u > 0, v > 0 // log_a(uv) = log_a(u) + log_a(v), khi u, v > 0"],["cách làm","Giải phương trình và bất phương trình mũ, log","Với phương trình, có thể đưa về cùng cơ số, đặt ẩn phụ dương hoặc lấy log. Với bất phương trình, dấu đổi chiều khi cơ số nằm giữa 0 và 1.","a^{f(x)}=a^{g(x)} ⇔ f(x)=g(x) với a>0, a≠1"]],"methods":[{"title":"Giải phương trình mũ và lôgarit","lead":"Dùng cùng cơ số khi có thể. Lôgarit thực cần đối số dương và cơ số dương khác 1. Khi giải bất phương trình, lôgarit cơ số từ 0 đến 1 là hàm nghịch biến, nên phải đảo chiều nếu bỏ log cùng cơ số.","steps":["Ghi điều kiện trước khi biến đổi.","Chọn đưa về cùng cơ số, đặt ẩn phụ dương hoặc gom log.","Giải phương trình mới.","Thử nghiệm trong điều kiện của phương trình ban đầu."],"example":"","tip":"","worked":[]},{"title":"Giải phương trình và bất phương trình mũ, log","lead":"Với phương trình, có thể đưa về cùng cơ số, đặt ẩn phụ dương hoặc lấy log. Với bất phương trình, dấu đổi chiều khi cơ số nằm giữa 0 và 1.","steps":["Đặt điều kiện","Biến đổi về cùng hàm","So đối số hoặc số mũ đúng chiều","Thử nghiệm"],"example":"","tip":"","worked":[]},{"title":"Giải bất phương trình lôgarit có cơ số nhỏ hơn 1","lead":"Hàm logarit nghịch biến nếu 0 < a < 1.","steps":["Đặt điều kiện cho các đối số dương.","Đưa hai vế về cùng cơ số rồi đảo chiều bất đẳng thức khi bỏ log.","Giao nghiệm mới với điều kiện ban đầu."],"example":"log_{\\frac{1}{2}}(x − 1) > log_{\\frac{1}{2}}(3) cho 0 < x − 1 < 3, tức 1 < x < 4.","worked":[],"tip":"","practice":["Giải log_{\\frac{1}{2}}(2x − 3) > −2.","Viết −2 = log_{\\frac{1}{2}}4. Khi bỏ lôgarit, được 2x − 3 < 4.","Kết hợp 2x − 3 > 0, nghiệm là \\frac{3}{2} < x < \\frac{7}{2}."]},{"title":"Điều kiện của phương trình lôgarit","lead":"","steps":[],"example":"","tip":"","worked":[["Điều kiện của phương trình lôgarit","Giải log_{2}(x − 1) + log_{2}(x + 2) = 3.",["Hai đối số phải dương, nên x > 1.","Gộp thành log_{2}((x − 1)(x + 2)) = 3, suy ra (x − 1)(x + 2) = 8.","Giải x² + x − 10 = 0. Nghiệm âm bị loại bởi x > 1, nghiệm dương được giữ."],"x = \\frac{−1+\\sqrt{41}}{2}.",""]]}],"visuals":[],"table":[]}],"g11-c7":[{"title":"Hai đường vuông góc","intro":"Góc giữa hai đường bằng góc giữa hai đường qua cùng điểm và lần lượt song song hoặc trùng với chúng, lấy từ 0° đến 90°. Hai đường vuông góc khi góc đó là 90°.","formulas":"","short":"","notes":[["khái niệm","Góc giữa hai đường thẳng","Có thể dời hai đường về qua cùng một điểm theo hai phương ban đầu. Góc giữa hai đường lấy trong [0°;90°], kể cả khi hai đường chéo nhau. Hai đường vuông góc khi góc này là 90°.","a∥a′, b∥b′ ⇒ góc(a,b)=góc(a′,b′)"]],"methods":[{"title":"Góc giữa hai đường thẳng","lead":"Có thể dời hai đường về qua cùng một điểm theo hai phương ban đầu. Góc giữa hai đường lấy trong [0°;90°], kể cả khi hai đường chéo nhau. Hai đường vuông góc khi góc này là 90°.","steps":["Tìm hai đường cắt nhau có phương tương ứng","Chọn góc không tù","Tính trong tam giác phù hợp"],"example":"","tip":"","worked":[]},{"title":"Tìm góc giữa hai đường chéo nhau","lead":"","steps":["Qua một điểm thích hợp, chọn hai đường lần lượt song song hoặc trùng với hai đường đã cho.","Tính góc giữa hai đường cắt nhau vừa chọn.","Nếu góc vừa tính lớn hơn 90°, lấy góc bù."],"tip":"","example":"Trong lập phương, dời CC′ về AA′. Góc giữa AB và CC′ bằng góc giữa AB và AA′, tức 90°.","worked":[],"diagram":"cubeLines"}],"visuals":[],"table":[]},{"title":"Đường vuông góc mặt phẳng","intro":"d vuông góc với mặt nếu d vuông góc với hai đường cắt nhau nằm trong mặt. Hình chiếu vuông góc của một điểm là chân đường vuông góc xuống mặt.","formulas":"","short":"","notes":[["định lí","Đường thẳng vuông góc với mặt phẳng","Đường vuông góc với một mặt khi vuông góc mọi đường trong mặt. Chỉ cần kiểm tra hai đường cắt nhau trong mặt. Hai đường cùng vuông góc một mặt thì cùng phương.","d⊥a,b; a,b cắt nhau và nằm trong (P) ⇒ d⊥(P)"]],"methods":[{"title":"Đường thẳng vuông góc với mặt phẳng","lead":"Đường vuông góc với một mặt khi vuông góc mọi đường trong mặt. Chỉ cần kiểm tra hai đường cắt nhau trong mặt. Hai đường cùng vuông góc một mặt thì cùng phương.","steps":["Chọn hai đường cắt nhau dễ chứng minh","Chứng minh từng vuông góc","Ghi kết luận kèm mặt"],"example":"","tip":"","worked":[]},{"title":"Từ hai đường vuông góc đến mặt phẳng","lead":"","steps":[],"example":"","tip":"","worked":[["Từ hai đường vuông góc đến mặt phẳng","Trong hình chóp S.ABC, SA vuông góc với AB và AC. Hai đường AB và AC cắt nhau. Chứng minh SA ⊥ (ABC).",["AB và AC đều nằm trong (ABC).","Hai đường này cắt nhau tại A và SA vuông góc với cả hai.","Dùng tiêu chuẩn đường thẳng vuông góc với mặt phẳng, sau đó suy ra SA là đường cao."],"SA ⊥ (ABC).","Cần hai đường cắt nhau trong mặt phẳng."]]}],"visuals":[0],"table":[],"diagrams":["planePerp"]},{"title":"Góc giữa đường và mặt","intro":"Nếu đường không vuông góc mặt, lấy góc giữa đường với hình chiếu vuông góc của nó. Nếu đường vuông góc mặt, góc bằng 90°.","formulas":"","short":"","notes":[["định lí","Hình chiếu và góc đường–mặt","Chiếu điểm xuống mặt bằng chân đường vuông góc. Chiếu đường xiên bằng cách chiếu hai điểm phân biệt rồi nối hai ảnh. Góc giữa đường xiên và mặt là góc với hình chiếu; đường vuông góc mặt cho góc 90°.","SA⊥(ABC) ⇒ hình chiếu của SB là AB; góc(SB,(ABC))=\\widehat{SBA}"]],"methods":[{"title":"Hình chiếu và góc đường–mặt","lead":"Chiếu điểm xuống mặt bằng chân đường vuông góc. Chiếu đường xiên bằng cách chiếu hai điểm phân biệt rồi nối hai ảnh. Góc giữa đường xiên và mặt là góc với hình chiếu; đường vuông góc mặt cho góc 90°.","steps":["Tìm chân chiếu","Xác định đúng góc có đỉnh tại giao điểm đường với mặt","Dùng sin, cos hoặc tan"],"example":"","tip":"","worked":[]},{"title":"Tính góc giữa cạnh bên và mặt đáy qua hình chiếu","lead":"","steps":["Xác định chân đường vuông góc từ đỉnh xuống đáy.","Chiếu cạnh bên để nhận dạng góc cần tính.","Dùng tỉ số lượng giác trong tam giác vuông tạo bởi cạnh và hình chiếu."],"example":"","worked":[["Chọn đúng góc với hình chiếu","Trong hình, SA ⟂ (ABC), SA = 4 cm và AB = 4\\sqrt{3} cm. Tính góc giữa SB và (ABC).",["Hình chiếu của SB xuống (ABC) là AB.","Tính tan SBA = \\frac{SA}{AB} = \\frac{1}{\\sqrt{3}} trong tam giác SAB."],"Góc cần tìm là 30°.","Góc với mặt phẳng được đo với hình chiếu AB."]],"tip":"","practice":["Cho hình chóp S.ABC có SA ⊥ (ABC), SA = 3 cm và AB = 3\\sqrt{3} cm. Tìm góc giữa SB và (ABC).","Hình chiếu của SB lên đáy là AB. Dùng tan của góc SBA.","Góc bằng 30°."],"diagram":"practiceIncline"}],"visuals":[],"table":[],"core":[["Góc giữa đường và mặt",["Chiếu đường lên mặt. Nếu đường không vuông góc với mặt, lấy góc giữa đường và hình chiếu; trường hợp vuông góc, góc bằng 90°."],""]],"diagrams":["planeAngle"]},{"title":"Hai mặt phẳng và góc nhị diện","intro":"Với hai mặt cắt nhau, lấy hai tia ở đúng hai nửa mặt phẳng, cùng gốc trên giao tuyến và cùng vuông góc giao tuyến. Hai mặt vuông góc khi góc phẳng nhị diện là 90°. Một mặt chứa đường vuông góc mặt kia thì hai mặt vuông góc.","formulas":"","short":"","notes":[["định lí","Góc nhị diện và hai mặt vuông góc","Góc phẳng của nhị diện là góc tạo bởi hai tia cùng vuông góc giao tuyến tại một điểm, nằm đúng hai nửa mặt phẳng. Một mặt chứa đường vuông góc với mặt kia thì hai mặt vuông góc.","d⊂(P), d⊥(Q) ⇒ (P)⊥(Q)"]],"methods":[{"title":"Góc nhị diện và hai mặt vuông góc","lead":"Góc phẳng của nhị diện là góc tạo bởi hai tia cùng vuông góc giao tuyến tại một điểm, nằm đúng hai nửa mặt phẳng. Một mặt chứa đường vuông góc với mặt kia thì hai mặt vuông góc.","steps":["Tìm giao tuyến","Dựng hai tia hoặc chỉ ra đường vuông góc","Kiểm tra đúng nửa mặt phẳng"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Góc phẳng của góc nhị diện",["Tại một điểm trên cạnh chung, lấy trong mỗi nửa mặt phẳng một tia vuông góc cạnh. Góc giữa hai tia là góc phẳng của góc nhị diện."],""]],"diagrams":["dihedral"]},{"title":"Khoảng cách","intro":"Từ điểm đến mặt là độ dài đoạn vuông góc. Giữa hai mặt song song dùng khoảng cách từ một điểm của mặt này đến mặt kia. Giữa hai đường chéo nhau dùng đoạn vuông góc chung.","formulas":"","short":"","notes":[["khái niệm","Khoảng cách trong không gian","Khoảng cách điểm đến mặt là độ dài đoạn vuông góc. Khoảng cách giữa hai mặt song song lấy từ một điểm bất kì của mặt này đến mặt kia. Khoảng cách hai đường chéo nhau là độ dài đoạn vuông góc chung.","d(M,(P))=MH nếu H∈(P), MH⊥(P)"],["cách làm","Dựng hình phụ đúng đại lượng cần tính","Góc đường–mặt dùng hình chiếu của đường. Khoảng cách điểm–mặt dùng chân vuông góc. Góc nhị diện cần hai tia vuông góc với giao tuyến tại cùng một điểm. Thể tích chóp dùng chiều cao vuông góc đáy.","V chóp=\\frac{S_{đáy}h}{3}; V lăng trụ=S_{đáy}h"]],"methods":[{"title":"Khoảng cách trong không gian","lead":"Khoảng cách điểm đến mặt là độ dài đoạn vuông góc. Khoảng cách giữa hai mặt song song lấy từ một điểm bất kì của mặt này đến mặt kia. Khoảng cách hai đường chéo nhau là độ dài đoạn vuông góc chung.","steps":["Xác định đúng đối tượng khoảng cách","Dựng chân vuông góc hoặc mặt phụ song song","Tính trong tam giác"],"example":"","tip":"","worked":[]},{"title":"Dựng hình phụ đúng đại lượng cần tính","lead":"Góc đường–mặt dùng hình chiếu của đường. Khoảng cách điểm–mặt dùng chân vuông góc. Góc nhị diện cần hai tia vuông góc với giao tuyến tại cùng một điểm. Thể tích chóp dùng chiều cao vuông góc đáy.","steps":["Ghi rõ cần góc hay khoảng cách","Tìm chân chiếu hoặc mặt phẳng phụ","Dùng tam giác vuông và chọn tỉ số lượng giác"],"example":"","tip":"","worked":[]},{"title":"Tính khoảng cách từ một điểm đến mặt phẳng trong hình chóp","lead":"Khoảng cách là độ dài đoạn vuông góc, cần dựng hoặc nhận ra chân chiếu.","steps":["Tìm đường qua điểm và vuông góc hai đường cắt nhau trong mặt.","Xác định giao điểm với mặt phẳng.","Tính độ dài bằng tam giác vuông nếu cần."],"example":"Nếu SA ⊥ AB và SA ⊥ AC trong hình chóp S.ABC, khoảng cách từ S đến (ABC) bằng SA.","worked":[],"tip":""}],"visuals":[],"table":[],"core":[["Ba bài toán khoảng cách",["Khoảng cách từ điểm tới đường hoặc mặt là độ dài đoạn vuông góc.","Với hai đường chéo nhau, tìm độ dài đoạn vuông góc chung hoặc dùng hai mặt song song thích hợp."],""]],"diagrams":["planeDistance"]},{"title":"Thể tích","intro":"Chiều cao phải vuông góc mặt đáy. Với lăng trụ và chóp, S là diện tích đáy, h là chiều cao.","formulas":"V lăng trụ = Sh; V hình chóp = \\frac{Sh}{3}","short":"","notes":[["định lí","Thể tích lăng trụ và hình chóp","Chiều cao là khoảng cách vuông góc tới đáy. Nếu cùng diện tích đáy và cùng chiều cao, thể tích hình chóp bằng một phần ba thể tích lăng trụ tương ứng.","V lăng trụ=S_{đáy}h // V chóp=\\frac{S_{đáy}h}{3}"]],"methods":[{"title":"Thể tích lăng trụ và hình chóp","lead":"Chiều cao là khoảng cách vuông góc tới đáy. Nếu cùng diện tích đáy và cùng chiều cao, thể tích hình chóp bằng một phần ba thể tích lăng trụ tương ứng.","steps":["Tính S đáy","Tìm chiều cao vuông góc","Thế đúng công thức và ghi đơn vị khối"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"diagrams":["pyramid"]}],"g11-c8":[{"title":"Biến cố giao, hợp và đối","intro":"Giao nghĩa là cùng xảy ra. Hợp nghĩa là ít nhất một xảy ra. Hai biến cố xung khắc có giao rỗng.","formulas":"","short":"","notes":[["","Biến cố và các quy tắc xác suất","Giao là cùng xảy ra, hợp là ít nhất một xảy ra. Xung khắc nghĩa là giao rỗng. Độc lập nghĩa là xác suất giao bằng tích. Hai biến cố xung khắc có xác suất dương không thể độc lập.","P(A∪B)=P(A)+P(B)−P(A∩B) // A,B độc lập ⇒ P(A∩B)=P(A)P(B)"]],"methods":[{"title":"Biến cố và các quy tắc xác suất","lead":"Giao là cùng xảy ra, hợp là ít nhất một xảy ra. Xung khắc nghĩa là giao rỗng. Độc lập nghĩa là xác suất giao bằng tích. Hai biến cố xung khắc có xác suất dương không thể độc lập.","steps":["Viết biến cố bằng giao, hợp hoặc đối","Kiểm tra độc lập hay xung khắc","Chọn công thức, kiểm tra kết quả nằm trong [0;1]"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"diagrams":["venn"]},{"title":"Quy tắc cộng","intro":"Cộng hai xác suất và trừ phần giao bị đếm hai lần. Với hai biến cố xung khắc, phần giao bằng 0.","formulas":"P(A ∪ B) = P(A) + P(B) − P(A ∩ B)","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Quy tắc nhân","intro":"Hai biến cố độc lập khi P(A ∩ B) = P(A)P(B). Xung khắc và độc lập là hai tính chất khác nhau.","formulas":"","short":"","notes":[],"methods":[{"title":"Tìm xác suất còn thiếu khi hai biến cố độc lập","lead":"","steps":["Viết xác suất giao bằng tích.","Thay tích vào công thức xác suất hợp.","Giải phương trình và kiểm tra xác suất thuộc [0; 1]."],"example":"","worked":[],"tip":"","practice":["Hai biến cố A, B độc lập, P(A) = 0,4 và P(A ∪ B) = 0,7. Tìm P(B).","Đặt p = P(B). Khi đó 0,4 + p − 0,4p = 0,7.","p = 0,5."]}],"visuals":[0],"table":[],"core":[["Độc lập khác xung khắc",["Độc lập cho phép nhân xác suất. Xung khắc nghĩa là không cùng xảy ra."],"P(A ∩ B) = P(A)P(B) khi A và B độc lập"]]},{"title":"Biến cố đối và đúng một","intro":"Tính ít nhất một bằng 1 trừ xác suất không có biến cố nào. Đúng một là hai phần riêng không giao.","formulas":"P(chỉ một trong A, B) = P(A) + P(B) − 2P(A ∩ B)","short":"","notes":[["bổ sung","“Đúng một” và “ít nhất một”","“Đúng một” bỏ phần giao, còn “ít nhất một” gồm cả phần giao. Biến cố đối của “ít nhất một” là “không có biến cố nào”.","P(đúng một)=P(A)+P(B)−2P(A∩B)"]],"methods":[{"title":"“Đúng một” và “ít nhất một”","lead":"“Đúng một” bỏ phần giao, còn “ít nhất một” gồm cả phần giao. Biến cố đối của “ít nhất một” là “không có biến cố nào”.","steps":["Vẽ hai vòng hoặc cây","Đánh dấu chính xác miền cần tính","Chọn công thức cộng, nhân hoặc bù"],"example":"","tip":"","worked":[]},{"title":"Tính xác suất đúng một lần khi hai phép thử độc lập","lead":"Hai khả năng “lần một thành công” và “lần hai thành công” loại trừ nhau khi yêu cầu đúng một lần.","steps":["Viết hai trường hợp thành công–thất bại và thất bại–thành công.","Dùng độc lập để nhân trong từng trường hợp.","Cộng hai xác suất."],"example":"Nếu xác suất thành công lần lượt 0,7 và 0,4 thì đúng một lần có xác suất 0,7·0,6 + 0,3·0,4 = 0,54.","worked":[],"tip":""},{"title":"Xác suất ít nhất một lần thành công","lead":"","steps":[],"example":"","tip":"","worked":[["Xác suất ít nhất một lần thành công","Hai lần thử độc lập có xác suất thành công lần lượt 0,7 và 0,6. Tính xác suất ít nhất một lần thành công.",["Biến cố đối là cả hai lần đều thất bại.","Xác suất hai lần thất bại lần lượt 0,3 và 0,4. Nhờ độc lập, xác suất đồng thời là 0,3·0,4 = 0,12.","Lấy 1 − 0,12."],"0,88.",""]]}],"visuals":[],"table":[]}],"g11-c9":[{"title":"Ý nghĩa đạo hàm và tiếp tuyến","intro":"Đạo hàm tại x₀ là giới hạn của thương số gia, biểu thị hệ số góc tiếp tuyến.","formulas":"f′(x₀) = lim_{h→0} \\frac{f(x₀+h) − f(x₀)}{h}; y = f(x₀) + f′(x₀)(x−x₀)","short":"","notes":[["","Đạo hàm, tiếp tuyến và đạo hàm cấp hai","Đạo hàm tại x₀ là giới hạn của thương số gia và bằng hệ số góc tiếp tuyến. Quy tắc hàm hợp cần nhân đạo hàm bên trong. Tọa độ s có đạo hàm cấp một là vận tốc, cấp hai là gia tốc.","f′(x₀)=lim_{h→0}\\frac{f(x₀+h)−f(x₀)}{h} // y=f(x₀)+f′(x₀)(x−x₀) // (uv)′=u′v+uv′; (\\frac{u}{v})′=\\frac{u′v−uv′}{v²} // (f(u))′=f′(u)u′"]],"methods":[{"title":"Đạo hàm, tiếp tuyến và đạo hàm cấp hai","lead":"Đạo hàm tại x₀ là giới hạn của thương số gia và bằng hệ số góc tiếp tuyến. Quy tắc hàm hợp cần nhân đạo hàm bên trong. Tọa độ s có đạo hàm cấp một là vận tốc, cấp hai là gia tốc.","steps":["Xác định miền và cấu trúc hàm","Áp dụng quy tắc","Tính tại điểm hoặc lấy đạo hàm lần nữa theo yêu cầu"],"example":"","tip":"","worked":[]},{"title":"Viết tiếp tuyến khi biết hoành độ tiếp điểm","lead":"Cần cả tọa độ tiếp điểm và hệ số góc tại đó.","steps":["Thay x₀ vào f để tìm y₀.","Tính f′(x₀).","Thay vào y − y₀ = f′(x₀)(x − x₀)."],"example":"Với y = x² tại x₀ = 3, y₀ = 9 và f′(3) = 6. Tiếp tuyến y = 6x − 9.","worked":[],"tip":""},{"title":"Tìm tiếp điểm có tiếp tuyến song song với đường thẳng","lead":"","steps":["Đọc hệ số góc của đường thẳng đã cho.","Giải phương trình đạo hàm bằng hệ số góc đó.","Tính tung độ và viết tiếp tuyến nếu đề yêu cầu."],"example":"","worked":[],"tip":"","practice":["Tìm các điểm trên đồ thị y = x³ − 3x có tiếp tuyến song song với y = 9x + 1.","Giải 3x² − 3 = 9.","x = ±2, các tiếp điểm là (2; 2) và (−2; −2)."]}],"visuals":[],"table":[],"diagrams":["tangent"]},{"title":"Quy tắc tính","intro":"Đạo hàm tuyến tính với tổng và hiệu. Tích, thương có quy tắc riêng, không lấy tích hoặc thương hai đạo hàm.","formulas":"(uv)′ = u′v + uv′; (\\frac{u}{v})′ = \\frac{u′v − uv′}{v²}, v ≠ 0","short":"","notes":[],"methods":[],"visuals":[],"table":[],"core":[["Đạo hàm của tích và thương",["Thương chỉ xét ở điểm mẫu khác 0. Chú ý thứ tự phép trừ trên tử."],"(uv)′ = u′v + uv′ // (\\frac{u}{v})′ = \\frac{u′v−uv′}{v²}, v ≠ 0"]]},{"title":"Hàm cơ bản","intro":"Hằng số có đạo hàm 0. Các công thức lượng giác dùng biến rađian.","formulas":"(xⁿ)′ = nx^{n−1}; (sin x)′ = cos x; (cos x)′ = −sin
