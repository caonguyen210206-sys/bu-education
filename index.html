"worked":[]}],"visuals":[],"table":[]},{"title":"Làm tròn","intro":"Nhìn chữ số ngay bên phải hàng cần làm tròn. Từ 5 trở lên tăng một đơn vị ở hàng đó. Với số âm, làm tròn độ lớn rồi đặt lại dấu.","formulas":"","short":"","notes":[["","Làm tròn số thập phân","Chỉ xét chữ số ngay sau hàng làm tròn. Nếu chữ số đó từ 5 trở lên, tăng chữ số ở hàng làm tròn một đơn vị; nếu nhỏ hơn 5 thì giữ.","7,394 ≈ 7,39 đến hàng phần trăm; 7,395 ≈ 7,40"]],"methods":[{"title":"Làm tròn số thập phân","lead":"Chỉ xét chữ số ngay sau hàng làm tròn. Nếu chữ số đó từ 5 trở lên, tăng chữ số ở hàng làm tròn một đơn vị; nếu nhỏ hơn 5 thì giữ.","steps":["Xác định hàng theo yêu cầu","Nhìn chữ số liền phải","Xử lí nhớ nếu chữ số hàng làm tròn là 9"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Làm tròn và ước lượng",["Xác định hàng làm tròn. Nhìn một chữ số ngay bên phải: 0 đến 4 giữ nguyên, 5 đến 9 tăng một đơn vị ở hàng làm tròn."],""]],"diagrams":["roundingLine"]},{"title":"Tỉ số phần trăm","intro":"Chia lượng xét cho lượng gốc. Thay đổi p% dùng hệ số 1 ± \\frac{p}{100}.","formulas":"Tỉ số phần trăm của A và B = \\frac{A}{B} × 100%","short":"","notes":[["cách làm","Xác định số gốc khi dùng phần trăm","Tỉ số phần trăm là phần chia cho gốc rồi đổi ra phần trăm. Muốn tìm số gốc từ một phần đã biết, chia cho tỉ lệ chứ không nhân.","Gốc = phần : (\\frac{p}{100}), p≠0"]],"methods":[{"title":"Xác định số gốc khi dùng phần trăm","lead":"Tỉ số phần trăm là phần chia cho gốc rồi đổi ra phần trăm. Muốn tìm số gốc từ một phần đã biết, chia cho tỉ lệ chứ không nhân.","steps":["Xác định toàn thể đang được so","Dùng phép tính phù hợp","Kiểm tra kết quả theo ước lượng"],"example":"","tip":"","worked":[]},{"title":"Tính phần trăm hao hụt","lead":"Phần trăm hao hụt được so với lượng trước khi giảm.","steps":["Lấy số ban đầu trừ số còn lại.","Chia độ giảm cho số ban đầu.","Nhân tỉ số với 100% và ghi rõ đại lượng gốc."],"example":"Từ 2,5 kg còn 2 kg, hao hụt 0, \\frac{5}{2,5} × 100% = 20%.","worked":[],"tip":""},{"title":"Tăng và giảm theo phần trăm","lead":"","steps":[],"example":"","tip":"","worked":[["Tăng và giảm theo phần trăm","Giá 200 000 đồng tăng 10%, sau đó giảm 10% theo giá mới. Tìm giá cuối.",["Giá sau tăng là 200 000 × 1,1 = 220 000 đồng.","Lần giảm lấy 10% của 220 000, tức 22 000 đồng.","Trừ 22 000 khỏi giá mới."],"198 000 đồng.","Hai lần lấy phần trăm trên hai giá gốc khác nhau."]]},{"title":"Tìm giá ban đầu sau khi giảm rồi tăng","lead":"","steps":["Đổi mỗi lần thay đổi thành hệ số nhân.","Nhân hai hệ số để biểu diễn giá cuối theo giá ban đầu.","Chia giá cuối cho hệ số thu được."],"example":"","worked":[],"tip":"","practice":["Một sản phẩm giảm 20%, sau đó tăng 10% so với giá đã giảm. Giá cuối là 264 000 đồng. Tính giá ban đầu.","Hai hệ số là 0,8 và 1,1. Giá cuối bằng 0,88 lần giá đầu.","264 000 : 0,88 = 300 000 đồng."]}],"visuals":[],"table":[],"core":[["Chọn số gốc",["Tỉ số phần trăm có mẫu là đại lượng dùng làm gốc."],"p% của A = A·\\frac{p}{100} // Tỉ số phần trăm của A và B = \\frac{A}{B}·100%, B ≠ 0"]]}],"g6-c8":[{"title":"Điểm, đường, tia","intro":"Qua hai điểm phân biệt có một đường thẳng. Tia có gốc và kéo dài theo một phía. Hai tia đối nhau chung gốc và tạo thành một đường thẳng.","formulas":"","short":"","notes":[],"methods":[{"title":"Xác định điểm, đường thẳng và hai tia đối nhau","lead":"","steps":["Chọn đường thẳng làm mốc.","Đọc các điểm thuộc đường và điểm ngoài đường.","Khi hai tia chung gốc và ngược hướng trên cùng đường, kết luận hai tia đối nhau."],"tip":"Đọc tên tia từ gốc đến một điểm khác trên tia.","example":"Trong hình, hai tia MA và MB đối nhau. Điểm N nằm ngoài đường thẳng AB.","worked":[],"diagram":"ray"}],"visuals":[],"table":[],"core":[["Điểm, đường thẳng và tia",["Viết A ∈ d nếu A nằm trên d.","Hai tia đối nhau chung gốc, cùng đường thẳng và ngược hướng."],"B ∉ d nếu B ở ngoài d"]],"diagrams":["ray"]},{"title":"Đoạn thẳng và trung điểm","intro":"Nếu M nằm giữa A và B thì AM + MB = AB. Trung điểm còn phải có AM = MB.","formulas":"AM = MB = \\frac{AB}{2}","short":"","notes":[["cách làm","Dùng vị trí điểm trước khi cộng đoạn","Hệ thức cộng đoạn cần điểm nằm giữa. Cách đều hai đầu đoạn chưa đủ để kết luận trung điểm khi chưa biết điểm thuộc đoạn.","A,M,B thẳng hàng và AM+MB=AB ⇒ M nằm giữa A,B nếu M khác A,B"]],"methods":[{"title":"Dùng vị trí điểm trước khi cộng đoạn","lead":"Hệ thức cộng đoạn cần điểm nằm giữa. Cách đều hai đầu đoạn chưa đủ để kết luận trung điểm khi chưa biết điểm thuộc đoạn.","steps":["Đọc thứ tự điểm từ tia hoặc hình","Chọn tổng hay hiệu","Kiểm tra điều kiện trung điểm"],"example":"","tip":"","worked":[]},{"title":"Tìm độ dài từ trung điểm","lead":"","steps":[],"example":"","tip":"","worked":[["Tìm độ dài từ trung điểm","M là trung điểm của AB, N là trung điểm của MB và AB = 20 cm. Tính AN.",["AM = MB = 20 : 2 = 10 cm.","MN = 10 : 2 = 5 cm.","Thứ tự A, M, N, B cho AN = AM + MN."],"15 cm.",""]]},{"title":"Tính khoảng cách giữa hai điểm trên cùng một tia","lead":"","steps":["So sánh khoảng cách của mỗi điểm tới gốc.","Đặt điểm gần gốc hơn vào giữa.","Dùng phép trừ để tính đoạn giữa hai điểm."],"example":"","worked":[],"tip":"","practice":["Trên tia Ox lấy A, B sao cho OA = 4 cm, OB = 10 cm. M là trung điểm AB. Tính OM.","A nằm giữa O và B, nên AB = 6 cm.","AM = 3 cm, suy ra OM = 4 + 3 = 7 cm."],"diagram":"practiceRay"}],"visuals":[],"table":[],"core":[["Điểm nằm giữa và trung điểm",["Chỉ cộng độ dài khi M nằm giữa A và B. Trung điểm cần nằm giữa và chia đoạn thành hai phần bằng nhau."],"AM + MB = AB // AM = MB = \\frac{AB}{2}"]],"diagrams":["midpoint"]},{"title":"Góc và tia phân giác","intro":"Góc có hai tia chung gốc. Phân giác nằm trong góc và chia góc thành hai góc bằng nhau.","formulas":"∠xOz = ∠zOy = \\frac{số đo ∠xOy}{2}","short":"","notes":[["","Góc và số đo","Một góc do hai tia chung gốc tạo thành. Góc nhọn nhỏ hơn 90°, góc vuông bằng 90°, góc tù lớn hơn 90° và nhỏ hơn 180°, góc bẹt bằng 180°.","Góc lớn = tổng hai góc kề bên trong"]],"methods":[{"title":"Góc và số đo","lead":"Một góc do hai tia chung gốc tạo thành. Góc nhọn nhỏ hơn 90°, góc vuông bằng 90°, góc tù lớn hơn 90° và nhỏ hơn 180°, góc bẹt bằng 180°.","steps":["Đặt tâm thước ở đỉnh","Căn một tia vào vạch 0","Đọc tia kia theo đúng thang"],"example":"","tip":"","worked":[]},{"title":"Tính góc nhờ tia nằm giữa","lead":"Chỉ cộng hai góc nhỏ thành góc lớn khi tia chung nằm trong góc lớn.","steps":["Đọc hoặc vẽ vị trí ba tia.","Dùng tổng hai góc kề hoặc tính một nửa nếu là tia phân giác.","Thử tổng hoặc so hai góc vừa tìm."],"example":"\\widehat{AOB} = 110°, OC ở trong và \\widehat{AOC} = 37°. Khi đó \\widehat{COB} = 73°.","worked":[],"tip":""},{"title":"Nhận biết tia phân giác","lead":"","steps":["Kiểm tra tia OM nằm trong góc AOB.","Tính hoặc chứng minh hai góc AOM và MOB bằng nhau.","Nếu đủ hai điều kiện, kết luận OM là tia phân giác."],"tip":"","example":"Nếu góc AOB bằng 80° và OM là tia phân giác thì hai góc nhỏ đều bằng 40°.","worked":[],"diagram":"bisector"}],"visuals":[0],"table":[],"core":[["Đọc góc",["Đỉnh viết ở giữa tên góc. Đọc góc nhọn, vuông, tù hoặc bẹt theo số đo.","Tia phân giác nằm trong góc và chia góc thành hai góc bằng nhau."],""]]}],"g6-c9":[{"title":"Thu thập và phân loại dữ liệu","intro":"Có dữ liệu số và dữ liệu không phải số. Kiểm tra tính hợp lí, đơn vị, trùng lặp và phạm vi trước khi lập bảng.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Biểu đồ tranh, cột và cột kép","intro":"Biểu đồ tranh cần chú giải. Biểu đồ cột so số lượng theo thang. Cột kép đặt hai nhóm cạnh nhau để so sánh.","formulas":"","short":"","notes":[["","Dữ liệu và biểu đồ","Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","Góc ở tâm = tỉ lệ × 360° // Tỉ lệ = \\frac{số của nhóm}{tổng số}"]],"methods":[{"title":"Dữ liệu và biểu đồ","lead":"Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","steps":["Đọc tên, đơn vị và thang chia","Xác định nhóm hoặc thời điểm đang hỏi","So sánh hoặc tính tỉ lệ"],"example":"","tip":"","worked":[]}],"visuals":[0],"table":[],"core":[["Đọc chú giải",["Biểu đồ tranh cần quy đổi mỗi biểu tượng.","Biểu đồ cột kép phải dùng cùng thang đo và đọc đúng hai nhóm."],""]],"diagrams":["paired"]},{"title":"Kết quả và xác suất thực nghiệm","intro":"Liệt kê các kết quả có thể xảy ra. Tần suất của một kết quả trong mẫu là tỉ số giữa số lần xảy ra và số lần thử.","formulas":"P thực nghiệm = \\frac{số lần xảy ra}{tổng số lần thử}","short":"","notes":[["","Kết quả, biến cố và xác suất","Một kết quả có thể chắc chắn, không thể hoặc có thể xảy ra. Xác suất cổ điển dùng các kết quả đồng khả năng; xác suất thực nghiệm dùng số lần quan sát được.","P(A)=\\frac{số kết quả thuận lợi}{số kết quả đồng khả năng} // Tần suất A = \\frac{số lần A xảy ra}{số lần thử}"]],"methods":[{"title":"Kết quả, biến cố và xác suất","lead":"Một kết quả có thể chắc chắn, không thể hoặc có thể xảy ra. Xác suất cổ điển dùng các kết quả đồng khả năng; xác suất thực nghiệm dùng số lần quan sát được.","steps":["Liệt kê kết quả hoặc đọc bảng thử nghiệm","Xác định mẫu số đúng","Đếm kết quả thỏa yêu cầu"],"example":"","tip":"","worked":[]},{"title":"Gộp hai đợt thử để tính xác suất thực nghiệm","lead":"Mỗi đợt có thể có số lần thử khác nhau.","steps":["Cộng số lần biến cố xảy ra ở cả hai đợt.","Cộng tổng số lần thử.","Chia hai tổng, rồi viết dưới dạng phân số hoặc phần trăm."],"example":"Đợt đầu có \\frac{7}{10} lần xảy ra, đợt sau \\frac{9}{30} lần. Kết quả chung là \\frac{16}{40} = 40%.","worked":[],"tip":"Lấy trung bình hai tỉ lệ chỉ cho đúng trong một số trường hợp, chẳng hạn hai đợt có số lần thử bằng nhau."},{"title":"Xác suất thực nghiệm","lead":"","steps":[],"example":"","tip":"","worked":[["Xác suất thực nghiệm","Gieo xúc xắc 50 lần, có 18 lần ra số chẵn. Tính xác suất thực nghiệm của sự kiện ra số lẻ.",["Mỗi lần gieo cho đúng một trong hai loại chẵn hoặc lẻ.","Số lần lẻ là 50 − 18 = 32.","Chia 32 cho tổng số lần gieo là 50."],"\\frac{32}{50} = 0,64.",""]]},{"title":"Suy số lần xuất hiện từ tỉ số thực nghiệm","lead":"","steps":["Xác định tổng số lần thử và biến cố cần đếm.","Nhân tỉ số với tổng số lần thử.","Kiểm tra kết quả là số nguyên từ 0 đến tổng số lần thử."],"example":"","worked":[],"tip":"","practice":["Tung một đồng xu 60 lần, tỉ số thực nghiệm của mặt ngửa là 0,45. Hỏi mặt sấp xuất hiện bao nhiêu lần?","Tính số lần mặt ngửa trước.","Mặt ngửa xuất hiện 27 lần, mặt sấp xuất hiện 33 lần."]}],"visuals":[],"table":[],"core":[["Mẫu số thực nghiệm",["Gộp nhiều đợt bằng cách cộng số lần xảy ra và tổng số lần thử."],"Tỉ số thực nghiệm = \\frac{số lần xảy ra}{tổng số lần thử}"]]}],"g7-c1":[{"title":"Số hữu tỉ","intro":"Viết được dưới dạng \\frac{a}{b} với a, b nguyên và b khác 0. Trên trục số, số ở bên phải lớn hơn. Số đối có tổng bằng 0; nghịch đảo của số khác 0 có tích bằng 1.","formulas":"","short":"","notes":[["","Phân số bằng nhau và quy đồng","Nhân hoặc chia cả tử và mẫu với cùng một số khác 0 không đổi giá trị. Đưa mẫu về dương khi so sánh; có thể dùng mẫu số chung nhỏ nhất.","\\frac{a}{b}=\\frac{c}{d} ⇔ ad=bc, b,d ≠ 0"]],"methods":[{"title":"Phân số bằng nhau và quy đồng","lead":"Nhân hoặc chia cả tử và mẫu với cùng một số khác 0 không đổi giá trị. Đưa mẫu về dương khi so sánh; có thể dùng mẫu số chung nhỏ nhất.","steps":["Rút gọn trước nếu thuận tiện","Chọn mẫu chung","Nhân cả tử và mẫu của mỗi phân số"],"example":"","tip":"","worked":[]}],"visuals":[0],"table":[],"diagrams":["signed"]},{"title":"Bốn phép tính","intro":"Quy đồng khi cộng trừ. Chia là nhân với nghịch đảo. Khi chuyển một số hạng sang vế kia của đẳng thức thì đổi dấu số hạng đó.","formulas":"","short":"","notes":[["cách làm","Tách dấu và kiểm tra điều kiện chia","Không chia cho 0. Đặt ngoặc quanh số âm khi làm lũy thừa. Khi chuyển vế, đổi dấu số hạng chuyển sang.","(−\\frac{2}{3})²=\\frac{4}{9}; −(\\frac{2}{3})²=−\\frac{4}{9}"],["","Cộng và trừ phân số","Quy đồng về mẫu chung rồi cộng hoặc trừ tử. Mẫu chung giữ nguyên. Sau đó rút gọn và kiểm tra kết quả theo ước lượng.","\\frac{a}{b} ± \\frac{c}{d}=\\frac{ad ± bc}{bd}"],["","Nhân, chia phân số và tìm phân số của một số","Tích bằng tử nhân tử, mẫu nhân mẫu. Chia cho phân số khác 0 thì nhân nghịch đảo. Tìm một phần của số bằng phép nhân; tìm số ban đầu từ một phần bằng phép chia.","\\frac{a}{b}×\\frac{c}{d}=\\frac{ac}{bd} // \\frac{a}{b}:\\frac{c}{d}=\\frac{ad}{bc}, c ≠ 0"]],"methods":[{"title":"Tách dấu và kiểm tra điều kiện chia","lead":"Không chia cho 0. Đặt ngoặc quanh số âm khi làm lũy thừa. Khi chuyển vế, đổi dấu số hạng chuyển sang.","steps":["Chuẩn hóa dấu và ngoặc","Thực hiện đúng ưu tiên","Thử kết quả vào đẳng thức ban đầu"],"example":"","tip":"","worked":[]},{"title":"Cộng và trừ phân số","lead":"Quy đồng về mẫu chung rồi cộng hoặc trừ tử. Mẫu chung giữ nguyên. Sau đó rút gọn và kiểm tra kết quả theo ước lượng.","steps":["Kiểm tra mẫu số","Quy đồng nếu khác mẫu","Tính tử rồi rút gọn"],"example":"","tip":"","worked":[]},{"title":"Nhân, chia phân số và tìm phân số của một số","lead":"Tích bằng tử nhân tử, mẫu nhân mẫu. Chia cho phân số khác 0 thì nhân nghịch đảo. Tìm một phần của số bằng phép nhân; tìm số ban đầu từ một phần bằng phép chia.","steps":["Xác định cần lấy một phần hay tìm toàn thể","Chọn nhân hoặc chia","Rút gọn trước khi nhân"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Lũy thừa","intro":"Phân biệt (−a)^{n} và −a^{n}. Với n chẵn, lũy thừa của số âm dương. Với n lẻ, kết quả âm.","formulas":"x^{m}x^{n} = x^{m+n}; (x^{m})^{n} = x^{mn}; (xy)^{n} = x^{n}y^{n}","short":"","notes":[["","Lũy thừa với số mũ tự nhiên","aⁿ là tích n thừa số a. Dấu ngoặc quyết định dấu: (−a)² = a² nhưng −a² là số đối của a². Với a khác 0, a⁰ = 1.","a^{m}·a^{n}=a^{m+n} // a^{m}:a^{n}=a^{m−n} (a ≠ 0, m ≥ n) // (a^{m})^{n}=a^{mn}; (ab)^{n}=a^{n}b^{n}"],["","Thứ tự thực hiện phép tính","Tính trong ngoặc trước. Sau đó tính lũy thừa nếu có, rồi nhân, chia, rồi cộng, trừ. Các phép cùng mức thực hiện từ trái sang phải.","8 + 2 × 5 = 18; (8 + 2) × 5 = 50"]],"methods":[{"title":"Lũy thừa với số mũ tự nhiên","lead":"aⁿ là tích n thừa số a. Dấu ngoặc quyết định dấu: (−a)² = a² nhưng −a² là số đối của a². Với a khác 0, a⁰ = 1.","steps":["Xem cơ số có giống nhau không","Chọn cộng, trừ hoặc nhân số mũ","Kiểm tra dấu và cơ số 0"],"example":"","tip":"","worked":[]},{"title":"Thứ tự thực hiện phép tính","lead":"Tính trong ngoặc trước. Sau đó tính lũy thừa nếu có, rồi nhân, chia, rồi cộng, trừ. Các phép cùng mức thực hiện từ trái sang phải.","steps":["Đánh dấu ngoặc và phép tính ưu tiên","Mỗi dòng rút gọn một bước","Giữ nguyên phần chưa tính"],"example":"","tip":"","worked":[]},{"title":"So sánh lũy thừa bằng dấu và cùng cơ số","lead":"Dấu ngoặc quyết định số âm có thuộc cơ số hay không.","steps":["Xác định dấu của từng biểu thức trước.","Với phần dương, đưa về cùng cơ số hoặc tính số mũ nhỏ.","Nếu cả hai âm, đảo thứ tự so với phần trị tuyệt đối."],"example":"(−\\frac{3}{4})^4 dương còn −(\\frac{3}{4})^4 âm. Biểu thức thứ nhất lớn hơn.","worked":[],"tip":""},{"title":"Lũy thừa và dấu ngoặc","lead":"","steps":[],"example":"","tip":"","worked":[["Lũy thừa và dấu ngoặc","So sánh (−\\frac{2}{3})² và −(\\frac{2}{3})².",["Biểu thức thứ nhất bình phương cả số âm.","Biểu thức thứ hai bình phương \\frac{2}{3} rồi lấy số đối.","So \\frac{4}{9} và −\\frac{4}{9}."],"(−\\frac{2}{3})² > −(\\frac{2}{3})².",""]]},{"title":"So sánh lũy thừa bằng cùng số mũ","lead":"","steps":["Nếu hai số mũ có ước chung, viết mỗi lũy thừa dưới dạng lũy thừa của một lũy thừa.","Đưa về cùng số mũ dương.","Với hai cơ số dương, so sánh cơ số mới."],"example":"","worked":[],"tip":"","practice":["So sánh 3^8 và 5^6.","Đưa cả hai về bình phương: 3^4 = 81 và 5^3 = 125.","3^8 < 5^6."]}],"visuals":[],"table":[],"core":[["Lũy thừa và thứ tự tính",["Với cơ số âm, mũ chẵn cho kết quả dương, mũ lẻ cho kết quả âm.","Tính ngoặc và lũy thừa trước, rồi nhân, chia và cộng, trừ."],"(a^m)^n = a^{mn} // (ab)^n = a^n b^n"]]}],"g7-c2":[{"title":"Thập phân hữu hạn và tuần hoàn","intro":"Mỗi số hữu tỉ viết được dưới dạng thập phân hữu hạn hoặc vô hạn tuần hoàn. Số vô tỉ có biểu diễn thập phân vô hạn không tuần hoàn.","formulas":"","short":"","notes":[["","Số thực, thập phân tuần hoàn và căn số học","Số hữu tỉ viết được thành thập phân hữu hạn hoặc vô hạn tuần hoàn; số vô tỉ có thập phân vô hạn không tuần hoàn. Căn bậc hai số học của a ≥ 0 là số không âm có bình phương bằng a.","ℚ ⊂ ℝ; \\sqrt{49}=7; x²=49 ⇒ x=±7"]],"methods":[{"title":"Số thực, thập phân tuần hoàn và căn số học","lead":"Số hữu tỉ viết được thành thập phân hữu hạn hoặc vô hạn tuần hoàn; số vô tỉ có thập phân vô hạn không tuần hoàn. Căn bậc hai số học của a ≥ 0 là số không âm có bình phương bằng a.","steps":["Kiểm tra miền của căn","Tính hoặc kẹp căn bằng hai bình phương","Phân loại số dựa trên kết quả"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Căn bậc hai số học","intro":"Với a ≥ 0, √a là số không âm có bình phương bằng a. Phương trình x² = a với a > 0 có hai nghiệm đối nhau.","formulas":"\\sqrt{49} = 7; x² = 49 ⇒ x = ±7","short":"","notes":[],"methods":[{"title":"Kẹp căn giữa hai số nguyên","lead":"So bình phương của các số không âm để ước lượng căn số học.","steps":["Tìm hai số chính phương liên tiếp bao quanh số dưới căn.","Lấy căn ở cả ba vế.","Dùng dấu chặt hoặc dấu bằng tùy số dưới căn có phải số chính phương không."],"example":"7² = 49 < 58 < 64 = 8² nên 7 < \\sqrt{58} < 8.","worked":[],"tip":""},{"title":"So sánh số âm chứa căn bằng số đối","lead":"","steps":["Đổi hai số âm về hai số đối dương.","So sánh bình phương của hai số dương.","Đổi chiều khi quay lại hai số âm ban đầu."],"example":"","worked":[],"tip":"","practice":["So sánh −\\sqrt{6} và −2,4.","6 > 2,4² = 5,76.","\\sqrt{6} > 2,4 nên −\\sqrt{6} < −2,4."]}],"visuals":[],"table":[],"core":[["Căn bậc hai số học",["Giá trị của căn số học luôn không âm.","Phân biệt nghiệm của x² = a với giá trị của \\sqrt{a}."],"\\sqrt{a²} = ∣a∣"]],"diagrams":["rootSquare"]},{"title":"Tập số thực và giá trị tuyệt đối","intro":"Số thực gồm số hữu tỉ và vô tỉ. Giá trị tuyệt đối là khoảng cách đến 0.","formulas":"ℚ ⊂ ℝ; trị tuyệt đối của −3,2 là 3,2","short":"","notes":[["cách làm","Phân loại số qua dạng thập phân và căn","Hữu hạn hay vô hạn tuần hoàn là hữu tỉ. Vô hạn không tuần hoàn là vô tỉ. Tính căn của số chính phương trước khi phân loại.","\\sqrt{49}=7∈ℚ; \\sqrt{2}∉ℚ"]],"methods":[{"title":"Phân loại số qua dạng thập phân và căn","lead":"Hữu hạn hay vô hạn tuần hoàn là hữu tỉ. Vô hạn không tuần hoàn là vô tỉ. Tính căn của số chính phương trước khi phân loại.","steps":["Rút gọn biểu thức","Nhận dạng mẫu thập phân hoặc căn","Chọn tập số nhỏ nhất phù hợp"],"example":"","tip":"","worked":[]},{"title":"Giá trị tuyệt đối và căn bậc hai","lead":"","steps":[],"example":"","tip":"","worked":[["Giá trị tuyệt đối và căn bậc hai","Rút gọn \\sqrt{(−5)²} − ∣−2∣.",["Tính (−5)² = 25.","Căn bậc hai số học của 25 là 5.","Khoảng cách từ −2 đến 0 là 2, nên hiệu là 5 − 2."],"3.",""]]}],"visuals":[0],"table":[],"core":[["Số hữu tỉ và vô tỉ",["Thập phân hữu hạn hoặc vô hạn tuần hoàn biểu diễn số hữu tỉ. Thập phân vô hạn không tuần hoàn biểu diễn số vô tỉ."],""]]}],"g7-c3":[{"title":"Góc kề bù và đối đỉnh","intro":"Góc kề bù có tổng 180°. Hai góc đối đỉnh bằng nhau. Điều đảo của mệnh đề đối đỉnh không đúng chỉ từ số đo bằng nhau.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[],"diagrams":["crossing"]},{"title":"Tia phân giác","intro":"Tia nằm trong góc và tạo hai góc bằng nhau với hai cạnh.","formulas":"Nếu Oz là phân giác thì ∠xOz = ∠zOy","short":"","notes":[],"methods":[],"visuals":[],"table":[],"diagrams":["bisector"]},{"title":"Dấu hiệu song song","intro":"Một cặp góc so le trong bằng nhau hoặc một cặp đồng vị bằng nhau đủ để hai đường bị cắt song song. Một cặp góc trong cùng phía bù nhau cũng đủ.","formulas":"","short":"","notes":[["định lí","Dấu hiệu nhận biết hai đường thẳng song song","Một đường thẳng cắt hai đường phân biệt. Nếu có một cặp góc so le trong bằng nhau, một cặp đồng vị bằng nhau hoặc một cặp trong cùng phía bù nhau thì hai đường bị cắt song song.","α so le trong = β ⇒ a∥b"],["cách làm","Từ góc bằng nhau đến hai đường song song","Hai góc bằng nhau chưa đủ nếu chưa chứng minh chúng đồng vị hoặc so le trong. Tiên đề Euclid thường dùng để chỉ ra hai đường qua cùng điểm cùng song song với đường thứ ba thì trùng nhau.","So le trong bằng nhau ⇒ hai đường bị cắt song song"]],"methods":[{"title":"Dấu hiệu nhận biết hai đường thẳng song song","lead":"Một đường thẳng cắt hai đường phân biệt. Nếu có một cặp góc so le trong bằng nhau, một cặp đồng vị bằng nhau hoặc một cặp trong cùng phía bù nhau thì hai đường bị cắt song song.","steps":["Chỉ ra đường cắt","Gọi đúng tên cặp góc","Áp dụng dấu hiệu"],"example":"","tip":"","worked":[]},{"title":"Từ góc bằng nhau đến hai đường song song","lead":"Hai góc bằng nhau chưa đủ nếu chưa chứng minh chúng đồng vị hoặc so le trong. Tiên đề Euclid thường dùng để chỉ ra hai đường qua cùng điểm cùng song song với đường thứ ba thì trùng nhau.","steps":["Đánh dấu đường cắt","Xác định vị trí cặp góc","Viết dấu hiệu nhận biết rồi kết luận"],"example":"","tip":"","worked":[]},{"title":"Chứng minh song song từ góc bù","lead":"Cặp góc trong cùng phía bù nhau là một dấu hiệu nhận biết.","steps":["Xác định đường cắt và hai góc nằm giữa hai đường cần chứng minh.","Kiểm tra chúng nằm cùng phía của đường cắt.","Tính tổng góc rồi áp dụng dấu hiệu."],"example":"Hai góc trong cùng phía bằng 117° và 63°. Tổng 180° nên hai đường song song.","worked":[],"tip":""},{"title":"Chứng minh hai đường song song từ góc so le trong","lead":"","steps":["Chỉ ra đường cắt c đi qua cả hai đường cần xét.","Đánh dấu hai góc nằm trong và khác phía c.","Chứng minh hai góc bằng nhau rồi áp dụng dấu hiệu song song."],"tip":"","example":"","worked":[],"diagram":"corresponding"}],"visuals":[0],"table":[],"core":[["Góc tạo bởi một cát tuyến",["So le trong hoặc đồng vị bằng nhau là dấu hiệu song song.","Hai góc trong cùng phía bù nhau cũng cho hai đường song song."],""]],"diagrams":["corresponding"]},{"title":"Tính chất và định lí","intro":"Với hai đường song song, góc đồng vị, so le trong tương ứng bằng nhau; góc trong cùng phía bù nhau. Khi chứng minh, tách giả thiết và kết luận.","formulas":"","short":"","notes":[["định lí","Tiên đề Euclid và tính chất hai đường song song","Qua một điểm ngoài đường thẳng chỉ có một đường song song với đường đã cho. Nếu một đường cắt hai đường song song, góc đồng vị và góc so le trong bằng nhau; góc trong cùng phía bù nhau.","α+β=180° nếu là cặp trong cùng phía"]],"methods":[{"title":"Tiên đề Euclid và tính chất hai đường song song","lead":"Qua một điểm ngoài đường thẳng chỉ có một đường song song với đường đã cho. Nếu một đường cắt hai đường song song, góc đồng vị và góc so le trong bằng nhau; góc trong cùng phía bù nhau.","steps":["Từ giả thiết song song","Chọn cặp góc cần liên hệ","Dùng tính chất hoặc tính duy nhất"],"example":"","tip":"","worked":[]},{"title":"Nhận dạng cặp góc khi cắt hai đường","lead":"","steps":[],"example":"","tip":"","worked":[["Nhận dạng cặp góc khi cắt hai đường","Một đường thẳng cắt hai đường song song. Một góc trong bằng 68°. Tính góc trong cùng phía với nó.",["Xác định hai góc nằm giữa hai đường song song, cùng phía đường cắt.","Hai góc trong cùng phía có tổng 180°.","Tính 180° − 68°."],"112°.",""]]},{"title":"Tính hai góc trong cùng phía theo tỉ số","lead":"","steps":["Xác định hai góc cùng phía với đường cắt.","Với hai đường song song, tổng hai góc bằng 180°.","Chia 180° thành số phần theo tỉ số."],"example":"","worked":[],"tip":"","practice":["Hai góc trong cùng phía tạo bởi hai đường song song có tỉ số 2 : 7. Tính hai góc.","Tổng có 9 phần bằng nhau.","Hai góc là 40° và 140°."]}],"visuals":[],"table":[]}],"g7-c4":[{"title":"Tổng ba góc","intro":"Trong mọi tam giác, tổng ba góc trong bằng 180°. Góc ngoài bằng tổng hai góc trong không kề với nó.","formulas":"\\widehat{A} + \\widehat{B} + \\widehat{C} = 180°","short":"","notes":[["","Tổng góc trong tam giác","Ba góc trong tam giác có tổng 180°. Góc ngoài kề bù với một góc trong nên bằng tổng hai góc trong không kề.","\\widehat{A} + \\widehat{B} + \\widehat{C} = 180°"]],"methods":[{"title":"Tổng góc trong tam giác","lead":"Ba góc trong tam giác có tổng 180°. Góc ngoài kề bù với một góc trong nên bằng tổng hai góc trong không kề.","steps":["Xác định đúng góc trong và góc ngoài","Lập tổng 180° hoặc hệ thức góc ngoài","Kiểm tra góc tìm được dương"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Tam giác bằng nhau","intro":"Đọc các đỉnh tương ứng theo thứ tự. Dùng cạnh–cạnh–cạnh, cạnh–góc–cạnh hoặc góc–cạnh–góc. Góc hoặc cạnh xen giữa phải đúng vị trí.","formulas":"","short":"","notes":[["khái niệm","Tam giác bằng nhau và trường hợp cạnh–cạnh–cạnh","Hai tam giác bằng nhau có từng cạnh, từng góc tương ứng bằng nhau. Nếu ba cạnh của tam giác này lần lượt bằng ba cạnh tương ứng của tam giác kia thì hai tam giác bằng nhau.","AB=DE, BC=EF, AC=DF ⇒ ΔABC=ΔDEF"],["định lí","Cạnh–góc–cạnh và góc–cạnh–góc","Trường hợp cạnh–góc–cạnh cần góc xen giữa hai cạnh. Trường hợp góc–cạnh–góc cần cạnh xen giữa hai góc. Không dùng ba góc để kết luận hai tam giác bằng nhau.","AB=DE, \\widehat{A}=\\widehat{D}, AC=DF ⇒ ΔABC=ΔDEF"],["cách làm","Chứng minh một cặp cạnh hoặc góc bằng nhau","Chọn hai tam giác chứa hai yếu tố cần chứng minh. Với tam giác vuông, có thể dùng cạnh huyền–cạnh góc vuông hoặc cạnh huyền–góc nhọn. Không tự suy hai tam giác bằng nhau từ ba góc.","C-C-C; C-G-C; G-C-G"]],"methods":[{"title":"Tam giác bằng nhau và trường hợp cạnh–cạnh–cạnh","lead":"Hai tam giác bằng nhau có từng cạnh, từng góc tương ứng bằng nhau. Nếu ba cạnh của tam giác này lần lượt bằng ba cạnh tương ứng của tam giác kia thì hai tam giác bằng nhau.","steps":["Ghép ba cặp cạnh","Suy thứ tự đỉnh","Viết cặp tam giác theo đúng thứ tự"],"example":"","tip":"","worked":[]},{"title":"Cạnh–góc–cạnh và góc–cạnh–góc","lead":"Trường hợp cạnh–góc–cạnh cần góc xen giữa hai cạnh. Trường hợp góc–cạnh–góc cần cạnh xen giữa hai góc. Không dùng ba góc để kết luận hai tam giác bằng nhau.","steps":["Vẽ hai tam giác cùng hướng","Khoanh yếu tố xen giữa","Kiểm tra cặp tương ứng"],"example":"","tip":"","worked":[["Kiểm tra góc xen giữa","Trong hình, AB = DE, AC = DF và góc BAC bằng góc EDF. Chứng minh BC = EF.",["Hai cạnh AB và AC có chung đầu mút A, nên BAC là góc xen giữa.","Tương tự, EDF là góc xen giữa DE và DF. Suy ra △ABC = △DEF theo cạnh–góc–cạnh."],"Hai cạnh tương ứng BC và EF bằng nhau.","Ghi đỉnh theo thứ tự tương ứng A với D, B với E và C với F."]],"diagram":"medianTwo"},{"title":"Chứng minh một cặp cạnh hoặc góc bằng nhau","lead":"Chọn hai tam giác chứa hai yếu tố cần chứng minh. Với tam giác vuông, có thể dùng cạnh huyền–cạnh góc vuông hoặc cạnh huyền–góc nhọn. Không tự suy hai tam giác bằng nhau từ ba góc.","steps":["Ghép đỉnh theo yếu tố đích","Tìm cạnh chung, góc chung hoặc cặp cạnh cho trước","Chốt trường hợp bằng nhau"],"example":"","tip":"","worked":[]},{"title":"Chứng minh bằng cạnh–góc–cạnh","lead":"","steps":[],"example":"","tip":"","worked":[["Chứng minh bằng cạnh–góc–cạnh","Hai tam giác ABC, DEF có AB = DE, AC = DF và góc A bằng góc D. Nêu cặp cạnh còn lại bằng nhau.",["Góc A nằm giữa AB và AC. Góc D nằm giữa DE và DF.","Áp dụng cạnh–góc–cạnh với đối ứng A ↔ D, B ↔ E, C ↔ F.","Lấy hai cạnh tương ứng đối diện A và D."],"BC = EF.",""]]},{"title":"Chứng minh hai đoạn bằng nhau qua trung điểm","lead":"","steps":["Tìm hai tam giác lần lượt chứa hai đoạn cần chứng minh.","Dùng trung điểm, cặp góc đối đỉnh và đoạn bằng nhau để áp dụng cạnh–góc–cạnh.","Ghép đúng cặp cạnh tương ứng."],"example":"","worked":[],"tip":"","practice":["Cho AB và CD cắt nhau tại O, O là trung điểm cả hai đoạn. Chứng minh AC = BD.","So sánh hai tam giác AOC và BOD.","OA = OB, OC = OD, \\widehat{AOC} = \\widehat{BOD}. Hai tam giác bằng nhau, suy ra AC = BD."],"diagram":"practiceOpposite"}],"visuals":[],"table":[],"core":[["Thứ tự đỉnh tương ứng",["Ở trường hợp cạnh–góc–cạnh, góc phải xen giữa hai cạnh.","Ở trường hợp góc–cạnh–góc, cạnh phải xen giữa hai góc."],""]],"diagrams":["medianTwo"]},{"title":"Tam giác vuông","intro":"Ngoài các trường hợp chung, có thể dùng các trường hợp riêng như cạnh huyền và cạnh góc vuông, hoặc cạnh huyền và góc nhọn tương ứng.","formulas":"","short":"","notes":[["định lí","Trường hợp bằng nhau của tam giác vuông","Hai tam giác vuông bằng nhau nếu có hai cạnh góc vuông tương ứng bằng nhau; hoặc một cạnh góc vuông và một góc nhọn tương ứng; hoặc cạnh huyền và một góc nhọn; hoặc cạnh huyền và một cạnh góc vuông.","Cạnh huyền–cạnh góc vuông dùng cho hai tam giác đã biết vuông"]],"methods":[{"title":"Trường hợp bằng nhau của tam giác vuông","lead":"Hai tam giác vuông bằng nhau nếu có hai cạnh góc vuông tương ứng bằng nhau; hoặc một cạnh góc vuông và một góc nhọn tương ứng; hoặc cạnh huyền và một góc nhọn; hoặc cạnh huyền và một cạnh góc vuông.","steps":["Chỉ ra hai góc vuông","Ghép cạnh huyền và góc hoặc cạnh tương ứng","Chọn dấu hiệu phù hợp"],"example":"","tip":"","worked":[]},{"title":"Dùng cạnh huyền và một cạnh góc vuông","lead":"Trường hợp riêng dùng cho hai tam giác đã biết vuông.","steps":["Chỉ ra góc vuông của mỗi tam giác.","Xác định hai cạnh huyền tương ứng và một cặp cạnh góc vuông bằng nhau.","Viết đúng thứ tự đỉnh rồi suy cạnh hoặc góc cần tìm."],"example":"Tam giác ABC và DEF vuông tại A, D có BC = EF và AB = DE. Suy ra AC = DF.","worked":[],"tip":""}],"visuals":[],"table":[],"diagrams":["congruent"]},{"title":"Tam giác cân và đều","intro":"Tam giác cân có hai cạnh bên bằng nhau, hai góc đáy bằng nhau. Đường từ đỉnh qua trung điểm đáy đồng thời là phân giác và đường cao. Tam giác đều có ba góc 60°.","formulas":"","short":"","notes":[["","Tam giác cân và đường trung trực","Hai góc ở đáy của tam giác cân bằng nhau; đảo lại, hai góc bằng nhau thì hai cạnh đối bằng nhau. Đường trung trực đi qua trung điểm và vuông góc đoạn thẳng. Điểm thuộc trung trực cách đều hai đầu mút và ngược lại.","AB = AC ⇔ \\widehat{B} = \\widehat{C} trong ΔABC"]],"methods":[{"title":"Tam giác cân và đường trung trực","lead":"Hai góc ở đáy của tam giác cân bằng nhau; đảo lại, hai góc bằng nhau thì hai cạnh đối bằng nhau. Đường trung trực đi qua trung điểm và vuông góc đoạn thẳng. Điểm thuộc trung trực cách đều hai đầu mút và ngược lại.","steps":["Xác định đỉnh cân","Dùng góc, cạnh hoặc trung trực để tìm yếu tố cần thiết","Kiểm tra điểm cách đều đúng hai đầu mút"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Tam giác cân và trung trực",["Tam giác cân có hai góc đáy bằng nhau.","Điểm thuộc đường trung trực của AB cách đều A và B, và ngược lại."],""]],"diagrams":["isoTriangle"]}],"g7-c5":[{"title":"Thu thập và tính đại diện","intro":"Có thể dùng quan sát, bảng hỏi, đo đạc hoặc nguồn có sẵn. Mẫu nên đại diện cho nhóm cần nghiên cứu; tránh chỉ hỏi một nhóm có đặc điểm riêng.","formulas":"","short":"","notes":[["","Dữ liệu và biểu đồ","Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","Góc ở tâm = tỉ lệ × 360° // Tỉ lệ = \\frac{số của nhóm}{tổng số}"]],"methods":[{"title":"Dữ liệu và biểu đồ","lead":"Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","steps":["Đọc tên, đơn vị và thang chia","Xác định nhóm hoặc thời điểm đang hỏi","So sánh hoặc tính tỉ lệ"],"example":"","tip":"","worked":[]}],"visuals":[0],"table":[]},{"title":"Biểu đồ quạt tròn","intro":"Mỗi quạt là một phần của tổng. Góc ở tâm bằng tỉ lệ phần nhân 360°.","formulas":"α = p% × 360°; 25% ứng với 90°","short":"","notes":[],"methods":[{"title":"Từ số lượng sang góc quạt tròn","lead":"Mỗi nhóm chiếm một phần của cùng tổng số quan sát.","steps":["Cộng số lượng các nhóm để tìm tổng.","Chia số lượng nhóm cho tổng để được tỉ lệ.","Nhân tỉ lệ với 360° rồi kiểm tra tổng các góc."],"example":"Nhóm có 15 trong 60 bạn chiếm 25% và ứng với góc 90°.","worked":[],"tip":""},{"title":"Chọn biểu đồ theo câu hỏi","lead":"","steps":[],"example":"","tip":"","worked":[["Chọn biểu đồ theo câu hỏi","Có số lượng học sinh của 4 lớp và muốn so lớp nào nhiều hơn. Nên dùng biểu đồ cột hay đường gấp khúc?",["Bốn lớp là bốn nhóm cần so sánh.","Với biểu đồ cột, dùng chung thang đo và mỗi lớp một cột.","So độ cao các cột để trả lời."],"Chọn biểu đồ cột.",""]]},{"title":"Tính lại tỉ lệ khi tổng số thay đổi","lead":"","steps":["Đổi phần trăm của nhóm thành số lượng.","Cập nhật cả số lượng nhóm và tổng mới.","Chia để tính tỉ lệ mới."],"example":"","worked":[],"tip":"","practice":["Trong 40 học sinh có 25% chọn bóng đá. Thêm 10 học sinh, 5 em chọn bóng đá. Tỉ lệ mới là bao nhiêu?","Ban đầu có 10 em chọn bóng đá.","Có 15 trong 50 em chọn bóng đá, tức 30%."]}],"visuals":[],"table":[],"core":[["Quạt tròn",["Tổng phần trăm là 100%, tổng số đo góc ở tâm là 360°."],"Góc của một quạt = tỉ lệ của nhóm × 360°"]],"diagrams":["fan"]},{"title":"Biểu đồ đoạn thẳng","intro":"Các điểm nối theo thứ tự, thường theo thời gian. Đọc trục, thang đo và đơn vị trước khi so sánh xu hướng.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[],"diagrams":["timeSeries"]}],"g7-c6":[{"title":"Tỉ lệ thức","intro":"Hai tỉ số bằng nhau tạo thành tỉ lệ thức. Tích hai ngoại tỉ bằng tích hai trung tỉ.","formulas":"\\frac{a}{b} = \\frac{c}{d} ⇔ ad = bc","short":"","notes":[["","Tỉ lệ thức và đại lượng tỉ lệ","Tỉ lệ thức là đẳng thức hai tỉ số. Nếu các tỉ số bằng nhau, có thể cộng hoặc trừ đồng thời các tử và mẫu nếu mẫu mới khác 0. Thuận giữ \\frac{y}{x}; nghịch giữ xy.","\\frac{a}{b}=\\frac{c}{d} ⇔ ad=bc // Thuận: y=kx; nghịch: xy=a"]],"methods":[{"title":"Tỉ lệ thức và đại lượng tỉ lệ","lead":"Tỉ lệ thức là đẳng thức hai tỉ số. Nếu các tỉ số bằng nhau, có thể cộng hoặc trừ đồng thời các tử và mẫu nếu mẫu mới khác 0. Thuận giữ \\frac{y}{x}; nghịch giữ xy.","steps":["Tìm đại lượng giữ nguyên","Lập tỉ lệ hay tích","Dùng một cặp dữ kiện tìm hệ số rồi suy giá trị khác"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Dãy tỉ số bằng nhau","intro":"Nếu các tỉ số cùng bằng k thì tỉ số giữa tổng các tử và tổng các mẫu cũng bằng k khi tổng mẫu khác 0.","formulas":"\\frac{a}{m} = \\frac{b}{n} = \\frac{a+b}{m+n}","short":"","notes":[],"methods":[{"title":"Tìm hai số từ dãy tỉ số và hiệu","lead":"Đề biết tỉ số của hai số và hiệu có thứ tự.","steps":["Viết x = am và y = bm với cùng m.","Thế vào x − y để tìm m.","Thay lại và kiểm tra thứ tự hai số."],"example":"\\frac{x}{5} = \\frac{y}{3} và x − y = 18, suy ra 2m = 18, x = 45, y = 27.","worked":[],"tip":""}],"visuals":[],"table":[]},{"title":"Tỉ lệ thuận","intro":"Thương \\frac{y}{x} không đổi với x khác 0. Khi x tăng gấp k lần thì y cũng tăng theo cùng hệ số.","formulas":"y = kx","short":"","notes":[],"methods":[],"visuals":[],"table":[],"core":[["Nhận biết tỉ lệ thuận và nghịch",["Tỉ lệ thuận giữ thương y và x. Tỉ lệ nghịch giữ tích xy."],"y = kx // y = \\frac{a}{x}, x ≠ 0"]]},{"title":"Tỉ lệ nghịch","intro":"Tích xy giữ nguyên. Nếu x tăng gấp m lần thì y giảm còn \\frac{1}{m} lần.","formulas":"y = \\frac{a}{x}; xy = a","short":"","notes":[["cách làm","Phân biệt tỉ lệ thuận và tỉ lệ nghịch","Hai đại lượng cùng tăng chưa đủ để kết luận tỉ lệ thuận. Kiểm tra thương không đổi với thuận, tích không đổi với nghịch. Dãy tỉ số bằng nhau cần mẫu mới khác 0.","Thuận: \\frac{y}{x}=k; nghịch: xy=k"]],"methods":[{"title":"Phân biệt tỉ lệ thuận và tỉ lệ nghịch","lead":"Hai đại lượng cùng tăng chưa đủ để kết luận tỉ lệ thuận. Kiểm tra thương không đổi với thuận, tích không đổi với nghịch. Dãy tỉ số bằng nhau cần mẫu mới khác 0.","steps":["Thử ít nhất hai cặp giá trị","Tìm hằng số","Lập mô hình và tính lượng còn thiếu"],"example":"","tip":"","worked":[]},{"title":"Dùng tỉ lệ nghịch","lead":"","steps":[],"example":"","tip":"","worked":[["Dùng tỉ lệ nghịch","6 máy giống nhau làm xong việc trong 8 giờ. 4 máy mất bao lâu nếu cùng năng suất?",["Khối lượng công việc giữ nguyên nên số máy nhân thời gian không đổi.","Tính 6 × 8 = 48 máy-giờ.","Chia 48 cho 4 máy."],"12 giờ.",""]]},{"title":"Chia số lượng theo tỉ lệ nghịch","lead":"","steps":["Đổi tỉ lệ nghịch với các số đã cho thành tỉ lệ thuận với nghịch đảo của chúng.","Rút gọn tỉ lệ.","Dùng tổng để tìm giá trị một phần."],"example":"","worked":[],"tip":"","practice":["Chia 84 thành hai phần tỉ lệ nghịch với 3 và 4 theo thứ tự.","Hai phần có tỉ lệ 4 : 3.","Hai phần lần lượt là 48 và 36."]}],"visuals":[],"table":[]}],"g7-c7":[{"title":"Biểu thức và đa thức","intro":"Thay biến bằng giá trị đã cho để tính giá trị biểu thức. Đa thức một biến là tổng các đơn thức có số mũ nguyên không âm.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Thu gọn và bậc","intro":"Gộp các hạng tử cùng số mũ. Bậc của đa thức khác 0 là số mũ lớn nhất có hệ số khác 0 sau khi thu gọn.","formulas":"","short":"","notes":[["","Đơn thức, đa thức và phép tính","Đơn thức là tích của hệ số và các lũy thừa nguyên không âm của biến. Đa thức là tổng các đơn thức. Chỉ gộp hạng tử đồng dạng; bậc được đọc sau khi thu gọn. Nhân bằng phân phối; chia một đa thức cho đơn thức bằng cách chia từng hạng tử khi đều chia hết.","a·x^{m}·b·x^{n}=ab·x^{m+n} // Nếu A chia hết cho B: A = BQ"]],"methods":[{"title":"Đơn thức, đa thức và phép tính","lead":"Đơn thức là tích của hệ số và các lũy thừa nguyên không âm của biến. Đa thức là tổng các đơn thức. Chỉ gộp hạng tử đồng dạng; bậc được đọc sau khi thu gọn. Nhân bằng phân phối; chia một đa thức cho đơn thức bằng cách chia từng hạng tử khi đều chia hết.","steps":["Sắp xếp hạng tử theo phần biến","Dùng phân phối khi nhân hoặc chia từng hạng tử","Thu gọn và kiểm tra bậc"],"example":"","tip":"","worked":[]},{"title":"Tìm bậc sau thu gọn","lead":"","steps":[],"example":"","tip":"","worked":[["Tìm bậc sau thu gọn","Tìm bậc của P(x) = 3x³ − x + 2 − 3x³ + 4x².",["Gom hạng tử cùng bậc.","Hai hạng tử bậc ba triệt tiêu.","P(x) = 4x² − x + 2, số mũ lớn nhất còn lại là 2."],"P có bậc 2.",""]]}],"visuals":[],"table":[]},{"title":"Cộng, trừ, nhân, chia","intro":"Cộng trừ theo hệ số cùng bậc. Nhân phân phối rồi thu gọn. Khi chia đa thức, bậc dư nhỏ hơn bậc đa thức chia nếu dư khác 0.","formulas":"P(x) = Q(x)·S(x) + R(x)","short":"","notes":[],"methods":[{"title":"Chia đa thức một biến và thử bằng phép nhân","lead":"Sắp xếp hạng tử theo lũy thừa giảm dần.","steps":["Chia hạng tử đầu của phần còn lại cho hạng tử đầu của số chia.","Nhân kết quả với số chia và trừ, rồi lặp đến khi bậc dư thấp hơn bậc số chia.","Kiểm tra số bị chia bằng số chia nhân thương cộng dư."],"example":"(x² + 3x + 5) chia cho x + 1 cho thương x + 2 và dư 3.","worked":[],"tip":""},{"title":"Tìm số dư phép chia đa thức cho x − a","lead":"","steps":["Viết P(x) = (x − a)Q(x) + r với r là hằng số.","Thay x = a, tích đầu bằng 0.","Tính P(a) để tìm r."],"example":"","worked":[],"tip":"","practice":["Tìm số dư khi chia P(x) = 2x³ − x + 5 cho x − 2.","Thay x = 2 vào P(x).","Số dư bằng 16 − 2 + 5 = 19."]}],"visuals":[],"table":[]},{"title":"Nghiệm","intro":"a là nghiệm khi P(a) = 0. Nghiệm của một tích bằng 0 tìm bằng cách cho từng thừa số bằng 0.","formulas":"","short":"","notes":[["cách làm","Tính và kiểm tra nghiệm của đa thức","Sau khi thu gọn, bậc là số mũ lớn nhất có hệ số khác 0. a là nghiệm của P khi P(a)=0. Phép chia kiểm tra bằng chia × thương + dư.","P(a)=0; P=QS+R"]],"methods":[{"title":"Tính và kiểm tra nghiệm của đa thức","lead":"Sau khi thu gọn, bậc là số mũ lớn nhất có hệ số khác 0. a là nghiệm của P khi P(a)=0. Phép chia kiểm tra bằng chia × thương + dư.","steps":["Xếp theo lũy thừa giảm dần","Thực hiện tính hệ số","Thử lại giá trị hoặc kết quả phép chia"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Nghiệm của đa thức",["Thay a vào đa thức, tính giá trị. a là nghiệm khi giá trị bằng 0.","Phép chia đa thức kiểm tra bằng số chia nhân thương cộng dư."],"P(a) = 0"]]}],"g7-c8":[{"title":"Biến cố","intro":"Biến cố là điều có thể được mô tả bằng một nhóm kết quả. Biến cố chắc chắn chứa mọi kết quả, biến cố không thể không chứa kết quả nào.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Xác suất đơn giản","intro":"Trong mô hình đồng khả năng hữu hạn, lấy số kết quả thuận lợi chia tổng kết quả.","formulas":"P(A) = \\frac{số kết quả thuận lợi}{số kết quả có thể}","short":"","notes":[["","Kết quả, biến cố và xác suất","Một kết quả có thể chắc chắn, không thể hoặc có thể xảy ra. Xác suất cổ điển dùng các kết quả đồng khả năng; xác suất thực nghiệm dùng số lần quan sát được.","P(A)=\\frac{số kết quả thuận lợi}{số kết quả đồng khả năng} // Tần suất A = \\frac{số lần A xảy ra}{số lần thử}"]],"methods":[{"title":"Kết quả, biến cố và xác suất","lead":"Một kết quả có thể chắc chắn, không thể hoặc có thể xảy ra. Xác suất cổ điển dùng các kết quả đồng khả năng; xác suất thực nghiệm dùng số lần quan sát được.","steps":["Liệt kê kết quả hoặc đọc bảng thử nghiệm","Xác định mẫu số đúng","Đếm kết quả thỏa yêu cầu"],"example":"","tip":"","worked":[]},{"title":"Đếm kết quả đồng khả năng","lead":"","steps":[],"example":"","tip":"","worked":[["Đếm kết quả đồng khả năng","Rút một thẻ từ 8 thẻ giống nhau, ghi số từ 1 đến 8. Tính xác suất rút được số lớn hơn 5.",["Mỗi thẻ có cùng khả năng được rút.","Các số thỏa là 6, 7, 8.","Lấy 3 kết quả thuận lợi chia 8 kết quả có thể."],"\\frac{3}{8}.",""]]},{"title":"Đếm biến cố có hai điều kiện giao nhau","lead":"","steps":["Liệt kê kết quả thỏa từng điều kiện.","Gộp hai danh sách, đếm mỗi kết quả đúng một lần.","Chia số kết quả thuận lợi cho số kết quả đồng khả năng."],"example":"","worked":[],"tip":"","practice":["Rút đều một thẻ đánh số từ 1 đến 12. Tính xác suất rút được số chia hết cho 2 hoặc 3.","Có 6 bội của 2, 4 bội của 3 và 2 bội chung.","Có 8 kết quả thuận lợi. Xác suất bằng \\frac{2}{3}."]}],"visuals":[],"table":[],"core":[["Ba kiểu biến cố",["Chắc chắn có xác suất 1, không thể có xác suất 0. Công thức đếm dùng khi các kết quả đồng khả năng."],"P(A) = \\frac{số kết quả thuận lợi cho A}{số kết quả có thể}"]]},{"title":"Biến cố đối","intro":"Biến cố đối của A xảy ra đúng khi A không xảy ra.","formulas":"P(A đối) = 1 − P(A)","short":"","notes":[],"methods":[{"title":"Tính xác suất bằng biến cố đối","lead":"Biến cố “ít nhất một” thường dễ tính qua trường hợp không có lần nào.","steps":["Xác định kết quả nào thuộc biến cố cần tính.","Viết biến cố đối phủ đúng phần còn lại.","Lấy 1 trừ xác suất biến cố đối."],"example":"Rút một thẻ từ 1 đến 12. Xác suất không rút bội của 4 bằng 1 − \\frac{3}{12} = \\frac{3}{4}.","worked":[],"tip":""}],"visuals":[],"table":[],"diagrams":["venn"]}],"g7-c9":[{"title":"Cạnh và góc đối diện","intro":"Trong một tam giác, cạnh lớn hơn đối diện góc lớn hơn. Góc lớn hơn cũng đối diện cạnh lớn hơn. Đường vuông góc ngắn hơn mọi đường xiên từ cùng điểm đến cùng đường.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Bất đẳng thức tam giác","intro":"Mỗi cạnh bé hơn tổng và lớn hơn hiệu dương của hai cạnh kia.","formulas":"Hiệu độ dài hai cạnh < cạnh còn lại < tổng hai cạnh","short":"","notes":[["","Cạnh, góc đối diện và bất đẳng thức tam giác","Cạnh lớn hơn đối diện góc lớn hơn. Trong các đoạn từ một điểm tới một đường, đoạn vuông góc ngắn nhất. Mỗi cạnh tam giác lớn hơn hiệu và nhỏ hơn tổng hai cạnh kia.","∣a − b∣ < c < a + b"],["cách làm","Từ dữ kiện cạnh, góc hoặc cách đều đến định lí","Tìm góc đối diện nếu so cạnh. Khi so đoạn nối một điểm đến một đường, dựng đường vuông góc. Khi có cách đều, phân biệt cách đều đỉnh với cách đều cạnh.","∣a−b∣<c<a+b; AG=\\frac{2AM}{3} với G là trọng tâm"]],"methods":[{"title":"Cạnh, góc đối diện và bất đẳng thức tam giác","lead":"Cạnh lớn hơn đối diện góc lớn hơn. Trong các đoạn từ một điểm tới một đường, đoạn vuông góc ngắn nhất. Mỗi cạnh tam giác lớn hơn hiệu và nhỏ hơn tổng hai cạnh kia.","steps":["Vẽ hình hoặc sắp độ dài","Xác định đúng góc đối diện hoặc đoạn chiếu","Loại trường hợp hai đầu mút bằng nhau"],"example":"","tip":"","worked":[]},{"title":"Từ dữ kiện cạnh, góc hoặc cách đều đến định lí","lead":"Tìm góc đối diện nếu so cạnh. Khi so đoạn nối một điểm đến một đường, dựng đường vuông góc. Khi có cách đều, phân biệt cách đều đỉnh với cách đều cạnh.","steps":["Xác định loại dữ kiện","Chọn quan hệ đúng","Kiểm tra điều kiện trước khi kết luận"],"example":"","tip":"","worked":[]},{"title":"Khoảng giá trị cạnh thứ ba","lead":"","steps":[],"example":"","tip":"","worked":[["Khoảng giá trị cạnh thứ ba","Hai cạnh tam giác dài 4 cm và 9 cm. Cạnh thứ ba có độ dài nguyên bao nhiêu?",["Độ dài x lớn hơn hiệu 9 − 4 = 5.","Đồng thời x nhỏ hơn tổng 9 + 4 = 13.","Liệt kê các số nguyên nằm giữa 5 và 13."],"6, 7, 8, 9, 10, 11, 12 cm.","Dấu bất đẳng thức nghiêm ngặt. 5 cm và 13 cm tạo hình suy biến."]]},{"title":"Tìm độ dài cạnh nguyên nhỏ nhất hoặc lớn nhất","lead":"","steps":["Dùng hiệu hai cạnh làm cận dưới và tổng làm cận trên.","Viết bất đẳng thức chặt.","Liệt kê hoặc chọn giá trị nguyên ở trong khoảng."],"example":"","worked":[],"tip":"","practice":["Một tam giác có hai cạnh 5 cm và 9 cm. Cạnh thứ ba nguyên và lớn hơn 8 cm. Tìm cạnh thứ ba lớn nhất.","Cạnh thứ ba phải nhỏ hơn 14 cm.","Cạnh thứ ba lớn nhất là 13 cm."]}],"visuals":[],"table":[],"diagrams":["impossibleTriangle"]},{"title":"Trung tuyến và trọng tâm","intro":"Ba trung tuyến gặp nhau tại trọng tâm. Trọng tâm cách đỉnh \\frac{2}{3} độ dài trung tuyến.","formulas":"AG = \\frac{2AM}{3}; GM = \\frac{AM}{3}","short":"","notes":[],"methods":[],"visuals":[],"table":[],"diagrams":["median"]},{"title":"Các điểm đồng quy","intro":"Trung trực gặp tại tâm ngoại tiếp, cách đều các đỉnh. Phân giác trong gặp tại tâm nội tiếp, cách đều các cạnh. Ba đường cao gặp tại trực tâm.","formulas":"","short":"","notes":[["","Các đường đồng quy trong tam giác","Ba trung tuyến gặp ở trọng tâm G; ba phân giác trong gặp ở tâm nội tiếp; ba trung trực gặp ở tâm ngoại tiếp; ba đường cao gặp ở trực tâm. Tâm nội tiếp cách đều các cạnh; tâm ngoại tiếp cách đều các đỉnh.","Nếu AM là trung tuyến thì AG=\\frac{2AM}{3}, GM=\\frac{AM}{3}"]],"methods":[{"title":"Các đường đồng quy trong tam giác","lead":"Ba trung tuyến gặp ở trọng tâm G; ba phân giác trong gặp ở tâm nội tiếp; ba trung trực gặp ở tâm ngoại tiếp; ba đường cao gặp ở trực tâm. Tâm nội tiếp cách đều các cạnh; tâm ngoại tiếp cách đều các đỉnh.","steps":["Đọc loại đường theo điều kiện","Chọn điểm đồng quy tương ứng","Dùng tỉ số hoặc tính cách đều đúng đối tượng"],"example":"","tip":"","worked":[]},{"title":"Nhận ra điểm cách đều hai đầu đoạn","lead":"Đường trung trực tập hợp các điểm cách đều hai đầu đoạn thẳng.","steps":["Chọn đoạn thẳng có hai đầu xuất hiện trong đẳng thức khoảng cách.","Chỉ ra từng điểm cách đều hai đầu.","Kết luận đường qua hai điểm đó là đường trung trực nếu hai điểm phân biệt."],"example":"MA = MB và NA = NB với M ≠ N thì MN là đường trung trực của AB.","worked":[],"tip":""}],"visuals":[],"table":[],"core":[["Bốn tâm cần phân biệt",["Trọng tâm là giao ba trung tuyến. Trực tâm là giao ba đường cao.","Tâm ngoại tiếp cách đều ba đỉnh; tâm nội tiếp cách đều ba cạnh."],"AG = \\frac{2}{3}AM khi AM là trung tuyến"]],"diagrams":["triangleCenters"]}],"g7-c10":[{"title":"Hình hộp chữ nhật và lập phương","intro":"Đáy hộp có kích thước a, b, chiều cao h. Lập phương có ba kích thước bằng nhau.","formulas":"S_{xq} = 2(a + b)h; S_{tp} = S_{xq} + 2ab; V = abh","short":"","notes":[["","Hộp chữ nhật và lập phương","Hình khai triển gồm các mặt được mở phẳng. Diện tích xung quanh hộp là tổng bốn mặt bên; toàn phần còn gồm hai đáy. Thể tích bằng diện tích đáy nhân chiều cao.","Hộp: S_{xq} = 2(a+b)h; S_{tp} = S_{xq}+2ab; V = abh // Lập phương: S_{xq}=4a²; S_{tp}=6a²; V=a³"]],"methods":[{"title":"Hộp chữ nhật và lập phương","lead":"Hình khai triển gồm các mặt được mở phẳng. Diện tích xung quanh hộp là tổng bốn mặt bên; toàn phần còn gồm hai đáy. Thể tích bằng diện tích đáy nhân chiều cao.","steps":["Xác định các mặt thực sự được sơn hoặc dán","Đổi cạnh cùng đơn vị","Tính diện tích cần dùng hoặc thể tích"],"example":"Hộp không nắp chỉ cộng một mặt đáy vào diện tích xung quanh.","tip":"","worked":[]}],"visuals":[],"table":[],"diagrams":["cubeSolid"]},{"title":"Lăng trụ đứng","intro":"Có hai đáy bằng nhau, song song. Mặt bên là hình chữ nhật. Chiều cao bằng cạnh bên.","formulas":"S_{xq} = C_{đáy}h; V = S_{đáy}h","short":"","notes":[["","","Hai đáy là đa giác bằng nhau nằm trên hai mặt phẳng song song. Mặt bên là hình chữ nhật; cạnh bên bằng chiều cao. Diện tích xung quanh bằng chu vi đáy nhân chiều cao.","S_{xq}=C_{đáy}h; S_{tp}=S_{xq}+2S_{đáy}; V=S_{đáy}h"]],"methods":[{"title":"Lăng trụ đứng","lead":"Hai đáy là đa giác bằng nhau nằm trên hai mặt phẳng song song. Mặt bên là hình chữ nhật; cạnh bên bằng chiều cao. Diện tích xung quanh bằng chu vi đáy nhân chiều cao.","steps":["Xác định hai mặt đáy","Tính diện tích hoặc chu vi đáy đúng theo đề","Nhân với chiều cao vuông góc"],"example":"","tip":"","worked":[]},{"title":"Tính diện tích xung quanh lăng trụ đứng","lead":"Mỗi mặt bên là hình chữ nhật có một chiều bằng chiều cao lăng trụ.","steps":["Tính chu vi đáy.","Nhân với chiều cao lăng trụ.","Nếu đề hỏi toàn phần, cộng diện tích hai đáy."],"example":"Đáy tam giác có các cạnh 5, 5, 6 cm, chiều cao lăng trụ 9 cm. Diện tích xung quanh là 16 × 9 = 144 cm².","worked":[["Ba mặt bên","Đáy là tam giác vuông có hai cạnh góc vuông 3 cm và 4 cm. Lăng trụ đứng cao 8 cm. Tính diện tích xung quanh.",["Cạnh huyền của đáy là 5 cm.","Trải các mặt bên thành ba hình chữ nhật có cùng chiều cao 8 cm. Cộng ba diện tích bằng (3 + 4 + 5)·8."],"S = 96 cm².","Nếu đề yêu cầu diện tích toàn phần, cộng diện tích của cả hai đáy."]],"tip":"","diagram":"prismNet"},{"title":"Thể tích lăng trụ tam giác","lead":"","steps":[],"example":"","tip":"","worked":[["Thể tích lăng trụ tam giác","Lăng trụ đứng có đáy là tam giác vuông cạnh góc vuông 6 cm, 8 cm, chiều cao lăng trụ 11 cm. Tính thể tích.",["Tính diện tích đáy 6 × 8 : 2 = 24 cm².","Xác định 11 cm là khoảng cách giữa hai đáy.","Lấy 24 × 11."],"264 cm³.",""]]},{"title":"Tìm một cạnh đáy từ thể tích lăng trụ","lead":"","steps":["Chia thể tích cho chiều cao lăng trụ để tìm diện tích đáy.","Nếu đáy là tam giác vuông, viết diện tích bằng nửa tích hai cạnh góc vuông.","Tìm cạnh còn thiếu và ghi đơn vị."],"example":"","worked":[],"tip":"","practice":["Lăng trụ đứng cao 9 cm có thể tích 216 cm³. Đáy là tam giác vuông với một cạnh góc vuông dài 6 cm. Tìm cạnh góc vuông kia.","Diện tích đáy bằng 24 cm².","Cạnh góc vuông còn lại dài 2·24 : 6 = 8 cm."]}],"visuals":[],"table":[],"core":[["Lăng trụ đứng",["Mặt bên là hình chữ nhật, cạnh bên bằng chiều cao lăng trụ."],"S_{xq} = C_{đáy}·h // V = S_{đáy}·h"]],"diagrams":["prism"]},{"title":"Diện tích toàn phần","intro":"Cộng hai đáy vào diện tích xung quanh. Đề làm hộp mở hoặc sơn một phần thì chỉ tính mặt được yêu cầu.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[],"diagrams":["prismNet"]}],"g8-c1":[{"title":"Đơn thức và đa thức nhiều biến","intro":"Bậc đơn thức khác 0 là tổng số mũ các biến. Hai đơn thức đồng dạng có cùng phần biến; cộng hoặc trừ bằng cách tính hệ số.","formulas":"","short":"","notes":[["khái niệm","Đơn thức và đơn thức đồng dạng","Đơn thức là biểu thức gồm một số, một biến hoặc tích của số và các lũy thừa với số mũ nguyên không âm của biến. Sau thu gọn, bậc của đơn thức khác 0 là tổng các số mũ. Hai đơn thức đồng dạng có cùng phần biến.","−3x²yz³ có bậc 2+1+3=6"]],"methods":[{"title":"Đơn thức và đơn thức đồng dạng","lead":"Đơn thức là biểu thức gồm một số, một biến hoặc tích của số và các lũy thừa với số mũ nguyên không âm của biến. Sau thu gọn, bậc của đơn thức khác 0 là tổng các số mũ. Hai đơn thức đồng dạng có cùng phần biến.","steps":["Thu gọn phần số và biến","Đọc hệ số, phần biến","Tính bậc hoặc gộp các đơn thức đồng dạng"],"example":"","tip":"","worked":[["Nhóm đúng phần biến","Thu gọn 4x²y − 7xy² + 3x²y.",["Hai hạng tử thứ nhất và thứ ba có cùng phần biến x²y.","Cộng hệ số 4 + 3 = 7. Giữ nguyên hạng tử −7xy²."],"Kết quả là 7x²y − 7xy².","Hai đơn thức cùng bậc chưa chắc đồng dạng."]]}],"visuals":[],"table":[]},{"title":"Thu gọn và bậc đa thức","intro":"Gộp hạng tử đồng dạng rồi tìm bậc lớn nhất còn lại. Hạng tử bậc cao có thể triệt tiêu.","formulas":"","short":"","notes":[["khái niệm","Đa thức và bậc","Đa thức là tổng các đơn thức. Các đơn thức trong tổng là hạng tử. Bậc của đa thức khác 0 là bậc lớn nhất của hạng tử khác 0 sau khi thu gọn.","(x²+2x)−(x²−3)=2x+3 có bậc 1"]],"methods":[{"title":"Đa thức và bậc","lead":"Đa thức là tổng các đơn thức. Các đơn thức trong tổng là hạng tử. Bậc của đa thức khác 0 là bậc lớn nhất của hạng tử khác 0 sau khi thu gọn.","steps":["Bỏ ngoặc đúng dấu","Nhóm hạng tử đồng dạng","Đọc bậc từ biểu thức đã thu gọn"],"example":"","tip":"","worked":[["Thu gọn trước khi đọc bậc","Tìm bậc của P = 5x³y − 5x³y + x²y² − 2x + 1.",["Hai hạng tử x³y triệt tiêu.","Tính tổng số mũ của hạng tử x²y², được 4. Các hạng tử còn lại có bậc thấp hơn."],"P có bậc 4.","Bậc của x²y² bằng 2 + 2, không phải số mũ lớn nhất."]]}],"visuals":[],"table":[],"core":[["Bậc của đa thức",["Thu gọn trước. Bậc của một đơn thức là tổng số mũ của các biến.","Bậc đa thức khác 0 là bậc lớn nhất còn lại."],""]]},{"title":"Cộng, trừ và nhân","intro":"Bỏ ngoặc đúng dấu. Khi nhân đa thức, nhân mỗi hạng tử với mọi hạng tử của đa thức còn lại rồi cộng kết quả.","formulas":"","short":"","notes":[["cách làm","Cộng và trừ đa thức","Cộng các đa thức bằng cách gộp các hạng tử đồng dạng. Khi trừ một đa thức, đổi dấu tất cả hạng tử trong đa thức bị trừ.","P−Q=P+(−Q)"],["định lí","Nhân đa thức","Nhân mỗi hạng tử của đa thức thứ nhất với từng hạng tử của đa thức thứ hai. Khi nhân đơn thức, nhân hệ số và cộng số mũ của các biến giống nhau.","(a+b)(c+d)=ac+ad+bc+bd"],["cách làm","Lập đa thức từ hình","Tính diện tích hoặc chu vi từng phần theo x, rồi ghép hoặc lấy hiệu theo hình. Phần diện tích bị cắt phải trừ cả biểu thức, có ngoặc.","S khung=(x+4)(x+2)−x²=6x+8"]],"methods":[{"title":"Cộng và trừ đa thức","lead":"Cộng các đa thức bằng cách gộp các hạng tử đồng dạng. Khi trừ một đa thức, đổi dấu tất cả hạng tử trong đa thức bị trừ.","steps":["Viết biểu thức có ngoặc","Đổi dấu khi bỏ ngoặc trừ","Gộp đúng phần biến"],"example":"","tip":"","worked":[]},{"title":"Nhân đa thức","lead":"Nhân mỗi hạng tử của đa thức thứ nhất với từng hạng tử của đa thức thứ hai. Khi nhân đơn thức, nhân hệ số và cộng số mũ của các biến giống nhau.","steps":["Lập đủ mọi tích","Kiểm tra dấu và số mũ","Thu gọn hạng tử đồng dạng"],"example":"","tip":"","worked":[]},{"title":"Lập đa thức từ hình","lead":"Tính diện tích hoặc chu vi từng phần theo x, rồi ghép hoặc lấy hiệu theo hình. Phần diện tích bị cắt phải trừ cả biểu thức, có ngoặc.","steps":["Đánh dấu phần giữ và phần bỏ","Viết công thức có ngoặc","Khai triển, thu gọn và ghi đơn vị"],"example":"","tip":"","worked":[]},{"title":"Lập đa thức diện tích từ hình có lối đi","lead":"Độ rộng lối đi làm thay đổi cả hai kích thước của phần trong.","steps":["Viết chiều dài và chiều rộng ngoài, trong theo biến.","Lấy diện tích ngoài trừ diện tích trong.","Khai triển và thu gọn, kèm điều kiện để kích thước trong dương."],"example":"Hình ngoài có kích thước x + 6 và x + 4, lối đi rộng 1 ở cả bốn phía. Diện tích lối đi là (x+6)(x+4) − (x+4)(x+2) = 4x + 16, với x > −2.","worked":[],"tip":""},{"title":"Nhân rồi thu gọn đa thức","lead":"","steps":[],"example":"","tip":"","worked":[["Nhân rồi thu gọn đa thức","Thu gọn 2x(x − y) + x(3y − x).",["Phân phối 2x vào cả hai hạng tử của ngoặc đầu.","Phân phối x vào cả hai hạng tử của ngoặc sau.","Gộp 2x² − 2xy + 3xy − x² theo các hạng tử đồng dạng."],"x² + xy.",""]]},{"title":"Lập đa thức thể tích từ hai khối hộp","lead":"","steps":["Tính thể tích từng khối bằng tích ba kích thước.","Cộng nếu hai khối ghép không chồng lấn.","Khai triển hoặc đặt nhân tử chung theo yêu cầu."],"example":"","worked":[],"tip":"","practice":["Hai khối hộp có kích thước x, x + 2, 3 và x, x + 2, 5, với x > 0. Lập đa thức biểu diễn tổng thể tích.","Cả hai khối có mặt đáy diện tích x(x + 2).","V = x(x + 2)(3 + 5) = 8x² + 16x."]}],"visuals":[],"table":[]},{"title":"Chia cho đơn thức","intro":"Chia từng hạng tử nếu mỗi hạng tử chia hết cho đơn thức chia. Số mũ mỗi biến ở tử phải không nhỏ hơn ở mẫu.","formulas":"","short":"","notes":[["tính chất","Chia đa thức cho đơn thức","Một đơn thức chia hết cho một đơn thức khác 0 nếu số mũ của từng biến ở đơn thức bị chia không nhỏ hơn ở đơn thức chia. Muốn chia đa thức cho đơn thức, chia từng hạng tử.","(6x³y²−4x²y):(2xy)=3x²y−2x"]],"methods":[{"title":"Chia đa thức cho đơn thức","lead":"Một đơn thức chia hết cho một đơn thức khác 0 nếu số mũ của từng biến ở đơn thức bị chia không nhỏ hơn ở đơn thức chia. Muốn chia đa thức cho đơn thức, chia từng hạng tử.","steps":["Kiểm tra từng biến","Chia hệ số và trừ số mũ","Nhân lại để kiểm tra"],"example":"","tip":"","worked":[["Chia từng hạng tử","Tính (12x³y² − 8x²y³) : 4x²y.",["Chia từng hệ số cho 4.","Trừ các số mũ tương ứng khi chia từng phần biến."],"Kết quả là 3xy − 2y².","Kiểm tra bằng cách nhân thương với 4x²y."]]}],"visuals":[],"table":[],"core":[["Chia cho đơn thức",["Mỗi hạng tử phải chia được cho đơn thức chia.","Chia hệ số và trừ số mũ theo từng biến."],""]]}],"g8-c2":[{"title":"Hiệu hai bình phương","intro":"Tách thành tích tổng và hiệu.","formulas":"a² − b² = (a − b)(a + b)","short":"","notes":[],"methods":[{"title":"Rút gọn tổng hiệu hai bình phương liên tiếp","lead":"","steps":["Nhìn các bình phương lặp ở hai số hạng kề.","Mở dấu ngoặc rồi triệt tiêu các hạng giống nhau trái dấu.","Chỉ khai triển hiệu hai bình phương còn lại nếu cần."],"example":"","worked":[],"tip":"","practice":["Rút gọn [(x + 3)² − (x + 2)²] + [(x + 2)² − (x + 1)²].","Hai hạng chứa (x + 2)² triệt tiêu.","Còn (x + 3)² − (x + 1)² = 2(2x + 4) = 4x + 8."]}],"visuals":[],"table":[]},{"title":"Bình phương của tổng, hiệu","intro":"Hạng tử giữa là hai lần tích, mang dấu của phép cộng hoặc trừ.","formulas":"(a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²","short":"","notes":[],"methods":[{"title":"Nhận diện bình phương của hiệu","lead":"","steps":[],"example":"","tip":"","worked":[["Nhận diện bình phương của hiệu","Phân tích 9x² − 12x + 4 thành nhân tử.",["Hai đầu là (3x)² và 2².","Hạng giữa bằng −2·3x·2.","Ghép thành bình phương của hiệu."],"(3x − 2)².",""]]}],"visuals":[],"table":[],"diagrams":["geometricSquare"]},{"title":"Lập phương của tổng và hiệu","intro":"Các hệ số là 1, 3, 3, 1. Với hiệu, dấu lần lượt là +, −, +, −.","formulas":"(a + b)³ = a³ + 3a²b + 3ab² + b³; (a − b)³ = a³ − 3a²b + 3ab² − b³","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Tổng và hiệu hai lập phương","intro":"Bình phương trong ngoặc cuối luôn có hai hạng tử bình phương cùng dấu cộng.","formulas":"a³ + b³ = (a + b)(a² − ab + b²); a³ − b³ = (a − b)(a² + ab + b²)","short":"","notes":[["","Hằng đẳng thức bậc ba","Khai triển lập phương dùng hệ số 1, 3, 3, 1. Tổng và hiệu hai lập phương có một nhân tử bậc nhất và một nhân tử bậc hai; dấu của hạng tử giữa ở nhân tử bậc hai ngược với dấu trong nhân tử bậc nhất.","(a±b)³=a³±3a²b+3ab²±b³ // a³+b³=(a+b)(a²−ab+b²) // a³−b³=(a−b)(a²+ab+b²)"]],"methods":[{"title":"Hằng đẳng thức bậc ba","lead":"Khai triển lập phương dùng hệ số 1, 3, 3, 1. Tổng và hiệu hai lập phương có một nhân tử bậc nhất và một nhân tử bậc hai; dấu của hạng tử giữa ở nhân tử bậc hai ngược với dấu trong nhân tử bậc nhất.","steps":["Xác định đề cho lũy thừa một ngoặc hay tổng hai lũy thừa","Chọn mẫu","Nhân thử để kiểm tra"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Phân tích đa thức thành nhân tử","intro":"Có thể đặt nhân tử chung, dùng hằng đẳng thức hoặc nhóm hạng tử. Chọn phương pháp sau khi quan sát toàn đa thức.","formulas":"","short":"","notes":[["","Phân tích thành nhân tử","Biến một tổng thành tích bằng đặt nhân tử chung, dùng hằng đẳng thức, nhóm hạng tử hoặc phối hợp. Nhân lại phải thu được đa thức ban đầu.","6x²−12x=6x(x−2); x²−4=(x−2)(x+2)"],["bổ sung","Hoàn thành bình phương","Nhìn hạng tử giữa để thêm bớt đúng hằng số. Cách này giúp tìm cực trị đơn giản và nhận dạng nhân tử trong phạm vi đã học.","x²−6x+13=(x−3)²+4≥4"]],"methods":[{"title":"Phân tích thành nhân tử","lead":"Biến một tổng thành tích bằng đặt nhân tử chung, dùng hằng đẳng thức, nhóm hạng tử hoặc phối hợp. Nhân lại phải thu được đa thức ban đầu.","steps":["Đặt nhân tử chung trước","Nhìn dạng hằng đẳng thức hoặc nhóm","Tiếp tục nếu nhân tử còn tách được"],"example":"","tip":"","worked":[]},{"title":"Hoàn thành bình phương","lead":"Nhìn hạng tử giữa để thêm bớt đúng hằng số. Cách này giúp tìm cực trị đơn giản và nhận dạng nhân tử trong phạm vi đã học.","steps":["Chia hệ số của x cho 2 khi hệ số x² là 1","Thêm rồi bớt bình phương vừa tìm","Xét dấu hoặc phân tích"],"example":"","tip":"","worked":[]},{"title":"Tách hạng tử giữa để tạo nhóm chung","lead":"Dùng khi đa thức bậc hai chưa thấy ngay hằng đẳng thức hay nhân tử chung.","steps":["Với ax² + bx + c, tìm m, n có tổng b và tích ac nếu có thể.","Thay bx bằng mx + nx rồi nhóm hai cặp.","Đặt nhân tử chung và nhân ngược để kiểm tra."],"example":"2x² + 7x + 3 = 2x² + 6x + x + 3 = (2x+1)(x+3).","worked":[],"tip":""}],"visuals":[],"table":[],"core":[["Chọn thứ tự phân tích",["Tìm nhân tử chung trước, sau đó thử hằng đẳng thức hoặc nhóm hạng tử.","Nhân ngược để kiểm tra."],""]]}],"g8-c3":[{"title":"Tứ giác và hình thang cân","intro":"Tổng bốn góc trong bằng 360°. Hình thang cân có hai góc kề một đáy bằng nhau và hai đường chéo bằng nhau.","formulas":"","short":"","notes":[["định lí","Tứ giác và tổng góc","Trong tứ giác lồi, một đường chéo chia tứ giác thành hai tam giác; tổng bốn góc trong bằng 360°. Góc ngoài kề bù với góc trong tương ứng.","\\widehat{A}+\\widehat{B}+\\widehat{C}+\\widehat{D}=360°"],["tính chất","Hình thang cân","Hình thang cân có hai góc kề một đáy bằng nhau, hai cạnh bên bằng nhau và hai đường chéo bằng nhau. Một hình thang có hai đường chéo bằng nhau là hình thang cân.","AB∥CD, AC=BD ⇒ ABCD là hình thang cân"]],"methods":[{"title":"Tứ giác và tổng góc","lead":"Trong tứ giác lồi, một đường chéo chia tứ giác thành hai tam giác; tổng bốn góc trong bằng 360°. Góc ngoài kề bù với góc trong tương ứng.","steps":["Xác định góc trong","Lập tổng bốn góc","Dùng bù nếu đề cho góc ngoài"],"example":"","tip":"","worked":[]},{"title":"Hình thang cân","lead":"Hình thang cân có hai góc kề một đáy bằng nhau, hai cạnh bên bằng nhau và hai đường chéo bằng nhau. Một hình thang có hai đường chéo bằng nhau là hình thang cân.","steps":["Xác định hai đáy song song","Dùng cặp góc kề đáy hoặc đường chéo","Kết luận"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"diagrams":["trapezoid"]},{"title":"Hình bình hành","intro":"Hai cặp cạnh đối song song, cạnh đối bằng nhau, góc đối bằng nhau, đường chéo chia đôi nhau. Các dấu hiệu gồm hai cặp cạnh đối bằng nhau hoặc một cặp cạnh đối vừa song song vừa bằng nhau.","formulas":"","short":"","notes":[["tính chất","","Hai cặp cạnh đối song song và bằng nhau, góc đối bằng nhau, hai đường chéo cắt nhau tại trung điểm mỗi đường. Có thể nhận biết từ một cặp cạnh đối vừa song song vừa bằng nhau, hoặc từ việc hai đường chéo chia đôi nhau.","O=AC∩BD, OA=OC và OB=OD ⇒ ABCD là hình bình hành"]],"methods":[{"title":"Hình bình hành","lead":"Hai cặp cạnh đối song song và bằng nhau, góc đối bằng nhau, hai đường chéo cắt nhau tại trung điểm mỗi đường. Có thể nhận biết từ một cặp cạnh đối vừa song song vừa bằng nhau, hoặc từ việc hai đường chéo chia đôi nhau.","steps":["Tìm dấu hiệu khớp dữ kiện","Chứng minh trước khi dùng tính chất","Chỉ ra đúng cặp đối"],"example":"","tip":"","worked":[]}],"visuals":[0],"table":[]},{"title":"Hình chữ nhật","intro":"Bốn góc vuông, đường chéo bằng nhau và chia đôi nhau. Hình bình hành có một góc vuông hoặc hai đường chéo bằng nhau là hình chữ nhật.","formulas":"","short":"","notes":[["tính chất","","Hình chữ nhật có bốn góc vuông và hai đường chéo bằng nhau, chia đôi nhau. Hình bình hành có một góc vuông hoặc có hai đường chéo bằng nhau là hình chữ nhật.","Trong hình chữ nhật: AC=BD và OA=OB=OC=OD"],["định lí","Dấu hiệu nâng cấp hình bình hành","Có một góc vuông hoặc hai đường chéo bằng nhau ⇒ hình chữ nhật. Có hai cạnh kề bằng nhau, hai đường chéo vuông góc hoặc một đường chéo là phân giác một góc ⇒ hình thoi. Có đủ dấu hiệu của cả hai ⇒ hình vuông.","Hình chữ nhật ∩ hình thoi = hình vuông"]],"methods":[{"title":"Hình chữ nhật","lead":"Hình chữ nhật có bốn góc vuông và hai đường chéo bằng nhau, chia đôi nhau. Hình bình hành có một góc vuông hoặc có hai đường chéo bằng nhau là hình chữ nhật.","steps":["Chứng minh hình bình hành nếu cần","Thêm góc vuông hoặc đường chéo bằng nhau","Dùng kết luận"],"example":"","tip":"","worked":[]},{"title":"Dấu hiệu nâng cấp hình bình hành","lead":"Có một góc vuông hoặc hai đường chéo bằng nhau ⇒ hình chữ nhật. Có hai cạnh kề bằng nhau, hai đường chéo vuông góc hoặc một đường chéo là phân giác một góc ⇒ hình thoi. Có đủ dấu hiệu của cả hai ⇒ hình vuông.","steps":["Chứng minh hình bình hành nếu chưa có","Chọn dấu hiệu ngắn nhất","Không đảo tính chất nếu thiếu giả thiết"],"example":"","tip":"","worked":[]},{"title":"Dấu hiệu nhận biết hình chữ nhật","lead":"","steps":[],"example":"","tip":"","worked":[["Dấu hiệu nhận biết hình chữ nhật","Một hình bình hành có hai đường chéo bằng nhau. Giải thích vì sao đó là hình chữ nhật.",["Với hình bình hành ABCD, AD = BC và AC = BD theo đề.","Tam giác ABC và BAD có ba cặp cạnh bằng nhau.","Suy ra \\widehat{ABC} = \\widehat{BAD}. Chúng bù nhau nên đều bằng 90°."],"ABCD là hình chữ nhật.",""]]}],"visuals":[],"table":[],"diagrams":["rectangleDiags"]},{"title":"Hình thoi","intro":"Bốn cạnh bằng nhau. Đường chéo vuông góc, chia đôi nhau và phân giác các góc. Hình bình hành có hai cạnh kề bằng nhau hoặc hai đường chéo vuông góc là hình thoi.","formulas":"","short":"","notes":[["tính chất","Hình thoi và hình vuông","Hình thoi có bốn cạnh bằng nhau. Hai đường chéo vuông góc, chia đôi nhau và là phân giác của các góc tương ứng. Hình vuông vừa là hình chữ nhật vừa là hình thoi.","S thoi=\\frac{d₁d₂}{2}; S vuông=a²"]],"methods":[{"title":"Hình thoi và hình vuông","lead":"Hình thoi có bốn cạnh bằng nhau. Hai đường chéo vuông góc, chia đôi nhau và là phân giác của các góc tương ứng. Hình vuông vừa là hình chữ nhật vừa là hình thoi.","steps":["Chọn dấu hiệu hình thoi hoặc hình chữ nhật","Kiểm tra điều kiện bổ sung để thành hình vuông"],"example":"","tip":"","worked":[]},{"title":"Từ hình bình hành đến hình thoi bằng đường chéo","lead":"Hai đường chéo vuông góc là dấu hiệu đủ khi đã biết hình bình hành.","steps":["Chứng minh tứ giác là hình bình hành.","Gọi O là giao điểm đường chéo và lấy tính chất trung điểm.","Dùng vuông góc để chứng minh hai cạnh kề bằng nhau hoặc áp dụng dấu hiệu nhận biết."],"example":"Trong hình bình hành ABCD, AC ⊥ BD. Do O là trung điểm BD, AC là đường trung trực BD, nên AB = AD. Suy ra ABCD là hình thoi.","worked":[],"tip":""}],"visuals":[],"table":[],"core":[["Dấu hiệu qua đường chéo",["Hình bình hành có hai đường chéo bằng nhau là hình chữ nhật.","Hình bình hành có hai đường chéo vuông góc là hình thoi.","Hình vuông vừa là hình chữ nhật vừa là hình thoi."],""]],"diagrams":["rhombus"]},{"title":"Hình vuông","intro":"Vừa là hình chữ nhật vừa là hình thoi. Có thể nhận từ hình chữ nhật có hai cạnh kề bằng nhau hoặc hình thoi có một góc vuông.","formulas":"","short":"","notes":[],"methods":[{"title":"Phân loại tứ giác từ hai đường chéo","lead":"","steps":["Kiểm tra hai đường chéo có cắt nhau tại trung điểm mỗi đường để nhận ra hình bình hành.","Xét thêm tính bằng nhau và vuông góc của hai đường chéo.","Nêu loại tứ giác mạnh nhất được suy ra."],"example":"","worked":[],"tip":"","practice":["Hai đường chéo của tứ giác cắt nhau tại trung điểm mỗi đường, bằng nhau và vuông góc. Tứ giác đó là hình gì?","Một hình bình hành có đường chéo bằng nhau là hình chữ nhật, có đường chéo vuông góc là hình thoi.","Hình vuông vì đồng thời là hình chữ nhật và hình thoi."]}],"visuals":[],"table":[],"diagrams":["squareDiags"]}],"g8-c4":[{"title":"Định lí Thalès và đảo","intro":"Nếu M thuộc AB, N thuộc AC và MN song song BC thì các đoạn tương ứng tỉ lệ. Đảo: hai tỉ số tương ứng bằng nhau thì suy ra song song.","formulas":"\\frac{AM}{AB} = \\frac{AN}{AC}; \\frac{AM}{MB} = \\frac{AN}{NC}","short":"","notes":[["","Định lí Thalès và định lí đảo","Trong ΔABC, M ∈ AB và N ∈ AC. Nếu MN ∥ BC thì các đoạn tương ứng tỉ lệ. Ngược lại, nếu hai tỉ số tương ứng bằng nhau thì MN ∥ BC. Có thể dùng hệ quả để tính MN theo BC.","\\frac{AM}{AB}=\\frac{AN}{AC}=\\frac{MN}{BC} // \\frac{AM}{MB}=\\frac{AN}{NC}"],["cách làm","Dùng định lí đảo khi dữ kiện là hai tỉ số","Tỉ số phần trên toàn bộ khác phần trên phần còn lại. Chọn các đoạn nằm trên cùng hai tia xuất phát từ A.","\\frac{AM}{AB}=\\frac{AN}{AC} ⇒ MN∥BC"]],"methods":[{"title":"Định lí Thalès và định lí đảo","lead":"Trong ΔABC, M ∈ AB và N ∈ AC. Nếu MN ∥ BC thì các đoạn tương ứng tỉ lệ. Ngược lại, nếu hai tỉ số tương ứng bằng nhau thì MN ∥ BC. Có thể dùng hệ quả để tính MN theo BC.","steps":["Đánh dấu đúng hai cạnh đi từ A","Ghép phần với phần hoặc phần với toàn bộ","Dùng định lí thuận để tính, đảo để chứng minh song song"],"example":"","tip":"","worked":[]},{"title":"Dùng định lí đảo khi dữ kiện là hai tỉ số","lead":"Tỉ số phần trên toàn bộ khác phần trên phần còn lại. Chọn các đoạn nằm trên cùng hai tia xuất phát từ A.","steps":["Viết hai tỉ số bằng kí hiệu trước","Đổi về cùng kiểu","Kiểm tra bằng nhau rồi kết luận"],"example":"AM=3, AB=9, AN=4, AC=12. Cả hai tỉ số bằng \\frac{1}{3}, nên MN∥BC.","tip":"","worked":[]},{"title":"Dùng định lí Thalès đảo","lead":"","steps":[],"example":"","tip":"","worked":[["Dùng định lí Thalès đảo","D nằm giữa A, B; E nằm giữa A, C. AD = 4 cm, AB = 10 cm, AE = 6 cm, AC = 15 cm. DE có song song BC không?",["Tính \\frac{AD}{AB} = \\frac{4}{10} = \\frac{2}{5}.","Tính \\frac{AE}{AC} = \\frac{6}{15} = \\frac{2}{5}.","Hai tỉ số tính từ cùng đỉnh A bằng nhau và D, E nằm đúng trên các cạnh."],"DE ∥ BC theo định lí Thalès đảo.",""]]},{"title":"Chứng minh hai đường thẳng song song bằng Thalès","lead":"","steps":["Kiểm tra E ∈ AB và F ∈ AC trong tam giác ABC.","Tính hai tỉ số \\frac{AE}{AB} và \\frac{AF}{AC} từ cùng đỉnh A.","Hai tỉ số bằng nhau thì áp dụng định lí Thalès đảo, suy ra EF ∥ BC."],"tip":"AM là trung tuyến, G là trọng tâm thì AG = \\frac{2}{3}AM. Tỉ lệ này chỉ dùng khi đã xác định đúng trung tuyến và trọng tâm.","example":"AE = 3, AB = 6, AF = 4, AC = 8. Hai tỉ số đều bằng \\frac{1}{2}, nên EF ∥ BC.","worked":[],"diagram":"thales"}],"visuals":[],"table":[],"core":[["Thalès thuận và đảo",["Trên hai cạnh cùng xuất phát từ A, xét hai điểm E ∈ AB và F ∈ AC.","Song song cho tỉ số; tỉ số tương ứng bằng nhau cho song song khi các điểm đúng vị trí."],"EF ∥ BC ⇔ \\frac{AE}{AB} = \\frac{AF}{AC}"]],"diagrams":["thales"]},{"title":"Hệ quả","intro":"Đường song song với một cạnh cắt hai cạnh còn lại tạo tam giác có ba cạnh tương ứng tỉ lệ.","formulas":"\\frac{AM}{AB} = \\frac{AN}{AC} = \\frac{MN}{BC}","short":"","notes":[],"methods":[{"title":"Tính đoạn song song bằng hệ quả Thalès","lead":"","steps":["Kiểm tra đoạn đã cho song song cạnh đối diện của tam giác.","Lập tỉ số đoạn song song với cạnh đáy bằng tỉ số hai cạnh tương ứng từ đỉnh.","Thế số và kiểm tra đoạn trong tam giác nhỏ hơn cạnh đáy."],"example":"","worked":[],"tip":"","practice":["Trong tam giác ABC, M thuộc AB, N thuộc AC và MN ∥ BC. Biết AM = 4 cm, MB = 2 cm, BC = 9 cm. Tính MN.","AB = 6 cm. Dùng \\frac{MN}{BC} = \\frac{AM}{AB}.","MN = 6 cm."],"diagram":"practiceThales"}],"visuals":[],"table":[],"diagrams":["practiceThales"]},{"title":"Đường trung bình","intro":"Nối trung điểm hai cạnh tam giác, song song và bằng một nửa cạnh còn lại.","formulas":"MN ∥ BC; MN = \\frac{BC}{2}","short":"","notes":[["","Đường trung bình của tam giác","Đường trung bình nối trung điểm hai cạnh của tam giác, song song và bằng một nửa cạnh thứ ba. Đường qua trung điểm một cạnh và song song với cạnh thứ hai đi qua trung điểm cạnh còn lại.","MN ∥ BC; MN=\\frac{BC}{2}"]],"methods":[{"title":"Đường trung bình của tam giác","lead":"Đường trung bình nối trung điểm hai cạnh của tam giác, song song và bằng một nửa cạnh thứ ba. Đường qua trung điểm một cạnh và song song với cạnh thứ hai đi qua trung điểm cạnh còn lại.","steps":["Tìm hai trung điểm trong cùng tam giác","Chỉ ra cạnh thứ ba","Suy song song hoặc độ dài"],"example":"","tip":"","worked":[["Tìm cạnh đáy từ đường trung bình","M, N là trung điểm AB, AC trong hình. Biết MN = 8 cm. Tính BC.",["Đọc hai giả thiết trung điểm để xác định MN là đường trung bình.","Viết MN = \\frac{1}{2}BC, rồi nhân hai vế với 2."],"BC = 16 cm.","Nếu chỉ biết MN ∥ BC, cần thêm dữ kiện mới kết luận được tỉ số \\frac{1}{2}."]],"diagram":"midline"}],"visuals":[],"table":[],"diagrams":["midline"]},{"title":"Đường phân giác","intro":"Phân giác AD của tam giác ABC chia cạnh đối diện BC theo tỉ lệ hai cạnh kề.","formulas":"\\frac{BD}{DC} = \\frac{AB}{AC}","short":"","notes":[["","Tính chất đường phân giác","Phân giác trong của \\widehat{A} cắt BC tại D và chia BC theo tỉ lệ hai cạnh kề tương ứng. Không được đổi thứ tự B và C giữa hai tỉ số.","\\frac{BD}{DC}=\\frac{AB}{AC}; BD+DC=BC"],["bổ sung","Tìm nhanh hai phần từ tổng và tỉ lệ","Có BD:DC=AB:AC và BC=BD+DC. Phần BD ứng với AB; phần DC ứng với AC.","BD=\\frac{AB}{AB+AC}·BC; DC=\\frac{AC}{AB+AC}·BC"]],"methods":[{"title":"Tính chất đường phân giác","lead":"Phân giác trong của \\widehat{A} cắt BC tại D và chia BC theo tỉ lệ hai cạnh kề tương ứng. Không được đổi thứ tự B và C giữa hai tỉ số.","steps":["Xác định đỉnh phân giác","Lập tỉ số đúng","Dùng tổng BC để tìm hai phần"],"example":"","tip":"","worked":[]},{"title":"Tìm nhanh hai phần từ tổng và tỉ lệ","lead":"Có BD:DC=AB:AC và BC=BD+DC. Phần BD ứng với AB; phần DC ứng với AC.","steps":["Lập đúng thứ tự","Cộng số phần","Nhân tổng với phần cần tìm"],"example":"","tip":"","worked":[]},{"title":"Chia cạnh theo đường phân giác","lead":"Tỉ lệ hai đoạn trên cạnh đối ứng với hai cạnh kề góc bị chia.","steps":["Chỉ rõ góc được chia và cạnh đối.","Lập \\frac{BD}{DC} = \\frac{AB}{AC} khi AD là phân giác trong.","Dùng tổng BD + DC = BC để tìm một phần rồi suy độ dài."],"example":"AB = 6, AC = 9, BC = 20 thì BD : DC = 2 : 3, nên BD = 8 và DC = 12.","worked":[],"tip":""}],"visuals":[],"table":[],"core":[["Tỉ số do phân giác trong",["Nếu AD là tia phân giác của góc A và D thuộc BC, ghép các cạnh kề với đoạn cùng phía."],"\\frac{DB}{DC} = \\frac{AB}{AC}"]],"diagrams":["bisector"]}],"g8-c5":[{"title":"Dữ liệu và kiểm tra","intro":"Phân biệt dữ liệu số và phân loại, có thứ tự hoặc không. Kiểm tra đơn vị, phạm vi và tính đại diện của mẫu.","formulas":"","short":"","notes":[["","Dữ liệu và biểu đồ","Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","Góc ở tâm = tỉ lệ × 360° // Tỉ lệ = \\frac{số của nhóm}{tổng số}"]],"methods":[{"title":"Dữ liệu và biểu đồ","lead":"Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","steps":["Đọc tên, đơn vị và thang chia","Xác định nhóm hoặc thời điểm đang hỏi","So sánh hoặc tính tỉ lệ"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Chọn biểu đồ","intro":"Cột hoặc cột kép để so sánh nhóm. Quạt tròn để thể hiện phần của toàn thể. Đoạn thẳng để thể hiện xu hướng có thứ tự.","formulas":"","short":"","notes":[],"methods":[],"visuals":[0],"table":[],"diagrams":["fan","timeSeries"]},{"title":"Đọc và phát hiện sai lệch","intro":"Xem điểm gốc, vạch chia và đơn vị. Trục tung bị cắt có thể làm chênh lệch trông lớn hơn thực tế.","formulas":"Góc quạt = tỉ lệ × 360°","short":"","notes":[],"methods":[{"title":"Phát hiện biểu đồ cột gây hiểu nhầm","lead":"Cột có thể trông chênh nhiều vì trục tung bắt đầu ở một giá trị dương.","steps":["Đọc giá trị trên trục, kể cả điểm bắt đầu.","Tính chênh lệch và tỉ lệ từ số thật.","So sánh với cách biểu diễn có trục bắt đầu từ 0."],"example":"Giá trị 92 và 94 chỉ chênh 2. Nếu trục bắt đầu ở 90, hai phần cột nhìn thấy có chiều cao 2 và 4.","worked":[],"tip":""},{"title":"Đọc tỉ trọng từ biểu đồ tròn","lead":"","steps":[],"example":"","tip":"","worked":[["Đọc tỉ trọng từ biểu đồ tròn","Nhóm A chiếm 40% trong 150 học sinh, nhóm B chiếm 26%. Nhóm A nhiều hơn nhóm B bao nhiêu?",["Tìm hiệu tỉ trọng, 40% − 26% = 14 điểm phần trăm.","Áp dụng 14% lên tổng 150 vì hai nhóm cùng thuộc tổng đó.","Tính 0,14 × 150."],"21 học sinh.",""]]},{"title":"Đổi từ tỉ lệ trên biểu đồ sang số lượng","lead":"","steps":["Xác định tổng số đối tượng của biểu đồ.","Đổi góc ở tâm hoặc tỉ lệ phần trăm thành phân số của tổng.","Nhân với tổng và kiểm tra tính nguyên của số lượng."],"example":"","worked":[],"tip":"","practice":["Biểu đồ quạt tròn biểu diễn 80 học sinh. Nhóm A ứng với quạt 126°. Hỏi nhóm A có bao nhiêu học sinh?","Quạt A chiếm \\frac{126}{360} = 35%.","Nhóm A có 28 học sinh."],"diagram":"practiceSector"}],"visuals":[],"table":[],"core":[["Kiểm tra biểu đồ",["So số liệu thật và đơn vị trên trục.","Trục tung bị cắt có thể làm chênh lệch trông lớn hơn."],""]]}],"g8-c6":[{"title":"Điều kiện xác định","intro":"Mẫu của phân thức phải khác 0. Ghi điều kiện từ biểu thức ban đầu trước khi rút gọn.","formulas":"","short":"","notes":[["cách làm","Lập miền xác định trước khi khử","Rút gọn \\frac{x²−9}{x−3} thành x+3 chỉ đúng với x≠3. Khi chia hai phân thức, loại thêm giá trị làm tử số của phân thức chia bằng 0.","\\frac{x²−9}{x−3}=x+3, x≠3"]],"methods":[{"title":"Lập miền xác định trước khi khử","lead":"Rút gọn \\frac{x²−9}{x−3} thành x+3 chỉ đúng với x≠3. Khi chia hai phân thức, loại thêm giá trị làm tử số của phân thức chia bằng 0.","steps":["Tách mọi mẫu thành nhân tử","Liệt kê giá trị loại","Tính rồi giữ điều kiện trong kết luận"],"example":"","tip":"","worked":[["Giá trị bị loại không quay lại","Rút gọn \\frac{x²−16}{x−4} và tính giá trị tại x = 4 nếu có.",["Mẫu ban đầu x − 4 phải khác 0.","Viết x² − 16 = (x − 4)(x + 4) và khử x − 4 với x ≠ 4."],"Biểu thức rút gọn là x + 4 với x ≠ 4. Tại x = 4, phân thức ban đầu không xác định.","Ghi điều kiện trước khi rút gọn."]]},{"title":"Tìm giá trị nguyên làm phân thức nguyên","lead":"","steps":["Ghi điều kiện mẫu khác 0.","Tách phân thức thành số nguyên cộng một phân thức có tử là số nguyên cố định nếu làm được.","Liệt kê các ước nguyên của tử rồi đối chiếu điều kiện."],"example":"","worked":[],"tip":"","practice":["Tìm x nguyên để \\frac{x+5}{x−1} nhận giá trị nguyên.","Viết \\frac{x+5}{x−1} = 1 + \\frac{6}{x−1}, với x ≠ 1.","x − 1 ∈ {−6; −3; −2; −1; 1; 2; 3; 6}. Suy ra x ∈ {−5; −2; −1; 0; 2; 3; 4; 7}."]}],"visuals":[],"table":[],"core":[["Giữ điều kiện ban đầu",["Liệt kê nghiệm làm mẫu bằng 0 trước khi rút gọn. Khử nhân tử chung vẫn giữ điều kiện xác định ban đầu."],"\\frac{x²−4}{x−2} = x + 2 với x ≠ 2"]]},{"title":"Tính chất và quy đồng","intro":"Nhân hoặc chia tử và mẫu cho cùng nhân tử khác 0 thì giá trị giữ nguyên. Phân tích các mẫu thành nhân tử để tìm mẫu chung.","formulas":"","short":"","notes":[["","Phân thức đại số","Phân thức \\frac{A}{B} có B khác đa thức 0; khi thay biến, mẫu phải khác 0. Nhân hoặc chia cả tử và mẫu cho cùng nhân tử khác 0 không đổi giá trị. Cộng trừ quy đồng; chia thêm điều kiện phân thức chia khác 0.","\\frac{A}{B}+\\frac{C}{D}=\\frac{AD+BC}{BD} // \\frac{A}{B}:\\frac{C}{D}=\\frac{AD}{BC}, B,C,D ≠ 0"]
