ác chữ số cùng hàng thẳng cột","Cộng từ phải sang trái","Nhớ sang hàng kế tiếp nếu cần"],"example":"8 + 7 = 8 + 2 + 5 = 15.","tip":"","worked":[]},{"title":"Phép trừ","lead":"Dùng để tìm phần còn lại hoặc chênh lệch. Nếu chữ số ở hàng đang xét không đủ trừ, đổi một đơn vị của hàng bên trái thành 10 đơn vị của hàng đó.","steps":["Đặt thẳng các hàng","Trừ từ phải sang trái, có thể đổi chục hoặc trăm","Lấy hiệu cộng số trừ để kiểm tra"],"example":"63 − 27 = 36 vì 36 + 27 = 63.","tip":"","worked":[]},{"title":"Trừ qua nhiều hàng 0","lead":"","steps":[],"example":"","tip":"","worked":[["Trừ qua nhiều hàng 0","Tính 40 002 − 1876.",["Đặt thẳng từng hàng.","Đổi từ hàng chục nghìn qua các hàng đang có 0 để đủ trừ hàng đơn vị. Kết quả từ phải sang trái là 6, 2, 1, 8, 3.","Thử 38 126 + 1876 = 40 002."],"38 126.",""]]}],"visuals":[],"table":[]},{"title":"Tính bằng bù","intro":"Muốn trừ số sát số tròn, trừ số tròn rồi điều chỉnh.","formulas":"53 000 − 999 = 53 000 − 1000 + 1","short":"","notes":[],"methods":[],"visuals":[],"table":[]}],"g3-c13":[{"title":"Xem đồng hồ","intro":"Một giờ có 60 phút. Có thể tách khoảng thời gian tại một giờ tròn.","formulas":"9:45 đến 10:20 là 15 + 20 = 35 phút","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Tháng và năm","intro":"Một năm có 12 tháng. Tháng 4, 6, 9, 11 có 30 ngày; tháng 2 có 28 hoặc 29 ngày; các tháng còn lại có 31 ngày.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Tiền Việt Nam","intro":"Cộng giá các món rồi tính chênh lệch với tiền đã đưa.","formulas":"Tiền thừa = số tiền đưa − tổng giá","short":"","notes":[["","Tính tiền","Tính tổng giá mua rồi lấy tiền đưa trừ tổng. Một nghìn đồng bằng 1000 đồng; viết tất cả về cùng đơn vị để tránh sai hàng.","Tiền trả lại = tiền đưa − tiền phải trả"]],"methods":[{"title":"Tính tiền","lead":"Tính tổng giá mua rồi lấy tiền đưa trừ tổng. Một nghìn đồng bằng 1000 đồng; viết tất cả về cùng đơn vị để tránh sai hàng.","steps":["Tính giá từng nhóm món","Cộng tổng","So với tiền đã đưa"],"example":"","tip":"","worked":[]},{"title":"Tính tiền thừa","lead":"","steps":[],"example":"","tip":"","worked":[["Tính tiền thừa","Có 50 000 đồng. Mua một bút 13 000 đồng và một vở 18 000 đồng. Còn bao nhiêu?",["Cộng số tiền phải trả, 13 000 + 18 000 = 31 000 đồng.","Lấy 50 000 − 31 000.","Kiểm tra tổng tiền mua và tiền thừa."],"19 000 đồng.",""]]}],"visuals":[],"table":[]}],"g3-c14":[{"title":"Nhân và chia trong 100 000","intro":"Có thể tách số theo hàng để nhẩm. Chia lần lượt từ trái sang phải, ghi 0 ở vị trí cần thiết.","formulas":"30 024 : 3 = 10 008","short":"","notes":[["","Phép nhân","Phép nhân gộp các nhóm có số lượng bằng nhau. Hai số đem nhân là thừa số; kết quả là tích. Thừa số chưa biết bằng tích chia cho thừa số đã biết khác 0.","a × b = tổng của b số hạng đều bằng a"]],"methods":[{"title":"Phép nhân","lead":"Phép nhân gộp các nhóm có số lượng bằng nhau. Hai số đem nhân là thừa số; kết quả là tích. Thừa số chưa biết bằng tích chia cho thừa số đã biết khác 0.","steps":["Tìm số nhóm và số vật mỗi nhóm","Nhân hai số","Dùng bảng nhân hoặc đặt tính để kiểm tra"],"example":"Có 4 túi, mỗi túi 6 quả: 6 × 4 = 24 quả.","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Kiểm tra chia có dư","intro":"Nhân số chia với thương rồi cộng số dư.","formulas":"a = b × q + r, với 0 ≤ r < b","short":"","notes":[["","Phép chia và số dư","Có thể chia đều theo số nhóm, hoặc tìm số nhóm khi biết lượng trong mỗi nhóm. Khi chia có dư, số dư nhỏ hơn số chia.","Số bị chia = số chia × thương + số dư"]],"methods":[{"title":"Phép chia và số dư","lead":"Có thể chia đều theo số nhóm, hoặc tìm số nhóm khi biết lượng trong mỗi nhóm. Khi chia có dư, số dư nhỏ hơn số chia.","steps":["Chọn ý nghĩa của thương","Chia từ hàng lớn đến hàng nhỏ nếu đặt tính","Xử lí dư theo câu hỏi"],"example":"25 người, xe chở 4 người: 25 : 4 được 6 dư 1, cần 7 xe.","tip":"","worked":[]},{"title":"Kiểm tra phép chia có dư","lead":"","steps":[],"example":"","tip":"","worked":[["Kiểm tra phép chia có dư","Tính 53 427 : 5.",["Chia từ hàng lớn đến nhỏ để được thương 10 685.","Tính 53 427 − 5 × 10 685 = 2.","So 2 với 5, số dư nhỏ hơn số chia."],"Thương 10 685, dư 2.",""]]}],"visuals":[],"table":[]}],"g3-c15":[{"title":"Thu thập và đọc dữ liệu","intro":"Đếm theo từng nhóm. Khi cập nhật, chỉ sửa nhóm có dữ liệu mới rồi tính lại tổng.","formulas":"","short":"","notes":[],"methods":[],"visuals":[0],"table":[]},{"title":"Khả năng xảy ra","intro":"Dựa vào những kết quả có thể rút được để phân loại chắc chắn, có thể, không thể.","formulas":"| Hộp chỉ có thẻ đỏ thì rút thẻ đỏ là chắc chắn.","short":"","notes":[],"methods":[{"title":"Điều có thể xảy ra","lead":"","steps":[],"example":"","tip":"","worked":[["Điều có thể xảy ra","Túi có 5 bi xanh và 1 bi đỏ. Lấy ngẫu nhiên một bi. Có chắc lấy được bi xanh không?",["Liệt kê màu của bi có trong túi.","Lấy bi xanh được vì túi có bi xanh.","Lấy bi đỏ cũng được vì vẫn còn bi đỏ."],"Có thể lấy được bi xanh.","Có nhiều bi xanh hơn chỉ làm kết quả đó dễ xảy ra hơn."]]}],"visuals":[],"table":[]}],"g3-c16":[{"title":"Số và tính toán","intro":"Phân tích số theo hàng. Thực hiện ngoặc trước, nhân chia trước cộng trừ. Với chia có dư, kiểm tra dư bé hơn số chia.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Hình và đo","intro":"Chu vi đo đường bao, diện tích đo phần mặt. Đổi về cùng đơn vị trước khi áp dụng công thức.","formulas":"P chữ nhật = 2(a + b); S chữ nhật = ab","short":"","notes":[["","Chu vi và diện tích","Chu vi là tổng độ dài đường bao; diện tích là số đơn vị vuông phủ kín phần mặt. Khi ghép mảnh không chồng lấn, diện tích cộng được, còn cạnh ghép chung không thuộc chu vi ngoài.","P chữ nhật = 2(a + b); S chữ nhật = ab; P vuông = 4a; S vuông = a²"]],"methods":[{"title":"Chu vi và diện tích","lead":"Chu vi là tổng độ dài đường bao; diện tích là số đơn vị vuông phủ kín phần mặt. Khi ghép mảnh không chồng lấn, diện tích cộng được, còn cạnh ghép chung không thuộc chu vi ngoài.","steps":["Đổi các kích thước về cùng đơn vị","Xác định đề hỏi đường bao hay mặt","Chọn công thức và ghi đơn vị đúng"],"example":"","tip":"","worked":[]},{"title":"Ôn phép tính và đơn vị","lead":"","steps":[],"example":"","tip":"","worked":[["Ôn phép tính và đơn vị","6 cuộn dây, mỗi cuộn 75 cm. Dùng 3 m. Còn bao nhiêu xăng-ti-mét?",["Tính 6 × 75 = 450 cm.","Đổi 3 m = 300 cm.","Lấy 450 − 300."],"150 cm.",""]]}],"visuals":[],"table":[]},{"title":"Dữ liệu và khả năng","intro":"Kiểm tra chú giải và tổng số lượt. Một kết quả đã xuất hiện nhiều lần chưa đảm bảo xuất hiện ở lượt tiếp.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]}],"g4-c1":[{"title":"Số tự nhiên","intro":"Xác định giá trị theo hàng, so sánh từ hàng cao. Chữ số tận cùng cho biết số chẵn hay lẻ.","formulas":"Số chẵn có tận cùng 0, 2, 4, 6, 8","short":"","notes":[["","Số chẵn và số lẻ","Số tự nhiên chẵn chia hết cho 2; số lẻ chia 2 dư 1. Chỉ cần xét chữ số tận cùng.","Chẵn: 0, 2, 4, 6, 8; lẻ: 1, 3, 5, 7, 9"]],"methods":[{"title":"Số chẵn và số lẻ","lead":"Số tự nhiên chẵn chia hết cho 2; số lẻ chia 2 dư 1. Chỉ cần xét chữ số tận cùng.","steps":["Đọc chữ số đơn vị","Xác định nhóm chẵn hay lẻ","Kiểm tra bằng cách ghép cặp"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Bốn phép tính","intro":"Tính trong ngoặc trước; nhân chia trước cộng trừ. Phép cùng mức thực hiện từ trái qua phải.","formulas":"12 + 8 × 5 = 52; (12 + 8) × 5 = 100","short":"","notes":[["","Thứ tự thực hiện phép tính","Tính trong ngoặc trước. Sau đó tính lũy thừa nếu có, rồi nhân, chia, rồi cộng, trừ. Các phép cùng mức thực hiện từ trái sang phải.","8 + 2 × 5 = 18; (8 + 2) × 5 = 50"]],"methods":[{"title":"Thứ tự thực hiện phép tính","lead":"Tính trong ngoặc trước. Sau đó tính lũy thừa nếu có, rồi nhân, chia, rồi cộng, trừ. Các phép cùng mức thực hiện từ trái sang phải.","steps":["Đánh dấu ngoặc và phép tính ưu tiên","Mỗi dòng rút gọn một bước","Giữ nguyên phần chưa tính"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Bài toán nhiều bước","intro":"Xác định đại lượng cần tìm ở mỗi bước. Dùng phép tính ngược để kiểm tra kết quả.","formulas":"","short":"","notes":[["","Bài toán lời văn","Câu hỏi chỉ rõ đại lượng phải tìm. Khi có nhiều dữ kiện, tách thành các bước có câu trả lời trung gian. Chọn phép tính theo mối quan hệ thực tế.","Tổng = các phần cộng lại; phần còn lại = tổng − phần đã dùng"]],"methods":[{"title":"Bài toán lời văn","lead":"Câu hỏi chỉ rõ đại lượng phải tìm. Khi có nhiều dữ kiện, tách thành các bước có câu trả lời trung gian. Chọn phép tính theo mối quan hệ thực tế.","steps":["Tóm tắt số đã có và số cần tìm","Chọn bước tìm trước","Ghi lời giải, phép tính và đơn vị"],"example":"Có 20 bút, cho 6 rồi được thêm 3: còn 20 − 6 + 3 = 17 bút.","tip":"","worked":[]},{"title":"Tìm hai số qua tổng và hiệu","lead":"","steps":[],"example":"","tip":"","worked":[["Tìm hai số qua tổng và hiệu","Hai hộp có 48 bút, hộp thứ nhất nhiều hơn hộp thứ hai 12 bút. Tìm số bút mỗi hộp.",["Bỏ riêng 12 bút hơn ra khỏi hộp thứ nhất.","Chia đều 48 − 12 = 36 bút, mỗi phần 18 bút.","Trả lại 12 bút cho hộp thứ nhất."],"Hộp thứ nhất 30 bút, hộp thứ hai 18 bút.",""]]}],"visuals":[],"table":[]}],"g4-c2":[{"title":"Đo góc","intro":"Đặt tâm thước ở đỉnh, một cạnh đi qua vạch 0, đọc cạnh còn lại trên đúng thang. Kéo dài tia để đo khi cần; số đo không đổi.","formulas":"","short":"","notes":[["cách làm","Đọc đúng thang số trên thước đo góc","Một cạnh góc phải đi qua vạch 0 của thang được dùng. Nếu thấy hai số ở cùng một vạch, đọc số thuộc thang bắt đầu ở cạnh thứ nhất.","0°<góc nhọn<90°; 90°<góc tù<180°"]],"methods":[{"title":"Đọc đúng thang số trên thước đo góc","lead":"Một cạnh góc phải đi qua vạch 0 của thang được dùng. Nếu thấy hai số ở cùng một vạch, đọc số thuộc thang bắt đầu ở cạnh thứ nhất.","steps":["Đặt tâm thước ở đỉnh","Căn vạch 0","Đọc tia thứ hai và kiểm tra loại góc"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Phân loại góc","intro":"Góc nhọn bé hơn 90°. Góc vuông bằng 90°. Góc tù nằm giữa 90° và 180°. Góc bẹt bằng 180°.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Tách góc","intro":"Tia nằm trong góc chia góc thành hai phần. Số đo góc lớn bằng tổng hai phần.","formulas":"Nếu ∠xOy vuông và ∠xOz = 30° thì ∠zOy = 60°","short":"","notes":[],"methods":[{"title":"Tách góc vuông","lead":"","steps":[],"example":"","tip":"","worked":[["Tách góc vuông","Tia OC nằm trong góc vuông AOB. Góc AOC bằng 34°. Tính góc COB và phân loại.",["Vì OC nằm giữa OA và OB, hai góc nhỏ cộng lại bằng góc AOB.","Tính 90° − 34° = 56°.","So 56° với 0° và 90°."],"Góc COB bằng 56°, là góc nhọn.",""]]}],"visuals":[0],"table":[]}],"g4-c3":[{"title":"Lớp và hàng","intro":"Từ phải sang trái là lớp đơn vị, lớp nghìn, lớp triệu, mỗi lớp gồm ba hàng.","formulas":"5 025 130 = 5 000 000 + 25 000 + 130","short":"","notes":[["","Giá trị theo hàng","Từ phải sang trái lần lượt là đơn vị, chục, trăm, nghìn, … Mỗi đơn vị của một hàng gấp 10 lần đơn vị hàng liền bên phải. Chữ số 0 giữ vị trí hàng trống.","407 = 400 + 0 + 7"]],"methods":[{"title":"Giá trị theo hàng","lead":"Từ phải sang trái lần lượt là đơn vị, chục, trăm, nghìn, … Mỗi đơn vị của một hàng gấp 10 lần đơn vị hàng liền bên phải. Chữ số 0 giữ vị trí hàng trống.","steps":["Đánh dấu hàng từ phải qua trái","Đọc chữ số được hỏi","Nhân với giá trị hàng nếu đề hỏi giá trị"],"example":"Chữ số 4 trong 407 có giá trị 400.","tip":"","worked":[]},{"title":"Phân biệt chữ số và giá trị","lead":"","steps":[],"example":"","tip":"","worked":[["Phân biệt chữ số và giá trị","Chữ số 7 ở hai vị trí trong 7 307 024 có giá trị nào?",["Chữ số 7 đầu tiên nằm ở hàng triệu.","Chữ số 7 tiếp theo nằm ở hàng nghìn.","Nhân mỗi chữ số với giá trị hàng tương ứng."],"7 000 000 và 7000.",""]]}],"visuals":[],"table":[]},{"title":"Làm tròn","intro":"Nhìn hàng ngay bên phải hàng cần làm tròn, từ 5 thì tăng 1, dưới 5 thì giữ.","formulas":"749 999 ≈ 700 000 đến hàng trăm nghìn","short":"","notes":[["","Làm tròn và ước lượng","Chọn hàng cần làm tròn. Chữ số ngay bên phải từ 5 trở lên thì tăng hàng đang xét một đơn vị, còn lại giữ nguyên. Thay các hàng thấp hơn bằng 0 khi làm tròn số nguyên.","347 ≈ 350 đến hàng chục; 347 ≈ 300 đến hàng trăm"]],"methods":[{"title":"Làm tròn và ước lượng","lead":"Chọn hàng cần làm tròn. Chữ số ngay bên phải từ 5 trở lên thì tăng hàng đang xét một đơn vị, còn lại giữ nguyên. Thay các hàng thấp hơn bằng 0 khi làm tròn số nguyên.","steps":["Gạch dưới hàng cần làm tròn","Nhìn chữ số ngay bên phải","Điều chỉnh và ghi dấu ≈"],"example":"Ước lượng 198 + 304 ≈ 200 + 300 = 500.","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"So sánh số lớn","intro":"Nhiều chữ số hơn thì số tự nhiên lớn hơn nếu không có số 0 đầu. Nếu cùng số chữ số, so từng hàng từ trái.","formulas":"","short":"","notes":[["","Thứ tự và dấu so sánh","Số xuất hiện sau trong dãy đếm tiến thì lớn hơn. Với số nhiều chữ số có cùng độ dài, so từ hàng cao nhất khác nhau. Miệng rộng của dấu quay về phía số lớn.","4 < 7; 7 > 4; 7 = 7"]],"methods":[{"title":"Thứ tự và dấu so sánh","lead":"Số xuất hiện sau trong dãy đếm tiến thì lớn hơn. Với số nhiều chữ số có cùng độ dài, so từ hàng cao nhất khác nhau. Miệng rộng của dấu quay về phía số lớn.","steps":["Đặt số lên tia số hoặc so từng hàng","Chọn dấu","Đọc lại cả câu để kiểm tra"],"example":"62 > 58 vì 6 chục nhiều hơn 5 chục.","tip":"","worked":[]}],"visuals":[],"table":[]}],"g4-c4":[{"title":"Khối lượng","intro":"Cùng đơn vị rồi mới tính.","formulas":"1 tấn = 10 tạ = 1000 kg; 1 tạ = 10 yến = 100 kg; 1 yến = 10 kg","short":"","notes":[["","","Dùng gam hoặc ki-lô-gam để đo khối lượng. Khi cân cả vật chứa, trừ khối lượng vỏ để được khối lượng bên trong.","1 kg = 1000 g; 1 yến = 10 kg; 1 tạ = 100 kg; 1 tấn = 1000 kg"]],"methods":[{"title":"Khối lượng","lead":"Dùng gam hoặc ki-lô-gam để đo khối lượng. Khi cân cả vật chứa, trừ khối lượng vỏ để được khối lượng bên trong.","steps":["Đổi về cùng đơn vị","Tách vỏ và vật","Cộng hoặc trừ theo câu hỏi"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Diện tích","intro":"Hai đơn vị diện tích liền nhau trong hệ mét chênh nhau 100 lần.","formulas":"1 m² = 100 dm²; 1 dm² = 100 cm²","short":"","notes":[["","Đơn vị diện tích","Hai đơn vị diện tích liền nhau trong dãy km², hm², dam², m², dm², cm², mm² chênh nhau 100 lần. Héc-ta bằng hm².","1 m² = 100 dm²; 1 ha = 10 000 m²; 1 km² = 100 ha"]],"methods":[{"title":"Đơn vị diện tích","lead":"Hai đơn vị diện tích liền nhau trong dãy km², hm², dam², m², dm², cm², mm² chênh nhau 100 lần. Héc-ta bằng hm².","steps":["Đếm số bậc giữa hai đơn vị","Nhân 100 mỗi bậc khi sang đơn vị nhỏ, chia khi ngược lại","Kiểm tra đơn vị cuối"],"example":"","tip":"","worked":[]},{"title":"Đổi diện tích","lead":"","steps":[],"example":"","tip":"","worked":[["Đổi diện tích","Viết 3 m² 7 dm² dưới dạng đề-xi-mét vuông.",["Một hình vuông cạnh 1 m có cạnh bằng 10 dm.","Diện tích của hình đó là 10 × 10 = 100 dm².","Đổi 3 m² thành 300 dm² rồi cộng 7 dm²."],"307 dm².",""]]}],"visuals":[0],"table":[]},{"title":"Thời gian và thế kỉ","intro":"Đổi theo mối quan hệ từng đơn vị. Thế kỉ thứ n gồm từ năm 100(n − 1) + 1 đến năm 100n.","formulas":"1 giờ = 60 phút; 1 phút = 60 giây; 1 thế kỉ = 100 năm","short":"","notes":[],"methods":[],"visuals":[],"table":[]}],"g4-c5":[{"title":"Tính chất của phép cộng","intro":"Đổi chỗ hoặc nhóm các số hạng không đổi tổng.","formulas":"a + b = b + a; (a + b) + c = a + (b + c)","short":"","notes":[["cách làm","Tính nhẩm bằng nhóm bù","Với tổng nhiều số, ưu tiên ghép các số tạo chục, trăm hoặc nghìn. Khi trừ số gần tròn, bù lại phần đã trừ thừa.","702−198=702−200+2=504"]],"methods":[{"title":"Tính nhẩm bằng nhóm bù","lead":"Với tổng nhiều số, ưu tiên ghép các số tạo chục, trăm hoặc nghìn. Khi trừ số gần tròn, bù lại phần đã trừ thừa.","steps":["Nhìn chữ số tận cùng","Chọn nhóm bù","Viết bước điều chỉnh để tránh đổi dấu"],"example":"","tip":"","worked":[]},{"title":"Tính nhanh nhờ nhóm số","lead":"","steps":[],"example":"","tip":"","worked":[["Tính nhanh nhờ nhóm số","Tính 197 + 325 + 803.",["Nhìn hai số 197 và 803 có thể ghép thành 1000.","Đổi chỗ 803 để cộng với 197 trước.","Lấy 1000 + 325."],"1325.",""]]}],"visuals":[],"table":[]},{"title":"Thay đổi hiệu","intro":"Tăng cả số bị trừ và số trừ cùng một lượng thì hiệu giữ nguyên.","formulas":"(a + c) − (b + c) = a − b","short":"","notes":[["","Phép trừ","Dùng để tìm phần còn lại hoặc chênh lệch. Nếu chữ số ở hàng đang xét không đủ trừ, đổi một đơn vị của hàng bên trái thành 10 đơn vị của hàng đó.","Số bị trừ − số trừ = hiệu"]],"methods":[{"title":"Phép trừ","lead":"Dùng để tìm phần còn lại hoặc chênh lệch. Nếu chữ số ở hàng đang xét không đủ trừ, đổi một đơn vị của hàng bên trái thành 10 đơn vị của hàng đó.","steps":["Đặt thẳng các hàng","Trừ từ phải sang trái, có thể đổi chục hoặc trăm","Lấy hiệu cộng số trừ để kiểm tra"],"example":"63 − 27 = 36 vì 36 + 27 = 63.","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Tìm hai số khi biết tổng và hiệu","intro":"Bớt hiệu khỏi tổng được hai lần số bé. Thêm hiệu vào tổng được hai lần số lớn.","formulas":"Số bé = (tổng − hiệu) : 2; số lớn = (tổng + hiệu) : 2","short":"","notes":[["","Hai số khi biết tổng và hiệu","Sau khi bỏ phần hơn khỏi tổng, phần còn lại gồm hai lần số bé. Có thể thêm hiệu vào tổng để được hai lần số lớn.","Số bé = \\frac{Tổng − Hiệu}{2}; số lớn = \\frac{Tổng + Hiệu}{2}"]],"methods":[{"title":"Hai số khi biết tổng và hiệu","lead":"Sau khi bỏ phần hơn khỏi tổng, phần còn lại gồm hai lần số bé. Có thể thêm hiệu vào tổng để được hai lần số lớn.","steps":["Vẽ sơ đồ hai đoạn","Đánh dấu phần hơn","Chọn tính số bé hoặc số lớn trước","Thử lại tổng và hiệu"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]}],"g4-c6":[{"title":"Hai đường vuông góc","intro":"Cắt nhau tạo bốn góc vuông. Dùng ê-ke kiểm tra hoặc vẽ.","formulas":"","short":"","notes":[["cách làm","Dùng cạnh của ê-ke để vẽ","Muốn vẽ vuông góc, đặt một cạnh góc vuông trùng đường đã cho rồi kẻ theo cạnh kia. Qua một điểm ngoài đường, có thể dựng hai lần vuông góc để được đường song song.","Hai đường phân biệt cùng vuông góc với một đường trong mặt phẳng thì song song"]],"methods":[{"title":"Dùng cạnh của ê-ke để vẽ","lead":"Muốn vẽ vuông góc, đặt một cạnh góc vuông trùng đường đã cho rồi kẻ theo cạnh kia. Qua một điểm ngoài đường, có thể dựng hai lần vuông góc để được đường song song.","steps":["Chọn cạnh mốc","Dựng góc vuông","Kiểm tra đường đi qua đúng điểm"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Hai đường song song","intro":"Trong mặt phẳng, hai đường thẳng phân biệt song song không cắt nhau dù kéo dài.","formulas":"AB ∥ CD","short":"","notes":[],"methods":[{"title":"Hai đường vuông góc cùng một đường","lead":"","steps":[],"example":"","tip":"","worked":[["Hai đường vuông góc cùng một đường","Hai đường thẳng phân biệt a và b trong cùng một mặt phẳng đều vuông góc với c. Chúng có cắt nhau không?",["Nhìn a và b theo cùng hướng so với c.","Cả hai tạo góc vuông với c.","Hai đường phân biệt đó song song."],"a ∥ b.",""]]}],"visuals":[0],"table":[]},{"title":"Cạnh hình chữ nhật và hình vuông","intro":"Các cặp cạnh đối song song. Hai cạnh kề vuông góc với nhau.","formulas":"AB ⊥ BC","short":"","notes":[],"methods":[],"visuals":[],"table":[]}],"g4-c7":[{"title":"Số và phép tính","intro":"So từ hàng cao. Ghép số hạng thành số tròn để cộng thuận tiện. Kiểm tra phép trừ bằng phép cộng.","formulas":"","short":"","notes":[],"methods":[{"title":"Tổng và hiệu trong bài ôn tập","lead":"","steps":[],"example":"","tip":"","worked":[["Tổng và hiệu trong bài ôn tập","Hai kho có 840 kg gạo, kho lớn hơn kho nhỏ 120 kg. Tính khối lượng kho nhỏ.",["Bớt 120 kg khỏi kho lớn để hai kho bằng nhau.","Lượng còn lại của cả hai là 840 − 120 = 720 kg.","Chia đôi 720 kg."],"Kho nhỏ có 360 kg.",""]]}],"visuals":[],"table":[]},{"title":"Số đo","intro":"Đổi khối lượng theo tấn–tạ–yến–kg. Đổi diện tích theo hệ số 100 giữa hai đơn vị liền kề.","formulas":"1 tấn = 1000 kg; 1 m² = 100 dm²","short":"","notes":[["","Đơn vị diện tích","Hai đơn vị diện tích liền nhau trong dãy km², hm², dam², m², dm², cm², mm² chênh nhau 100 lần. Héc-ta bằng hm².","1 m² = 100 dm²; 1 ha = 10 000 m²; 1 km² = 100 ha"]],"methods":[{"title":"Đơn vị diện tích","lead":"Hai đơn vị diện tích liền nhau trong dãy km², hm², dam², m², dm², cm², mm² chênh nhau 100 lần. Héc-ta bằng hm².","steps":["Đếm số bậc giữa hai đơn vị","Nhân 100 mỗi bậc khi sang đơn vị nhỏ, chia khi ngược lại","Kiểm tra đơn vị cuối"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Hình học","intro":"Dùng thước đo góc đọc số đo theo đúng thang. Dùng ê-ke kiểm tra vuông góc; hai cạnh đối của hình chữ nhật song song.","formulas":"","short":"","notes":[["","Vuông góc và song song trong mặt phẳng","Hai đường vuông góc tạo góc vuông. Hai đường phân biệt song song thì cùng nằm trong một mặt phẳng và không có điểm chung. Các cạnh đối của hình chữ nhật song song, các cạnh kề vuông góc.","AB ⊥ BC; AB ∥ CD"]],"methods":[{"title":"Vuông góc và song song trong mặt phẳng","lead":"Hai đường vuông góc tạo góc vuông. Hai đường phân biệt song song thì cùng nằm trong một mặt phẳng và không có điểm chung. Các cạnh đối của hình chữ nhật song song, các cạnh kề vuông góc.","steps":["Dùng ê-ke kiểm tra góc vuông","Kéo dài theo phương của đoạn","Xét quan hệ của cả đường thẳng"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]}],"g4-c8":[{"title":"Tính chất nhân","intro":"Có giao hoán, kết hợp và phân phối với phép cộng, phép trừ.","formulas":"a(b + c) = ab + ac; a(b − c) = ab − ac","short":"","notes":[["","Tính chất để tính nhẩm","Cộng và nhân có tính giao hoán, kết hợp. Phân phối phép nhân qua tổng hoặc hiệu bằng cách nhân vào từng số hạng.","(a+b)+c=a+(b+c); (ab)c=a(bc); a(b±c)=ab±ac"]],"methods":[{"title":"Tính chất để tính nhẩm","lead":"Cộng và nhân có tính giao hoán, kết hợp. Phân phối phép nhân qua tổng hoặc hiệu bằng cách nhân vào từng số hạng.","steps":["Nhìn nhóm số dễ tạo số tròn","Đổi chỗ hoặc nhóm thích hợp","Tính và đối chiếu"],"example":"25 × 17 × 4 = (25 × 4) × 17 = 1700.","tip":"","worked":[]},{"title":"Dùng tính chất phân phối","lead":"","steps":[],"example":"","tip":"","worked":[["Dùng tính chất phân phối","Tính nhẩm 48 × 25.",["Tách 48 thành 12 × 4.","Đổi cách nhóm để được 12 × (4 × 25).","Tính 4 × 25 = 100 rồi nhân 12."],"1200.",""]]}],"visuals":[],"table":[]},{"title":"Chia và ước lượng","intro":"Tìm chữ số thương bằng cách ước lượng, nhân thử và kiểm tra số dư nhỏ hơn số chia.","formulas":"275 = 12 × 22 + 11","short":"","notes":[["","Làm tròn và ước lượng","Chọn hàng cần làm tròn. Chữ số ngay bên phải từ 5 trở lên thì tăng hàng đang xét một đơn vị, còn lại giữ nguyên. Thay các hàng thấp hơn bằng 0 khi làm tròn số nguyên.","347 ≈ 350 đến hàng chục; 347 ≈ 300 đến hàng trăm"]],"methods":[{"title":"Làm tròn và ước lượng","lead":"Chọn hàng cần làm tròn. Chữ số ngay bên phải từ 5 trở lên thì tăng hàng đang xét một đơn vị, còn lại giữ nguyên. Thay các hàng thấp hơn bằng 0 khi làm tròn số nguyên.","steps":["Gạch dưới hàng cần làm tròn","Nhìn chữ số ngay bên phải","Điều chỉnh và ghi dấu ≈"],"example":"Ước lượng 198 + 304 ≈ 200 + 300 = 500.","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Nhân chia với 10, 100, …","intro":"Với số tự nhiên, nhân 10, 100, … thêm số chữ số 0 tương ứng. Khi chia hết cho các số đó, bỏ tương ứng số 0 ở tận cùng.","formulas":"","short":"","notes":[["","Nhân và chia với 10, 100, …","Với số tự nhiên, nhân với lũy thừa của 10 làm mỗi chữ số chuyển sang hàng cao hơn. Khi chia hết, dịch theo chiều ngược lại.","37 × 100 = 3700; 3700 : 100 = 37"]],"methods":[{"title":"Nhân và chia với 10, 100, …","lead":"Với số tự nhiên, nhân với lũy thừa của 10 làm mỗi chữ số chuyển sang hàng cao hơn. Khi chia hết, dịch theo chiều ngược lại.","steps":["Đếm số chữ số 0 của thừa số","Dịch hàng tương ứng","Điền 0 vào các vị trí trống"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Trung bình cộng và đơn giá","intro":"Trung bình bằng tổng chia số lượng. Giá một đơn vị bằng tổng giá chia lượng mua.","formulas":"Số trung bình cộng = tổng các số : số các số hạng","short":"","notes":[["","","Số trung bình cộng bằng tổng các giá trị chia số giá trị. Tính theo đơn vị bằng cách đưa về một đơn vị trước.","Trung bình = \\frac{tổng các số}{số các số} // Đơn giá = \\frac{tổng tiền}{số lượng}"]],"methods":[{"title":"Trung bình cộng và đơn giá","lead":"Số trung bình cộng bằng tổng các giá trị chia số giá trị. Tính theo đơn vị bằng cách đưa về một đơn vị trước.","steps":["Tính tổng đúng phạm vi đề","Chia cho số đơn vị","Nhân với số lượng mới nếu đề yêu cầu"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]}],"g4-c9":[{"title":"Bảng số liệu và biểu đồ cột","intro":"Đọc tên, đơn vị và vạch chia. So chênh lệch bằng hiệu hai giá trị, không nhìn riêng chiều cao nếu trục bắt đầu khác 0.","formulas":"","short":"","notes":[["","Dữ liệu và biểu đồ","Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","Góc ở tâm = tỉ lệ × 360° // Tỉ lệ = \\frac{số của nhóm}{tổng số}"]],"methods":[{"title":"Dữ liệu và biểu đồ","lead":"Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","steps":["Đọc tên, đơn vị và thang chia","Xác định nhóm hoặc thời điểm đang hỏi","So sánh hoặc tính tỉ lệ"],"example":"","tip":"","worked":[]},{"title":"Tính tổng từ biểu đồ","lead":"","steps":[],"example":"","tip":"","worked":[["Tính tổng từ biểu đồ","Ba tổ đọc lần lượt 8, 11, 5 quyển sách. Tổ thứ hai đọc ít hơn hai tổ còn lại gộp lại bao nhiêu quyển?",["Gộp số của tổ một và tổ ba, 8 + 5 = 13.","So 13 với 11.","Lấy 13 − 11."],"2 quyển.",""]]}],"visuals":[0],"table":[]},{"title":"Số lần xảy ra","intro":"Tổng số lần của các kết quả rời nhau bằng tổng lượt thử. Kết quả lượt trước không ấn định lượt sau.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]}],"g4-c10":[{"title":"Phân số","intro":"Tử số đếm phần được lấy, mẫu số dương cho biết toàn thể được chia thành bao nhiêu phần bằng nhau. Thương a : b viết được dưới dạng \\frac{a}{b} với b khác 0.","formulas":"\\frac{a}{b} = a : b, b ≠ 0","short":"","notes":[["","Phân số và ý nghĩa phép chia","Mẫu số cho biết số phần bằng nhau chia từ toàn thể; tử số cho biết số phần được lấy. Với mẫu khác 0, phân số biểu diễn thương của tử số cho mẫu số.","\\frac{a}{b} = a : b với b ≠ 0"]],"methods":[{"title":"Phân số và ý nghĩa phép chia","lead":"Mẫu số cho biết số phần bằng nhau chia từ toàn thể; tử số cho biết số phần được lấy. Với mẫu khác 0, phân số biểu diễn thương của tử số cho mẫu số.","steps":["Xác định toàn thể và số phần bằng nhau","Ghi tử trên, mẫu dưới","Kiểm tra mẫu khác 0"],"example":"","tip":"","worked":[]}],"visuals":[0],"table":[]},{"title":"Phân số bằng nhau","intro":"Nhân hoặc chia cả tử và mẫu cho cùng số tự nhiên khác 0. Rút gọn là chia cho ước chung.","formulas":"\\frac{3}{5} = \\frac{6}{10}","short":"","notes":[["","Phân số bằng nhau và quy đồng","Nhân hoặc chia cả tử và mẫu với cùng một số khác 0 không đổi giá trị. Đưa mẫu về dương khi so sánh; có thể dùng mẫu số chung nhỏ nhất.","\\frac{a}{b}=\\frac{c}{d} ⇔ ad=bc, b,d ≠ 0"]],"methods":[{"title":"Phân số bằng nhau và quy đồng","lead":"Nhân hoặc chia cả tử và mẫu với cùng một số khác 0 không đổi giá trị. Đưa mẫu về dương khi so sánh; có thể dùng mẫu số chung nhỏ nhất.","steps":["Rút gọn trước nếu thuận tiện","Chọn mẫu chung","Nhân cả tử và mẫu của mỗi phân số"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"So sánh","intro":"Cùng mẫu so tử. Khác mẫu thì quy đồng rồi so. Phân số có tử nhỏ hơn, bằng, lớn hơn mẫu lần lượt bé hơn, bằng, lớn hơn 1.","formulas":"","short":"","notes":[["cách làm","So sánh phân số theo mốc","Ngoài quy đồng, có thể so với 1. Với phân số nhỏ hơn 1, phân số thiếu ít hơn để tới 1 thì lớn hơn.","\\frac{7}{8}=1−\\frac{1}{8}; \\frac{5}{6}=1−\\frac{1}{6}"]],"methods":[{"title":"So sánh phân số theo mốc","lead":"Ngoài quy đồng, có thể so với 1. Với phân số nhỏ hơn 1, phân số thiếu ít hơn để tới 1 thì lớn hơn.","steps":["Tìm mốc chung","So phần thiếu hoặc phần vượt","Đổi sang quy đồng nếu cách này không thuận tiện"],"example":"","tip":"","worked":[]},{"title":"So sánh bằng mốc 1","lead":"","steps":[],"example":"","tip":"","worked":[["So sánh bằng mốc 1","So sánh \\frac{8}{7} và \\frac{7}{9}.",["\\frac{8}{7} lớn hơn 1 vì tử số lớn hơn mẫu số.","\\frac{7}{9} nhỏ hơn 1 vì tử số nhỏ hơn mẫu số.","Ghép hai quan hệ qua cùng mốc 1."],"\\frac{8}{7} > \\frac{7}{9}.",""]]}],"visuals":[],"table":[]}],"g4-c11":[{"title":"Cộng và trừ cùng mẫu","intro":"Giữ nguyên mẫu số, cộng hoặc trừ các tử số.","formulas":"\\frac{a}{m} + \\frac{b}{m} = \\frac{a + b}{m}","short":"","notes":[],"methods":[],"visuals":[0],"table":[]},{"title":"Khác mẫu","intro":"Quy đồng về mẫu số chung rồi mới cộng hoặc trừ. Rút gọn kết quả nếu được.","formulas":"\\frac{1}{2} + \\frac{1}{3} = \\frac{3 + 2}{6} = \\frac{5}{6}","short":"","notes":[["","Cộng và trừ phân số","Quy đồng về mẫu chung rồi cộng hoặc trừ tử. Mẫu chung giữ nguyên. Sau đó rút gọn và kiểm tra kết quả theo ước lượng.","\\frac{a}{b} ± \\frac{c}{d}=\\frac{ad ± bc}{bd}"]],"methods":[{"title":"Cộng và trừ phân số","lead":"Quy đồng về mẫu chung rồi cộng hoặc trừ tử. Mẫu chung giữ nguyên. Sau đó rút gọn và kiểm tra kết quả theo ước lượng.","steps":["Kiểm tra mẫu số","Quy đồng nếu khác mẫu","Tính tử rồi rút gọn"],"example":"","tip":"","worked":[]},{"title":"Cộng hai phân số khác mẫu","lead":"","steps":[],"example":"","tip":"","worked":[["Cộng hai phân số khác mẫu","Tính \\frac{3}{4} + \\frac{5}{6}.",["Tìm một mẫu chung, chẳng hạn 12.","Đổi \\frac{3}{4} = \\frac{9}{12} và \\frac{5}{6} = \  \\frac{(a+b)h}{2} // S hình bình hành = ah; S hình thoi = \\frac{d₁d₂}{2}"],["","Đường tròn và hình tròn","Đường tròn là đường biên. Hình tròn gồm đường biên và miền bên trong. Bán kính nối tâm với đường tròn; đường kính đi qua tâm và bằng hai lần bán kính.","d = 2r; C = 2πr = πd; S = πr²"]],"methods":[{"title":"Diện tích theo đáy, chiều cao hoặc đường chéo","lead":"Chiều cao là khoảng cách vuông góc tới đường chứa đáy. Hình thang dùng tổng hai đáy song song. Hình thoi có thể tính bằng nửa tích hai đường chéo.","steps":["Xác định loại hình","Chọn đáy và chiều cao tương ứng hoặc hai đường chéo","Nhân chia theo công thức"],"example":"","tip":"","worked":[]},{"title":"Đường tròn và hình tròn","lead":"Đường tròn là đường biên. Hình tròn gồm đường biên và miền bên trong. Bán kính nối tâm với đường tròn; đường kính đi qua tâm và bằng hai lần bán kính.","steps":["Xác định r hay d","Chọn độ dài đường bao hoặc diện tích","Thay π theo yêu cầu làm tròn"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Số đo diện tích","intro":"1 ha = 10 000 m². Đổi cả hai kích thước trước khi tính diện tích.","formulas":"","short":"","notes":[["","Đơn vị diện tích","Hai đơn vị diện tích liền nhau trong dãy km², hm², dam², m², dm², cm², mm² chênh nhau 100 lần. Héc-ta bằng hm².","1 m² = 100 dm²; 1 ha = 10 000 m²; 1 km² = 100 ha"]],"methods":[{"title":"Đơn vị diện tích","lead":"Hai đơn vị diện tích liền nhau trong dãy km², hm², dam², m², dm², cm², mm² chênh nhau 100 lần. Héc-ta bằng hm².","steps":["Đếm số bậc giữa hai đơn vị","Nhân 100 mỗi bậc khi sang đơn vị nhỏ, chia khi ngược lại","Kiểm tra đơn vị cuối"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]}],"g5-c7":[{"title":"Tỉ số và ý nghĩa của tỉ số phần trăm","intro":"Tỉ số a : b so số a với số b, với b khác 0. Với hai đại lượng cùng loại, đổi về cùng đơn vị trước khi chia. Tỉ số p% nghĩa là p phần trên 100.","formulas":"p% = \\frac{p}{100}","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Tỉ lệ bản đồ","intro":"1 : n nghĩa là một đơn vị trên bản đồ ứng với n đơn vị thực tế. Dùng cùng đơn vị khi nhân hoặc chia.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Tìm hai số theo tỉ số","intro":"Chia tổng cho tổng số phần, hoặc chia hiệu cho hiệu số phần, rồi nhân số phần tương ứng.","formulas":"Tổng 35, tỉ số 2 : 5 ⇒ một phần bằng 35 : 7 = 5","short":"","notes":[],"methods":[{"title":"Biết tổng và tỉ số","lead":"","steps":[],"example":"","tip":"","worked":[["Biết tổng và tỉ số","Tổng hai số là 96, tỉ số của số bé và số lớn bằng \\frac{3}{5}. Tìm hai số.",["Vẽ số bé 3 phần và số lớn 5 phần bằng nhau.","Tổng 8 phần bằng 96, một phần là 12.","Nhân lần lượt với 3 và 5."],"36 và 60.",""]]}],"visuals":[],"table":[]},{"title":"Tìm tỉ số phần trăm và giá trị phần trăm","intro":"Muốn tìm tỉ số phần trăm của A so với B, chia A cho B rồi viết dưới dạng phần trăm. Muốn tìm p% của A, nhân A với \\frac{p}{100}.","formulas":"Tỉ số phần trăm của A và B = (\\frac{A}{B}) × 100%, B ≠ 0 // p% của A = A × \\frac{p}{100}","short":"","notes":[["bổ sung","Tăng giảm phần trăm liên tiếp","Mỗi tỉ lệ phần trăm được tính theo giá trị ngay trước bước đó. Muốn tìm giá gốc, chia cho hệ số còn lại, không cộng ngược đúng số phần trăm.","Giá sau = giá trước × (1±\\frac{p}{100}) // Hai bước: nhân hai hệ số"]],"methods":[{"title":"Tăng giảm phần trăm liên tiếp","lead":"Mỗi tỉ lệ phần trăm được tính theo giá trị ngay trước bước đó. Muốn tìm giá gốc, chia cho hệ số còn lại, không cộng ngược đúng số phần trăm.","steps":["Ghi giá gốc của từng bước","Đổi phần trăm thành hệ số","Nhân theo đúng thứ tự"],"example":"Giảm 20%, rồi tăng 20%: 100 × 0,8 × 1,2 = 96.","tip":"","worked":[]}],"visuals":[],"table":[]}],"g5-c8":[{"title":"Thể tích","intro":"Đo phần không gian khối chiếm bằng các khối lập phương đơn vị. Số khối mỗi lớp nhân số lớp cho thể tích hộp.","formulas":"V hộp = a × b × h","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Đơn vị thể tích","intro":"Mỗi bước giữa hai đơn vị liền kề chênh nhau 1000 lần.","formulas":"1 m³ = 1000 dm³; 1 dm³ = 1000 cm³; 1 l = 1 dm³","short":"","notes":[["","Đơn vị thể tích và dung tích","Hai đơn vị thể tích liền nhau trong hệ mét chênh 1000 lần. Một lít chiếm đúng một đề-xi-mét khối.","1 m³ = 1000 dm³; 1 dm³ = 1000 cm³; 1 l = 1 dm³; 1 ml = 1 cm³"]],"methods":[{"title":"Đơn vị thể tích và dung tích","lead":"Hai đơn vị thể tích liền nhau trong hệ mét chênh 1000 lần. Một lít chiếm đúng một đề-xi-mét khối.","steps":["Xác định đổi thể tích hay dung tích","Chọn hệ số đúng","Viết phép đổi rồi mới cộng trừ"],"example":"","tip":"","worked":[]},{"title":"Đổi thể tích sang lít","lead":"","steps":[],"example":"","tip":"","worked":[["Đổi thể tích sang lít","Một bình có dung tích 0,018 m³. Bình chứa tối đa bao nhiêu lít?",["Đổi 1 m³ = 1000 dm³.","Nhân 0,018 × 1000 để được 18 dm³.","Dùng 1 dm³ = 1 lít."],"18 lít.",""]]}],"visuals":[],"table":[]}],"g5-c9":[{"title":"Hộp chữ nhật","intro":"Diện tích xung quanh bằng chu vi đáy nhân chiều cao. Toàn phần gồm thêm hai đáy.","formulas":"S_{xq} = 2(a + b)h; S_{tp} = S_{xq} + 2ab; V = abh","short":"","notes":[["","Hộp chữ nhật và lập phương","Hình khai triển gồm các mặt được mở phẳng. Diện tích xung quanh hộp là tổng bốn mặt bên; toàn phần còn gồm hai đáy. Thể tích bằng diện tích đáy nhân chiều cao.","Hộp: S_{xq} = 2(a+b)h; S_{tp} = S_{xq}+2ab; V = abh // Lập phương: S_{xq}=4a²; S_{tp}=6a²; V=a³"]],"methods":[{"title":"Hộp chữ nhật và lập phương","lead":"Hình khai triển gồm các mặt được mở phẳng. Diện tích xung quanh hộp là tổng bốn mặt bên; toàn phần còn gồm hai đáy. Thể tích bằng diện tích đáy nhân chiều cao.","steps":["Xác định các mặt thực sự được sơn hoặc dán","Đổi cạnh cùng đơn vị","Tính diện tích cần dùng hoặc thể tích"],"example":"Hộp không nắp chỉ cộng một mặt đáy vào diện tích xung quanh.","tip":"","worked":[]}],"visuals":[0],"table":[]},{"title":"Lập phương","intro":"Sáu mặt đều là hình vuông cạnh a. Bốn mặt bên tính vào diện tích xung quanh.","formulas":"S_{xq} = 4a²; S_{tp} = 6a²; V = a³","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Mặt được sử dụng","intro":"Khi làm hộp không nắp hoặc sơn một số mặt, chỉ cộng diện tích các mặt thực sự cần tính.","formulas":"","short":"","notes":[["bổ sung","Tỉ lệ kích thước, diện tích và thể tích","Nếu mọi chiều dài cùng gấp k lần, mỗi diện tích gấp k² và thể tích gấp k³. Với hộp không nắp, tính đúng các mặt còn lại thay vì lấy toàn phần.","k>0: S mới=k²S cũ; V mới=k³V cũ"]],"methods":[{"title":"Tỉ lệ kích thước, diện tích và thể tích","lead":"Nếu mọi chiều dài cùng gấp k lần, mỗi diện tích gấp k² và thể tích gấp k³. Với hộp không nắp, tính đúng các mặt còn lại thay vì lấy toàn phần.","steps":["Xem đề tăng một chiều hay tất cả chiều","Chọn công thức diện tích hoặc thể tích","Kiểm tra mặt có nắp hay không"],"example":"","tip":"","worked":[]},{"title":"Diện tích kính của bể hở","lead":"","steps":[],"example":"","tip":"","worked":[["Diện tích kính của bể hở","Bể không nắp dài 8 dm, rộng 5 dm, cao 4 dm. Tính diện tích kính.",["Tính đáy 8 × 5 = 40 dm².","Tính bốn mặt bên, (8 + 5) × 2 × 4 = 104 dm².","Cộng đáy và mặt bên."],"144 dm².",""]]}],"visuals":[],"table":[]}],"g5-c10":[{"title":"Đổi số đo thời gian","intro":"Dùng 1 giờ = 60 phút, 1 phút = 60 giây. Phút chia 60 mới ra giờ thập phân.","formulas":"45 phút = 0,75 giờ","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Chuyển động đều","intro":"s là quãng đường, v là vận tốc, t là thời gian. Các đơn vị phải tương thích.","formulas":"s = v × t; v = \\frac{s}{t}; t = \\frac{s}{v}","short":"","notes":[["","Vận tốc và chuyển động đều","Trong chuyển động đều, vận tốc không đổi. Khi hai vật đi về phía nhau, khoảng cách giảm theo tổng vận tốc; đuổi nhau cùng chiều thì dùng hiệu vận tốc.","s = vt; v=\\frac{s}{t}; t=\\frac{s}{v}"],["cách làm","Chuyển động có đổi đơn vị","Nếu vận tốc tính bằng km mỗi giờ thì thời gian phải tính theo giờ. Khi tính vận tốc trung bình, lấy tổng đường chia tổng thời gian đề xét.","s=vt; v_{tb}=\\frac{s₁+s₂}{t₁+t₂}"]],"methods":[{"title":"Vận tốc và chuyển động đều","lead":"Trong chuyển động đều, vận tốc không đổi. Khi hai vật đi về phía nhau, khoảng cách giảm theo tổng vận tốc; đuổi nhau cùng chiều thì dùng hiệu vận tốc.","steps":["Đổi phút sang giờ hoặc đổi vận tốc","Vẽ hướng chuyển động","Lập quan hệ theo quãng đường thực"],"example":"","tip":"","worked":[]},{"title":"Chuyển động có đổi đơn vị","lead":"Nếu vận tốc tính bằng km mỗi giờ thì thời gian phải tính theo giờ. Khi tính vận tốc trung bình, lấy tổng đường chia tổng thời gian đề xét.","steps":["Đổi thời gian","Vẽ sơ đồ quãng đường","Lập công thức theo từng chặng rồi cộng"],"example":"Đi 36 km mỗi giờ trong 25 phút được 36 × \\frac{25}{60} = 15 km.","tip":"","worked":[]},{"title":"Chuyển động đều qua phần lẻ giờ","lead":"","steps":[],"example":"","tip":"","worked":[["Chuyển động đều qua phần lẻ giờ","Xe đi 54 km mỗi giờ trong 1 giờ 20 phút. Tính quãng đường.",["Một giờ đi 54 km.","20 phút bằng một phần ba giờ, đi 54 : 3 = 18 km.","Cộng quãng đường hai khoảng."],"72 km.",""]]}],"visuals":[],"table":[]},{"title":"Cùng chiều và ngược chiều","intro":"Hai vật đi về phía nhau thì tốc độ thu hẹp khoảng cách là tổng hai vận tốc. Khi đuổi nhau cùng chiều, lấy hiệu vận tốc nhanh trừ chậm.","formulas":"","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Vận tốc trung bình","intro":"Lấy tổng quãng đường chia tổng thời gian của khoảng đang xét.","formulas":"v_{tb} = \\frac{s tổng}{t tổng}","short":"","notes":[],"methods":[],"visuals":[],"table":[]}],"g5-c11":[{"title":"Đọc biểu đồ","intro":"So cột theo số liệu và đơn vị. Biểu đồ quạt tròn biểu thị các phần của một toàn thể.","formulas":"Tổng các tỉ lệ của cả hình tròn = 100%","short":"","notes":[["","Dữ liệu và biểu đồ","Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","Góc ở tâm = tỉ lệ × 360° // Tỉ lệ = \\frac{số của nhóm}{tổng số}"]],"methods":[{"title":"Dữ liệu và biểu đồ","lead":"Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","steps":["Đọc tên, đơn vị và thang chia","Xác định nhóm hoặc thời điểm đang hỏi","So sánh hoặc tính tỉ lệ"],"example":"","tip":"","worked":[]}],"visuals":[0],"table":[]},{"title":"Tần suất thực nghiệm","intro":"Lấy số lần kết quả xuất hiện chia tổng số lượt thử. Khi gộp nhiều lượt, cộng số lần và số lượt trước khi chia.","formulas":"Tần suất = \\frac{số lần xuất hiện}{tổng số lượt}","short":"","notes":[],"methods":[{"title":"Tỉ số số lần xuất hiện","lead":"","steps":[],"example":"","tip":"","worked":[["Tỉ số số lần xuất hiện","Tung đồng xu 40 lần, 17 lần mặt sấp. Tính tỉ số phần trăm số lần mặt ngửa.",["Tính số lần ngửa 40 − 17 = 23.","Tỉ số số lần ngửa là \\frac{23}{40} = 0,575.","Đổi sang phần trăm."],"57,5%.",""]]}],"visuals":[],"table":[]}],"g5-c12":[{"title":"Phân số, thập phân và phần trăm","intro":"Đổi về dạng thuận tiện. Khi tăng giảm phần trăm nhiều lần, mỗi bước áp dụng lên giá trị ngay trước đó.","formulas":"Giá sau khi giảm p% = giá trước × (1 − \\frac{p}{100})","short":"","notes":[["","Nhân, chia phân số và tìm phân số của một số","Tích bằng tử nhân tử, mẫu nhân mẫu. Chia cho phân số khác 0 thì nhân nghịch đảo. Tìm một phần của số bằng phép nhân; tìm số ban đầu từ một phần bằng phép chia.","\\frac{a}{b}×\\frac{c}{d}=\\frac{ac}{bd} // \\frac{a}{b}:\\frac{c}{d}=\\frac{ad}{bc}, c ≠ 0"],["","Cộng và trừ số thập phân","Dấu phẩy của các số phải thẳng cột. Có thể thêm số 0 ở cuối phần thập phân để đủ số hàng.","3,7 + 0,25 = 3,95; 3,70 − 0,25 = 3,45"],["","Tỉ số, phần trăm và tỉ lệ bản đồ","Tỉ số là thương của hai đại lượng cùng loại sau khi đổi cùng đơn vị. p% nghĩa là p phần trên 100. Với tỉ lệ bản đồ 1 : n, một đơn vị trên bản đồ tương ứng n đơn vị thật.","Phần = gốc × \\frac{p}{100}; gốc = phần : (\\frac{p}{100}) // Nếu A:B=m:n thì A = \\frac{m}{m+n}(A+B)"]],"methods":[{"title":"Nhân, chia phân số và tìm phân số của một số","lead":"Tích bằng tử nhân tử, mẫu nhân mẫu. Chia cho phân số khác 0 thì nhân nghịch đảo. Tìm một phần của số bằng phép nhân; tìm số ban đầu từ một phần bằng phép chia.","steps":["Xác định cần lấy một phần hay tìm toàn thể","Chọn nhân hoặc chia","Rút gọn trước khi nhân"],"example":"","tip":"","worked":[]},{"title":"Cộng và trừ số thập phân","lead":"Dấu phẩy của các số phải thẳng cột. Có thể thêm số 0 ở cuối phần thập phân để đủ số hàng.","steps":["Đặt thẳng dấu phẩy","Tính từng cột","Viết dấu phẩy của kết quả thẳng cột"],"example":"","tip":"","worked":[]},{"title":"Tỉ số, phần trăm và tỉ lệ bản đồ","lead":"Tỉ số là thương của hai đại lượng cùng loại sau khi đổi cùng đơn vị. p% nghĩa là p phần trên 100. Với tỉ lệ bản đồ 1 : n, một đơn vị trên bản đồ tương ứng n đơn vị thật.","steps":["Xác định mẫu gốc hoặc sơ đồ phần bằng nhau","Chọn tìm phần, tìm gốc hoặc tìm tỉ số","Kiểm tra cùng đơn vị"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Diện tích và thể tích","intro":"Diện tích dùng đơn vị vuông, thể tích dùng đơn vị khối.","formulas":"S tam giác = ah : 2; S hình tròn = πr²; V hộp = abh; V lập phương = a³","short":"","notes":[["","Diện tích theo đáy, chiều cao hoặc đường chéo","Chiều cao là khoảng cách vuông góc tới đường chứa đáy. Hình thang dùng tổng hai đáy song song. Hình thoi có thể tính bằng nửa tích hai đường chéo.","S tam giác = \\frac{ah}{2} // S hình thang = \\frac{(a+b)h}{2} // S hình bình hành = ah; S hình thoi = \\frac{d₁d₂}{2}"],["","Đường tròn và hình tròn","Đường tròn là đường biên. Hình tròn gồm đường biên và miền bên trong. Bán kính nối tâm với đường tròn; đường kính đi qua tâm và bằng hai lần bán kính.","d = 2r; C = 2πr = πd; S = πr²"],["","Hộp chữ nhật và lập phương","Hình khai triển gồm các mặt được mở phẳng. Diện tích xung quanh hộp là tổng bốn mặt bên; toàn phần còn gồm hai đáy. Thể tích bằng diện tích đáy nhân chiều cao.","Hộp: S_{xq} = 2(a+b)h; S_{tp} = S_{xq}+2ab; V = abh // Lập phương: S_{xq}=4a²; S_{tp}=6a²; V=a³"]],"methods":[{"title":"Diện tích theo đáy, chiều cao hoặc đường chéo","lead":"Chiều cao là khoảng cách vuông góc tới đường chứa đáy. Hình thang dùng tổng hai đáy song song. Hình thoi có thể tính bằng nửa tích hai đường chéo.","steps":["Xác định loại hình","Chọn đáy và chiều cao tương ứng hoặc hai đường chéo","Nhân chia theo công thức"],"example":"","tip":"","worked":[]},{"title":"Đường tròn và hình tròn","lead":"Đường tròn là đường biên. Hình tròn gồm đường biên và miền bên trong. Bán kính nối tâm với đường tròn; đường kính đi qua tâm và bằng hai lần bán kính.","steps":["Xác định r hay d","Chọn độ dài đường bao hoặc diện tích","Thay π theo yêu cầu làm tròn"],"example":"","tip":"","worked":[]},{"title":"Hộp chữ nhật và lập phương","lead":"Hình khai triển gồm các mặt được mở phẳng. Diện tích xung quanh hộp là tổng bốn mặt bên; toàn phần còn gồm hai đáy. Thể tích bằng diện tích đáy nhân chiều cao.","steps":["Xác định các mặt thực sự được sơn hoặc dán","Đổi cạnh cùng đơn vị","Tính diện tích cần dùng hoặc thể tích"],"example":"Hộp không nắp chỉ cộng một mặt đáy vào diện tích xung quanh.","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Chuyển động","intro":"Tính theo s = vt sau khi đổi đơn vị thời gian. Đọc kĩ có tính thời gian nghỉ hay không.","formulas":"","short":"","notes":[["","Vận tốc và chuyển động đều","Trong chuyển động đều, vận tốc không đổi. Khi hai vật đi về phía nhau, khoảng cách giảm theo tổng vận tốc; đuổi nhau cùng chiều thì dùng hiệu vận tốc.","s = vt; v=\\frac{s}{t}; t=\\frac{s}{v}"]],"methods":[{"title":"Vận tốc và chuyển động đều","lead":"Trong chuyển động đều, vận tốc không đổi. Khi hai vật đi về phía nhau, khoảng cách giảm theo tổng vận tốc; đuổi nhau cùng chiều thì dùng hiệu vận tốc.","steps":["Đổi phút sang giờ hoặc đổi vận tốc","Vẽ hướng chuyển động","Lập quan hệ theo quãng đường thực"],"example":"","tip":"","worked":[]},{"title":"Chuyển động và phần trăm","lead":"","steps":[],"example":"","tip":"","worked":[["Chuyển động và phần trăm","Xe cần đi 150 km. Đi được 60% quãng đường. Còn bao xa?",["Phần còn lại là 100% − 60% = 40%.","Tính 150 × 0,4.","Kiểm tra 90 km đã đi và 60 km còn lại cộng bằng 150 km."],"60 km.",""]]}],"visuals":[],"table":[]},{"title":"Dữ liệu","intro":"Đọc cả đơn vị, chú giải và tổng mẫu trước khi đổi số lượng sang phần trăm.","formulas":"","short":"","notes":[["","Dữ liệu và biểu đồ","Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","Góc ở tâm = tỉ lệ × 360° // Tỉ lệ = \\frac{số của nhóm}{tổng số}"]],"methods":[{"title":"Dữ liệu và biểu đồ","lead":"Dữ liệu có thể là số hoặc nhóm phân loại. Bảng ghi tần số theo nhóm. Biểu đồ tranh phải đọc chú giải; biểu đồ cột so lượng; biểu đồ đường thể hiện biến đổi; hình quạt thể hiện phần của tổng.","steps":["Đọc tên, đơn vị và thang chia","Xác định nhóm hoặc thời điểm đang hỏi","So sánh hoặc tính tỉ lệ"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]}],"g6-c1":[{"title":"Tập hợp","intro":"Có thể liệt kê phần tử trong ngoặc nhọn hoặc mô tả tính chất đặc trưng. Dùng ∈ khi phần tử thuộc tập hợp, ∉ khi không thuộc.","formulas":"ℕ = {0; 1; 2; …}; ℕ* = {1; 2; 3; …}","short":"","notes":[["","Tập hợp số tự nhiên","Một tập hợp gồm các phần tử phân biệt. Có thể liệt kê hoặc nêu tính chất đặc trưng. Dùng ∈ cho phần tử thuộc và ∉ cho phần tử không thuộc.","ℕ = {0; 1; 2; …}; ℕ* = {1; 2; 3; …}"]],"methods":[{"title":"Tập hợp số tự nhiên","lead":"Một tập hợp gồm các phần tử phân biệt. Có thể liệt kê hoặc nêu tính chất đặc trưng. Dùng ∈ cho phần tử thuộc và ∉ cho phần tử không thuộc.","steps":["Xác định điều kiện phần tử","Liệt kê không trùng","Kiểm tra mốc đầu và cuối"],"example":"","tip":"","worked":[]},{"title":"Từ mô tả sang liệt kê","lead":"","steps":[],"example":"","tip":"","worked":[["Từ mô tả sang liệt kê","Liệt kê các số tự nhiên lớn hơn 8, nhỏ hơn hoặc bằng 13 và chia hết cho 3.",["Điều kiện biên cho 9, 10, 11, 12, 13.","Trong danh sách, 9 và 12 là bội của 3.","Viết mỗi phần tử đúng một lần trong ngoặc nhọn."],"A = {9; 12}.",""]]}],"visuals":[],"table":[],"core":[["Mô tả tập hợp",["Liệt kê mỗi phần tử một lần.","Có thể chỉ rõ tính chất chung thay vì liệt kê."],"A = {x ∈ ℕ ∣ x < 4} = {0; 1; 2; 3}"]]},{"title":"Số tự nhiên và thứ tự","intro":"Hệ thập phân dùng giá trị theo hàng. Trên tia số, số bên phải lớn hơn. Khi đếm tất cả số nguyên từ a đến b, lấy b − a + 1.","formulas":"","short":"","notes":[["","Giá trị theo hàng","Từ phải sang trái lần lượt là đơn vị, chục, trăm, nghìn, … Mỗi đơn vị của một hàng gấp 10 lần đơn vị hàng liền bên phải. Chữ số 0 giữ vị trí hàng trống.","407 = 400 + 0 + 7"],["","Thứ tự và dấu so sánh","Số xuất hiện sau trong dãy đếm tiến thì lớn hơn. Với số nhiều chữ số có cùng độ dài, so từ hàng cao nhất khác nhau. Miệng rộng của dấu quay về phía số lớn.","4 < 7; 7 > 4; 7 = 7"]],"methods":[{"title":"Giá trị theo hàng","lead":"Từ phải sang trái lần lượt là đơn vị, chục, trăm, nghìn, … Mỗi đơn vị của một hàng gấp 10 lần đơn vị hàng liền bên phải. Chữ số 0 giữ vị trí hàng trống.","steps":["Đánh dấu hàng từ phải qua trái","Đọc chữ số được hỏi","Nhân với giá trị hàng nếu đề hỏi giá trị"],"example":"Chữ số 4 trong 407 có giá trị 400.","tip":"","worked":[]},{"title":"Thứ tự và dấu so sánh","lead":"Số xuất hiện sau trong dãy đếm tiến thì lớn hơn. Với số nhiều chữ số có cùng độ dài, so từ hàng cao nhất khác nhau. Miệng rộng của dấu quay về phía số lớn.","steps":["Đặt số lên tia số hoặc so từng hàng","Chọn dấu","Đọc lại cả câu để kiểm tra"],"example":"62 > 58 vì 6 chục nhiều hơn 5 chục.","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Phép tính","intro":"Cộng và nhân có giao hoán, kết hợp. Nhân phân phối với cộng, trừ. Chia có dư có 0 ≤ r < b.","formulas":"a(b + c) = ab + ac; a = bq + r","short":"","notes":[["","Phép cộng","Gộp hai nhóm hoặc thêm vào dùng phép cộng. Cộng các chữ số cùng hàng. Nếu kết quả một hàng từ 10 trở lên, ghi chữ số hàng đó và chuyển một đơn vị sang hàng liền bên trái.","Số hạng + số hạng = tổng"],["","Phép trừ","Dùng để tìm phần còn lại hoặc chênh lệch. Nếu chữ số ở hàng đang xét không đủ trừ, đổi một đơn vị của hàng bên trái thành 10 đơn vị của hàng đó.","Số bị trừ − số trừ = hiệu"],["","Phép nhân","Phép nhân gộp các nhóm có số lượng bằng nhau. Hai số đem nhân là thừa số; kết quả là tích. Thừa số chưa biết bằng tích chia cho thừa số đã biết khác 0.","a × b = tổng của b số hạng đều bằng a"],["","Phép chia và số dư","Có thể chia đều theo số nhóm, hoặc tìm số nhóm khi biết lượng trong mỗi nhóm. Khi chia có dư, số dư nhỏ hơn số chia.","Số bị chia = số chia × thương + số dư"]],"methods":[{"title":"Phép cộng","lead":"Gộp hai nhóm hoặc thêm vào dùng phép cộng. Cộng các chữ số cùng hàng. Nếu kết quả một hàng từ 10 trở lên, ghi chữ số hàng đó và chuyển một đơn vị sang hàng liền bên trái.","steps":["Đặt các chữ số cùng hàng thẳng cột","Cộng từ phải sang trái","Nhớ sang hàng kế tiếp nếu cần"],"example":"8 + 7 = 8 + 2 + 5 = 15.","tip":"","worked":[]},{"title":"Phép trừ","lead":"Dùng để tìm phần còn lại hoặc chênh lệch. Nếu chữ số ở hàng đang xét không đủ trừ, đổi một đơn vị của hàng bên trái thành 10 đơn vị của hàng đó.","steps":["Đặt thẳng các hàng","Trừ từ phải sang trái, có thể đổi chục hoặc trăm","Lấy hiệu cộng số trừ để kiểm tra"],"example":"63 − 27 = 36 vì 36 + 27 = 63.","tip":"","worked":[]},{"title":"Phép nhân","lead":"Phép nhân gộp các nhóm có số lượng bằng nhau. Hai số đem nhân là thừa số; kết quả là tích. Thừa số chưa biết bằng tích chia cho thừa số đã biết khác 0.","steps":["Tìm số nhóm và số vật mỗi nhóm","Nhân hai số","Dùng bảng nhân hoặc đặt tính để kiểm tra"],"example":"Có 4 túi, mỗi túi 6 quả: 6 × 4 = 24 quả.","tip":"","worked":[]},{"title":"Phép chia và số dư","lead":"Có thể chia đều theo số nhóm, hoặc tìm số nhóm khi biết lượng trong mỗi nhóm. Khi chia có dư, số dư nhỏ hơn số chia.","steps":["Chọn ý nghĩa của thương","Chia từ hàng lớn đến hàng nhỏ nếu đặt tính","Xử lí dư theo câu hỏi"],"example":"25 người, xe chở 4 người: 25 : 4 được 6 dư 1, cần 7 xe.","tip":"","worked":[]},{"title":"Tính nhanh tổng bằng cách ghép cặp","lead":"","steps":["Viết số hạng đầu và cuối, đếm số hạng.","Ghép số nhỏ nhất với số lớn nhất rồi lặp lại.","Nếu còn một số ở giữa, cộng riêng số đó."],"example":"","worked":[],"tip":"","practice":["Tính 21 + 22 + … + 41.","Mỗi cặp hai đầu có tổng 62. Số 31 đứng giữa.","Có 10 cặp, kết quả 10·62 + 31 = 651."]}],"visuals":[],"table":[]},{"title":"Lũy thừa và thứ tự tính","intro":"Tính trong ngoặc trước, rồi lũy thừa, nhân chia, cộng trừ.","formulas":"a^{m}·a^{n} = a^{m+n}; a^{m} : a^{n} = a^{m−n} (a ≠ 0, m ≥ n)","short":"","notes":[["","Lũy thừa với số mũ tự nhiên","aⁿ là tích n thừa số a. Dấu ngoặc quyết định dấu: (−a)² = a² nhưng −a² là số đối của a². Với a khác 0, a⁰ = 1.","a^{m}·a^{n}=a^{m+n} // a^{m}:a^{n}=a^{m−n} (a ≠ 0, m ≥ n) // (a^{m})^{n}=a^{mn}; (ab)^{n}=a^{n}b^{n}"],["","Thứ tự thực hiện phép tính","Tính trong ngoặc trước. Sau đó tính lũy thừa nếu có, rồi nhân, chia, rồi cộng, trừ. Các phép cùng mức thực hiện từ trái sang phải.","8 + 2 × 5 = 18; (8 + 2) × 5 = 50"]],"methods":[{"title":"Lũy thừa với số mũ tự nhiên","lead":"aⁿ là tích n thừa số a. Dấu ngoặc quyết định dấu: (−a)² = a² nhưng −a² là số đối của a². Với a khác 0, a⁰ = 1.","steps":["Xem cơ số có giống nhau không","Chọn cộng, trừ hoặc nhân số mũ","Kiểm tra dấu và cơ số 0"],"example":"","tip":"","worked":[]},{"title":"Thứ tự thực hiện phép tính","lead":"Tính trong ngoặc trước. Sau đó tính lũy thừa nếu có, rồi nhân, chia, rồi cộng, trừ. Các phép cùng mức thực hiện từ trái sang phải.","steps":["Đánh dấu ngoặc và phép tính ưu tiên","Mỗi dòng rút gọn một bước","Giữ nguyên phần chưa tính"],"example":"","tip":"","worked":[]},{"title":"Tính biểu thức có ngoặc và lũy thừa","lead":"Dấu ngoặc cho biết phần cần xử lý riêng.","steps":["Tính các lũy thừa trong ngoặc.","Rút gọn từng ngoặc từ trong ra ngoài.","Tính nhân, chia trước cộng, trừ và giữ đúng thứ tự ở các phép cùng cấp."],"example":"36 : (2³ + 1) + 4 = 36 : 9 + 4 = 8.","worked":[],"tip":""}],"visuals":[],"table":[],"core":[["Cùng cơ số",["Khi nhân, cộng số mũ. Khi chia, trừ số mũ nếu cơ số khác 0 và số mũ bị chia không nhỏ hơn số mũ chia."],"a^m·a^n = a^{m+n} // a^m : a^n = a^{m−n}"]]}],"g6-c2":[{"title":"Chia hết","intro":"a chia hết cho b khác 0 khi dư bằng 0. a là bội của b, b là ước của a. Dấu hiệu 2 và 5 xem chữ số tận cùng; 3 và 9 xem tổng các chữ số.","formulas":"Chia hết cho 2: tận cùng chẵn; chia hết cho 5: tận cùng 0 hoặc 5","short":"","notes":[["định lí","Kiểm tra đồng thời hai dấu hiệu chia hết","Khi đề cho số chứa chữ số chưa biết, dùng điều kiện tận cùng để giảm khả năng, rồi thử tổng chữ số. Nếu b và c nguyên tố cùng nhau, chia hết cho cả hai thì chia hết cho tích.","Số chia hết cho cả 3 và 5 thì chia hết cho 15"]],"methods":[{"title":"Kiểm tra đồng thời hai dấu hiệu chia hết","lead":"Khi đề cho số chứa chữ số chưa biết, dùng điều kiện tận cùng để giảm khả năng, rồi thử tổng chữ số. Nếu b và c nguyên tố cùng nhau, chia hết cho cả hai thì chia hết cho tích.","steps":["Ghi các chữ số có thể","Áp dụng từng điều kiện","Thử lại cả hai"],"example":"32x chia hết cho 5 thì x∈{0;5}; tổng chữ số chỉ chia hết cho 3 khi x không thuộc hai lựa chọn, nên vô nghiệm.","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Dấu hiệu chia hết",["Xét tận cùng cho 2, 5. Xét tổng chữ số cho 3, 9.","Khi cộng hoặc trừ các bội của cùng một số, kết quả vẫn là bội của số đó."],"12 ∣ 60 nghĩa là 60 chia hết cho 12"]]},{"title":"Số nguyên tố","intro":"Số tự nhiên lớn hơn 1 có đúng hai ước dương là 1 và chính nó. Hợp số có nhiều hơn hai ước dương. 0 và 1 không thuộc hai loại đó.","formulas":"","short":"","notes":[["","Số nguyên tố và hợp số","Số nguyên tố lớn hơn 1 có đúng hai ước dương. Hợp số lớn hơn 1 có hơn hai ước dương. 0 và 1 không thuộc hai loại. Mỗi hợp số phân tích được thành tích thừa số nguyên tố.","84 = 2²·3·7"]],"methods":[{"title":"Số nguyên tố và hợp số","lead":"Số nguyên tố lớn hơn 1 có đúng hai ước dương. Hợp số lớn hơn 1 có hơn hai ước dương. 0 và 1 không thuộc hai loại. Mỗi hợp số phân tích được thành tích thừa số nguyên tố.","steps":["Thử chia các số nguyên tố nhỏ","Tách thừa số cho đến khi mọi thừa số đều nguyên tố","Nhân kiểm tra"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"diagrams":["primeTree"]},{"title":"ƯCLN và BCNN","intro":"Phân tích thành thừa số nguyên tố. ƯCLN lấy thừa số chung với số mũ nhỏ nhất. BCNN lấy mọi thừa số xuất hiện với số mũ lớn nhất.","formulas":"ƯCLN(12,18) = 6; BCNN(12,18) = 36","short":"","notes":[["","Ước chung và ước chung lớn nhất","Ước chung chia hết mọi số đã cho. ƯCLN là ước chung dương lớn nhất; các ước chung là các ước của ƯCLN. Hai số nguyên tố cùng nhau có ƯCLN bằng 1.","ƯCLN(24,36) = 2²·3 = 12"],["","Bội chung và bội chung nhỏ nhất","Bội chung chia hết cho mọi số đã cho. BCNN là bội chung dương nhỏ nhất; mọi bội chung là bội của BCNN.","BCNN(12,18) = 2²·3² = 36"]],"methods":[{"title":"Ước chung và ước chung lớn nhất","lead":"Ước chung chia hết mọi số đã cho. ƯCLN là ước chung dương lớn nhất; các ước chung là các ước của ƯCLN. Hai số nguyên tố cùng nhau có ƯCLN bằng 1.","steps":["Phân tích từng số","Lấy các thừa số chung với số mũ nhỏ nhất","Nhân lại"],"example":"Chia 24 bút và 36 vở thành nhiều túi giống nhau nhất được 12 túi.","tip":"","worked":[]},{"title":"Bội chung và bội chung nhỏ nhất","lead":"Bội chung chia hết cho mọi số đã cho. BCNN là bội chung dương nhỏ nhất; mọi bội chung là bội của BCNN.","steps":["Phân tích từng số","Lấy mọi thừa số xuất hiện với số mũ lớn nhất","Nhân lại"],"example":"Hai chu kì 12 và 18 phút cùng lặp lần đầu sau 36 phút.","tip":"","worked":[]},{"title":"Tìm lần trùng lịch bằng BCNN","lead":"Hai việc lặp lại sau những khoảng cố định và cùng bắt đầu tại một thời điểm.","steps":["Đổi các khoảng về cùng đơn vị.","Phân tích các chu kì thành thừa số nguyên tố, lấy số mũ lớn nhất ở mỗi thừa số.","Nhân để tìm BCNN. Nếu hỏi số lần trong một khoảng, kiểm tra có tính lần ban đầu không."],"example":"Hai chuông reo mỗi 12 và 18 phút. Lần tiếp theo cùng reo sau 36 phút.","worked":[],"tip":""},{"title":"Dùng ƯCLN để chia nhóm","lead":"","steps":[],"example":"","tip":"","worked":[["Dùng ƯCLN để chia nhóm","Có 36 bút xanh và 48 bút đỏ. Chia nhiều nhất bao nhiêu gói giống nhau và dùng hết bút?",["Số gói phải là ước của cả 36 và 48 để mỗi màu đều chia hết.","Phân tích 36 = 2²·3² và 48 = 2⁴·3.","Lấy thừa số chung với số mũ nhỏ hơn, 2²·3 = 12. Mỗi gói có 3 bút xanh và 4 bút đỏ."],"12 gói.",""]]}],"visuals":[],"table":[],"core":[["Phân tích thừa số nguyên tố",["ƯCLN lấy thừa số chung với số mũ nhỏ nhất.","BCNN lấy mọi thừa số xuất hiện với số mũ lớn nhất."],""]]},{"title":"Vận dụng","intro":"Chia các vật thành nhiều nhóm giống nhau nhất thường dùng ƯCLN. Tìm thời điểm hai chu kì lặp cùng nhau lần đầu thường dùng BCNN.","formulas":"","short":"","notes":[["cách làm","Nhìn từ khóa rồi kiểm tra quan hệ chia hết","Chia đều thành số nhóm lớn nhất thường là ƯCLN vì số nhóm phải là ước. Tìm thời điểm lặp lại sớm nhất thường là BCNN vì khoảng thời gian phải là bội.","\\frac{a·b}{ƯCLN(a,b)}=BCNN(a,b) với a,b nguyên dương"]],"methods":[{"title":"Nhìn từ khóa rồi kiểm tra quan hệ chia hết","lead":"Chia đều thành số nhóm lớn nhất thường là ƯCLN vì số nhóm phải là ước. Tìm thời điểm lặp lại sớm nhất thường là BCNN vì khoảng thời gian phải là bội.","steps":["Viết điều kiện “chia hết cho” theo đúng chiều","Chọn ƯCLN hoặc BCNN","Thử kết quả theo bài toán"],"example":"","tip":"","worked":[]},{"title":"Tìm số có cùng số dư khi chia cho nhiều số","lead":"","steps":["Trừ số dư chung để đưa về chia hết.","Tìm BCNN rồi chọn bội theo khoảng đề cho.","Cộng lại số dư và thử điều kiện."],"example":"","worked":[],"tip":"","practice":["Tìm số tự nhiên N, 30 < N < 60, chia cho 6 hoặc 8 đều dư 2.","N − 2 là bội của 24 và nằm giữa 28 và 58.","N − 2 = 48, vậy N = 50."]}],"visuals":[],"table":[]}],"g6-c3":[{"title":"Số nguyên và số đối","intro":"Số nguyên gồm số âm, 0 và số dương. Hai số đối cách 0 bằng nhau và nằm khác phía nếu khác 0.","formulas":"ℤ = {…; −2; −1; 0; 1; 2; …}; a + (−a) = 0","short":"","notes":[["","Tập hợp số nguyên","ℤ gồm số nguyên âm, 0 và số nguyên dương. Trên trục số, càng sang phải càng lớn. Hai số đối có tổng 0 và cách 0 một khoảng bằng nhau.","−5 < −2 < 0 < 3; số đối của a là −a"]],"methods":[{"title":"Tập hợp số nguyên","lead":"ℤ gồm số nguyên âm, 0 và số nguyên dương. Trên trục số, càng sang phải càng lớn. Hai số đối có tổng 0 và cách 0 một khoảng bằng nhau.","steps":["Đặt mốc 0","Xác định phía và khoảng cách","So từ trái sang phải"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Đọc trục số",["Số ở bên phải lớn hơn. Số đối của a là −a.","Hai số đối nhau cách 0 một khoảng bằng nhau."],"−4 < 0 < 3"]],"diagrams":["signed"]},{"title":"Cộng và trừ","intro":"Cùng dấu thì cộng độ lớn và giữ dấu. Trái dấu thì lấy độ lớn lớn trừ nhỏ, theo dấu số có độ lớn lớn hơn.","formulas":"a − b = a + (−b)","short":"","notes":[["","Cộng và trừ số nguyên","Cùng dấu cộng độ lớn, giữ dấu chung. Trái dấu lấy độ lớn lớn trừ độ lớn nhỏ và giữ dấu của số có độ lớn lớn hơn. Trừ là cộng số đối.","a − b = a + (−b)"]],"methods":[{"title":"Cộng và trừ số nguyên","lead":"Cùng dấu cộng độ lớn, giữ dấu chung. Trái dấu lấy độ lớn lớn trừ độ lớn nhỏ và giữ dấu của số có độ lớn lớn hơn. Trừ là cộng số đối.","steps":["Đổi trừ thành cộng nếu cần","So dấu và độ lớn","Gắn dấu kết quả"],"example":"−7 − (−3) = −7 + 3 = −4.","tip":"","worked":[]},{"title":"Trừ một số âm","lead":"","steps":[],"example":"","tip":"","worked":[["Trừ một số âm","Nhiệt độ hiện tại là 3°C, buổi sáng là −4°C. Nhiệt độ tăng bao nhiêu?",["Lấy nhiệt độ sau trừ nhiệt độ trước, 3 − (−4).","Trên trục số, từ −4 tới 0 là 4 đơn vị, từ 0 tới 3 thêm 3 đơn vị.","Tổng độ tăng là 4 + 3."],"Tăng 7°C.",""]]},{"title":"Tìm vị trí xuất phát từ vị trí cuối","lead":"","steps":["Chọn dấu cho mỗi độ dời theo hướng quy ước.","Viết vị trí cuối bằng vị trí đầu cộng các độ dời.","Trừ từng độ dời để tìm vị trí đầu."],"example":"","worked":[],"tip":"","practice":["Một thang máy lên 7 tầng, sau đó xuống 4 tầng và dừng ở tầng 2. Tầng trệt mang số 0, tầng hầm mang số âm. Thang máy xuất phát ở tầng nào?","Tổng độ dời là 7 + (−4) = 3.","Tầng −1 vì −1 + 3 = 2."]}],"visuals":[0],"table":[]},{"title":"Dấu ngoặc","intro":"Bỏ ngoặc sau dấu cộng giữ dấu trong ngoặc. Bỏ ngoặc sau dấu trừ đổi dấu từng số hạng.","formulas":"a − (b − c) = a − b + c","short":"","notes":[["","Quy tắc dấu ngoặc","Ngoặc sau dấu cộng bỏ được và giữ dấu bên trong. Ngoặc sau dấu trừ đổi dấu của mọi hạng tử bên trong.","a+(b−c)=a+b−c; a−(b−c)=a−b+c"],["cách làm","Tách dấu, giữ thứ tự phép tính","Phép trừ số âm chuyển thành cộng số đối. Tích hoặc thương khác 0 có dấu âm nếu hai số trái dấu. Không áp dụng quy tắc dấu tích cho phép cộng.","−5−(−2)=−3; (−5)·(−2)=10"]],"methods":[{"title":"Quy tắc dấu ngoặc","lead":"Ngoặc sau dấu cộng bỏ được và giữ dấu bên trong. Ngoặc sau dấu trừ đổi dấu của mọi hạng tử bên trong.","steps":["Nhìn dấu đứng ngay trước ngoặc","Đổi mọi dấu nếu là trừ","Nhóm các số thuận tiện"],"example":"","tip":"","worked":[]},{"title":"Tách dấu, giữ thứ tự phép tính","lead":"Phép trừ số âm chuyển thành cộng số đối. Tích hoặc thương khác 0 có dấu âm nếu hai số trái dấu. Không áp dụng quy tắc dấu tích cho phép cộng.","steps":["Xử lí ngoặc trước","Chọn quy tắc theo phép toán","Dùng trục số kiểm tra cộng trừ"],"example":"","tip":"","worked":[]},{"title":"Bỏ ngoặc có dấu trừ phía trước","lead":"Xét dấu ngay trước ngoặc.","steps":["Đổi dấu từng số hạng trong ngoặc nếu trước ngoặc là dấu trừ.","Viết lại các số hạng với dấu mới.","Ghép các số đối nhau rồi tính tổng."],"example":"7 − (−3 + 11) = 7 + 3 − 11 = −1.","worked":[],"tip":""}],"visuals":[],"table":[]},{"title":"Nhân và chia","intro":"Hai số cùng dấu cho kết quả dương, trái dấu cho âm. Chia hết trong ℤ cần số chia khác 0 và thương nguyên.","formulas":"(−6)·(−4) = 24; (−24) : 6 = −4","short":"","notes":[["","Nhân và chia số nguyên","Hai số cùng dấu cho tích hoặc thương dương; trái dấu cho âm. Tích với 0 bằng 0. Chia hết trong ℤ cần số chia khác 0 và thương nguyên.","(−a)(−b)=ab; (−24):6=−4"]],"methods":[{"title":"Nhân và chia số nguyên","lead":"Hai số cùng dấu cho tích hoặc thương dương; trái dấu cho âm. Tích với 0 bằng 0. Chia hết trong ℤ cần số chia khác 0 và thương nguyên.","steps":["Tách xét dấu và độ lớn","Tính phần dương","Kiểm tra điều kiện chia hết nếu đề hỏi"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Dấu của tích và thương",["Cùng dấu cho kết quả dương; khác dấu cho kết quả âm, với hai số khác 0.","Muốn chia hết trong ℤ thì thương phải là số nguyên."],""]]}],"g6-c4":[{"title":"Tam giác đều, hình vuông, lục giác đều","intro":"Tam giác đều có ba cạnh bằng nhau và ba góc 60°. Hình vuông có bốn cạnh bằng nhau và bốn góc vuông. Lục giác đều có thể chia thành sáu tam giác đều quanh tâm.","formulas":"","short":"","notes":[["","Tính chất hình phẳng trong thực tiễn","Tam giác đều có ba cạnh bằng nhau, các góc 60°. Lục giác đều chia thành sáu tam giác đều có chung tâm. Hình thoi có bốn cạnh bằng nhau; hình bình hành có các cặp cạnh đối song song; hình thang cân có hai góc kề một đáy bằng nhau.","P tam giác đều = 3a; P lục giác đều = 6a"]],"methods":[{"title":"Tính chất hình phẳng trong thực tiễn","lead":"Tam giác đều có ba cạnh bằng nhau, các góc 60°. Lục giác đều chia thành sáu tam giác đều có chung tâm. Hình thoi có bốn cạnh bằng nhau; hình bình hành có các cặp cạnh đối song song; hình thang cân có hai góc kề một đáy bằng nhau.","steps":["Dựa vào dấu hiệu cạnh và góc","Đọc cạnh bằng nhau trên hình","Dùng công thức phù hợp nếu cần"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Nhận dạng đa giác đều",["Tam giác đều có ba góc 60°.","Lục giác đều tách thành sáu tam giác đều bằng nhau.","Hình vuông có bốn góc vuông và bốn cạnh bằng nhau."],""]],"diagrams":["regularGrid"]},{"title":"Hình chữ nhật và hình bình hành","intro":"Hình chữ nhật có hai cặp cạnh đối song song và bốn góc vuông. Hình bình hành có hai cặp cạnh đối song song và bằng nhau.","formulas":"P chữ nhật = 2(a + b); S chữ nhật = ab; S bình hành = ah","short":"","notes":[["","Chu vi và diện tích","Chu vi là tổng độ dài đường bao; diện tích là số đơn vị vuông phủ kín phần mặt. Khi ghép mảnh không chồng lấn, diện tích cộng được, còn cạnh ghép chung không thuộc chu vi ngoài.","P chữ nhật = 2(a + b); S chữ nhật = ab; P vuông = 4a; S vuông = a²"]],"methods":[{"title":"Chu vi và diện tích","lead":"Chu vi là tổng độ dài đường bao; diện tích là số đơn vị vuông phủ kín phần mặt. Khi ghép mảnh không chồng lấn, diện tích cộng được, còn cạnh ghép chung không thuộc chu vi ngoài.","steps":["Đổi các kích thước về cùng đơn vị","Xác định đề hỏi đường bao hay mặt","Chọn công thức và ghi đơn vị đúng"],"example":"","tip":"","worked":[["Cạnh hình vuông từ chu vi","Một hình vuông có chu vi 28 cm. Tính diện tích.",["Bốn cạnh bằng nhau, nên cạnh dài 28 : 4 = 7 cm.","Nhân hai độ dài cạnh để tính diện tích."],"S = 49 cm².","Độ dài cạnh đo bằng cm, diện tích đo bằng cm²."]]},{"title":"Tính diện tích hình ghép qua phần bị khuyết","lead":"Khi hình có thể phủ vừa một hình chữ nhật, phần thừa thường tính được đơn giản.","steps":["Vẽ hình bao và đánh dấu phần bị khuyết.","Tìm kích thước còn thiếu bằng các đoạn cùng phương.","Tính diện tích hình bao rồi trừ diện tích phần khuyết."],"example":"Mảnh đất nằm trong hình chữ nhật 12 m × 8 m, khuyết một hình chữ nhật 3 m × 2 m. Diện tích còn 96 − 6 = 90 m².","worked":[],"tip":""},{"title":"Tách hình để tìm diện tích","lead":"","steps":[],"example":"","tip":"","worked":[["Tách hình để tìm diện tích","Hình bình hành có đáy 12 cm, chiều cao ứng với đáy 7 cm và cạnh bên 9 cm. Tính diện tích.",["Xác định chiều cao vuông góc với đáy là 7 cm.","Hình bình hành cắt ghép được thành hình chữ nhật có chiều dài 12 cm, rộng 7 cm.","Nhân đáy với chiều cao."],"84 cm².","Cạnh bên 9 cm dùng khi tính chu vi."]]},{"title":"So chu vi trước và sau khi khoét góc","lead":"","steps":["Đánh dấu hai đoạn biên mất đi.","Đếm hai đoạn biên mới theo chiều dài và chiều rộng phần bị khoét.","Dùng sự chênh lệch để tính chu vi và trừ diện tích phần khoét."],"example":"","worked":[],"tip":"","practice":["Hình chữ nhật 12 m × 8 m bị khoét một hình chữ nhật 3 m × 2 m ở một góc. Tìm chu vi và diện tích phần còn lại.","Hai đoạn mới có tổng độ dài đúng bằng hai đoạn mất đi.","Chu vi 40 m. Diện tích 96 − 6 = 90 m²."],"diagram":"practiceNotch"}],"visuals":[0],"table":[]},{"title":"Hình thoi","intro":"Bốn cạnh bằng nhau, hai đường chéo vuông góc và cắt nhau tại trung điểm.","formulas":"S = \\frac{d₁d₂}{2}","short":"","notes":[["","Diện tích theo đáy, chiều cao hoặc đường chéo","Chiều cao là khoảng cách vuông góc tới đường chứa đáy. Hình thang dùng tổng hai đáy song song. Hình thoi có thể tính bằng nửa tích hai đường chéo.","S tam giác = \\frac{ah}{2} // S hình thang = \\frac{(a+b)h}{2} // S hình bình hành = ah; S hình thoi = \\frac{d₁d₂}{2}"]],"methods":[{"title":"Diện tích theo đáy, chiều cao hoặc đường chéo","lead":"Chiều cao là khoảng cách vuông góc tới đường chứa đáy. Hình thang dùng tổng hai đáy song song. Hình thoi có thể tính bằng nửa tích hai đường chéo.","steps":["Xác định loại hình","Chọn đáy và chiều cao tương ứng hoặc hai đường chéo","Nhân chia theo công thức"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[],"core":[["Diện tích hình thoi",["Hai đường chéo hình thoi vuông góc và cắt nhau tại trung điểm mỗi đường."],"S = \\frac{d_1 d_2}{2}"]],"diagrams":["rhombus"]},{"title":"Hình thang cân","intro":"Hai đáy song song, hai góc kề mỗi đáy bằng nhau, hai cạnh bên bằng nhau.","formulas":"S hình thang = \\frac{(a + b)h}{2}","short":"","notes":[],"methods":[],"visuals":[],"table":[],"diagrams":["trapezoid"]}],"g6-c5":[{"title":"Trục đối xứng","intro":"Gấp theo trục thì hai phần hình chồng khít. Điểm trên trục đứng yên.","formulas":"| Hình vuông có bốn trục: hai đường chéo và hai đường qua trung điểm các cạnh đối.","short":"","notes":[["","","Gấp theo một đường thẳng mà hai phần của hình trùng nhau thì đường đó là trục đối xứng. Mọi điểm trên trục đứng yên.","Hình vuông có 4 trục; hình chữ nhật dài hơn rộng có 2 trục"]],"methods":[{"title":"Trục đối xứng","lead":"Gấp theo một đường thẳng mà hai phần của hình trùng nhau thì đường đó là trục đối xứng. Mọi điểm trên trục đứng yên.","steps":["Đề xuất đường gấp","Đối chiếu từng đỉnh hoặc cạnh tương ứng","Loại đường chỉ đi qua giữa nhưng hai nửa không trùng"],"example":"","tip":"","worked":[]}],"visuals":[],"table":[]},{"title":"Tâm đối xứng","intro":"Quay hình 180° quanh tâm làm hình trùng lại. Tâm là trung điểm nối hai điểm đối xứng.","formulas":"| Giao điểm hai đường chéo của hình bình hành là tâm đối xứng.","short":"","notes":[["","","Khi quay 180° quanh O mà hình trùng với chính nó, O là tâm đối xứng. Nếu P và P′ tương ứng, O là trung điểm PP′.","OP = OP′ và O nằm giữa P, P′"]],"methods":[{"title":"Tâm đối xứng","lead":"Khi quay 180° quanh O mà hình trùng với chính nó, O là tâm đối xứng. Nếu P và P′ tương ứng, O là trung điểm PP′.","steps":["Tìm giao điểm hai đường chéo hoặc trung điểm","Ghép cặp điểm đối diện","Kiểm tra cả hình sau nửa vòng quay"],"example":"","tip":"","worked":[]},{"title":"Kiểm tra tâm đối xứng bằng cặp điểm","lead":"Một phép quay 180° quanh O phải đưa hình về chính nó.","steps":["Chọn tâm ứng viên O.","Nối các cặp điểm dự kiến đổi chỗ khi quay.","Kiểm tra O là trung điểm của từng đoạn nối và các cạnh hoặc phần cong khớp nhau."],"example":"Hai đường chéo hình bình hành cắt nhau tại O và O là trung điểm mỗi đường. Quay 180° thì các đỉnh đối đổi chỗ.","worked":[],"tip":""},{"title":"Kiểm tra tâm đối xứng","lead":"","steps":[],"example":"","tip":"","worked":[["Kiểm tra tâm đối xứng","Hình bình hành ABCD có tâm đối xứng ở đâu?",["Gọi O là giao hai đường chéo.","Hai đường chéo cắt nhau tại trung điểm mỗi đường.","Quay nửa vòng quanh O thì A đổi chỗ với C, B đổi chỗ với D và các cạnh tương ứng chồng khít."],"O là tâm đối xứng.",""]]}],"visuals":[],"table":[]},{"title":"Phân biệt","intro":"Một hình có thể có trục nhưng không có tâm, hoặc có tâm nhưng không có trục. Tam giác đều có ba trục và không có tâm.","formulas":"","short":"","notes":[],"methods":[{"title":"Tìm trục và tâm đối xứng bằng phép gấp, quay","lead":"","steps":["Dự đoán các đường đi qua tâm hình.","Kiểm tra khi gấp theo từng đường, các đỉnh và cạnh có trùng nhau không.","Kiểm tra tâm riêng bằng phép quay 180°."],"example":"","worked":[],"tip":"","practice":["Một hình chữ nhật có chiều dài gấp đôi chiều rộng có bao nhiêu trục đối xứng? Hình có tâm đối xứng không?","Hai đường qua trung điểm các cặp cạnh đối là ứng viên. Thử gấp theo một đường chéo.","Có 2 trục. Giao điểm hai đường chéo là tâm đối xứng."]}],"visuals":[],"table":[],"core":[["Hai phép kiểm tra",["Gấp qua đường để kiểm tra trục đối xứng.","Quay 180° quanh điểm để kiểm tra tâm đối xứng. Một hình có thể có cả hai."],""]],"diagrams":["symmetry"]}],"g6-c6":[{"title":"Phân số và dấu","intro":"Mẫu số nguyên khác 0. Có thể chuyển dấu trừ giữa tử, mẫu hoặc trước phân số. Phân số có cùng giá trị khi tích chéo bằng nhau.","formulas":"\\frac{a}{b} = \\frac{c}{d} ⇔ ad = bc","short":"","notes":[["","Phân số bằng nhau và quy đồng","Nhân hoặc chia cả tử và mẫu với cùng một số khác 0 không đổi giá trị. Đưa mẫu về dương khi so sánh; có thể dùng mẫu số chung nhỏ nhất.","\\frac{a}{b}=\\frac{c}{d} ⇔ ad=bc, b,d ≠ 0"]],"methods":[{"title":"Phân số bằng nhau và quy đồng","lead":"Nhân hoặc chia cả tử và mẫu với cùng một số khác 0 không đổi giá trị. Đưa mẫu về dương khi so sánh; có thể dùng mẫu số chung nhỏ nhất.","steps":["Rút gọn trước nếu thuận tiện","Chọn mẫu chung","Nhân cả tử và mẫu của mỗi phân số"],"example":"","tip":"","worked":[]}],"visuals":[0],"table":[],"core":[["Mẫu phải khác 0",["Đưa dấu âm về trước phân số hoặc lên tử. Hai phân số bằng nhau khi tích chéo bằng nhau."],"\\frac{−a}{b} = \\frac{a}{−b} = −\\frac{a}{b} // \\frac{a}{b} = \\frac{c}{d} ⇔ ad = bc, bd ≠ 0"]]},{"title":"Rút gọn và so sánh","intro":"Chia tử và mẫu cho ước chung. Muốn so, có thể đưa về mẫu chung dương rồi so tử.","formulas":"","short":"","notes":[["","So sánh phân số và hỗn số","Với cùng mẫu dương, tử lớn hơn cho phân số lớn hơn. Có thể dùng mốc 0, 1 hoặc quy đồng. Hỗn số dương gồm phần nguyên và phần phân số nhỏ hơn 1.","2 và \\frac{3}{5} = \\frac{2×5+3}{5}=\\frac{13}{5}"]],"methods":[{"title":"So sánh phân số và hỗn số","lead":"Với cùng mẫu dương, tử lớn hơn cho phân số lớn hơn. Có thể dùng mốc 0, 1 hoặc quy đồng. Hỗn số dương gồm phần nguyên và phần phân số nhỏ hơn 1.","steps":["Đưa mẫu về dương","Chọn mốc hoặc quy đồng","So hai tử; đổi hỗn số nếu cần"],"example":"","tip":"","worked":[]},{"title":"So hai phân số gần 1 bằng phần thiếu","lead":"","steps":["Tính phần mỗi phân số còn thiếu để bằng 1.","So sánh hai phần thiếu.","Phân số có phần thiếu nhỏ hơn sẽ lớn hơn."],"example":"","worked":[],"tip":"","practice":["So sánh \\frac{11}{12} và \\frac{17}{18}.","Các phần thiếu lần lượt là \\frac{1}{12} và \\frac{1}{18}.","Vì \\frac{1}{18} < \\frac{1}{12} nên \\frac{17}{18} > \\frac{11}{12}."]}],"visuals":[],"table":[]},{"title":"Bốn phép tính","intro":"Cộng trừ sau khi quy đồng. Nhân tử với tử, mẫu với mẫu. Chia bằng cách nhân nghịch đảo của số chia khác 0.","formulas":"\\frac{a}{b} + \\frac{c}{d} = \\frac{ad + bc}{bd}; \\frac{a}{b} : \\frac{c}{d} = \\frac{ad}{bc}","short":"","notes":[["","Cộng và trừ phân số","Quy đồng về mẫu chung rồi cộng hoặc trừ tử. Mẫu chung giữ nguyên. Sau đó rút gọn và kiểm tra kết quả theo ước lượng.","\\frac{a}{b} ± \\frac{c}{d}=\\frac{ad ± bc}{bd}"],["","Nhân, chia phân số và tìm phân số của một số","Tích bằng tử nhân tử, mẫu nhân mẫu. Chia cho phân số khác 0 thì nhân nghịch đảo. Tìm một phần của số bằng phép nhân; tìm số ban đầu từ một phần bằng phép chia.","\\frac{a}{b}×\\frac{c}{d}=\\frac{ac}{bd} // \\frac{a}{b}:\\frac{c}{d}=\\frac{ad}{bc}, c ≠ 0"]],"methods":[{"title":"Cộng và trừ phân số","lead":"Quy đồng về mẫu chung rồi cộng hoặc trừ tử. Mẫu chung giữ nguyên. Sau đó rút gọn và kiểm tra kết quả theo ước lượng.","steps":["Kiểm tra mẫu số","Quy đồng nếu khác mẫu","Tính tử rồi rút gọn"],"example":"","tip":"","worked":[]},{"title":"Nhân, chia phân số và tìm phân số của một số","lead":"Tích bằng tử nhân tử, mẫu nhân mẫu. Chia cho phân số khác 0 thì nhân nghịch đảo. Tìm một phần của số bằng phép nhân; tìm số ban đầu từ một phần bằng phép chia.","steps":["Xác định cần lấy một phần hay tìm toàn thể","Chọn nhân hoặc chia","Rút gọn trước khi nhân"],"example":"","tip":"","worked":[]},{"title":"Chia phân số âm","lead":"","steps":[],"example":"","tip":"","worked":[["Chia phân số âm","Tính (−\\frac{5}{6}) : (\\frac{10}{9}).",["Số chia \\frac{10}{9} khác 0 nên có số nghịch đảo \\frac{9}{10}.","Đổi phép chia thành (−\\frac{5}{6}) × (\\frac{9}{10}).","Rút gọn 5 với 10, 9 với 6 rồi giữ dấu âm."],"−\\frac{3}{4}.",""]]}],"visuals":[],"table":[],"core":[["Nghịch đảo và phép chia",["Chỉ phân số khác 0 có nghịch đảo. Sau khi đổi chia thành nhân, rút gọn theo tích."],"\\frac{a}{b} : \\frac{c}{d} = \\frac{a}{b}·\\frac{d}{c}, bcd ≠ 0"]]},{"title":"Hỗn số và bài toán phân số","intro":"Hỗn số gồm phần nguyên và phần phân số. Tìm phần của một số thì nhân; tìm số ban đầu từ một phần thì chia.","formulas":"","short":"","notes":[["cách làm","Làm phân số có dấu và bài toán ngược","Đưa dấu trừ ra trước phân số trước khi so. Khi tìm toàn thể từ một phần, không nhân lần nữa.","Nếu \\frac{m}{n} của A bằng B thì A=B:\\frac{m}{n}, m≠0"]],"methods":[{"title":"Làm phân số có dấu và bài toán ngược","lead":"Đưa dấu trừ ra trước phân số trước khi so. Khi tìm toàn thể từ một phần, không nhân lần nữa.","steps":["Xác định toàn thể","Chọn nhân hoặc chia","Kiểm tra phần tìm được có đúng tỉ lệ"],"example":"\\frac{3}{5} số học sinh là 18 em nên lớp có 18 : \\frac{3}{5} = 30 em.","tip":"","worked":[]},{"title":"Tìm số ban đầu từ một phần đã biết","lead":"Đề cho một phân số của số ban đầu, hỏi cả số đó.","steps":["Viết số đã biết bằng số ban đầu nhân phân số.","Chia số đã biết cho phân số khác 0.","Nhân lại để thử."],"example":"Ba phần năm số sách bằng 24 quyển, vậy có 24 : (\\frac{3}{5}) = 40 quyển.","worked":[],"tip":""}],"visuals":[],"table":[]}],"g6-c7":[{"title":"Số thập phân có dấu","intro":"So phần nguyên và phần thập phân đối với số dương. Với hai số âm, số có giá trị tuyệt đối lớn hơn thì nhỏ hơn.","formulas":"−2,05 > −2,5","short":"","notes":[],"methods":[],"visuals":[],"table":[]},{"title":"Tính số thập phân","intro":"Cộng, trừ thẳng dấu phẩy. Với phép chia, nhân cả số chia và số bị chia với cùng lũy thừa của 10 để đưa số chia về số nguyên.","formulas":"","short":"","notes":[["","Cộng và trừ số thập phân","Dấu phẩy của các số phải thẳng cột. Có thể thêm số 0 ở cuối phần thập phân để đủ số hàng.","3,7 + 0,25 = 3,95; 3,70 − 0,25 = 3,45"],["","Nhân và chia số thập phân","Khi nhân, số chữ số thập phân của tích bằng tổng số chữ số thập phân của hai thừa số trước khi bỏ số 0 tận cùng. Khi chia, chuyển số chia thành số tự nhiên bằng cách dịch dấu phẩy cả hai số cùng lượng.","1,2 × 0,3 = 0,36; 2,4 : 0,06 = 240 : 6 = 40"]],"methods":[{"title":"Cộng và trừ số thập phân","lead":"Dấu phẩy của các số phải thẳng cột. Có thể thêm số 0 ở cuối phần thập phân để đủ số hàng.","steps":["Đặt thẳng dấu phẩy","Tính từng cột","Viết dấu phẩy của kết quả thẳng cột"],"example":"","tip":"","worked":[]},{"title":"Nhân và chia số thập phân","lead":"Khi nhân, số chữ số thập phân của tích bằng tổng số chữ số thập phân của hai thừa số trước khi bỏ số 0 tận cùng. Khi chia, chuyển số chia thành số tự nhiên bằng cách dịch dấu phẩy cả hai số cùng lượng.","steps":["Ước lượng cỡ kết quả","Tính như số tự nhiên sau khi xử lí dấu phẩy","Kiểm tra lại bằng phép tính ngược"],"example":"","tip":"",
